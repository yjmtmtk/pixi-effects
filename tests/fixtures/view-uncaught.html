<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>view: a stray error, then a movie that does become ready</title></head>
<body>
  <!-- Fixture for tests/tools/view.test.ts: an unrelated script throws (the template logs it as "uncaught: …"), and the movie is ready 1.5 s later. -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>window.__logs = []; window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));</script>
  <script>setTimeout(() => { throw new Error('a stray widget failed'); }, 100);</script>
  <script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const movie = new Movie();
    window.movie = movie;
    await new Promise(r => setTimeout(r, 1500));
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 3, frameRate: 30, background: '#101828',
        composition: { layers: [{ type: 'text', name: 'late', text: 'ready after all', style: { fontSize: 40, fill: '#ffffff' }, initial: { x: 320, y: 180, anchorX: 0.5, anchorY: 0.5 } }] } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
