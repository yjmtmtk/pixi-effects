<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · hover and drag on movie.pick</title></head>
<body style="margin:0">
  <!-- Test film (tests/films/interact.test.ts): movie.hover with a layer that runs away from a still pointer ('runner'), and the 2D drag-and-drop of the recipe `drag-drop` (the code in the page is the recipe's,
       with the page's names): a 'card' moved by the variables cx / cy, dropped on a 'zone'. The canvas is shown at twice its size. window.__events lists what happened; fire(type, x, y) sends a pointer event
       at canvas pixel (x, y). -->
  <canvas id="stage" width="480" height="270" style="width:960px;height:540px;display:block"></canvas>
  <script>
    window.__logs = []; window.__events = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const canvas = document.getElementById('stage');
    const movie = new Movie();
    window.movie = movie;
    const q = new URLSearchParams(location.search);
    // a pointer event at canvas pixel (x, y), sent to the canvas (and, bubbling, to the window: what a real pointer does)
    window.fire = (type, x, y) => { const r = canvas.getBoundingClientRect(); canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + x * r.width / 480, clientY: r.top + y * r.height / 270, bubbles: type !== 'pointerleave', pointerId: 1 })); };
    await movie.init({ canvas, width: 480, height: 270, duration: 4, frameRate: 30, loop: true, background: '#102040', vars: { cx: 100, cy: 100 },
      composition: { sequences: [
        { type: 'shape', shape: 'rect', name: 'bg', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#1c2b4d' } },
        { type: 'shape', shape: 'rect', name: 'zone', width: 140, height: 140, initial: { x: 380, y: 200, anchorX: 0.5, anchorY: 0.5, fillColor: '#2a3a66' } },
        { type: 'shape', shape: 'rect', name: 'runner', width: 60, height: 30, initial: { x: 60, y: 40, anchorX: 0.5, anchorY: 0.5, fillColor: '#d96a3a' }, keyframes: [{ at: 0, to: { x: 420 }, duration: 3, ease: 'none' }] },
        { type: 'shape', shape: 'rect', name: 'card', width: 100, height: 60, initial: { x: 'cx', y: 'cy', anchorX: 0.5, anchorY: 0.5, fillColor: '#f2c14e' } },
      ] } });
    movie.pause();

    // --- hover: the callbacks log what they are told
    if (q.get('hover') !== '0') movie.hover({ ignore: ['bg'], cursor: true, onEnter: (h) => window.__events.push('in ' + h.name), onLeave: (h) => window.__events.push('out ' + h.name) });

    // --- drag and drop: the recipe `drag-drop`
    canvas.addEventListener('pointerdown', (e) => {
      const [x, y] = movie.canvasPoint(e);
      if (!movie.pick(x, y, { only: ['card'] })) return;                 // only the card can be picked up
      const grip = { dx: movie.vars.cx - x, dy: movie.vars.cy - y };      // where in the card it was taken
      const place = (ev) => { const [px, py] = movie.canvasPoint(ev); return movie.setVars({ cx: px + grip.dx, cy: py + grip.dy }); };   // a rebuild: tens of ms, joined if it falls behind
      const move = (ev) => { place(ev); };
      const up = async (ev) => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        await place(ev);                                                  // the card is where it was let go: now ask what is under it
        const [px, py] = movie.canvasPoint(ev);
        const under = movie.pick(px, py, { ignore: ['card'] });
        window.__events.push('drop on ' + (under ? under.name : 'nothing'));
        if (under?.name === 'zone') await movie.setVars({ cx: 380, cy: 200 });         // snap into the zone
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    });
    window.__ready = true;
  </script>
</body>
</html>
