<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>check · audio formats</title></head>
<body>
  <!--
    Acceptance check (not an example): tests/films/audio-formats.test.ts. An audio layer plays a one-second 440 Hz tone given as a movie asset in the
    format of ?ext= (mp3, wav, ogg, m4a, flac, opus; tests/films/media/tone.*), or ?src= for any other address. sound() -> what inspectAudio says;
    window.__error is the message init failed with.
  -->
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">
  { "imports": {
      "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const q = new URLSearchParams(location.search);
    const src = q.get('src') ?? `media/tone.${q.get('ext') ?? 'mp3'}`;
    try {
      const movie = new Movie();
      await movie.init({ width: 160, height: 90, duration: 1, background: '#000000', assets: [{ name: 'tone', src }],
        composition: { sequences: [{ type: 'audio', name: 'tone', asset: 'tone' }] } });
      window.movie = movie;
      window.sound = async () => { const a = await movie.inspectAudio(); return { sources: a.sources.length, peak: a.peakDb, issues: a.issues }; };
    } catch (e) { window.__error = String(e && e.message || e); }
    window.__ready = true;
  </script>
</body>
</html>
