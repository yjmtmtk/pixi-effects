<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>film · check leaves alone what is fine and names a cut-off title, a text off the canvas and a cut fade</title>
</head>
<body style="margin:0">
  <!--
    Test film (tests/films/tools-check-false-alarms.test.ts), 640 x 360, 2 s at 30 fps. Five layers, the same in every run:
      glow    a circle that zooms (scale to 1.4 over 4 s) and decays (alpha to 0.22 over 3 s): both still going at the end, on purpose
      title   a text with x / y in initial that rises (y 150 -> 110) and fades in over `rise` seconds (default 0.4)
      card    a rect that lives 1.5 s: fades in, then keyframes[1] fades it out for 1 s from `cutAt` (default 0.5: it ends with the layer)
      entry   a text that waits off the canvas (x -300) and slides in at 1 s: waiting for its entrance
      badge   a text that pops (scale 1 -> 1.25) at 0.5 s of its life; starts at `badgeAt` (default 0)
    (no query)        all fine: check reports nothing (tests/tools/noFalseWarnings.test.ts opens it like this)
    ?fault=cutoff     the title is far wider than the canvas
    ?fault=offcanvas  the badge's x is 5600 instead of 560 (a typo)
    ?fault=fadecut    the card's fade-out starts at 1 s (cutAt 1): half of it is past the layer's end
    &rise=S  &badgeAt=S  &cutAt=S   move those moments
  -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
  </script>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":      "https://esm.sh/mediabunny@1.61.3"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const q = new URLSearchParams(location.search);
    const fault = q.get('fault');
    const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
    const rise = num('rise', 0.4);
    const badgeAt = num('badgeAt', 0);
    const cutAt = num('cutAt', fault === 'fadecut' ? 1 : 0.5);
    const sequences = [
      { type: 'shape', shape: 'circle', name: 'glow', radius: 24, initial: { x: 70, y: 40, fillColor: '#f2c14e' },
        keyframes: [{ at: 0, to: { scale: 1.4 }, duration: 4, ease: 'none' }, { at: 0, to: { alpha: 0.22 }, duration: 3, ease: 'none' }] },
      { type: 'text', name: 'title', text: fault === 'cutoff' ? 'THIS HEADLINE IS MUCH TOO WIDE FOR THE FRAME' : 'Hello',
        style: { fontSize: 44, fill: '#ffffff' }, initial: { x: 320, y: 110, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { y: 150, alpha: 0 }, to: { y: 110, alpha: 1 }, duration: rise, ease: 'power2.out' }] },
      { type: 'shape', shape: 'rect', name: 'card', width: 200, height: 50, duration: 1.5, initial: { x: 320, y: 210, fillColor: '#4e8ff2' },
        keyframes: [{ at: 0, from: { alpha: 0 }, duration: 0.3 }, { at: cutAt, to: { alpha: 0 }, duration: 1 }] },
      { type: 'text', name: 'entry', text: 'enter', style: { fontSize: 28, fill: '#9fe0a0' }, initial: { x: -300, y: 300, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 1, to: { x: 160 }, duration: 0.5, ease: 'power2.out' }] },
      { type: 'text', name: 'badge', text: 'NEW', at: badgeAt, style: { fontSize: 24, fill: '#ff8f6b' },
        initial: { x: fault === 'offcanvas' ? 5600 : 560, y: 300, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 0.5, to: { scale: 1.25 }, duration: 0.3, ease: 'power2.out' }] },
    ];
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 2, frameRate: 30, background: '#101828', composition: { sequences } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
