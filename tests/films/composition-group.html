<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · a composition is one picture</title></head>
<body style="margin:0">
  <!-- Test film (tests/films/composition-group.test.ts): what a composition's alpha, blendMode and clip do to its content, on black, 640 x 360, 1 s.
       Each cell holds two overlapping opaque rects; whether the overlap shows the top rect alone says whether the composition was drawn as one picture.
       A  group alpha     comp (20, 20) 160 x 80, alpha 0.5: red 0..100, blue 50..150 (on top). One picture: the overlap is blue at half, (0, 0, 128).
       B  multiply        white backdrop at (200, 20); comp blendMode multiply: red 0..100, green 50..150. One picture: the overlap is green.
       B2 difference      white backdrop at (380, 20); comp blendMode difference: green 0..100, red 50..150. One picture: the overlap is cyan (white - red).
       C  clip            comp (20, 140) 100 x 60, clip: true, a yellow rect 0..160: nothing right of x = 120.  C2 the same without clip: yellow to 180.
       D  culling         comp at x = 700 (its rectangle wholly off the canvas, no clip), a magenta rect placed back at -320: drawn at 380..440.
       E  edges           a white circle r 30 in a comp at alpha 1 (centre 520, 170) and in one at alpha 0.999 (centre 600, 170): the same edge pixels.
       F  card            a threeD comp (20, 240) 160 x 80, alpha 0.5: red 0..100, blue 50..150: the overlap is blue at half.
       G  through         grey backdrop at (200, 240); a comp at alpha 0.5 whose rect (0, 0, 128) blends 'add': the rect keeps adding to the backdrop
                          while it fades, (128, 128, 192), as at alpha 1 (a composition whose layers blend with what is behind it is not isolated).
       H  clip and checks comp 'win' (400, 322) 60 x 30, clip: true, its text 'outsideText' at x 120 (outside the window, so not drawn) sits where
                          the text 'other' is drawn: pick does not find it, inspect reports no overlap but says it is hidden by the clip.
       I  half cut        comp 'win2' (20, 330) 60 x 24, clip: true, a text 'halfText' wider than 60 px: inspect says the clip cuts it.
       The page gives the test px(x, y) = [r, g, b] at frame 0 and alphaOf(name) = the alpha movie.inspect(0) reports. -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const rect = (name, x, y, w, h, fillColor) => ({ type: 'shape', shape: 'rect', name, width: w, height: h, anchorX: 0, anchorY: 0, initial: { x, y, fillColor } });
    const pair = (a, b) => [rect(undefined, 0, 0, 100, 80, a), rect(undefined, 50, 0, 100, 80, b)];
    const circle = (name, x, alpha) => ({ type: 'composition', name, width: 80, height: 80, initial: { x: x - 40, y: 130, alpha }, sequences: [
      { type: 'shape', shape: 'circle', radius: 30, initial: { x: 40, y: 40, fillColor: '#ffffff' } }] });
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: 640, height: 360, duration: 1, frameRate: 30, background: '#000000',
        composition: { sequences: [
          { type: 'composition', name: 'groupA', width: 160, height: 80, initial: { x: 20, y: 20, alpha: 0.5 }, sequences: pair('#ff0000', '#0000ff') },
          rect('white1', 200, 20, 160, 80, '#ffffff'),
          { type: 'composition', name: 'multiplied', width: 160, height: 80, blendMode: 'multiply', initial: { x: 200, y: 20 }, sequences: pair('#ff0000', '#00ff00') },
          rect('white2', 380, 20, 160, 80, '#ffffff'),
          { type: 'composition', name: 'differenced', width: 160, height: 80, blendMode: 'difference', initial: { x: 380, y: 20 }, sequences: pair('#00ff00', '#ff0000') },
          { type: 'composition', name: 'clipped', width: 100, height: 60, clip: true, initial: { x: 20, y: 140 }, sequences: [rect(undefined, 0, 0, 160, 60, '#ffff00')] },
          { type: 'composition', name: 'unclipped', width: 100, height: 60, initial: { x: 200, y: 140 }, sequences: [rect(undefined, 0, 0, 160, 60, '#ffff00')] },
          { type: 'composition', name: 'offCanvas', width: 100, height: 60, initial: { x: 700, y: 140 }, sequences: [rect(undefined, -320, 0, 60, 60, '#ff00ff')] },
          circle('solid', 520, 1),
          circle('almost', 600, 0.999),
          { type: 'composition', name: 'card', width: 160, height: 80, threeD: true, initial: { x: 20, y: 240, alpha: 0.5 }, sequences: pair('#ff0000', '#0000ff') },
          rect('grey', 200, 240, 160, 80, '#808080'),
          { type: 'composition', name: 'glow', width: 160, height: 80, initial: { x: 200, y: 240, alpha: 0.5 }, sequences: [{ ...rect('glowRect', 0, 0, 160, 80, '#000080'), blendMode: 'add' }] },
          { type: 'composition', name: 'win', width: 60, height: 30, clip: true, initial: { x: 400, y: 322 }, sequences: [
            { type: 'text', name: 'outsideText', text: 'ABC', style: { fontSize: 20, fill: '#ffffff' }, initial: { x: 120, y: 15, anchorX: 0.5, anchorY: 0.5 } }] },
          { type: 'composition', name: 'win2', width: 60, height: 24, clip: true, initial: { x: 20, y: 330 }, sequences: [
            { type: 'text', name: 'halfText', text: 'ABCDEFG', style: { fontSize: 20, fill: '#ffffff' }, initial: { x: 0, y: 0 } }] },
          { type: 'text', name: 'other', text: 'ABC', style: { fontSize: 20, fill: '#ffffff' }, initial: { x: 520, y: 337, anchorX: 0.5, anchorY: 0.5 } },
        ] },
      });
      const report = await movie.inspect(0, { layers: 'all' });
      window.alphaOf = (name) => { const l = report.layers.find(l => l.name === name); return l ? l.alpha : null; };
      window.issues = report.issues;
      const img = await movie.snapshot(0, { as: 'imageData' });
      window.px = (x, y) => { const i = (Math.floor(y) * img.width + Math.floor(x)) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; };
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
