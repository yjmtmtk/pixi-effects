<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · three layer determinism (check)</title></head>
<body>
  <!-- Test film (tests/tools/threeDeterminism.test.ts): one three layer, a box turning with the time. ?leaky=random: update uses Math.random; ?leaky=dt: update turns the box by a speed that builds up
       from call to call (an integrator: the state a mixer advanced with update(dt) keeps); ?renderer=webgpu; ?follow=1: followCamera and followLights with a moving camera. -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "three": "../../node_modules/three/build/three.module.js", "three/webgpu": "../../node_modules/three/build/three.webgpu.js",
    "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    import { registerThree } from '../../dist/three.js';
    import * as THREE from 'three';
    const q = new URLSearchParams(location.search);
    const leaky = q.get('leaky'), renderer = q.get('renderer') || undefined, follow = q.get('follow') === '1';
    registerThree();
    let box, last = 0, v = 0;
    const update = leaky === 'random' ? (t) => { box.rotation.y = Math.random() * 6; }
      : leaky === 'dt' ? (t) => { const dt = t - last; last = t; v += 3 * dt; box.rotation.y += v * dt; }
      : (t) => { box.rotation.y = t * 2; };
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: 3, frameRate: 30, background: '#102040', composition: { sequences: [
        ...(follow ? [{ type: 'camera', keyframes: [{ at: 0, to: { x: 240, lookAtX: 160 }, duration: 3, ease: 'none' }] }, { type: 'light', kind: 'ambient', initial: { intensity: 0.5 } }, { type: 'light', kind: 'point', initial: { x: 60, y: 20, z: 300 } }] : []),
        { type: 'three', name: 'spin', renderer, followCamera: follow, followLights: follow, antialias: false,
          setup: (ctx) => {
            box = follow ? new THREE.Mesh(new THREE.BoxGeometry(100, 100, 100), new THREE.MeshLambertMaterial({ color: 0x3a6ea5 })) : new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshNormalMaterial());
            if (follow) box.position.set(160, -90, 0); else ctx.camera.position.z = 3;
            ctx.scene.add(box);
          }, update },
      ] } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
