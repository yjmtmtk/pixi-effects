<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · a favicon 404 and a slow start</title></head>
<body>
  <!-- Test film (tests/tools/checkLoadFailures.test.ts): the page has no <link rel="icon">, so the browser asks for /favicon.ico and gets a 404 at once; the movie becomes ready only after 5 s
       (a slow CDN). `check` must wait for it: a favicon is not a failed load of the page. -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    await new Promise((r) => setTimeout(r, 5000));
    const movie = new Movie(); window.movie = movie;
    await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: 1, frameRate: 30, background: '#123456', composition: { sequences: [] } });
    window.__ready = true;
  </script>
</body>
</html>
