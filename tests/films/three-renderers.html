<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · three renderers</title></head>
<body>
  <!-- Test film (tests/films/three-renderers.test.ts): one three layer (a lit box that turns with the time, a sphere, a point light) over a 2D shape, drawn by three's
       WebGLRenderer or WebGPURenderer (?renderer=webgl|webgpu; ?break=1 makes the shared route fail on purpose; ?share=0 keeps a webgpu layer on its own canvas instead of Pixi's GPU device). The page gives the test pixelAt(frame, x, y), hashOf(frame) and backend (the renderer PixiJS chose). -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "three": "../../node_modules/three/build/three.module.js", "three/webgpu": "../../node_modules/three/build/three.webgpu.js" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    import { registerThree, three } from '../../dist/three.js';
    import * as THREE from 'three';
    const PAGE = new URLSearchParams(location.search).get('page');                          // ?page=webgpu: the page default, and the layer names no renderer
    registerThree(PAGE ? { renderer: PAGE } : undefined);
    const q = new URLSearchParams(location.search);
    const which = q.get('renderer') || 'webgl';
    const SHARE = q.get('share') !== '0';
    const AA = q.get('aa') !== '0', FOG = q.get('fog') === '1', TONE = q.get('tone') === '1';       // the output pipeline switches the test compares
    if (q.get('break') === '1') {                                                           // a PixiJS that keeps its GPU textures elsewhere: the shared route cannot adopt a texture
      const { TextureSource } = await import('pixi.js');
      const store = new WeakMap();
      Object.defineProperty(TextureSource.prototype, '_gpuData', { configurable: true,
        get() { return /^three layer/.test(this.label) ? undefined : (store.get(this) ?? (store.set(this, Object.create(null)), store.get(this))); }, set(v) { store.set(this, v); } });
    }
    const movie = new Movie();
    window.movie = movie;
    window.hashOf = async (frame) => {
      const d = (await movie.snapshot(frame, { as: 'imageData' })).data;
      let h = 0x811c9dc5;
      for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16);
    };
    window.pixelAt = async (frame, x, y) => { const img = await movie.snapshot(frame, { as: 'imageData' }); const i = (y * img.width + x) * 4; return Array.from(img.data.slice(i, i + 4)); };
    window.framePixels = async (frame) => Array.from((await movie.snapshot(frame, { as: 'imageData' })).data);
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: 3, frameRate: 30, background: '#102040',
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'band', width: 320, height: 24, initial: { x: 160, y: 168, fillColor: '#f2c14e' } },
          three({
            type: 'three', name: 'scene3d', ...(PAGE ? {} : { renderer: which }), antialias: AA, ...(SHARE ? {} : { shareGpu: false }), width: 320, height: 180, initial: { x: 160, y: 90, anchorX: 0.5, anchorY: 0.5 },
            setup: (ctx) => {
              const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0x7fb4ff, roughness: 0.5, metalness: 0.1 }));
              const ball = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), new THREE.MeshStandardMaterial({ color: 0xff7a5c, roughness: 0.4 }));
              ball.position.set(1.8, 0.4, 0);
              const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(2, 3, 4);
              const fill = new THREE.PointLight(0xffd9a0, 12, 20); fill.position.set(-3, 1, 3);
              if (TONE) { ctx.renderer.toneMapping = THREE.ACESFilmicToneMapping; ctx.renderer.toneMappingExposure = 1.05; }
              if (FOG) ctx.scene.fog = new THREE.FogExp2(0x06080c, 0.14);
              window.threeInfo = { cls: ctx.renderer.constructor.name, gpuBackend: !!(ctx.renderer.backend && ctx.renderer.backend.isWebGPUBackend) };
              const lamp = new THREE.PointLight(0xffa040, 0.1, 30, 1.6); lamp.position.set(-2, 1.2, 2);     // its intensity is animated by a keyframe below: lights must follow the time, frame by frame
              ctx.scene.add(box, ball, key, fill, lamp, new THREE.AmbientLight(0xffffff, 0.35));
              ctx.camera.position.set(0, 0.4, 5);
              return { objects: { box, ball, lamp } };
            },
            keyframes: [{ at: 0, to: { 'three.lamp.intensity': 40 }, duration: 2.5, ease: 'none' }],
            update: (t, ctx) => { const box = ctx.scene.children[0]; box.rotation.set(0.4, t * 1.2, 0); },
          }),
        ] },
      });
      window.backend = movie.app.renderer.name;
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
