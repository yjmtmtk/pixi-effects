<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · a 2D layer shown on a mesh of a three layer</title></head>
<body style="margin:0;background:#000">
  <!-- Test film (tests/films/three-layer-texture.test.ts): a 2D composition named `screen` (480 x 270: a blue background, a yellow dot that moves, the text {label}, a green bar that grows) shown on a mesh of a
       `three` layer with threeLayerTexture(ctx, 'screen'). ?mode=flat: a plane that fills the picture (the picture must equal the 2D layer, pixel for pixel) · half: the plane is half the picture (the
       corners must stay the page background: the 2D layer is not drawn on the stage) · cube: a turning cube with the screen on one face · lifespan: `screen` starts at 1.5 s · late: `screen` is listed AFTER the three layer ·
       stripes: the screen is 1-pixel black and white stripes and the plane is a quarter of the picture (a texture seen small: aliased without mipmaps) · alpha: the screen is a half-transparent red disc on nothing and the layer asks for `transparent: true` · ui: the screen has a green button (`button`, at 240,60 of the screen: in the upper part, so that a mapping turned upside down is caught, 160 x 60) and the mesh is a plane that fills the picture; the page records what a click and a hover name in window.__clicked / window.__entered · tall: the screen is 480 x 800, taller than the 360-pixel picture, with a green bar at y 700 that grows from nothing, shown on a plane that fits it (a layer of the screen that lies below the picture is still drawn, and on the first draw too) · fade: like flat, the screen composition is at alpha 0.5 (its alpha is the layer's: the mesh shows it over black, on every route) · blur: like flat but a white block with a blur filter sits in the middle of the screen (a filter's size is in the layer's own pixels, whatever `res` is) · huge: a 3000 x 300 screen (with ?res=4 the texture is wider than any GPU allows) · maskoff: the screen sits at x 40 and has a mask (a mask is placed in the parent's space, not the screen's) · rebuild: like flat, plus a later three layer `tail` that throws in its setup when window.__fail is set and waits when window.__slow is set (a rebuild that fails, or is slow: the old movie must go on showing its own screen) · notcomp: the name is a shape layer · missing: no such name · ?share=0: the three layer has a canvas of its own. ?transparent=0 (with alpha): the layer does not ask for it. window.initError is init's message when it refused. -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = []; window.__setups = 0;
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "three": "../../node_modules/three/build/three.module.js", "three/webgpu": "../../node_modules/three/build/three.webgpu.js", "three/tsl": "../../node_modules/three/build/three.tsl.js" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    import { registerThree, three, threeLayerTexture } from '../../dist/three.js';
    import * as THREE from 'three';
    registerThree();
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'flat', share = q.get('share') !== '0', res = Number(q.get('res') || 1);
    const SW = 480, SH = 270;
    const screenStripes = (extra = {}) => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 0, y: 0 }, ...extra, sequences: [
      { type: 'canvas', name: 'stripes', width: SW, height: SH, initial: { x: 0, y: 0, anchorX: 0, anchorY: 0 }, smoothing: false, draw: (ctx) => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, SW, SH); ctx.fillStyle = '#000'; for (let x = 0; x < SW; x += 2) ctx.fillRect(x, 0, 1, SH); } },
    ] });
    const screenUi = () => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 0, y: 0 }, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: SW, height: SH, initial: { x: SW / 2, y: SH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#1d3a6e' } },
      { type: 'shape', shape: 'rect', name: 'button', width: 160, height: 60, cornerRadius: 12, initial: { x: 240, y: 60, anchorX: 0.5, anchorY: 0.5, fillColor: '#3ddc97' } },
    ] });
    const TH = 800;
    const screenTall = () => ({ type: 'composition', name: 'screen', width: SW, height: TH, duration: 4, initial: { x: 0, y: 0 }, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: SW, height: TH, initial: { x: SW / 2, y: TH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#1d3a6e' } },
      { type: 'shape', shape: 'rect', name: 'bar', width: 400, height: 40, initial: { x: 240, y: 700, anchorX: 0.5, anchorY: 0.5, fillColor: '#3ddc97', scaleX: 0 }, keyframes: [{ at: 0.5, to: { scaleX: 1 }, duration: 1 }] },
    ] });
    const screenAlpha = () => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 0, y: 0 }, sequences: [
      { type: 'shape', shape: 'circle', name: 'disc', radius: 100, initial: { x: 240, y: 135, fillColor: '#ff0000', fillAlpha: 0.5 } },
    ] });
    const screen = (extra = {}) => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 0, y: 0 }, ...extra, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: SW, height: SH, initial: { x: SW / 2, y: SH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#1d3a6e' } },
      { type: 'shape', shape: 'circle', name: 'dot', radius: 40, initial: { x: 60, y: 135, fillColor: '#f2c14e' }, keyframes: [{ at: 0, to: { x: 420 }, duration: 4, ease: 'sine.inOut' }] },
      { type: 'text', name: 'label', text: '{label}', style: { fontSize: 56, fill: '#ffffff', fontWeight: '800' }, initial: { x: SW / 2, y: 60, anchorX: 0.5, anchorY: 0.5 } },
      { type: 'shape', shape: 'rect', name: 'bar', width: 380, height: 18, initial: { x: 50, y: 230, fillColor: '#3ddc97' }, keyframes: [{ at: 0, from: { scaleX: 0.02 }, to: { scaleX: 1 }, duration: 4, ease: 'none' }] },
    ] });
    const world = () => three({ type: 'three', name: 'world', renderer: 'webgpu', ...(share ? {} : { shareGpu: false }), antialias: false, width: 640, height: 360, initial: { x: 320, y: 180, anchorX: 0.5, anchorY: 0.5 },
      setup: async (ctx) => {
        window.__setups++;
        const name = mode === 'missing' ? 'nothing-here' : mode === 'notcomp' ? 'bg' : 'screen';
        const s = await threeLayerTexture(ctx, name, { resolution: res, ...(mode === 'alpha' && q.get('transparent') !== '0' ? { transparent: true } : {}) });
        window.__screen = { width: s.width, height: s.height }; window.__handle = s;
        let mesh;
        if (mode === 'cube') {
          ctx.camera.position.set(0, 0.6, 5);
          const dark = () => new THREE.MeshBasicMaterial({ color: 0x223 });
          mesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 0.4), [dark(), dark(), dark(), dark(), s.material, dark()]);
        } else {
          const fov = 40, dist = (360 / 2) / Math.tan((fov / 2) * Math.PI / 180), k = mode === 'half' ? 0.5 : mode === 'stripes' ? 0.25 : 1;
          ctx.camera = new THREE.PerspectiveCamera(fov, 640 / 360, 1, 5000); ctx.camera.position.set(0, 0, dist);
          mesh = new THREE.Mesh(mode === 'tall' ? new THREE.PlaneGeometry(360 * 0.9 * (SW / TH), 360 * 0.9) : new THREE.PlaneGeometry(640 * k, 360 * k), s.material);
        }
        mesh.name = 'plane';
        ctx.scene.add(mesh);
        return { objects: { mesh } };
      },
      update: (t, ctx) => { const m = ctx.scene.children[0]; if (mode === 'cube' && m) { m.rotation.y = 0.35 + 0.5 * Math.sin(t * 1.2); m.rotation.x = -0.12; } } });
    const screenBlur = () => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 0, y: 0 }, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: SW, height: SH, initial: { x: SW / 2, y: SH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#000000' } },
      { type: 'shape', shape: 'rect', name: 'block', width: 200, height: 160, filters: [{ type: 'blur', strength: 12 }], initial: { x: SW / 2, y: SH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#ffffff' } },
    ] });
    const screenHuge = () => ({ type: 'composition', name: 'screen', width: 3000, height: 300, duration: 4, initial: { x: 0, y: 0 }, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: 3000, height: 300, initial: { x: 1500, y: 150, anchorX: 0.5, anchorY: 0.5, fillColor: '#1d3a6e' } },
    ] });
    const screenMasked = () => ({ type: 'composition', name: 'screen', width: SW, height: SH, duration: 4, initial: { x: 40, y: 0 },
      mask: { type: 'shape', shape: 'circle', radius: 60, initial: { x: 240, y: 135, fillColor: '#ffffff' } }, sequences: [
      { type: 'shape', shape: 'rect', name: 'sbg', width: SW, height: SH, initial: { x: SW / 2, y: SH / 2, anchorX: 0.5, anchorY: 0.5, fillColor: '#1d3a6e' } },
    ] });
    const sourceLayer = mode === 'blur' ? screenBlur() : mode === 'huge' ? screenHuge() : mode === 'maskoff' ? screenMasked() : mode === 'fade' ? screen({ initial: { x: 0, y: 0, alpha: 0.5 } }) : mode === 'stripes' ? screenStripes() : mode === 'ui' ? screenUi() : mode === 'tall' ? screenTall() : mode === 'alpha' ? screenAlpha() : screen(mode === 'lifespan' ? { at: 1.5, duration: 2.5 } : {});
    const seqs = mode === 'late' ? [{ type: 'shape', shape: 'rect', name: 'bg', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#0b0f1a' } }, world(), screen()]
      : [{ type: 'shape', shape: 'rect', name: 'bg', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#0b0f1a' } }, sourceLayer, world()];
    if (mode === 'rebuild') seqs.push({ type: 'three', name: 'tail', reuse: false, width: 64, height: 36, setup: async () => { if (window.__slow) await new Promise((r) => setTimeout(r, 1500)); if (window.__fail) throw new Error('boom: this later layer failed'); } });
    const movie = new Movie();
    window.movie = movie;
    window.hashOf = async (frame) => { const d = (await movie.snapshot(frame, { as: 'imageData' })).data; let h = 0x811c9dc5; for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); };
    window.regionStats = async (frame, x0, y0, w, h) => { const d = await movie.snapshot(frame, { as: 'imageData' }); let n = 0, sum = 0, sum2 = 0; for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { const i = (y * d.width + x) * 4, l = (0.2126 * d.data[i] + 0.7152 * d.data[i + 1] + 0.0722 * d.data[i + 2]); n++; sum += l; sum2 += l * l; } const mean = sum / n; return { mean, std: Math.sqrt(Math.max(0, sum2 / n - mean * mean)) }; };
    window.pixelsAt = async (frame, points) => { const d = await movie.snapshot(frame, { as: 'imageData' }); return points.map(([x, y]) => Array.from(d.data.slice((y * d.width + x) * 4, (y * d.width + x) * 4 + 3))); };
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 4, frameRate: 30, background: '#0b0f1a', vars: mode === 'stripes' || mode === 'alpha' || mode === 'ui' || mode === 'tall' || mode === 'blur' || mode === 'huge' || mode === 'maskoff' ? {} : { label: 'LIVE 2D' }, composition: { sequences: seqs } });
      movie.pause();
      const canvas = document.getElementById('stage');
      canvas.addEventListener('click', (e) => { const h = movie.pick(...movie.canvasPoint(e)); window.__clicked = h ? h.path : null; });
      movie.hover({ onEnter: (h) => { window.__entered = h.path; } });
      window.__ready = true;
    } catch (e) { window.initError = String((e && e.message) || e); window.__ready = true; }
  </script>
</body>
</html>
