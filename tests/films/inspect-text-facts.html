<!DOCTYPE html><html><head><meta charset="UTF-8"><title>film · what inspect says about a text as drawn</title></head><body style="margin:0">
<!-- Test film (tests/films/inspect-text-facts.test.ts): a plain text, a text scaled 2×, and a text at alpha 0.8 inside a composition at alpha 0.5, to read inspect's text, fontPx and opacity. --><canvas id="stage" width="640" height="360"></canvas>
<script>window.__logs = []; for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }</script>
<script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
<script type="module">
import { Movie } from '../../dist/index.js';
const movie = new Movie(); window.movie = movie;
await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 1, frameRate: 30, background: '#000',
  composition: { layers: [
    { type: 'text', name: 'plain', text: 'Hello world', style: { fontSize: 40, fill: '#ffffff' }, initial: { x: 160, y: 80, anchorX: 0.5, anchorY: 0.5 } },
    { type: 'text', name: 'scaled', text: 'Big', style: { fontSize: 20, fill: '#ffffff' }, initial: { x: 480, y: 80, anchorX: 0.5, anchorY: 0.5, scale: 2 } },
    { type: 'composition', name: 'group', width: 640, height: 200, initial: { y: 160, alpha: 0.5 }, layers: [
      { type: 'text', name: 'inner', text: 'Faded line', style: { fontSize: 30, fill: '#ffffff' }, initial: { x: 320, y: 100, anchorX: 0.5, anchorY: 0.5, alpha: 0.8 } },
    ] },
  ] } });
window.__ready = true;
</script></body></html>
