<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · skew about the anchor</title></head>
<body style="margin:0">
  <!-- Test film (tests/films/geometry-skew.test.ts): one white rect, 160 x 80, at (320, 180) on black, 640 x 360, 1 s.
       The query sets its skew and its anchor: ?skewX=40&skewY=0&anchorX=0.5&anchorY=0.5 (degrees; these are the defaults but skewX, which is 0).
       The test reads the pixels at the corners the documents predict, just inside and just outside each one, and the white run along one column / row.
       The page gives the test pixel(x, y) (the red channel of the frame 0 snapshot) and runs(axis, at) (the white runs along a column or a row). -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const q = new URLSearchParams(location.search);
    const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
    const skewX = num('skewX', 0), skewY = num('skewY', 0), anchorX = num('anchorX', 0.5), anchorY = num('anchorY', 0.5);
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: 640, height: 360, duration: 1, frameRate: 30, background: '#000000',
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'box', width: 160, height: 80, anchorX, anchorY,
            initial: { x: 320, y: 180, skewX, skewY, fillColor: '#ffffff' } },
        ] },
      });
      const img = await movie.snapshot(0, { as: 'imageData' });
      window.__size = [img.width, img.height];
      window.pixel = (x, y) => { const X = Math.floor(x), Y = Math.floor(y); if (X < 0 || Y < 0 || X >= img.width || Y >= img.height) return -1; return img.data[(Y * img.width + X) * 4]; };
      // the white runs (red > 128) along column x = at (axis 'y') or row y = at (axis 'x'): [[start, endExclusive], ...]
      window.runs = (axis, at) => { const n = axis === 'y' ? img.height : img.width; const out = []; let s = -1;
        for (let i = 0; i <= n; i++) { const v = i < n ? (axis === 'y' ? pixel(at, i) : pixel(i, at)) : 0; if (v > 128 && s < 0) s = i; if (v <= 128 && s >= 0) { out.push([s, i]); s = -1; } }
        return out; };
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
