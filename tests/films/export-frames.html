<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · export-frames</title></head>
<body>
  <!-- Test film (tests/films/export-frames.test.ts): a movie of one rect crossing the frame in exactly its own length. The query sets it:
       ?duration=2 (seconds) &fps=30 &sound=1 (a sustained pad all the way through). The test renders it and counts the frames of the real file. -->
  <canvas id="stage" width="160" height="90"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const q = new URLSearchParams(location.search);
    const duration = Number(q.get('duration') ?? 2), fps = Number(q.get('fps') ?? 30), sound = q.has('sound');
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 160, height: 90, duration, frameRate: fps, background: '#102040',
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'box', width: 40, height: 40, initial: { x: 20, y: 45, fillColor: '#ffffff' }, keyframes: [{ at: 0, to: { x: 140 }, duration, ease: 'none' }] },
          ...(sound ? [{ type: 'audio', name: 'pad', volume: 0.8, music: { bpm: 120, tracks: [{ inst: 'pad', notes: 'c3:8', attack: 0.01 }] } }] : []),
        ] } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init: ' + e.message); }
  </script>
</body>
</html>
