<!DOCTYPE html><html><head><meta charset="UTF-8"><title>film · picking text by its glyphs</title></head><body style="margin:0">
<!-- Test film (tests/films/pick-text.test.ts): a big white word on black, and a line of text with spans, to ask movie.pick({ alpha }) about points inside and outside the letters. --><canvas id="stage" width="640" height="360"></canvas>
<script>window.__logs = []; for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }</script>
<script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
<script type="module">
import { Movie } from '../../dist/index.js';
import * as PIXI from 'pixi.js';
window.PIXI = PIXI;
const movie = new Movie(); window.movie = movie;
await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 1, frameRate: 30, background: '#000',
  composition: { sequences: [
    { type: 'text', name: 'word', text: 'HI', style: { fontSize: 200, fill: '#ffffff', fontWeight: '900' }, initial: { x: 200, y: 180, anchorX: 0.5, anchorY: 0.5 } },
    { type: 'text', name: 'outlined', text: 'Oo', style: { fontSize: 190, fill: '#ffffff', fontWeight: '700', stroke: { color: '#ffffff', width: 6 } }, initial: { x: 480, y: 180, anchorX: 0.5, anchorY: 0.5 } },
    { type: 'text', name: 'line', spans: ['Go ', { text: 'now', fill: '#ffffff', fontWeight: '700' }], style: { fontSize: 70, fill: '#ffffff' }, initial: { x: 320, y: 320, anchorX: 0.5, anchorY: 0.5 } },
  ] } });
window.pixelsOf = async () => (await movie.snapshot(0, { as: 'imageData' }));
window.__ready = true;
</script></body></html>
