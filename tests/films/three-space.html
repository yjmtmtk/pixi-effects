<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · three layer in the composition's space</title></head>
<body>
  <!-- Test film (tests/films/three-space.test.ts): the same composition (a camera that moves and changes fov, optionally lights) drawn two ways:
       ?mode=board: three flat cards (shape layers with threeD: true), the composition's own 2.5D;  ?mode=three: three flat planes in ONE `three` layer with followCamera / followLights.
       ?falloff=smooth|inverseSquare (with ?lights=point|spot: the light falls off with the distance; radius and falloffDistance are 300 / 300 at 960 x 540);  ?shadow=1: a spot light that casts shadows, a wall and a card in front of it that casts one;  ?fog=1: the camera writes fog (near 150, far 600, #0a1020);  ?lights=none|ambient|point|parallel|spot  ?lamp=late: a point light that only lives from 1 s to 2 s  ?cm=0: colour management off in the layer (what makes a Lambert plane shade like a card).
       The page gives the test framePixels, pixelAt, hashOf and pngOf. -->
  <canvas id="stage" width="480" height="270"></canvas>        <!-- ?big=1: the same film at 1280 x 720 (everything scaled), where a scale-blind shadow bias loses the shadow -->
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "three": "../../node_modules/three/build/three.module.js", "three/webgpu": "../../node_modules/three/build/three.webgpu.js",
    "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    import { registerThree } from '../../dist/three.js';
    import * as THREE from 'three';
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'board', kind = q.get('lights') || 'none', lamp = q.get('lamp');
    const cm = q.get('cm') !== '0', renderer = q.get('renderer') || undefined;
    registerThree();
    const BIG = q.get('big') === '1';
    const W = BIG ? 1280 : 480, H = BIG ? 720 : 270, DUR = 3, K = W / 960;   // the composition is 480 x 270 (1280 x 720 with ?big=1); numbers below are written for 960 x 540 and scaled
    document.getElementById('stage').width = W; document.getElementById('stage').height = H;
    const s = (n) => n * K;
    const BOXES = [ { x: 300, y: 270, z: 0, c: '#3a6ea5' }, { x: 660, y: 270, z: -300, c: '#d96a3a' }, { x: 480, y: 330, z: 250, c: '#3aa56e' } ];
    const LIGHTS = {
      none: [],
      ambient: [{ kind: 'ambient', initial: { intensity: 0.3 } }],
      point: [{ kind: 'ambient', initial: { intensity: 0.2 } }, { kind: 'point', initial: { x: s(300), y: s(100), z: s(700), intensity: 1 } }],
      parallel: [{ kind: 'ambient', initial: { intensity: 0.2 } }, { kind: 'parallel', initial: { x: s(100), y: s(50), z: s(500), lookAtX: s(480), lookAtY: s(270), lookAtZ: 0, intensity: 0.8 } }],
      spot: [{ kind: 'ambient', initial: { intensity: 0.2 } }, { kind: 'spot', initial: { x: s(420), y: s(60), z: s(700), lookAtX: s(480), lookAtY: s(300), lookAtZ: 0, coneAngle: 50, coneFeather: 0.5, intensity: 1 } }],
      lampOnly: [{ kind: 'ambient', initial: { intensity: 0.2 } }, { kind: 'point', at: 1, duration: 1, initial: { x: s(300), y: s(100), z: s(700), intensity: 1 } }],
    }[lamp === 'late' ? 'lampOnly' : kind];
    const fog = q.get('fog') === '1';
    const shadow = q.get('shadow') === '1';
    const FALL = q.get('falloff'), RADIUS = Number(q.get('radius') || 300), FALLDIST = Number(q.get('falldist') || 300);
    if (FALL) for (const l of LIGHTS) if (l.kind === 'point' || l.kind === 'spot') { l.falloff = FALL; l.initial = { ...l.initial, radius: s(RADIUS), falloffDistance: s(FALLDIST) }; }
    const sequences = shadow ? [
      { type: 'light', kind: 'ambient', initial: { intensity: 0.3 } },
      { type: 'light', kind: 'spot', castsShadows: true, initial: { x: s(300), y: s(80), z: s(700), lookAtX: s(480), lookAtY: s(270), lookAtZ: 0, coneAngle: 70, coneFeather: 0.3, intensity: 1, shadowDarkness: 0.8 } },
    ] : [
      { type: 'camera', name: 'cam', ...(fog ? { initial: { fogNear: 150, fogFar: 600, fogColor: '#0a1020' } } : {}), keyframes: [{ at: 0, from: { x: W / 2, y: H / 2, fov: 40 }, to: { x: s(780), y: s(150), fov: 70 }, duration: DUR, ease: 'none' }] },
      ...LIGHTS.map((l) => ({ type: 'light', ...l })),
    ];
    if (shadow) {
      const WALL = { x: s(480), y: s(270), z: s(-300), w: s(880), h: s(480), c: '#3a6ea5' }, CARD = { x: s(440), y: s(270), z: 0, w: s(200), h: s(200), c: '#d96a3a' };
      if (mode === 'board') {
        sequences.push({ type: 'shape', shape: 'rect', width: WALL.w, height: WALL.h, threeD: true, initial: { x: WALL.x, y: WALL.y, z: WALL.z, anchorX: 0.5, anchorY: 0.5, fillColor: WALL.c } });
        sequences.push({ type: 'shape', shape: 'rect', width: CARD.w, height: CARD.h, threeD: true, castsShadows: true, initial: { x: CARD.x, y: CARD.y, z: CARD.z, anchorX: 0.5, anchorY: 0.5, fillColor: CARD.c } });
      } else {
        sequences.push({ type: 'three', name: 'scene3d', antialias: false, renderer, followCamera: true, followLights: true,
          setup: (ctx) => {
            if (!cm) { THREE.ColorManagement.enabled = false; ctx.renderer.outputColorSpace = THREE.LinearSRGBColorSpace; }
            for (const [o, cast] of [[WALL, false], [CARD, true]]) {
              const m = new THREE.Mesh(new THREE.PlaneGeometry(o.w, o.h), new THREE.MeshLambertMaterial({ color: o.c, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }));
              m.position.set(o.x, -o.y, o.z); m.castShadow = cast; m.receiveShadow = !cast; ctx.scene.add(m);
            }
          } });
      }
    } else if (mode === 'board') {
      for (const b of BOXES) sequences.push({ type: 'shape', shape: 'rect', width: s(200), height: s(200), threeD: true, initial: { x: s(b.x), y: s(b.y), z: s(b.z), anchorX: 0.5, anchorY: 0.5, fillColor: b.c } });
    } else {
      sequences.push({ type: 'three', name: 'scene3d', antialias: false, renderer, followCamera: true, followLights: true, followFog: true,
        setup: (ctx) => {
          if (!cm) { THREE.ColorManagement.enabled = false; ctx.renderer.outputColorSpace = THREE.LinearSRGBColorSpace; }
          for (const b of BOXES) {
            const lit = LIGHTS.length > 0;
            const m = new THREE.Mesh(new THREE.PlaneGeometry(s(200), s(200)), lit ? new THREE.MeshLambertMaterial({ color: b.c }) : new THREE.MeshBasicMaterial({ color: b.c }));
            m.position.set(s(b.x), -s(b.y), s(b.z)); ctx.scene.add(m);
          }
        } });
    }
    const movie = new Movie();
    window.movie = movie;
    window.framePixels = async (frame) => Array.from((await movie.snapshot(frame, { as: 'imageData' })).data);
    window.pixelAt = async (frame, x, y) => { const img = await movie.snapshot(frame, { as: 'imageData' }); const i = (y * img.width + x) * 4; return Array.from(img.data.slice(i, i + 4)); };
    window.hashOf = async (frame) => { const d = (await movie.snapshot(frame, { as: 'imageData' })).data; let h = 0x811c9dc5; for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); };
    window.pngOf = async (frame) => { const img = await movie.snapshot(frame, { as: 'imageData' }); const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').putImageData(img, 0, 0); return c.toDataURL('image/png'); };
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: W, height: H, duration: DUR, frameRate: 30, background: '#101820', composition: { sequences } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
