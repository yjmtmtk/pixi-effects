<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · backdropBlur on both backends</title></head>
<body style="margin:0">
  <!-- Test film (tests/films/backdrop-blur.test.ts): black and white stripes 4 px wide behind a panel (x 120..360, y 60..210) whose filter is
       backdropBlur: what is behind the panel is blurred, what is outside is not. contrast(x0, x1, y) = max - min of the red channel along a row. -->
  <canvas id="stage" width="480" height="270"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3", "pixi-filters": "https://esm.sh/pixi-filters@6.1.5?external=pixi.js" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const movie = new Movie();
    window.movie = movie;
    const stripes = Array.from({ length: 60 }, (_, i) => ({ type: 'shape', shape: 'rect', width: 4, height: 270, initial: { x: i * 8 + 2, y: 135, fill: '#ffffff' } }));
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 480, height: 270, duration: 1, frameRate: 30, background: '#000000',
        composition: { layers: [
          ...stripes,
          { type: 'shape', shape: 'rect', name: 'panel', width: 240, height: 150, initial: { x: 240, y: 135, fill: '#ffffff', fillAlpha: 0.05 }, filters: [{ type: 'backdropBlur', strength: 8 }] },
        ] } });
      window.backend = () => movie.app.renderer.name;
      window.contrast = async (x0, x1, y) => { const img = await movie.snapshot(0, { as: 'imageData' }); let lo = 255, hi = 0; for (let x = x0; x < x1; x++) { const v = img.data[(y * img.width + x) * 4]; lo = Math.min(lo, v); hi = Math.max(hi, v); } return hi - lo; };
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); window.__ready = true; }
  </script>
</body>
</html>
