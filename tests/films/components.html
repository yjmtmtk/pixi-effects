<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · components</title></head>
<body style="margin:0">
  <!-- Test film (tests/films/components.test.ts): one component placed three times, 320 x 180 on black, 1 s.
       'chip' (params: colour '#ff0000', label 'x', dx 0): a 60 x 40 rect filled {colour}, at x = 10 + dx inside a 100 x 60 composition; a text {label}.
       a  at (0, 0)    params { colour: '#00ff00', label: 'A' }            → green rect at x 10..70, y 10..50
       b  at (0, 100)  params { colour: '{accent}', label: 'B', dx: 20 }   → the movie variable accent (#0000ff): blue rect at x 30..90, y 110..150
       c  at (200, 0)  no params                                           → the defaults: red rect at x 210..270
       The page gives px(x, y) = [r, g, b] at frame 0, names = the paths movie.inspect(0) lists, and setAccent(hex) (setVars, then the same px). -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.23.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }</script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const movie = new Movie();
    window.movie = movie;
    let img;
    const grab = async () => { img = await movie.snapshot(0, { as: 'imageData' }); };
    window.px = (x, y) => { const i = (Math.floor(y) * img.width + Math.floor(x)) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; };
    window.setAccent = async (hex) => { await movie.setVars({ accent: hex }); await grab(); };
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: 320, height: 180, duration: 1, frameRate: 30, background: '#000000',
        vars: { accent: '#0000ff' },
        composition: {
          components: {
            chip: { params: { colour: '#ff0000', label: 'x', dx: 0 }, width: 100, height: 60, layers: [
              { type: 'shape', shape: 'rect', name: 'box', width: 60, height: 40, anchorX: 0, anchorY: 0, initial: { x: '10 + dx', y: 10, fill: '{colour}' } },
              { type: 'text', name: 'label', text: '{label}', style: { fontSize: 12, fill: '#ffffff' }, initial: { x: 85, y: 30, anchorX: 0.5, anchorY: 0.5 } },
            ] },
          },
          layers: [
            { use: 'chip', name: 'a', params: { colour: '#00ff00', label: 'A' } },
            { use: 'chip', name: 'b', params: { colour: '{accent}', label: 'B', dx: 20 }, initial: { x: 0, y: 100 } },
            { type: 'composition', use: 'chip', name: 'c', initial: { x: 200, y: 0 } },
          ],
        },
      });
      await grab();
      window.names = (await movie.inspect(0, { layers: 'all' })).layers.map(l => l.path);
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
