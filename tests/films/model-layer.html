<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>film · model layer</title></head>
<body>
  <!-- Test film (tests/films/model-layer.test.ts): one `model` layer, a glTF box that turns 360° in 2 s (tests/fixtures/spin-box.gltf), over a 2D band; ?renderer=webgl|webgpu, ?aa=0.
       The page gives the test pixelAt, hashOf, framePixels and layerInfo (movie.inspect: which renderer and backend the layer used). -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "three": "../../node_modules/three/build/three.module.js", "three/webgpu": "../../node_modules/three/build/three.webgpu.js",
    "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
  <script type="module">
    import { Movie, model } from '../../dist/index.js';
    import { registerThree } from '../../dist/three.js';
    const q = new URLSearchParams(location.search);
    registerThree();
    const movie = new Movie();
    window.movie = movie;
    window.hashOf = async (frame) => {
      const d = (await movie.snapshot(frame, { as: 'imageData' })).data;
      let h = 0x811c9dc5;
      for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16);
    };
    window.pixelAt = async (frame, x, y) => { const img = await movie.snapshot(frame, { as: 'imageData' }); const i = (y * img.width + x) * 4; return Array.from(img.data.slice(i, i + 4)); };
    window.framePixels = async (frame) => Array.from((await movie.snapshot(frame, { as: 'imageData' })).data);
    window.layerInfo = async (frame) => (await movie.inspect(frame)).layers.find((l) => l.name === 'box');
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: 3, frameRate: 30, background: '#102040',
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'band', width: 320, height: 24, initial: { x: 160, y: 168, fillColor: '#f2c14e' } },
          model({ type: 'model', name: 'box', asset: '../fixtures/spin-box.gltf', three: { renderer: q.get('renderer') || undefined, antialias: q.get('aa') !== '0' },
            width: 320, height: 180, initial: { x: 160, y: 90, anchorX: 0.5, anchorY: 0.5 } }),
        ] },
      });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
