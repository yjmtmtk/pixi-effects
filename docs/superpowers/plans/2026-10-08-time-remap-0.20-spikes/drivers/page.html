<!DOCTYPE html><html><head><meta charset="UTF-8"><title>spike</title></head><body>
<canvas id="stage" width="320" height="180"></canvas>
<script>
window.__logs = [];
for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
</script>
<script type="importmap">
{ "imports": { "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "gsap": "https://esm.sh/gsap@3.12.5", "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin", "mediabunny": "https://esm.sh/mediabunny" } }
</script>
<script type="module">
import { Movie, particles } from '../dist/index.js';
window.particles = particles; window.mb = await import('mediabunny');
window.mk = async (opts) => {
  if (window.movie) { await window.movie.destroy(); window.movie = null; }
  window.__logs.length = 0;
  const movie = new Movie(); window.movie = movie;
  await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: 8, frameRate: 30, background: '#000000', assets: opts.assets ?? [{ name: 'v', src: 't.mp4' }], ...opts });
  return true;
};
const toImg = (url) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = url; });
window.snap = async (f) => movie.snapshot(f, { as: 'dataURL' });
window.pix = async (url) => { const i = await toImg(url); const c = document.createElement('canvas'); c.width = i.width; c.height = i.height; const g = c.getContext('2d'); g.drawImage(i, 0, 0); return g.getImageData(0, 0, c.width, c.height).data; };
window.diff = async (a, b) => { if (a === b) return 0; const A = await pix(a), B = await pix(b); let m = 0; for (let i = 0; i < A.length; i++) m = Math.max(m, Math.abs(A[i] - B[i])); return m; };
window.shuffle = (arr, seed = 1) => { const a = arr.slice(); let s = seed; const r = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
window.orders = async (frames) => {
  const take = async (order) => { const m = {}; for (const f of order) m[f] = await snap(f); return m; };
  const fwd = await take(frames);
  const bwd = await take(frames.slice().reverse());
  const jmp = await take(shuffle(frames, 7));
  const jmp2 = await take(shuffle(frames, 99));
  const out = { n: frames.length, bwdMax: 0, jmpMax: 0, jmp2Max: 0 };
  for (const f of frames) {
    out.bwdMax = Math.max(out.bwdMax, await diff(fwd[f], bwd[f]));
    out.jmpMax = Math.max(out.jmpMax, await diff(fwd[f], jmp[f]));
    out.jmp2Max = Math.max(out.jmp2Max, await diff(fwd[f], jmp2[f]));
  }
  out.fwd = fwd;
  return out;
};
window.__ready = true;
</script></body></html>
