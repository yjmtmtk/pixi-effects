# A fresh checkout on Linux: typecheck, build, unit tests (about 90 s). It catches what a working tree on the maintainer's Mac cannot: a file that was never
# committed, a name that differs only in case, a lockfile that does not match. The real-browser tests are not run here: a runner has no GPU (Chrome falls back to
# software GL and WebGPU is absent), so they say little about drawing and take 10 to 17 minutes; `npm run release:check` runs them before every publish.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # the command-line tools use Node's built-in WebSocket (Node >= 22)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests (the real-browser tests are skipped here: they run on the maintainer's machine, with a GPU, as `npm run release:check`)
        run: npm test
        env:
          SKIP_BROWSER_TESTS: '1'
