name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp -r dist examples ai _site/
          mkdir -p _site/docs && cp docs/dsl.md docs/api.md _site/docs/
          cp llms.txt llms-full.txt _site/
          node scripts/build-guide.mjs _site/guide
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>pixi-effects · examples</title>
            <style>
              body { background: #0a0a0f; color: #ccc; font-family: system-ui, -apple-system, sans-serif; padding: 40px; max-width: 720px; margin: 0 auto; line-height: 1.5; }
              h1 { font-weight: 500; margin: 0 0 4px 0; }
              p { color: #888; font-size: 14px; margin: 0 0 24px 0; }
              ol { list-style: none; padding: 0; margin: 0 0 24px 0; counter-reset: ex; }
              ol li { counter-increment: ex; margin: 0; }
              ol li a { color: #ddd; padding: 10px 0; display: block; text-decoration: none; border-bottom: 1px solid #1a1a22; }
              ol li a:hover { background: #11162a; color: #fff; padding-left: 8px; }
              ol li a small { color: #88ccff; font-family: Menlo, monospace; margin-right: 12px; }
              .playground { display: inline-block; margin-top: 8px; padding: 10px 18px; background: #1a2140; color: #ddd; border-radius: 6px; text-decoration: none; }
              .playground:hover { background: #243069; color: #fff; }
              a.repo { color: #88ccff; font-size: 12px; }
              a.guide { display: block; margin: 0 0 14px 0; padding: 22px 24px; background: linear-gradient(120deg, #14335a, #1b4a5a); color: #fff; border-radius: 10px; text-decoration: none; }
              a.guide strong { display: block; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
              a.guide span { color: #b9e3ee; font-size: 14px; }
              a.guide:hover { background: linear-gradient(120deg, #1a4272, #236070); }
              a.gallery { display: block; margin: 0 0 28px 0; padding: 22px 24px; background: linear-gradient(120deg, #1b2347, #2a1f4a); color: #fff; border-radius: 10px; text-decoration: none; }
              a.gallery strong { display: block; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
              a.gallery span { color: #b9c3ee; font-size: 14px; }
              a.gallery:hover { background: linear-gradient(120deg, #243069, #38286a); }
              .ai { font-size: 13px; color: #888; margin: 0 0 24px 0; }
              .ai a { color: #88ccff; margin-right: 12px; }
            </style>
          </head>
          <body>
            <h1>pixi-effects · examples</h1>
            <p>Declarative composition + video rendering for the web. Read in order — each example focuses on one feature area. <a class="repo" href="https://github.com/yjmtmtk/pixi-effects">github.com/yjmtmtk/pixi-effects</a></p>
            <a class="guide" href="guide/"><strong>📖 Guide — learn it, step by step</strong><span>Your first video in ten minutes, how it works, guides for text, shapes, audio, filters and 2.5D, a cookbook with live demos, and the tools that let an AI write and check a video.</span></a>
            <a class="gallery" href="examples/gallery/"><strong>▶ Gallery — 39 motion-graphics pieces</strong><span>Logo reveals, kinetic type, data stories, 2.5D, three.js and more — each one plain data written by an AI (fable, opus or sonnet).</span></a>
            <p class="ai">For AI agents: <a href="ai/SKILL.md">SKILL.md</a><a href="llms.txt">llms.txt</a><a href="llms-full.txt">llms-full.txt</a><a href="ai/template.html">template.html</a></p>
            <ol>
              <li><a href="examples/01-hello.html"><small>01</small>hello — minimum viable composition</a></li>
              <li><a href="examples/02-keyframes.html"><small>02</small>keyframes &amp; expressions</a></li>
              <li><a href="examples/03-shapes.html"><small>03</small>shapes</a></li>
              <li><a href="examples/04-media.html"><small>04</small>media (image / video / audio)</a></li>
              <li><a href="examples/05-composition-mask.html"><small>05</small>composition &amp; mask</a></li>
              <li><a href="examples/06-filters.html"><small>06</small>filters</a></li>
              <li><a href="examples/07-transitions.html"><small>07</small>transitions</a></li>
              <li><a href="examples/08-presets-export.html"><small>08</small>presets &amp; export</a></li>
              <li><a href="examples/09-audio.html"><small>09</small>audio (multi-track + ducking)</a></li>
              <li><a href="examples/10-three.html"><small>10</small>three.js layer</a></li>
              <li><a href="examples/11-depth.html"><small>11</small>depth &amp; camera (2.5D)</a></li>
              <li><a href="examples/12-title-motion.html"><small>12</small>title motion (2.5D)</a></li>
              <li><a href="examples/13-sfx.html"><small>13</small>sound effects (no files)</a></li>
              <li><a href="examples/14-draw-on.html"><small>14</small>draw-on strokes, changing text</a></li>
              <li><a href="examples/15-custom-player.html"><small>15</small>your own player</a></li>
              <li><a href="examples/music-lab.html"><small>♪</small>music lab — eight tunes written as text</a></li>
            </ol>
            <a class="playground" href="examples/playground.html">▶ open playground</a>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
