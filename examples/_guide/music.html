<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music written as text</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe music-guide` block of site/guide/audio.md: edit the guide, then run the script -->
  <style>
    /* the page IS the picture: it fills the guide's frame exactly (no padding, no inline-canvas gap), so it never scrolls inside it */
    html, body { margin: 0; padding: 0; overflow: hidden; line-height: 0; background: #0d1220; }       /* line-height 0: the picture sits on a text line; a line of text under it is a gap */
    canvas { display: block; width: 100%; height: auto; }
    .movie-controller-wrap { width: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      return [
        { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#10131c' } },
        { type: 'text', text: 'a tune from text', style: { fontSize: 72, fill: '#ffffff' }, initial: { x: 'GW/2', y: 'GH/2', anchorX: 0.5, anchorY: 0.5 } },
        { type: 'audio', volume: 0.8, music: {
            bpm: 92, swing: 0.12,
            tracks: [
              { inst: 'keys', strum: 0.012, notes: 'Cmaj7:4 Am7:4 Dm7:4 G7:4' },           // chords by name, 4 beats each
              { inst: 'bass', notes: 'c2:2 g2:2 | a1:2 e2:2 | d2:2 a2:2 | g1:2 d2:2' },     // notes: name, octave, length in beats
              { inst: 'bell', vol: 0.5, notes: '_:4 | e6:1 g6:1 e6:2 | d6:4 | b5:2 d6:2' },  // _ is a rest
            ],
            drums: [{ from: 4, kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' }],
        } },
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 12, frameRate: 30, background: '#101424', poster: 1.5,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
