<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>An orbit within an orbit</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe orbit-chain` block of site/guide/motion.md: edit the guide, then run the script -->
  <style>
    body { margin: 0; padding: 16px; background: #0d1220; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    .movie-controller-wrap { width: min(960px, 100%); }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      return [
        { type: 'shape', shape: 'circle', radius: 50, duration: 8, initial: { x: 640, y: 360, fillColor: '#ffd166' } },
        { type: 'null', name: 'earth-orbit', initial: { x: 640, y: 360 }, keyframes: [{ at: 0, to: { rotation: 360 }, duration: 8, ease: 'none' }] },
        { type: 'shape', shape: 'circle', radius: 20, parent: 'earth-orbit', initial: { x: 240, y: 0, fillColor: '#4cc9f0' } },
        { type: 'null', name: 'moon-orbit', parent: 'earth-orbit', initial: { x: 240, y: 0 }, keyframes: [{ at: 0, to: { rotation: 1440 }, duration: 8, ease: 'none' }] },
        { type: 'shape', shape: 'circle', radius: 7, parent: 'moon-orbit', initial: { x: 55, y: 0, fillColor: '#e8eefc' } },
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 8, frameRate: 30, background: '#101424', poster: 1.5,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
