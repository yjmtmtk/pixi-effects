<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A slideshow with transitions</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe slideshow` block of site/guide/cookbook.md: edit the guide, then run the script -->
  <style>
    /* the page IS the picture: it fills the guide's frame exactly (no padding, no inline-canvas gap), so it never scrolls inside it */
    html, body { margin: 0; padding: 0; overflow: hidden; line-height: 0; background: #0d1220; }       /* line-height 0: the picture sits on a text line; a line of text under it is a gap */
    canvas { display: block; width: 100%; height: auto; }
    .movie-controller-wrap { width: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie, kenBurns, withFade } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      const photos = ['p1', 'p2', 'p3'], L = 4, T = 1, STEP = L - T;
      const kinds = ['crossfade', 'wipe', 'zoom'];
      const total = photos.length * STEP + T;
      const sequences = photos.map((asset, i) => kenBurns({ asset, name: 'scene' + i, at: i * STEP, duration: L, motion: i % 2 ? 'position' : 'scale' }));
      const transitions = photos.slice(1).map((_, i) => ({
        kind: kinds[i % kinds.length], from: 'scene' + i, to: 'scene' + (i + 1), at: (i + 1) * STEP, duration: T,
        ...(kinds[i % kinds.length] === 'wipe' ? { direction: 'left' } : {}),
      }));
      photos.forEach((_, i) => sequences.push(withFade({
        type: 'text', text: 'Scene ' + (i + 1), at: i * STEP + 0.5, duration: L - 1.5,
        style: { fontSize: 44, fill: '#ffffff', dropShadow: { color: '#000000', blur: 6, distance: 2, alpha: 0.7 } },
        initial: { x: 'GW/2', y: 600, anchorX: 0.5, anchorY: 0.5 },
      }, { in: 0.4, out: 0.4 })));
      transitions.forEach(tr => sequences.push({ type: 'audio', sfx: 'swoosh', at: tr.at + tr.duration / 2 - 0.16 }));
      return { sequences, transitions, duration: total };
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: built.duration || 8, frameRate: 30, background: '#101424', poster: 5.5,
      assets: [{ name: 'p1', src: '../_assets/photos/lake-autumn.jpg' }, { name: 'p2', src: '../_assets/photos/lake-dusk.jpg' }, { name: 'p3', src: '../_assets/photos/lake-lookout.jpg' }],
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
