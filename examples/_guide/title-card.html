<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A title card</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe title-card` block of site/guide/cookbook.md: edit the guide, then run the script -->
  <style>
    /* the page IS the picture: it fills the guide's frame exactly (no padding, no inline-canvas gap), so it never scrolls inside it */
    html, body { margin: 0; padding: 0; overflow: hidden; line-height: 0; background: #0d1220; }       /* line-height 0: the picture sits on a text line; a line of text under it is a gap */
    canvas { display: block; width: 100%; height: auto; }
    .movie-controller-wrap { width: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      return [
        { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#101424' } },
        { type: 'text', text: 'Spring Collection', style: { fontSize: 110, fontWeight: 'bold', fill: '#ffffff' },
          initial: { x: 'GW/2', y: 330, anchorX: 0.5, anchorY: 0.5 },
          keyframes: [{ at: 0.3, from: { alpha: 0, y: 380 }, to: { alpha: 1, y: 330 }, duration: 0.9, ease: 'power3.out' }] },
        { type: 'shape', shape: 'line', from: [420, 420], to: [860, 420], trimEnd: 0, strokeCap: 'round', at: 1,
          initial: { strokeColor: '#ffd166', strokeWidth: 8 }, keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1, ease: 'power2.inOut' }] },
        { type: 'audio', sfx: 'swoosh', at: 0.3 },
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 5, frameRate: 30, background: '#101424', poster: 2.6,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
