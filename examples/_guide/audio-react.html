<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visuals that follow the music</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe audio-react-guide` block of site/guide/audio.md: edit the guide, then run the script -->
  <style>
    /* the page IS the picture: it fills the guide's frame exactly (no padding, no inline-canvas gap), so it never scrolls inside it */
    html, body { margin: 0; padding: 0; overflow: hidden; line-height: 0; background: #0d1220; }       /* line-height 0: the picture sits on a text line; a line of text under it is a gap */
    canvas { display: block; width: 100%; height: auto; }
    .movie-controller-wrap { width: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie, react, bpmEnvelope } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      const env = bpmEnvelope(120, { duration: 8, frameRate: 30 });      // with a real file: const env = await audioEnvelope('music.mp3', { frameRate: 30 })
      return [
        { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#07060f' } },
        { type: 'shape', shape: 'circle', radius: 110, duration: 8, initial: { x: 'GW/2', y: 'GH/2', fillColor: '#ff2d95' },
          keyframes: react(env, { duration: 8, props: {
            scale: { base: 1, amount: 0.45, band: 'bass', attack: 0.02, release: 0.2 },        // swells with the low end, falls back slowly
            alpha: { base: 0.5, amount: 0.5, beats: true, decay: 0.15 },                      // flashes on every beat
          } }) },
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 8, frameRate: 30, background: '#101424', poster: 3.2,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
