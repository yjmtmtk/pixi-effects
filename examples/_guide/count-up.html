<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Numbers that count up</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe count-up` block of site/guide/cookbook.md: edit the guide, then run the script -->
  <style>
    body { margin: 0; padding: 16px; background: #0d1220; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    .movie-controller-wrap { width: min(960px, 100%); }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js",
      "pixi-effects/controller": "https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/Controller.js",
      "pixi-effects/present":    "https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      const stats = [['Users', 24800], ['Countries', 62], ['Uptime %', 99.9]];
      return stats.flatMap(([label, value], i) => [
        { type: 'text', text: '{value}', format: { grouping: true, decimals: value % 1 ? 1 : 0 }, at: 0.2 + i * 0.3,
          style: { fontSize: 110, fontWeight: 'bold', fill: '#ffffff' },
          initial: { x: 240 + i * 400, y: 330, anchorX: 0.5, anchorY: 0.5, value: 0 },
          keyframes: [{ at: 0, to: { value }, duration: 2, ease: 'power2.out' }] },
        { type: 'text', text: label, at: 0.2 + i * 0.3, style: { fontSize: 28, fill: '#9fb3d9' },
          initial: { x: 240 + i * 400, y: 410, anchorX: 0.5, anchorY: 0.5 },
          keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.6 }] },
      ]);
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 4.5, frameRate: 30, background: '#101424', poster: 3.5,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
