<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A lower third</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe lower-third` block of site/guide/cookbook.md: edit the guide, then run the script -->
  <style>
    body { margin: 0; padding: 16px; background: #0d1220; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    .movie-controller-wrap { width: min(960px, 100%); }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      const T = 4;
      return [
        { type: 'shape', shape: 'rect', name: 'bar', width: 520, height: 110, cornerRadius: 10, anchorX: 0, anchorY: 0.5, duration: T,
          initial: { x: 80, y: 600, fillColor: '#3b5bdb' },
          keyframes: [{ at: 0, from: { x: -560 }, to: { x: 80 }, duration: 0.6, ease: 'power3.out' }, { at: -0.6, to: { x: -560 }, duration: 0.6, ease: 'power3.in' }] },
        { type: 'text', text: 'Mika Sato', duration: T, style: { fontSize: 42, fontWeight: 'bold', fill: '#ffffff' },
          initial: { x: 112, y: 580, anchorX: 0, anchorY: 0.5 },
          keyframes: [{ at: 0.3, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.4 }, { at: -0.6, to: { alpha: 0 }, duration: 0.3 }] },
        { type: 'text', text: 'Head of Design', duration: T, style: { fontSize: 24, fill: '#dbe4ff' },
          initial: { x: 112, y: 622, anchorX: 0, anchorY: 0.5 },
          keyframes: [{ at: 0.4, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.4 }, { at: -0.6, to: { alpha: 0 }, duration: 0.3 }] },
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 4, frameRate: 30, background: '#1b2238', poster: 2,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
