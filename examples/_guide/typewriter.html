<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terminal lines that type themselves</title>
  <!-- written by scripts/build-guide-demos.mjs from the `// @recipe typewriter` block of site/guide/cookbook.md: edit the guide, then run the script -->
  <style>
    body { margin: 0; padding: 16px; background: #0d1220; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    .movie-controller-wrap { width: min(960px, 100%); }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

<script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":    "../../dist/present.js"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const canvas = document.getElementById('stage');
    const movie = new Movie();
    new Controller(movie, { canvas });       // a movie with stops gets a Present button

    // the guide's recipe, as it is printed there
    const built = (() => {
      const lines = ['$ npm install pixi-effects', 'added 4 packages in 3s', '$ npx pixi-effects render movie.html', 'rendered movie.mp4 (12 s)'];
      const CPS = 22;
      let at = 0.5;
      return [
        { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#0b0f14' } },
        ...lines.map((text, i) => {
          const start = at;
          at += text.length / CPS + 0.4;
          return { type: 'text', text, at: start, style: { fontSize: 34, fontFamily: 'ui-monospace, Menlo, monospace', fill: text.startsWith('$') ? '#7bd88f' : '#cdd6e0' },
            initial: { x: 90, y: 150 + i * 70, anchorX: 0, anchorY: 0.5, visibleChars: 0 },
            keyframes: [{ at: 0, to: { visibleChars: text.length }, duration: text.length / CPS, ease: 'none' }] };
        }),
      ];
    })();

    await movie.init({ canvas, width: 1280, height: 720, duration: 9, frameRate: 30, background: '#101424', poster: 8,
      composition: Array.isArray(built) ? { sequences: built } : { sequences: built.sequences, transitions: built.transitions } });

    window.movie = movie;
    window.__ready = true;
  </script>
</body>
</html>
