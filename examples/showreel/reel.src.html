<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixi-effects: everything, in one video</title>
  <link rel="stylesheet" href="@@LOADER_CSS@@" />
  <style>
    body { background: #0b0d12; margin: 0; padding: 16px; }
    .stage { position: relative; width: min(1280px, 100%); margin: 0 auto; }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <!--
    GENERATED by scripts/build-showreel.mjs from examples/showreel/ (reel.src.html, shared.js, chapters.json, chapters/*.js, music.js). Edit those, not this file.
    This whole video is the data below: every chapter is a plain function that returns layers, and the page only lays them end to end.
  -->
  <div class="stage">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>
  <script type="importmap">
  { "imports": {
      "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap": "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny": "https://esm.sh/mediabunny",
      "pixi-effects": "@@DIST@@index.js",
      "pixi-effects/controller": "@@DIST@@Controller.js",
      "pixi-effects/presenter": "@@DIST@@Presenter.js",
      "pixi-effects/three": "@@DIST@@three.js",
      "pixi-filters": "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three": "https://esm.sh/three@0.178.0" } }
  </script>
  <script type="module">
    import * as lib from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    /*@@INLINE@@*/

    const W = 1920, H = 1080, FPS = 30;
    const countLayers = (seqs) => (seqs || []).reduce((n, s) => n + 1 + countLayers(s.sequences), 0);

    // Lay the chapters end to end: each starts OVERLAP seconds before the one before it ends, and the transition between them runs in that overlap.
    function assemble(facts) {
      const P = SHARED(lib, facts);
      const plan = P.planOf(TABLE);
      const audio = MUSIC(P, plan) ?? [];
      P.music = (audio.find(l => l.music) || {}).music;           // the chapter about sound draws this very music as notation
      const sequences = [], transitions = [], assets = [];
      TABLE.chapters.forEach((row, i) => {
        const c = CH[row.id](P);
        if (c.duration !== row.duration) console.warn(`reel: chapter ${row.id} lasts ${c.duration} s but chapters.json promises ${row.duration} s`);
        const at = plan.chapters[i].at;
        sequences.push({ type: 'composition', name: row.id, at, duration: c.duration, width: W, height: H, sequences: c.sequences });
        for (const a of c.assets ?? []) assets.push(a);
        if (i > 0 && TABLE.transitions[row.id]) transitions.push({ ...TABLE.transitions[row.id], from: TABLE.chapters[i - 1].id, to: row.id, at, duration: TABLE.overlap });
      });
      return { sequences: [...sequences, ...audio], transitions, assets, total: plan.total, plan: plan.chapters };
    }

    try {
      // pass 1 counts the reel's own data; pass 2 builds the chapters again knowing the numbers (the last chapter shows them)
      const first = assemble({ kb: 0, layers: 0, lineCount: 0, lines: [] });
      const lines = JSON.stringify(first.sequences, null, 2).split('\n');
      const facts = { kb: @@KB@@, layers: countLayers(first.sequences), lineCount: lines.length, lines };
      const reel = assemble(facts);
      const movie = new lib.Movie();
      window.movie = movie;
      new Controller(movie, { canvas: document.getElementById('stage') });
      await movie.init({
        canvas: document.getElementById('stage'), width: W, height: H, frameRate: FPS, duration: reel.total, background: '#000000',
        assets: reel.assets, poster: TABLE.poster ?? reel.total * 0.5, composition: { sequences: reel.sequences, transitions: reel.transitions },
      });
      window.reelPlan = reel.plan;
      window.__ready = true;
    } catch (err) {
      console.error('reel failed: ' + (err && err.message || err));
      window.__ready = true;
    }
  </script>
</body>
</html>
