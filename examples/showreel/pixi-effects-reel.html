    const drawOn = (at, duration, ease = 'power2.inOut') => ({ at, to: { trimEnd: 1 }, duration, ease });
    const sfx = (name, preset, at, volume, extra = {}) => ({ type: 'audio', name, sfx: { preset, ...extra }, at, volume });
  
    return {
      duration: 7,
      poster: 6.2,
      sequences: [
        P.bg(C.ink),
        // the ring's track is there from the first frame (calm edge), the vermilion arc fills it
        { type: 'shape', shape: 'arc', name: 'track', radius: R, startAngle: 0, endAngle: 360,
          initial: { x: 'GW*5/16', y: 'GH/2', strokeColor: C.ink2, strokeWidth: RW } },
        // construction lines: the horizon across the whole poster and the ring's vertical axis
        { type: 'shape', shape: 'line', name: 'horizon', from: [96, CY], to: [GW - 96, CY], trimEnd: 0, strokeCap: 'butt',
          initial: { strokeColor: C.bone, strokeWidth: 3, strokeAlpha: 0.5 }, keyframes: [drawOn(0.6, 1.5, 'power3.inOut')] },
        { type: 'shape', shape: 'line', name: 'axis', from: [CX, CY - R - 90], to: [CX, CY + R + 90], trimEnd: 0, strokeCap: 'butt',
          initial: { strokeColor: C.bone, strokeWidth: 3, strokeAlpha: 0.5 }, keyframes: [drawOn(0.8, 1.1)] },
        // the dial: 60 ticks, one path, drawn on in order
        { type: 'shape', shape: 'path', name: 'dial', d: ticks.trim(), trimEnd: 0, strokeCap: 'butt',
          initial: { strokeColor: C.bone, strokeWidth: 3, strokeAlpha: 0.7 }, keyframes: [drawOn(1.0, 1.3)] },
        // the diamond: a closed polygon drawn on
        { type: 'shape', shape: 'polygon', name: 'diamond', points: diamond, trimEnd: 0, strokeJoin: 'miter',
          initial: { strokeColor: C.bone, strokeWidth: 3, strokeAlpha: 0.9 }, keyframes: [drawOn(1.5, 1.0)] },
        // the progress ring
        { type: 'shape', shape: 'arc', name: 'ring', radius: R, startAngle: -90, endAngle: -90, strokeCap: 'butt',
          initial: { x: 'GW*5/16', y: 'GH/2', strokeColor: C.red, strokeWidth: RW },
          keyframes: [{ at: 0.6, to: { endAngle: 270 }, duration: 1.3, ease: 'power2.inOut' }] },
        // the mark: a disc that grows, then morphs into a four-point star while its gradient turns
        { type: 'shape', shape: 'path', name: 'mark', d: disc, morphTo: star, at: 1.9, duration: 5.1, colorSpace: 'oklch',
          fillGradient: { type: 'linear', angle: 45, stops: [[0, C.red], [0.4, C.red], [1, C.gold]] },
          initial: { pivotX: CX, pivotY: CY, x: 'GW*5/16', y: 'GH/2', scale: 0, rotation: -45, morph: 0 },
          keyframes: [
            { at: 0, to: { scale: 1 }, duration: 0.55, ease: 'power3.out' },
            { at: 0.75, to: { morph: 1, rotation: 0 }, duration: 1.25, ease: 'power2.inOut' },
            { at: 0.5, to: { fillGradient: { angle: 315 } }, duration: 3.6, ease: 'sine.inOut' },
          ] },
        // the display word, rising through a slot cut by an inline mask
        { type: 'text', name: 'word', text: 'SHAPES', style: wordStyle, at: 1.2, duration: 5.8,
          initial: { x: PANEL_L, y: WORD_Y, anchorX: 0, anchorY: 0.5 },
          mask: { type: 'shape', shape: 'rect', name: 'word-slot', width: PANEL_W + 40, height: 250, initial: { x: PANEL_L - 10, y: WORD_Y - 135, anchorX: 0, anchorY: 0, fillColor: '#ffffff' } },
          keyframes: [{ at: 0, from: { y: WORD_Y + 240 }, to: { y: WORD_Y }, duration: 0.8, ease: 'power3.out' }] },
        ...dots,
        ...P.tag('02', 'SHAPES', 'a line, a ring, a morph, a wave: all shapes, all data'),
        sfx('sfx-draw', 'swoosh', 0.5, 0.5),
        sfx('sfx-word', 'swipe', 1.2, 0.4),
        sfx('sfx-mark', 'pop', 1.9, 0.55),
        sfx('sfx-morph', 'swoosh', 2.55, 0.4, { pitch: 5, brightness: 0.3 }),
        ...[0, 1, 2, 3, 4].map((k) => sfx(`sfx-dot-${k}`, 'click', f(WAVE_IN + k * 0.11), 0.45, { pitch: k * 2 })),
        sfx('sfx-ripple', 'chime', RIPPLE, 0.4, { pitch: 7 }),
      ],
    };
  },
  "03-space": // 03 SPACE — 2.5D without a 3D engine: five cards hang at five depths (each prints its own z), a camera dollies in on offsetZ while the near
  // cards slip past the lens, and the focus racks from the nearest card to the far one, the vermilion word DEPTH.
  function (P) {
    const { C, F } = P;
    const HERO_Z = -700;
    // A card is a threeD composition: a paper rect, a small mono "z", the big number (or word). Identical cards, only z differs: the screen size,
    // the overlap and the blur are the depth.
    const card = ({ name, x, y, z, w, h, fill, ink, rotY = 0, rotX = 0, big, size, label, near = false, keyframes = [] }) => ({
      type: 'composition', name, threeD: true, hideBehindCamera: near, width: w, height: h,
      initial: { x, y, z, pivotX: w / 2, pivotY: h / 2, rotationY: rotY, rotationX: rotX },
      keyframes,
      sequences: [
        { type: 'shape', shape: 'rect', name: name + '-paper', width: w, height: h, cornerRadius: 10,
          initial: { x: w / 2, y: h / 2, fillColor: fill, strokeColor: C.ink, strokeWidth: 3 } },
        { type: 'text', name: name + '-z', text: label, style: { fontSize: 46, fill: ink, fontFamily: F.mono, letterSpacing: 2 },
          initial: { x: 30, y: 26, anchorX: 0, anchorY: 0, alpha: 0.8 } },
        { type: 'text', name: name + '-word', text: big, style: { fontSize: size, fill: ink, fontFamily: F.display },
          initial: { x: w / 2, y: h / 2 + 22, anchorX: 0.5, anchorY: 0.5 } },
      ],
    });
    const paper = { w: 400, h: 240, fill: C.bone, ink: C.ink, size: 92, label: 'z' };
    return {
      duration: 8,
      poster: 6.0,
      sequences: [
        P.bg(C.ink),
        // The camera: looks at the far card the whole time (so it stays centred and everything else parallaxes), dollies in on offsetZ, sways a
        // little, and racks the focus from the nearest card to the far one half way through the flight.
        { type: 'camera', name: 'cam',
          initial: { x: 880, y: 590, lookAtX: 960, lookAtY: 540, lookAtZ: HERO_Z, focus: 'card-near', aperture: 44 },
          keyframes: [
            { at: 1.2, to: { offsetZ: -900 }, duration: 4.4, ease: 'power2.inOut' },
            { at: 1.2, to: { x: 1010, y: 510 }, duration: 4.4, ease: 'power2.inOut' },
            { at: 3.0, to: { focus: 'card-hero' }, duration: 1.5, ease: 'power2.inOut' },
          ] },
        // Far to near (array order does not matter for threeD layers: they are drawn farthest-first). The side cards sit far enough off the
        // camera's path that they leave the frame whole as the camera passes them.
        card({ name: 'card-hero', x: 960, y: 540, z: HERO_Z, w: 1000, h: 560, fill: C.red, ink: C.bone, size: 196, label: 'z  -700', big: 'DEPTH',
          rotY: -16, rotX: 4, keyframes: [{ at: 1.6, to: { rotationY: 0, rotationX: 0 }, duration: 3.8, ease: 'power2.inOut' }] }),
        card({ ...paper, name: 'card-d', x: 560, y: 690, z: -450, rotY: 14, rotX: -3, big: '-450' }),
        card({ ...paper, name: 'card-c', x: 1700, y: 250, z: -200, rotY: -12, rotX: 5, big: '-200' }),
        card({ ...paper, name: 'card-b', x: 440, y: 380, z: 150, rotY: 12, rotX: 2, big: '+150', near: true }),
        card({ ...paper, name: 'card-near', x: 1280, y: 650, z: 500, rotY: -10, rotX: -4, big: '+500', near: true }),
        // Sound: the flight starts, the focus lands, the dolly settles.
        { type: 'audio', name: 'sfx-fly', sfx: 'swoosh', at: 1.25, volume: 0.35 },
        { type: 'audio', name: 'sfx-focus', sfx: 'click', at: 4.75, volume: 0.45 },
        { type: 'audio', name: 'sfx-land', sfx: { preset: 'hit', pitch: -5 }, at: 5.45, volume: 0.3 },
        // The label last: it is 2D and must stay on top of the cards.
        ...P.tag('03', 'SPACE', 'cards at five depths: a dolly in, a rack focus to the far one'),
      ],
    };
  },

  "05-blend-matte": function (P) {
    const { C, F } = P;
    // One word, three compositing tools in one gesture:
    //   1. a hard band (ONE named matte, not drawn itself) sweeps across and cuts three layers at once: a panel, a hatch and the vermilion word;
    //   2. right behind it, a wide gradient used as a LUMA matte fills the word in for good with a soft edge;
    //   3. a light leak (color-dodge) and a streak (screen) burn over the finished word; a multiply vignette frames it.
    const CX = 960, CY = 500;                                      // the word's centre
    const BAND_W = 380, BAND_TOP = 190, BAND_H = 620;              // the band: a window as tall as the word and its label
    const word = { fontSize: 400, fontFamily: F.display, fontWeight: '900' };
    const wordAt = { x: CX, y: CY, anchorX: 0.5, anchorY: 0.5 };
  
    // a hatch of 45-degree lines across the band's height: ONE path of many sub-paths
    let hatch = '';
    for (let x = -BAND_H; x <= 1920; x += 34) hatch += `M ${x} ${BAND_TOP} L ${x + BAND_H} ${BAND_TOP + BAND_H} `;
  
    // a code label under the word that names what is on screen in each beat
    const LABEL_Y = 860;
    const label = (name, text, at, until) => ({
      type: 'text', name, text, at, ...(until ? { duration: until - at } : {}),
      style: { fontSize: 44, fill: C.gold, fontFamily: F.mono },
      initial: { x: CX, y: LABEL_Y, anchorX: 0.5, anchorY: 0.5 },
      keyframes: [
        { at: 0, from: { alpha: 0, y: LABEL_Y + 16 }, to: { alpha: 1, y: LABEL_Y }, duration: 0.4, ease: 'power3.out' },
        ...(until ? [{ at: -0.3, to: { alpha: 0 }, duration: 0.3, ease: 'power2.in' }] : []),
      ],
    });
  
    return {
      duration: 7,
      poster: 5.6,
      sequences: [
        P.bg(C.ink),
  
        // the word as a ghost outline: what is there before any matte lets the filled word through
        { type: 'text', name: 'ghost', text: 'MATTE', style: { ...word, fill: C.ink, stroke: { color: C.bone, width: 4, join: 'round' } },
          initial: { ...wordAt, alpha: 0.45 },
          keyframes: [{ at: 3.0, to: { alpha: 0 }, duration: 0.6, ease: 'power2.inOut' }] },  // gone once the word is filled: no rim around it
  
        // (1) THE MATTE: a null carries the band and its two visible edge lines together; the band itself is never drawn
        { type: 'null', name: 'rig', initial: { x: 330, y: 0 },
          keyframes: [{ at: 0.7, to: { x: 2250 }, duration: 2.1, ease: 'power2.inOut' }] },
        { type: 'shape', shape: 'rect', name: 'band', parent: 'rig', width: BAND_W, height: BAND_H, anchorX: 0.5, anchorY: 0,
          initial: { x: 0, y: BAND_TOP, fillColor: '#ffffff' } },
        // three layers cut by that one band
        { type: 'shape', shape: 'rect', name: 'panel', mask: 'band', width: 1920, height: 1080, anchorX: 0, anchorY: 0,
          initial: { x: 0, y: 0, fillColor: C.ink2 } },
        { type: 'shape', shape: 'path', name: 'hatch', mask: 'band', d: hatch, strokeCap: 'butt',
          initial: { strokeColor: C.bone, strokeWidth: 3, strokeAlpha: 0.16 } },
        { type: 'text', name: 'word-band', mask: 'band', text: 'MATTE', style: { ...word, fill: C.red }, initial: wordAt },
        // the window's edges, drawn by two thin lines that ride the same null (so the eye sees where the matte is)
        ...[-BAND_W / 2, BAND_W / 2].map((dx, i) => ({
          type: 'shape', shape: 'rect', name: 'edge-' + i, parent: 'rig', width: 4, height: BAND_H, anchorX: 0.5, anchorY: 0,
          initial: { x: dx, y: BAND_TOP, fillColor: C.bone, alpha: 0.9 },
        })),
  
        // (2) A LUMA MATTE: a wide gradient, white behind and black ahead, slides in right after the band: the word fills in for good, softly
        { type: 'shape', shape: 'rect', name: 'fade', width: 3800, height: 700, anchorX: 1, anchorY: 0.5,
          fillGradient: { angle: 0, stops: [[0, '#ffffff'], [0.8, '#ffffff'], [1, '#000000']] },
          initial: { x: 300, y: CY },
          keyframes: [{ at: 1.4, to: { x: 2500 }, duration: 1.8, ease: 'power1.inOut' }] },
        { type: 'text', name: 'word-luma', mask: { layer: 'fade', channel: 'luma' }, text: 'MATTE', style: { ...word, fill: C.red }, initial: wordAt },
  
        // (3) BLEND MODES over the finished word: a warm haze (screen) lifts the dark room, a light leak burns the letters out (color-dodge,
        //     cut to the letters by a second matte: over near-black a dodge only makes a muddy red disc), a streak of light (screen)
        { type: 'shape', shape: 'circle', name: 'haze', radius: 760, blendMode: 'screen',
          fillGradient: { type: 'radial', stops: [[0, 'rgba(255,150,70,0.30)'], [1, 'rgba(255,120,40,0)']] },
          initial: { x: 1900, y: 60, alpha: 0 },
          keyframes: [
            { at: 3.4, to: { alpha: 1 }, duration: 0.6, ease: 'power2.out' },
            { at: 3.4, to: { x: 1180, y: 380 }, duration: 2.4, ease: 'power2.inOut' },
          ] },
        { type: 'text', name: 'letters', text: 'MATTE', style: { ...word, fill: '#ffffff' }, initial: wordAt },
        { type: 'shape', shape: 'circle', name: 'leak', radius: 720, blendMode: 'color-dodge', mask: 'letters',
          fillGradient: { type: 'radial', stops: [[0, 'rgba(255,170,70,0.92)'], [0.45, 'rgba(255,120,40,0.55)'], [1, 'rgba(255,90,30,0)']] },
          initial: { x: 1900, y: 60, alpha: 0 },
          keyframes: [
            { at: 3.4, to: { alpha: 1 }, duration: 0.6, ease: 'power2.out' },
            { at: 3.4, to: { x: 1180, y: 380 }, duration: 2.4, ease: 'power2.inOut' },
          ] },
        { type: 'shape', shape: 'rect', name: 'streak', width: 4600, height: 300, blendMode: 'screen',
          fillGradient: { angle: 90, stops: [[0, 'rgba(255,209,102,0)'], [0.5, 'rgba(255,209,102,0.38)'], [1, 'rgba(255,209,102,0)']] },
          initial: { x: 1500, y: -40, rotation: -24, alpha: 0 },
          keyframes: [
            { at: 3.6, to: { alpha: 1 }, duration: 0.5, ease: 'power2.out' },
            { at: 3.6, to: { x: 980, y: 240 }, duration: 2.2, ease: 'power2.inOut' },
          ] },
        // a vignette: clear in the middle, darker at the corners
        { type: 'shape', shape: 'rect', name: 'vignette', width: 1920, height: 1080, anchorX: 0, anchorY: 0, blendMode: 'multiply',
          fillGradient: { type: 'radial', radius: 0.75, stops: [[0.45, '#ffffff'], [1, '#4a4f60']] },
          initial: { x: 0, y: 0 } },
  
        // what each beat is, as the data that makes it
        label('code-band', "mask: 'band'", 0.9, 2.2),
        label('code-luma', "mask: { layer: 'fade', channel: 'luma' }", 2.2, 3.6),
        label('code-blend', "blendMode: 'color-dodge'", 3.6),
  
        { type: 'audio', name: 'sfx-band', sfx: 'swoosh', at: 0.75, volume: 0.55 },
        { type: 'audio', name: 'sfx-leak', sfx: { preset: 'chime', pitch: -5, brightness: -0.2 }, at: 3.45, volume: 0.5 },
  
        ...P.tag('05', 'BLEND AND MATTE', 'one matte cuts three layers, light blends in'),
      ],
    };
  },
  "06-shader-warp": function (P) {
    const { C, F } = P;
    // The disc that holds formula A, and the iris that opens formula B out of it (canvas px).
    const CX = 1400, CY = 540, R = 330, R_FULL = 1560;      // R_FULL: the disc covers the frame (corner distance from CX, CY + a margin)
    const SIDE = 720;                                       // formula A is drawn into a 720 x 720 layer around the disc only
  
    // Formula A: a polar checkerboard (rings x rays) whose rays wind into a spiral as `twist` grows. Integer ray count: no seam at atan's cut.
    const SPIRAL = `
      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
        vec2 p = (fragCoord - iResolution.xy * 0.5) / (iResolution.y * 0.46);
        float r = length(p);
        float a = atan(p.y, p.x);
        float rings = sin(r * 18.0 - iTime * pace);
        float rays = sin(a * 12.0 + r * twist - iTime * 0.5);
        float v = rings * rays;
        float w = fwidth(v) * 1.2 + 0.001;
        float tone = smoothstep(-w, w, v);
        vec3 ink = vec3(0.043, 0.051, 0.071);
        vec3 lite = mix(signal, bone, smoothstep(0.30, 0.42, r));
        vec3 col = mix(ink, lite, tone);
        col *= 0.55 + 0.45 * smoothstep(1.05, 0.55, r);
        fragColor = vec4(col, 1.0);
      }`;
  
    // Formula B: a liquid field, the plane folded by a sum of sines (7 constant steps), then banded into veins.
    const LIQUID = `
      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
        vec2 q = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
        vec2 uv = q * 1.3;
        float t = iTime * speed;
        for (int i = 1; i < 8; i++) {
          float fi = float(i);
          uv.x += 0.55 / fi * sin(fi * 1.6 * uv.y + t + 0.4 * fi);
          uv.y += 0.55 / fi * cos(fi * 1.4 * uv.x - t * 0.8 + 0.7 * fi);
        }
        float v = 0.5 + 0.5 * sin(uv.x + uv.y);
        vec3 deep = vec3(0.020, 0.035, 0.075);
        vec3 sea = vec3(0.030, 0.230, 0.330);
        vec3 col = mix(deep, sea, smoothstep(0.15, 0.95, v));
        float bands = abs(fract(v * 6.0) - 0.5);
        float aa = fwidth(v * 6.0) * 1.5 + 0.01;
        float vein = smoothstep(0.43 - aa, 0.43 + aa, bands);
        col = mix(col, signal, vein * 0.9);
        col += vec3(0.95, 0.92, 0.86) * pow(v, 14.0) * 0.35;
        float band = smoothstep(0.85, 0.05, abs(q.y + 0.08));
        col *= 1.0 - calm * 0.8 * band;
        col *= 1.0 - calm * 0.55 * smoothstep(0.66, 0.92, abs(q.y));
        col *= 1.0 - 0.35 * dot(q * 0.5, q * 0.5);
        fragColor = vec4(col, 1.0);
      }`;
  
    const enter = (at, x) => ({ at, from: { alpha: 0, x: x - 36 }, to: { alpha: 1, x }, duration: 0.6, ease: 'power3.out' });
  
    return {
      duration: 7,
      poster: 5.0,
      sequences: [
        P.bg(C.ink),
  
        // ── beat 1 (0 – 3.0): formula A in a disc; the spiral winds up ──
        { type: 'shader', name: 'spiral', fragment: SPIRAL, width: SIDE, height: SIDE, duration: 3.8,
          uniforms: { twist: 1.5, pace: 0.8, signal: C.red, bone: C.bone },
          initial: { x: CX - SIDE / 2, y: CY - SIDE / 2 },
          mask: { type: 'shape', shape: 'circle', radius: R, initial: { x: CX, y: CY, fillColor: '#ffffff' } },
          keyframes: [
            { at: 0.9, to: { 'uniforms.twist': 22, 'uniforms.pace': 3.2 }, duration: 1.6, ease: 'power2.inOut' },
          ] },
  
        { type: 'text', name: 'drawn', text: 'DRAWN', duration: 2.95,
          style: { fontSize: 200, fill: C.bone, fontFamily: F.display, letterSpacing: 2 },
          initial: { x: 96, y: 470, anchorX: 0, anchorY: 0.5 },
          keyframes: [enter(0.7, 96), { at: 2.5, to: { alpha: 0, x: 66 }, duration: 0.4, ease: 'power2.in' }] },

  "07-filters-particles": // 07 FILTERS AND PARTICLES: one word, five looks (a new one every 1.2 s), each named on screen with the data that made it.
  // glow, then crt, then glitch + rgbSplit, then a seeded particle burst, and film grain over the whole frame at the end.
  function (P) {
    const { C, F } = P;
    const WORD = 'SIGNAL';
    const CX = 960, CY = 470;                       // where the word sits
    const BEAT = 1.2, T0 = 1.0;                     // a new treatment every 1.2 s, the first at 1.0 s

      { label: 'CRT',              data: "+ { type: 'crt', curvature: 4 }",              from: at(1), to: at(2) },
      { label: 'GLITCH + RGB SPLIT', data: "+ { type: 'glitch' } + { type: 'rgbSplit' }", from: at(2), to: at(3) },
      { label: 'PARTICLES',        data: '...particles({ count: 220, seed: 7 })',        from: at(3), to: at(4) },

    const labels = looks.flatMap((l, i) => [
      { type: 'text', name: 'label-' + i, text: l.label, at: l.from, duration: l.to - l.from,
        style: { fontSize: 64, fill: i === 0 ? C.dim : C.red, fontFamily: F.mono, letterSpacing: 10, fontWeight: 'bold' },
        initial: { x: 96, y: 800, anchorX: 0, anchorY: 0.5 },

          : [{ at: 0, from: { alpha: 0, x: 76 }, to: { alpha: 1, x: 96 }, duration: 0.22, ease: 'power3.out' }] },
      { type: 'text', name: 'data-' + i, text: l.data, at: l.from, duration: l.to - l.from,
        style: { fontSize: 40, fill: C.bone, fontFamily: F.mono },
        initial: { x: 96, y: 996, anchorX: 0, anchorY: 0.5 },

      word('word-crt', [glowAt(5)], [{ at: 0, from: { scale: 1.02 }, to: { scale: 1.02 }, duration: 0.01 }]),
    ], [
      { type: 'crt', name: 'tube', curvature: 4, lineWidth: 3, lineContrast: 0.35, noise: 0.12, noiseSize: 1, vignetting: 0.3, vignettingAlpha: 0.9, vignettingBlur: 0.3, time: 0 },

    ];
  
    // 4 PARTICLES: the picture snaps clean, the word slams, the glow flares and a seeded burst leaves it.
    const bx = CX, by = CY;
    const burstAt = at(3);

      ...P.particles({ count: 70, at: burstAt, life: [1.2, 1.8], area: { x: bx, y: by - 60, width: 700, height: 100 }, angle: [200, 340], speed: [320, 900],
        gravity: 900, drag: 0.8, size: [12, 22], scale: [1, 0.6], fade: { out: 0.4 }, colors: [C.red, C.gold, C.bone, C.cyan], shape: 'rect', spin: [-420, 420], seed: 8, name: 'confetti' }),
    ];
    const ring = { type: 'shape', shape: 'circle', name: 'ring', radius: 150, at: burstAt, duration: 0.8,
      initial: { x: bx, y: by, fillAlpha: 0, strokeColor: C.gold, strokeWidth: 10, strokeAlpha: 0.9, scale: 0.4 },
      keyframes: [{ at: 0, to: { scale: 4.2, strokeAlpha: 0, strokeWidth: 2 }, duration: 0.8, ease: 'power3.out' }] };

      word('word-burst', [glowAt(5)], [
        { at: 0, from: { scale: 1.16 }, to: { scale: 1.02 }, duration: 0.5, ease: 'power3.out' },
        { at: 0, from: { 'filters.halo.outerStrength': 14 }, to: { 'filters.halo.outerStrength': 5 }, duration: 0.7, ease: 'power2.out' },
      ]),
    ]);
  
    // 5 GRAIN: the word settles; the grain of the whole scene (below) comes up to show.
    const settle = win('w-grain', at(4), END - at(4), [
      word('word-grain', [glowAt(5)], [{ at: 0, from: { scale: 1.02 }, to: { scale: 1.0 }, duration: END - at(4), ease: 'power1.inOut' }]),
    ]);
  
    const sfx = [
      { type: 'audio', name: 'sfx-glow', sfx: 'chime', at: at(0), volume: 0.35 },
      { type: 'audio', name: 'sfx-crt', sfx: 'beep', at: at(1), volume: 0.3 },
      { type: 'audio', name: 'sfx-glitch', sfx: 'glitch', at: at(2), volume: 0.5 },
      { type: 'audio', name: 'sfx-hit', sfx: 'hit', at: at(3), volume: 0.5 },
      { type: 'audio', name: 'sfx-pop', sfx: 'pop', at: at(3) + 0.03, volume: 0.35 },
      { type: 'audio', name: 'sfx-grain', sfx: 'swoosh', at: at(4) - 0.1, volume: 0.25 },

    // Everything sits in one scene so the film grain lies over the whole frame, the labels too.
    const scene = {
      type: 'composition', name: 'scene', width: 1920, height: 1080,
      filters: [{ type: 'grain', name: 'film', amount: 0.03, size: 1.6, seed: 5, fps: 24 }],

  "08-motion": function (P) {
    const { C, F } = P;
  
    // One visual system: a lane per easing, a dot per lane, all leaving the start line together and aiming at the same finish line.
    // The clock lane on top shows the composition's own time, which the chapter then freezes, rewinds and replays in slow motion.
    const X0 = 540, X1 = 1420;            // start and finish line (px)
    const LEN = 1.8;                      // seconds of content in the race (its own clock)
    const GO = 0.1, RUN = 1.4;            // the easings leave at 0.1 s of the race and take 1.4 s (springs: their own settle time)
    const laneY = (i) => 200 + i * 140;
  
    // the clock, in the movie's seconds: calm, play, freeze, rewind, hold, slow motion (0.6x), calm
    const T = { play: 0.8, freeze: 2.6, rewind: 3.0, hold: 3.6, slow: 3.7, end: 6.3 };
    const clockKeys = (prop, map) => [
      { at: T.play, from: { [prop]: map(0) }, to: { [prop]: map(LEN) }, duration: LEN, ease: 'none' },
      { at: T.freeze, to: { [prop]: map(LEN) }, duration: T.rewind - T.freeze },
      { at: T.rewind, to: { [prop]: map(0) }, duration: T.hold - T.rewind, ease: 'power2.inOut' },
      { at: T.hold, to: { [prop]: map(0) }, duration: T.slow - T.hold },
      { at: T.slow, to: { [prop]: map(LEN) }, duration: T.end - T.slow, ease: 'none' },
    ];
  
    const lanes = [
      { name: 'linear', label: 'linear', ease: 'none', dur: RUN, color: C.bone },
      { name: 'power2', label: 'power2.inOut', ease: 'power2.inOut', dur: RUN, color: C.bone },
      { name: 'bezier', label: 'cubic-bezier', ease: 'cubic-bezier(.2, .8, .2, 1)', dur: RUN, color: C.cyan },
      { name: 'bouncy', label: 'spring.bouncy', ease: 'spring.bouncy', dur: 'auto', color: C.red },
      { name: 'wobbly', label: 'spring.wobbly', ease: 'spring.wobbly', dur: 'auto', color: C.red },
    ];
  
    const tracks = [];
    const labels = [];
    const dots = [];
    // the clock lane (lane 0)
    labels.push({ type: 'text', name: 'label-clock', text: 'clock', style: { fontSize: 38, fill: C.dim, fontFamily: F.mono },
      initial: { x: 96, y: laneY(0), anchorX: 0, anchorY: 0.5 } });
    tracks.push({ type: 'shape', shape: 'rect', name: 'track-clock', width: X1 - X0, height: 4, anchorX: 0, anchorY: 0.5,
      initial: { x: X0, y: laneY(0), fillColor: C.dim, fillAlpha: 0.35 } });
    lanes.forEach((l, k) => {
      const y = laneY(k + 1);
      labels.push({ type: 'text', name: 'label-' + l.name, text: l.label, style: { fontSize: 38, fill: l.color === C.bone ? C.bone : l.color, fontFamily: F.mono },
        initial: { x: 96, y, anchorX: 0, anchorY: 0.5 } });
      tracks.push({ type: 'shape', shape: 'rect', name: 'track-' + l.name, width: X1 - X0, height: 4, anchorX: 0, anchorY: 0.5,
        initial: { x: X0, y, fillColor: C.dim, fillAlpha: 0.35 } });
      // the part of the track already travelled: it grows with the same ease as the dot
      dots.push({ type: 'shape', shape: 'rect', name: 'trail-' + l.name, width: X1 - X0, height: 10, anchorX: 0, anchorY: 0.5,
        initial: { x: X0, y, fillColor: l.color, fillAlpha: 0.55, scaleX: 0 },
        keyframes: [{ at: GO, to: { scaleX: 1 }, duration: l.dur, ease: l.ease }] });
      dots.push({ type: 'shape', shape: 'circle', name: 'dot-' + l.name, radius: 34,
        initial: { x: X0, y, fillColor: l.color },
        keyframes: [{ at: GO, to: { x: X1 }, duration: l.dur, ease: l.ease }] });
    });
  
    const line = (name, x) => ({ type: 'shape', shape: 'rect', name, width: 4, height: 800, anchorX: 0.5, anchorY: 0,

    const race = {
      type: 'composition', name: 'race', duration: 7, width: 1920, height: 1080,
      initial: { time: 0 },
      keyframes: clockKeys('time', (t) => t),
      sequences: dots,
    };
  
    // everything that moves together shakes together: the seeded handheld wiggle rides on the stage during the slow motion
    const stage = {
      type: 'composition', name: 'stage', duration: 7, width: 1920, height: 1080,
      initial: { x: 0, y: 0 },
      keyframes: P.wiggle({ at: T.slow, duration: T.end - T.slow, freq: 9, seed: 4,

        ...tracks, ...labels,
        race,

        { type: 'shape', shape: 'rect', name: 'playhead', width: 8, height: 64, anchorX: 0.5, anchorY: 0.5, cornerRadius: 3,
          initial: { x: X0, y: laneY(0), fillColor: C.bone },
          keyframes: clockKeys('x', (t) => X0 + (t / LEN) * (X1 - X0)) },
      ],
    };
  
    // what the clock is doing, in one or two words (top right)
    const status = (name, text, at, until, color) => ({
      type: 'text', name, text, at, duration: until - at, style: { fontSize: 64, fill: color, fontFamily: F.display },
      initial: { x: 1824, y: 84, anchorX: 1, anchorY: 0.5, alpha: 0 },

        stage,
        status('st-ease', 'EASING', 0.8, T.freeze, C.bone),
        status('st-freeze', 'FREEZE', T.freeze, T.rewind, C.cyan),
        status('st-rewind', 'REWIND', T.rewind, T.slow, C.cyan),
        status('st-slow', 'SLOW-MO + SHAKE', T.slow, T.end, C.red),
        { type: 'audio', sfx: 'swoosh', at: T.play - 0.1, volume: 0.6 },
        { type: 'audio', sfx: 'click', at: T.freeze, volume: 0.6 },
        { type: 'audio', sfx: { preset: 'swoosh', pitch: -7 }, at: T.rewind - 0.1, volume: 0.6 },
        { type: 'audio', sfx: 'pop', at: T.slow, volume: 0.6 },
      ],
    };
  },
  "09-sound": // 09 / SOUND: the music under this reel is text. The chapter reads the reel's own score (P.music, made by music.js) and draws the bars that
  // play under it, as a piano roll that scrolls past a playhead: every bar carries its token ('e5:1.5', 'Am7:4'), the drum lanes are the
  // pattern strings themselves ('x...x...'), and each note lights up as it sounds. The chord readout changes on the bar lines with a hit.
  function (P) {
    const { C, F } = P;
    const D = 8;
    // Where this chapter sits in the music. The music layer starts at 1.4 s (music.js: two bars before the 01-type cut) and this chapter at
    // 59.6 s in the reel (plan.chapters, 09-sound): the chapter cannot see the plan, so the two numbers are written here.
    const REEL_AT = 59.6, MUSIC_AT = 1.4;
    const M = P.music ?? { bpm: 120, tracks: [], drums: [] };
    const SPB = 60 / M.bpm;                                       // seconds per beat (0.5)
    const B0 = (REEL_AT - MUSIC_AT) / SPB;                        // the music's beat at this chapter's 0 s (116.4: bar 30 begins at -0.2 s)
    const tOf = b => (b - B0) * SPB;                              // chapter seconds of a beat
    const calm = t => t >= 0.6 && t <= D - 0.6;                   // the transitions own the edges
  
    // The roll: time runs right to left past the playhead at PH, PXB pixels a beat.
    const PH = 640, PXB = 150, X0 = 300, X1 = 1824;
    const X = b => PH + (b - B0) * PXB;                           // x at 0 s (the roll moves left 2 * PXB px a second)
    const LOOK = [B0 - 3, B0 + D / SPB + (X1 - PH) / PXB + 1];    // beats that are ever on screen
  
    // Read the score: the same strings the synthesiser plays.
    const parse = notes => {
      const ev = []; let b = 0;
      for (const raw of notes.split(/\s+/)) {
        if (!raw || raw === '|') continue;
        const tok = raw.replace(/[!,]/g, '');
        const [name, len] = tok.split(':');
        const l = len === undefined ? 1 : Number(len);
        if (name !== '_' && name !== '~') ev.push({ tok, name, beat: b, len: l });
        b += l;
      }
      return ev;
    };
    const midi = n => {
      const m = /^([a-g])(#|b)?(\d)$/i.exec(n);
      if (!m) return null;
      return 12 * (Number(m[3]) + 1) + { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    };
    const track = inst => (M.tracks.find(t => t.inst === inst) ?? { notes: '' });
    const inView = e => e.beat + e.len > LOOK[0] && e.beat < LOOK[1];
    const pad = parse(track('pad').notes).filter(inView);
    const lead = parse(track('lead').notes).filter(inView);
    const bass = parse(track('bass').notes).filter(inView);
  
    const mono = (size, fill, extra = {}) => ({ fontFamily: F.mono, fontSize: size, fill, ...extra });
    const TOKEN = mono(34, C.bone);
    const tokenW = s => P.measureText(s, TOKEN).width;
    const LANE = { pad: 338, lead: 488, bass: 650, kick: 758, clap: 856 };
  
    // a roll text whose right edge has scrolled out of the window is hidden (the window's matte already hides it; this keeps inspect's overlap list honest)
    const gone = right => (right - X0) / (2 * PXB);               // seconds until the right edge passes the window's left edge
    const hideAt = right => (gone(right) > 0 ? [{ at: gone(right), set: { alpha: 0 } }] : []);
    const until = right => k => k.at < D && (k.set?.alpha === 0 || gone(right) <= 0 || k.at < gone(right));
    const roll = [];
    // bar lines (every 4 beats) and lane hairlines
    for (let k = Math.ceil(LOOK[0] / 4); k * 4 < LOOK[1]; k++) {
      roll.push({ type: 'shape', shape: 'rect', name: `barline-${k}`, width: 2, height: 600, anchorX: 0.5, anchorY: 0,
        initial: { x: X(4 * k), y: 296, fillColor: C.bone, alpha: 0.12 } });
    }
  
    // a note: a bar as long as the note, its token written on it, lit while it sounds
    const note = (e, i, lane, { y, h, color, onAlpha, offAlpha, label }) => {

      roll.push({ type: 'shape', shape: 'rect', name: `${lane}-bar-${i}`, width: w, height: h, cornerRadius: 8, anchorX: 0, anchorY: 0.5,
        initial: { x: X(e.beat) + 4, y, fillColor: color, strokeColor: color, strokeWidth: 2,
          ...(t1 <= 0 ? { fillAlpha: offAlpha * 0.6, strokeAlpha: 0.3 } : t0 <= 0 ? { fillAlpha: onAlpha, strokeAlpha: 1 } : { fillAlpha: offAlpha, strokeAlpha: 0.55 }) },
        keyframes: [
          { at: t0, set: { fillAlpha: onAlpha, strokeAlpha: 1 } },
          { at: t1, to: { fillAlpha: offAlpha * 0.6, strokeAlpha: 0.3 }, duration: 0.35, ease: 'power2.out' },
        ].filter(k => k.at > 0 && k.at < D) });
      const right = X(e.beat) + 16 + tokenW(e.tok);
      if (label && tokenW(e.tok) + 24 <= w) {
        roll.push({ type: 'text', name: `${lane}-tok-${i}`, text: e.tok, style: label,
          initial: { x: X(e.beat) + 16, y, anchorX: 0, anchorY: 0.5, alpha: gone(right) <= 0 ? 0 : t1 <= 0 ? 0.45 : t0 <= 0 ? 1 : 0.7 },
          keyframes: [{ at: t0, set: { alpha: 1 } }, { at: t1, to: { alpha: 0.45 }, duration: 0.35 }, ...hideAt(right)]
            .filter(k => k.at > 0).filter(until(right)) });
      }
    };
    pad.forEach((e, i) => note(e, i, 'pad', { y: LANE.pad, h: 56, color: C.bone, onAlpha: 0.2, offAlpha: 0.05, label: mono(36, C.bone) }));
    const leadY = e => LANE.lead + (76.5 - midi(e.name)) * 13;
    lead.forEach((e, i) => note(e, i, 'lead', { y: leadY(e), h: 42, color: C.red, onAlpha: 0.95, offAlpha: 0.14, label: TOKEN }));
    const bassY = e => LANE.bass - (midi(e.name) - 38) * 2;
    bass.forEach((e, i) => note(e, i, 'bass', { y: bassY(e), h: 40, color: C.dim, onAlpha: 0.55, offAlpha: 0.1, label: TOKEN }));
  
    // the drum lanes: the pattern strings themselves, one character per 16th, each hit a cell that flashes gold
    const STEP = PXB / 4;
    const adv = tokenW('x'.repeat(16)) / 16;
    const DRUM = mono(34, C.bone, { letterSpacing: STEP - adv });
    const drumBars = name => {
      const out = [];
      for (let k = Math.floor(LOOK[0] / 4); k * 4 < LOOK[1]; k++) {
        const entry = (M.drums ?? []).find(d => d[name] && d.from <= 4 * k && 4 * k < (d.to ?? Infinity) && (d.to ?? Infinity) - d.from >= 4);
        if (entry) out.push({ k, pattern: entry[name].replace(/[\s|]/g, '').slice(0, 16) });
      }
      return out;
    };
    for (const name of ['kick', 'clap']) {
      for (const { k, pattern } of drumBars(name)) {
        [...pattern].forEach((c, s) => {
          if (c === '.') return;
          const b = 4 * k + s / 4, t = tOf(b);
          roll.push({ type: 'shape', shape: 'rect', name: `${name}-cell-${k}-${s}`, width: STEP - 6, height: 52, cornerRadius: 6,
            initial: { x: X(b) + adv / 2, y: LANE[name], fillColor: C.gold, alpha: 0.16 },
            keyframes: t < 0 || t >= D - 0.05 ? [] : [{ at: t, set: { alpha: 0.95 } }, { at: t + 0.02, to: { alpha: 0.22 }, duration: 0.4, ease: 'power2.out' }] });
        });

    const changes = pad.filter(e => calm(tOf(e.beat)));          // chords that begin inside the chapter (the bar lines with a hit)
    // the playhead: a red line, and a glow that follows the beat (a bpm envelope on the same tempo as the score)
    const env = P.bpmEnvelope(M.bpm, { duration: D + 1, frameRate: 30 });
    const phase = (B0 - 4 * Math.floor(B0 / 4)) * SPB;           // where in its bar this chapter starts: the envelope's bar starts on ours
    const playhead = [
      { type: 'shape', shape: 'rect', name: 'ph-glow', width: 90, height: 620, anchorX: 0.5, anchorY: 0,
        initial: { x: PH, y: 292, fillGradient: { angle: 0, stops: [[0, 'rgba(255,90,54,0)'], [0.5, 'rgba(255,90,54,0.55)'], [1, 'rgba(255,90,54,0)']] } },
        keyframes: P.react(env, { duration: D, audioOffset: phase, props: { alpha: { base: 0.15, amount: 0.85, band: 'bass', beats: true, decay: 0.22 } } }) },
      { type: 'shape', shape: 'rect', name: 'ph-line', width: 4, height: 620, anchorX: 0.5, anchorY: 0, initial: { x: PH, y: 292, fillColor: C.red },
        keyframes: changes.flatMap(e => [                        // a flash on every bar line where the chord changes (the sfx hit lands here)
          { at: tOf(e.beat), set: { width: 14, fillColor: C.bone } },
          { at: tOf(e.beat) + 0.03, to: { width: 4, fillColor: C.red }, duration: 0.4, ease: 'power2.out' },
        ]) },
    ];
    // a ring where each melody note starts, on the playhead
    const rings = lead.filter(e => calm(tOf(e.beat))).map((e, i) => ({
      type: 'shape', shape: 'circle', name: `ring-${i}`, at: tOf(e.beat), duration: 0.5,
      initial: { x: PH, y: leadY(e), radius: 12, fillAlpha: 0, strokeColor: C.red, strokeWidth: 4, alpha: 1 },
      keyframes: [{ at: 0, to: { radius: 54, alpha: 0, strokeWidth: 1 }, duration: 0.5, ease: 'power2.out' }],
    }));
  
    // the headline, a text cursor that blinks on the beat, and the chord readout that changes on the bar lines (with a hit)
    const HEAD = { fontFamily: F.display, fontSize: 108, fill: C.bone };
    const headW = P.measureText('SOUND IS TEXT', HEAD);
    const HEAD_Y = 120;
    const headline = P.animateText('SOUND IS TEXT', HEAD, { x: 96, y: HEAD_Y, name: 'head', by: 'words', at: 0.6, duration: D - 0.6,
      in: { preset: 'rise', duration: 0.6, ease: 'power3.out' }, stagger: { each: 0.09 },
      styleFor: p => (p.text === 'TEXT' ? { fill: C.red } : {}) });
    const cursor = { type: 'shape', shape: 'rect', name: 'cursor', at: 1.0, width: 16, height: 88, anchorX: 0, anchorY: 0.5,
      initial: { x: 96 + headW.width + 22, y: HEAD_Y + headW.height / 2, fillColor: C.red },
      keyframes: P.react(env, { duration: D - 1.0, audioOffset: phase + 1.0, props: { alpha: { base: 0.2, amount: 0.8, beats: true, decay: 0.3 } } }) };
    const first = pad.filter(e => tOf(e.beat) <= 0.6).pop() ?? pad[0];
    const chord = { type: 'text', name: 'chord', text: first ? first.name : '', style: mono(96, C.bone, { fontWeight: 'bold' }), at: 0.9,
      initial: { x: 1824, y: HEAD_Y + headW.height / 2, anchorX: 1, anchorY: 0.5 },
      keyframes: [
        { at: 0, from: { alpha: 0, y: HEAD_Y + headW.height / 2 + 30 }, duration: 0.5, ease: 'power3.out' },
        ...changes.flatMap(e => [
          { at: tOf(e.beat) - 0.9, set: { text: e.name, fill: C.red } },
          { at: tOf(e.beat) - 0.9, from: { scale: 1.18 }, to: { scale: 1 }, duration: 0.4, ease: 'power3.out' },
          { at: tOf(e.beat) - 0.9 + 0.25, to: { fill: C.bone }, duration: 0.4 },
        ]),
      ] };
    const hits = changes.map((e, i) => ({ type: 'audio', name: `hit-${i}`, sfx: { preset: 'hit', brightness: 0.3 }, at: tOf(e.beat), volume: 0.4 }));
  
    // where we are in the score, beat by beat
    const pos = b => `${M.bpm} BPM · BAR ${Math.floor(b / 4) + 1} · ${(((b % 4) + 4) % 4) + 1}`;
    const beats = [];
    for (let b = Math.ceil(B0); tOf(b) < D; b++) beats.push(b);
    const readout = { type: 'text', name: 'readout', text: pos(Math.floor(B0)), style: mono(34, C.dim), at: 0.5,
      initial: { x: 1824, y: 84, anchorX: 1, anchorY: 0.5 },
      keyframes: [{ at: 0, from: { alpha: 0 }, duration: 0.5 }, ...beats.map(b => ({ at: tOf(b) - 0.5, set: { text: pos(b) } })).filter(k => k.at > 0)] };
  
    return {
      duration: D,
      poster: 4.4,
      sequences: [
        P.bg(C.ink),
        ...P.tag('09', 'SOUND', 'the music under this reel is text, drawn as it plays'),
        ...Object.entries(LANE).filter(([n]) => n !== 'lead').map(([n, y]) => ({ type: 'shape', shape: 'rect', name: `hair-${n}`, width: X1 - X0, height: 2,
          anchorX: 0, anchorY: 0.5, initial: { x: X0, y: y + 40, fillColor: C.bone, alpha: 0.06 } })),
        { type: 'shape', shape: 'rect', name: 'roll-window', width: X1 - X0, height: 640, anchorX: 0, anchorY: 0,
          initial: { x: X0, y: 284, fillGradient: { angle: 0, stops: [[0, 'rgba(255,255,255,0)'], [0.06, 'rgba(255,255,255,1)'], [0.94, 'rgba(255,255,255,1)'], [1, 'rgba(255,255,255,0)']] } } },
        { type: 'composition', name: 'roll', width: 6000, height: 1080, mask: { layer: 'roll-window', channel: 'alpha' },
          initial: { x: 0, y: 0 }, keyframes: [{ at: 0, to: { x: -(D / SPB) * PXB }, duration: D, ease: 'none' }], sequences: roll },
        ...names,
        ...playhead,
        ...rings,
        ...headline,
        cursor,
        chord,
        readout,
        ...hits,
      ],
    };
  },
  "10-data-talks": function (P) {
    const { C, F } = P;
  
    // ONE table of numbers drives every layer of this chapter: change it and the bars, the line, the dots, the counters,
    // the percentage and the second page all follow. (Sample data: invented.)
    const DATA = [['Q1', 1.4], ['Q2', 1.9], ['Q3', 2.6], ['Q4', 3.4], ['Q5', 4.6]];
    const N = DATA.length, VALS = DATA.map(d => d[1]);
    const MAX = Math.max(...VALS), LAST = VALS[N - 1], FIRST = VALS[0];
    const STEP = [1, 2, 2.5, 5, 10].find(s => MAX / s <= 3) ?? 10;        // axis ticks: 0, 2, 4, 6 for this table
    const TOP = Math.ceil(MAX / STEP) * STEP;
    const GROWTH = Math.round((LAST / FIRST - 1) * 100);                   // +229 (%)

    const T = 0.6;                                                         // the slide between the two pages

    const mono = (size, fill, extra = {}) => ({ fontSize: size, fill, fontFamily: F.mono, ...extra });

    const X0 = 190, BW = 130, PITCH = 186, BASE = 860, CH = 500;
    const cx = i => X0 + 30 + BW / 2 + i * PITCH;
    const hOf = v => CH * v / TOP;
    const yOf = v => BASE - hOf(v);
    const BAR_AT = 0.7, BAR_DUR = 0.7, EACH = 0.14;
    const delay = P.stagger(N, { each: EACH });
    const LINE_AT = 1.5, LINE_DUR = 1.2;
  
    const page1 = [P.bg(C.ink, 'bg1')];
    page1.push(...P.tag('10', 'DATA AND TALKS', 'sample data: one array of numbers draws every bar, line and counter'));
    page1.push({ type: 'text', name: 'page-no-1', text: '1 / 2', style: mono(34, C.dim, { letterSpacing: 4 }), initial: { x: 1824, y: 84, anchorX: 1, anchorY: 0.5 } });
    page1.push({ type: 'text', name: 'chart-title', text: 'Revenue per quarter, $M', style: { fontSize: 64, fill: C.bone, fontFamily: F.display },
      initial: { x: 96, y: 190, anchorX: 0, anchorY: 0.5 } });
  
    // axis: grid lines and tick labels from the table's range
    for (let v = 0; v <= TOP; v += STEP) {
      const y = yOf(v);
      page1.push({ type: 'shape', shape: 'line', name: 'grid-' + v, from: [X0 - 6, y], to: [X0 + 30 + N * PITCH - 56 + 30, y],
        initial: { strokeColor: v === 0 ? C.dim : '#232a3b', strokeWidth: v === 0 ? 3 : 2 } });

    }
  
    // bars (a wave of delays from stagger()), their counting labels and the quarter names
    DATA.forEach(([q, v], i) => {

      page1.push({ type: 'shape', shape: 'rect', name: 'bar-' + q, width: BW, height: 0, cornerRadius: 6, anchorY: 1, at,
        initial: { x: cx(i), y: BASE, fillColor: last ? C.red : '#34405c' },
        keyframes: [{ at: 0, to: { height: h }, duration: BAR_DUR, ease: 'power3.out' }] });
      page1.push({ type: 'text', name: 'val-' + q, text: '{value}', format: { decimals: 1 }, at,
        style: mono(38, last ? C.red : C.bone, { fontWeight: 'bold' }),
        initial: { x: cx(i), y: BASE - 30, anchorX: 0.5, anchorY: 1, value: 0, alpha: 0 },
        keyframes: [{ at: 0, to: { value: v, y: BASE - h - 36, alpha: 1 }, duration: BAR_DUR, ease: 'power3.out' }] });
      page1.push({ type: 'text', name: 'qlabel-' + q, text: q, style: mono(40, last ? C.bone : C.dim), initial: { x: cx(i), y: BASE + 22, anchorX: 0.5, anchorY: 0 } });
    });
  
    // the line across the bar tops draws on (trimEnd 0 -> 1); a dot lands where it reaches each point

    page1.push({ type: 'text', name: 'kpi', text: '${value}M', format: { decimals: 1 }, style: { fontSize: 156, fill: C.red, fontFamily: F.display },

    page2.push(...P.tag('10', 'DATA AND TALKS', 'sample data: one array of numbers draws every bar, line and counter', { at: 0.1, color: SOFT, captionColor: INK }));
    page2.push({ type: 'text', name: 'page-no-2', text: '2 / 2', style: mono(34, SOFT, { letterSpacing: 4 }), initial: { x: 1824, y: 84, anchorX: 1, anchorY: 0.5 } });
    page2.push({ type: 'text', name: 'growth-label', text: `REVENUE GROWTH, ${DATA[0][0]} TO ${DATA[N - 1][0]}`, style: mono(40, SOFT, { letterSpacing: 3 }),

    page2.push({ type: 'text', name: 'growth', text: '+{value}%', format: { decimals: 0 }, style: { fontSize: 290, fill: C.red, fontFamily: F.display },
      initial: { x: 96, y: 440, anchorX: 0, anchorY: 0.5, value: 0, alpha: 0 },

    page2.push({ type: 'text', name: 'range', text: `$${fmt(FIRST)}M  to  $${fmt(LAST)}M`, style: { fontSize: 72, fill: INK, fontFamily: F.display },
      initial: { x: 96, y: 650, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 1.5, to: { alpha: 1 }, duration: 0.6 }] });
    page2.push({ type: 'text', name: 'range-sub', text: `in ${N} quarters`, style: { fontSize: 48, fill: SOFT, fontFamily: F.sans },
      initial: { x: 96, y: 740, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 1.7, to: { alpha: 1 }, duration: 0.6 }] });
    // the same table again as a small chart

    DATA.forEach(([q, v], i) => {
      const x = MX + MB / 2 + i * MP, last = i === N - 1;
      page2.push({ type: 'shape', shape: 'rect', name: 'mini-' + q, width: MB, height: 0, cornerRadius: 4, anchorY: 1, at: 1.0 + mdelay[i],

      poster: 2.9,

        { type: 'composition', name: 'deck', at: 0, duration: 7, width: 1920, height: 1080,

  },
  "11-source": // Chapter 11 — SOURCE: the reveal that the whole reel is data. (1) real lines of the reel's own JSON scroll past, (2) three measured numbers,
  // (3) the install line as the last frame. P.facts is empty in the one-chapter check page: a sample stands in until the build fills it.

      '{', '  "type": "camera",', '  "name": "cam",', '  "initial": { "z": 0, "fov": 40, "focus": "title" },', '  "keyframes": [',
      '    { "at": 0.5, "to": { "focus": "card-2" }, "duration": 1.2, "ease": "power2.inOut" },', '    { "at": 2, "to": { "offsetZ": -300 }, "duration": 3 }',
      '  ]', '},', '{', '  "type": "text",', '  "name": "title-3",', '  "text": "SPACE",', '  "style": { "fontSize": 240, "fill": "#f2ede4", "fontFamily": "Arial Black" },',
      '  "initial": { "x": 960, "y": 540, "anchorX": 0.5, "anchorY": 0.5, "alpha": 0 },', '  "keyframes": [',
      '    { "at": 0.6, "from": { "y": 600 }, "to": { "y": 540, "alpha": 1 }, "duration": 0.8, "ease": "power3.out" }', '  ],', '  "threeD": true', '},',
      '{', '  "type": "light",', '  "kind": "spot",', '  "castsShadows": true,', '  "initial": { "x": 400, "y": 200, "z": 600, "intensity": 1.2, "coneAngle": 40 }', '},',
      '{', '  "type": "audio",', '  "sfx": "swoosh",', '  "at": 2.4,', '  "volume": 0.4', '},', '{', '  "type": "shape",', '  "shape": "arc",', '  "radius": 200,',
      '  "startAngle": -90,', '  "endAngle": -90,', '  "strokeCap": "round",', '  "initial": { "x": 960, "y": 540, "strokeColor": "#ff5a36", "strokeWidth": 24 },',
      '  "keyframes": [{ "at": 1, "to": { "endAngle": 270 }, "duration": 2, "ease": "power2.inOut" }]', '},',
      '{', '  "type": "shader",', '  "name": "field",', '  "fragment": "void mainImage(out vec4 fragColor, in vec2 fragCoord) { vec2 uv = fragCoord / iResolution.xy; …",',
      '  "uniforms": { "speed": 1, "tint": "#38c8ff" }', '},',
    ];
    const lines = real ? facts.lines : [...SAMPLE, ...SAMPLE];
    const lineCount = real ? facts.lineCount : 6000;
    const kb = real ? facts.kb : 300;
    const layers = real ? facts.layers : 1200;
    const num = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  
    // ---- beat 1: the wall of data -----------------------------------------------------------------------------------------------------
    const LH = 46, FS = 36, COLS = 78, X0 = 96, TOP = 140, VIEW = 800, SHOW = 96;
    const monoStyle = { fontSize: FS, fill: C.bone, fontFamily: F.mono };
    // start the slice at the first camera (a telling line) if there is one; a long line is cut to the width of the wall
    let start = 0;
    if (real) { const i = lines.findIndex(l => /"type": "camera"/.test(l)); start = Math.max(0, (i < 0 ? 0 : i) - 24); }
    const slice = lines.slice(start, start + SHOW).map(l => (l.length > COLS ? l.slice(0, COLS - 1) + '…' : l));
    const charW = P.measureText('M', monoStyle).width;
    const wallLayers = [];
    slice.forEach((text, i) => {
      const y = TOP + i * LH;
      wallLayers.push({ type: 'text', name: `src-${i}`, text, style: monoStyle, initial: { x: X0, y, anchorX: 0, anchorY: 0 } });
      const m = text.match(/^(\s*"type": )("[a-z]+")/);              // the kind of every layer, in the signal colour
      if (m) wallLayers.push({ type: 'text', name: `key-${i}`, text: m[2], style: { ...monoStyle, fill: C.red }, initial: { x: X0 + m[1].length * charW, y, anchorX: 0, anchorY: 0 } });
    });
    const contentH = slice.length * LH;
    const SCROLL = Math.min(2800, contentH - VIEW - 600);                 // the fast scroll, then a slow drift of 600 px: both stay inside the content
    const wall = {
      type: 'composition', name: 'wall', width: 1920, height: TOP + contentH + 200, at: 0, duration: 5.6, sequences: wallLayers,
      initial: { x: 0, y: 0 },
      mask: { type: 'shape', shape: 'rect', width: 1728, height: VIEW, anchorX: 0, anchorY: 0, initial: { x: X0, y: TOP, fillColor: '#ffffff' } },
      keyframes: [
        { at: 0.6, to: { y: -SCROLL }, duration: 2.7, ease: 'power2.in' },
        { at: 3.3, to: { y: -SCROLL - 600 }, duration: 2.3, ease: 'none' },
        { at: 3.3, to: { alpha: 0.25 }, duration: 0.25 },
        { at: 5.3, to: { alpha: 0 }, duration: 0.3 },
      ],
    };
    const fade = (name, y, stops) => ({ type: 'shape', shape: 'rect', name, width: 1728, height: 150, anchorX: 0, anchorY: 0, at: 0, duration: 5.6,
      fillGradient: { type: 'linear', angle: 90, stops }, initial: { x: X0, y } });
    const readHead = { type: 'shape', shape: 'rect', name: 'read-head', width: 1728, height: LH + 8, anchorX: 0, anchorY: 0.5, at: 0, duration: 3.5,
      initial: { x: X0, y: 540, fillColor: C.ink2, alpha: 0 }, keyframes: [{ at: 0.6, to: { alpha: 1 }, duration: 0.4 }, { at: 3.25, to: { alpha: 0 }, duration: 0.2 }] };
    const linesLabel = { type: 'text', name: 'lines-label', text: `${num(lineCount)} lines`, style: { fontSize: 34, fill: C.dim, fontFamily: F.mono, letterSpacing: 2 },
      at: 0, duration: 3.5, initial: { x: 1824, y: 84, anchorX: 1, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0.7, to: { alpha: 1 }, duration: 0.5 }, { at: 3.25, to: { alpha: 0 }, duration: 0.2 }] };
    // a veil over the wall under the numbers (one layer, so the wall dims as one picture)
    const veil = { type: 'shape', shape: 'rect', name: 'veil', width: 1920, height: 1080, anchorX: 0, anchorY: 0, at: 3.3, duration: D - 3.3,
      initial: { x: 0, y: 0, fillColor: C.ink, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 0.85 }, duration: 0.25 }, { at: 2, to: { alpha: 1 }, duration: 0.3 }] };
  
    // ---- beat 2: three numbers --------------------------------------------------------------------------------------------------------
    const numStyle = { fontSize: 170, fill: C.bone, fontFamily: F.display };
    const unitStyle = { fontSize: 56, fill: C.dim, fontFamily: F.mono, letterSpacing: 2 };
    const rows = [
      { n: '1', unit: 'file', color: C.red },
      { n: num(kb), unit: 'KB' },
      { n: num(layers), unit: 'layers' },
    ];
    const NUM_AT = 3.4, NUM_END = 5.55;
    const numbers = [];
    rows.forEach((r, i) => {
      const y = 300 + i * 245, at = NUM_AT + i * 0.15;
      const w = P.measureText(r.n, numStyle).width;
      const life = NUM_END - at;
      const enter = (yy, dy) => [{ at: 0, from: { y: yy + dy, alpha: 0 }, to: { y: yy, alpha: 1 }, duration: 0.6, ease: 'power3.out' }, { at: -0.25, to: { alpha: 0 }, duration: 0.25 }];
      numbers.push({ type: 'text', name: `num-${i}`, text: r.n, style: { ...numStyle, fill: r.color ?? C.bone }, at, duration: life,
        initial: { x: X0, y, anchorX: 0, anchorY: 0.5 }, keyframes: enter(y, 70) });
      numbers.push({ type: 'text', name: `unit-${i}`, text: r.unit, style: unitStyle, at: at + 0.08, duration: life - 0.08,
        initial: { x: X0 + w + 40, y: y + 30, anchorX: 0, anchorY: 0.5 }, keyframes: enter(y + 30, 50) });
    });
  
    // ---- beat 3: the lock-up (the last frame of the reel) -------------------------------------------------------------------------------
    const LOCK_AT = 5.6;
    const cmdStyle = { fontSize: 92, fill: C.bone, fontFamily: F.mono, fontWeight: 'bold' };
    const cmdW = P.measureText('npm i pixi-effects', cmdStyle).width;
    const rise = (y, dy, at, dur = 0.7) => [{ at, from: { y: y + dy, alpha: 0 }, to: { y, alpha: 1 }, duration: dur, ease: 'power3.out' }];
    const lockup = [
      { type: 'text', name: 'cmd', text: 'npm i pixi-effects', style: cmdStyle, at: LOCK_AT, duration: D - LOCK_AT,
        initial: { x: 960, y: 450, anchorX: 0.5, anchorY: 0.5 }, keyframes: rise(450, 60, 0) },
      { type: 'shape', shape: 'rect', name: 'cursor', width: Math.round(charW * 92 / FS * 0.9), height: 96, anchorX: 0, anchorY: 0.5, at: LOCK_AT, duration: D - LOCK_AT,
        initial: { x: 960 + cmdW / 2 + 22, y: 450, fillColor: C.red, alpha: 0 }, keyframes: [{ at: 0.5, to: { alpha: 1 }, duration: 0.2 }] },
      { type: 'text', name: 'url', text: 'github.com/yjmtmtk/pixi-effects', style: { fontSize: 48, fill: C.dim, fontFamily: F.mono, letterSpacing: 1 }, at: LOCK_AT + 0.15, duration: D - LOCK_AT - 0.15,
        initial: { x: 960, y: 590, anchorX: 0.5, anchorY: 0.5 }, keyframes: rise(590, 40, 0) },
      { type: 'text', name: 'status', text: 'experimental · pre-1.0 · MIT', style: { fontSize: 44, fill: C.bone, fontFamily: F.mono, letterSpacing: 4 }, at: LOCK_AT + 0.3, duration: D - LOCK_AT - 0.3,
        initial: { x: 960, y: 690, anchorX: 0.5, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 0.9 }, duration: 0.6 }] },
    ];
  
    // ---- label and sound ----------------------------------------------------------------------------------------------------------------
    const tag = P.tag('11', 'SOURCE', 'the data of this reel, as it is written');
    const caption = tag.find(l => l.name === 'caption');
    if (caption) caption.keyframes.push({ at: 3.3, set: { text: 'the whole reel, measured: one HTML page' } }, { at: LOCK_AT, set: { text: 'read it, run it, change it' } });
    const sfx = [
      { type: 'audio', name: 'sfx-cut', sfx: { preset: 'swipe', pitch: -4 }, at: 3.3, volume: 0.4 },
      ...rows.map((_, i) => ({ type: 'audio', name: `sfx-row-${i}`, sfx: { preset: 'click', pitch: i * 2 }, at: NUM_AT + i * 0.15 + 0.12, volume: 0.5 })),
      { type: 'audio', name: 'sfx-lock', sfx: { preset: 'hit', pitch: -6, brightness: -0.4 }, at: LOCK_AT + 0.05, volume: 0.45 },
    ];
  
    return {
      duration: D,
      poster: 4.6,
      sequences: [
        P.bg(C.ink),
        readHead,                                                         // under the lines: a highlight bar the data passes through
        wall,
        fade('fade-top', TOP, [[0, C.ink], [1, 'rgba(11,13,18,0)']]),
        fade('fade-bottom', TOP + VIEW - 150, [[0, 'rgba(11,13,18,0)'], [1, C.ink]]),
        veil,
        ...tag,
        linesLabel,
        ...numbers,
        ...lockup,
        ...sfx,
      ],
    };
  },
    };
    const MUSIC = // The reel's music: ONE bed under the whole reel, written as text (the library's `music` layer). 120 BPM, so a bar is 2 s and a beat 0.5 s.
// The bar lines are placed so that each new section begins on a chapter cut (a section starts on the bar nearest the middle of that
// chapter's transition). 40 bars: a pad alone, a soft bass pulse, the kick, an arpeggio, a hook that builds, the peak under the sound
// chapter (09-sound draws bars 29-32 of this very score) and the data chapter, then a held C major 9 that the reel ends on.
function (P, plan) {
  const BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT;
  const ch = id => plan.chapters.find(c => c.id === id);
  const AT = ch('01-type').at - 2 * BAR;                                   // 1.4 s: two bars of pad, then the pulse lands on the first cut
  const barOf = id => Math.round((ch(id).at + plan.overlap / 2 - AT) / BAR);
  const BARS = Math.floor((plan.total - AT) / BAR + 1e-6);                 // 40: the last bar ends with the reel
  const S = {                                                              // where each section starts (bar numbers)
    pulse: barOf('01-type'), groove: barOf('02-shapes'), motion: barOf('04-light'), build: barOf('07-filters-particles'),
    peak: barOf('09-sound'), lift: barOf('10-data-talks'), outro: barOf('11-source'), end: BARS - 2,
  };
  const order = ['intro', 'pulse', 'groove', 'motion', 'build', 'peak', 'lift', 'outro', 'end'];
  const startOf = name => (name === 'intro' ? 0 : S[name]);
  const section = b => order.filter(n => startOf(n) <= b).pop();

  // Harmony: a four-bar loop in A minor / C major that restarts with every section; a bar before the peak leans on G, the outro walks home.
  const LOOP = ['Am7', 'Fmaj7', 'Cadd9', 'G6'];
  const chords = b => {                                                    // [[name, beats], ...] for bar b
    if (b >= S.end) return b === S.end ? [['Cmaj9', 8]] : [];              // the held ending (one token over the last two bars)
    if (b === S.end - 1) return [['Gsus4', 2], ['G', 2]];
    if (b === S.end - 2) return [['Fmaj7', 4]];
    if (b === S.peak - 1) return [['G6', 4]];
    return [[LOOP[(b - startOf(section(b))) % 4], 4]];
  };
  const ROOT = { Am7: 'a', Fmaj7: 'f', Cadd9: 'c', G6: 'g', Gsus4: 'g', G: 'g', Cmaj9: 'c' };
  const low = c => ({ a: 'a1', f: 'f1', c: 'c2', g: 'g1' })[ROOT[c]];
  const high = c => ({ a: 'a2', f: 'f2', c: 'c3', g: 'g2' })[ROOT[c]];
  const ARP = { Am7: ['a4', 'c5', 'e5', 'g5'], Fmaj7: ['f4', 'a4', 'c5', 'e5'], Cadd9: ['c5', 'd5', 'e5', 'g5'], G6: ['g4', 'b4', 'd5', 'e5'],
    Gsus4: ['g4', 'c5', 'd5', 'g5'], G: ['g4', 'b4', 'd5', 'g5'], Cmaj9: ['c5', 'e5', 'g5', 'b5'] };
  const ARP_ORDER = [0, 1, 2, 3, 1, 2, 3, 2];

  // The hook: dotted (3 + 3 + 2) like the bass under it. Every note is at least a beat long, so the sound chapter can print each one on its bar.
  const HOOK = {
    build: ['e5:1.5 d5:1.5 c5:1', 'a4:1.5 c5:1.5 e5:1', 'd5:1.5 e5:1.5 g5:1', 'e5:3 d5:1', 'c5:3 a4:1', 'b4:1.5 d5:1.5 e5:1'],
    peak: ['e5:1.5 g5:1.5 e5:1', 'a5:1.5 g5:1.5 e5:1', 'd5:1.5 e5:1.5 g5:1', 'e5:3 d5:1'],
    lift: ['e5:1.5 g5:1.5 e5:1', 'a5:1.5 c6:1.5 a5:1', 'g5:1.5 e5:1.5 d5:1'],
    outro: ['c5:3 a4:1', 'd5:2 b4:2'],
    end: ['c5:8'],
  };
  const up = s => s.replace(/([a-g]#?)(\d)/g, (m, n, o) => n + (Number(o) + 1));   // the same line an octave higher (for the bell)

  // One function per track: the tokens of bar b. Every bar adds up to 4 beats (checked below); the last token spans the last two bars.
  const T = {
    pad: b => chords(b).map(([c, l]) => `${c}:${l}`),
    keys: b => {
      const s = section(b);
      if (['intro', 'pulse'].includes(s)) return ['_:4'];
      if (s === 'end') return b === S.end ? ['Cmaj9@4:4', '_:4'] : [];
      return chords(b).flatMap(([c, l]) => (l === 4 ? [`${c}@4:1.5`, `${c}@4:1`, '_:1.5'] : [`${c}@4:1.5`, '_:0.5']));
    },
    bass: b => {
      const s = section(b);
      if (s === 'intro') return ['_:4'];
      if (s === 'end') return b === S.end ? ['c2:6', '_:2'] : [];
      return chords(b).flatMap(([c, l]) => {
        if (s === 'pulse') return Array(l).fill(`${low(c)}:1`);                              // the soft pulse: quarter notes
        if (s === 'motion' || s === 'build') return Array(l * 2).fill(0).map((_, i) => `${i === 6 ? high(c) : low(c)}:0.5`);
        if (l === 2) return [`${low(c)}:1.5`, `${low(c)}:0.5`];
        return s === 'peak' || s === 'lift' ? [`${low(c)}:1.5`, `${low(c)}:1.5`, `${high(c)}:1`] : [`${low(c)}:1.5`, `${low(c)}:1.5`, `${low(c)}:1`];
      });
    },
    pluck: b => {
      const s = section(b);
      if (['intro', 'pulse', 'groove'].includes(s)) return ['_:4'];
      if (s === 'end') return b === S.end ? ['_:8'] : [];
      return chords(b).flatMap(([c, l]) => Array(l * 2).fill(0).map((_, i) => `${ARP[c][ARP_ORDER[i % 8]]}:0.5`));
    },
    lead: b => {
      const s = section(b);
      if (!HOOK[s]) return ['_:4'];
      if (s === 'end') return b === S.end ? [HOOK.end[0]] : [];
      return (HOOK[s][b - S[s]] ?? '_:4').split(' ');
    },
    bell: b => {
      const s = section(b);
      if (s === 'end') return b === S.end ? ['[g5 c6 e6]:8'] : [];
      if (s !== 'peak' && s !== 'lift') return ['_:4'];
      return up(HOOK[s][b - S[s]] ?? '_:4').split(' ');
    },
  };
  const beatsOf = tokens => tokens.reduce((n, t) => n + Number(t.split(':')[1] ?? 1), 0);
  const line = name => {
    const bars = [];
    for (let b = 0; b < BARS; b++) {
      const tokens = T[name](b);
      const want = b === S.end ? 8 : b > S.end ? 0 : 4;
      if (beatsOf(tokens) !== want) console.warn(`music: track ${name}, bar ${b} has ${beatsOf(tokens)} beats, not ${want}`);
      if (tokens.length) bars.push(tokens.join(' '));
    }
    return bars.join(' | ');
  };

  // Drums: 16 steps a bar. Each section is one entry from its first beat to the next section's.
  const beat = bar => bar * 4;
  const drums = [
    { from: beat(S.groove), to: beat(S.motion), kick: 'o.......o.......', shaker: '..o...o...o...o.' },
    { from: beat(S.motion), to: beat(S.build), kick: 'x.......x.o.....', hat: '..o...o...o...o.', rim: '....o.......o...' },
    { from: beat(S.build), to: beat(S.peak - 1), kick: 'x...x...x...x...', clap: '....o.......o...', hat: '..o...o...o...o.' },
    { from: beat(S.peak - 1), to: beat(S.peak), kick: 'x...x...x...x...', snare: '....o...o.o.xxxx' },               // the fill into the peak
    { from: beat(S.peak), to: beat(S.outro), kick: 'x...x...x...x...', clap: '....x.......x...', hat: 'o.o.o.o.o.o.o.o.', openhat: '..x...x...x...x.' },
    { from: beat(S.peak), to: beat(S.peak) + 1, crash: 'o...' },
    { from: beat(S.lift), to: beat(S.lift) + 1, crash: 'o...' },
    { from: beat(S.outro), to: beat(S.end), kick: 'x.......x.......', hat: '..o...o...o...o.' },
    { from: beat(S.end), to: beat(S.end) + 1, kick: 'x...', crash: 'o...' },
  ];

  const music = {
    bpm: BPM, reverb: 0.3, humanize: 0.006, drumVol: 0.6, seed: 9,
    tracks: [
      { inst: 'pad', vol: [[0, 0.45], [beat(S.groove), 0.36], [beat(S.build), 0.4], [beat(S.peak), 0.46], [beat(S.outro), 0.52]], attack: 0.9, release: 2.2, tone: 0.45, reverb: 0.5, notes: line('pad') },
      { inst: 'keys', vol: [[beat(S.groove), 0.26], [beat(S.build), 0.34], [beat(S.peak), 0.48], [beat(S.outro), 0.4]], pan: -0.2, strum: 0.012, tone: 0.55, reverb: 0.3, notes: line('keys') },
      { inst: 'bass', vol: [[beat(S.pulse), 0.38], [beat(S.groove), 0.6], [beat(S.peak), 0.72], [beat(S.outro), 0.6]], tone: 0.45, reverb: 0.05, notes: line('bass') },
      { inst: 'pluck', vol: [[beat(S.motion), 0], [beat(S.motion) + 8, 0.26], [beat(S.build), 0.32], [beat(S.peak), 0.5], [beat(S.outro), 0.32]], pan: 0.25, tone: 0.6, reverb: 0.4, notes: line('pluck') },
      { inst: 'lead', vol: [[beat(S.build), 0.24], [beat(S.peak) - 4, 0.44], [beat(S.peak), 0.66], [beat(S.outro), 0.5]], tone: 0.5, reverb: 0.35, notes: line('lead') },
      { inst: 'bell', vol: 0.28, pan: 0.2, ring: 0.7, reverb: 0.6, notes: line('bell') },
    ],
    drums,
  };
  return [
    { type: 'audio', name: 'music', at: AT, duration: plan.total - AT, volume: 1.22, music,
      keyframes: [{ at: -1.6, to: { volume: 0 }, duration: 1.6, ease: 'sine.in' }] },        // the held chord fades with the last picture
  ];
};

    const W = 1920, H = 1080, FPS = 30;
    const countLayers = (seqs) => (seqs || []).reduce((n, s) => n + 1 + countLayers(s.sequences), 0);

    // Lay the chapters end to end: each starts OVERLAP seconds before the one before it ends, and the transition between them runs in that overlap.
    function assemble(facts) {
      const P = SHARED(lib, facts);
      const plan = P.planOf(TABLE);
      const audio = MUSIC(P, plan) ?? [];
      P.music = (audio.find(l => l.music) || {}).music;           // the chapter about sound draws this very music as notation
      const sequences = [], transitions = [], assets = [];
      TABLE.chapters.forEach((row, i) => {
        const c = CH[row.id](P);
        if (c.duration !== row.duration) console.warn(`reel: chapter ${row.id} lasts ${c.duration} s but chapters.json promises ${row.duration} s`);
        const at = plan.chapters[i].at;
        sequences.push({ type: 'composition', name: row.id, at, duration: c.duration, width: W, height: H, sequences: c.sequences });
        for (const a of c.assets ?? []) assets.push(a);
        if (i > 0 && TABLE.transitions[row.id]) transitions.push({ ...TABLE.transitions[row.id], from: TABLE.chapters[i - 1].id, to: row.id, at, duration: TABLE.overlap });
      });
      return { sequences: [...sequences, ...audio], transitions, assets, total: plan.total, plan: plan.chapters };
    }

    try {
      // pass 1 counts the reel's own data; pass 2 builds the chapters again knowing the numbers (the last chapter shows them)
      const first = assemble({ kb: 0, layers: 0, lineCount: 0, lines: [] });
      const lines = JSON.stringify(first.sequences, null, 2).split('\n');
      const facts = { kb: 104, layers: countLayers(first.sequences), lineCount: lines.length, lines };
      const reel = assemble(facts);
      const movie = new lib.Movie();
      window.movie = movie;
      new Controller(movie, { canvas: document.getElementById('stage') });
      await movie.init({
        canvas: document.getElementById('stage'), width: W, height: H, frameRate: FPS, duration: reel.total, background: '#000000',
        assets: reel.assets, poster: TABLE.poster ?? reel.total * 0.5, composition: { sequences: reel.sequences, transitions: reel.transitions },
      });
      window.reelPlan = reel.plan;
      window.__ready = true;
    } catch (err) {
      console.error('reel failed: ' + (err && err.message || err));
      window.__ready = true;
    }
  </script>
</body>
</html>
