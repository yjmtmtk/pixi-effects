<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixi-effects video</title>
  <style>
    body { background: #0d1220; margin: 0; padding: 16px; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie, kenBurns, withFade } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';

    const W = 1280, H = 720, FPS = 30, DURATION = 8;
    const CTA_AT = 6.0;
    const FONT = 'Arial Black, Arial, sans-serif';
    const SANS = 'Helvetica Neue, Arial, sans-serif';

    // seeded random so every run / export is identical
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // ---------- camera: orbit + dolly zoom, sampled from one function (orbit() can't also dolly) ----------
    const CX = 640, CY = 360;
    const camAt = (t) => {
      const u = t / DURATION;
      const e = 0.5 - 0.5 * Math.cos(Math.PI * u);                       // sine.inOut
      const theta = (-24 + 48 * e) * Math.PI / 180;                        // sweep -24deg -> +24deg
      const v = Math.min(1, Math.max(0, (t - 3.4) / 2.2));                 // dolly zoom window 3.4s -> 5.6s
      const fov = 38 + 26 * Math.sin(Math.PI * v) ** 2;                    // 38 -> 72 -> 38
      const R = (H / 2) / Math.tan(fov * Math.PI / 360);                   // keeps the z = 0 plane fixed
      return { x: +(CX + R * Math.sin(theta)).toFixed(2), z: +(R * Math.cos(theta)).toFixed(2), fov: +fov.toFixed(3) };
    };
    const STEP = 1 / 15;
    const camKeys = [];
    for (let t = 0; t < DURATION - 1e-6; t += STEP) camKeys.push({ at: +t.toFixed(4), to: camAt(t + STEP), duration: STEP, ease: 'none' });
    const camera = {
      type: 'camera', name: 'cam',
      initial: { ...camAt(0), y: CY, lookAtX: CX, lookAtY: CY, lookAtZ: 0 },
      keyframes: camKeys,
    };

    // ---------- background (2D, ignores the camera) ----------
    const bg = [
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2' },
        fillGradient: { stops: [[0, '#070a1c'], [0.55, '#14103a'], [1, '#2a1048']] } },
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH*0.55' },
        fillGradient: { type: 'radial', radius: 0.6, stops: [[0, 'rgba(120,90,255,0.35)'], [1, 'rgba(120,90,255,0)']] } },
    ];

    // ---------- parallax particles: threeD circles at many depths ----------
    const particles = Array.from({ length: 70 }, () => {
      const z = -700 + rnd() * 920;                                         // -700 .. +220 (camera is never nearer than ~470)
      const x = -250 + rnd() * 1780, y = 20 + rnd() * 680;
      const near = (z + 700) / 920;
      return {
        type: 'shape', shape: 'circle', threeD: true, radius: 2 + near * 4 + rnd() * 2, duration: DURATION,
        initial: { x, y, z, fillColor: rnd() > 0.5 ? '#9fb4ff' : '#d9a7ff', fillAlpha: 0.25 + rnd() * 0.45 },
        keyframes: [{ at: 0, to: { y: y - 50 - near * 60 }, duration: DURATION, ease: 'none' }],
      };
    });

    // ---------- feature cards: five depths, each a stack of threeD layers at the same z ----------
    const FEATURES = [
      ['01', 'Noise\nCancelling', '-45 dB adaptive ANC', '#5b8cff', -300, 405, 85],
      ['02', '40-hour\nBattery',   '5 min = 3 h playback', '#34d3a0', 40, 480, 400],
      ['03', 'Spatial\nAudio',    'Head-tracked 3D sound', '#c08bff', -190, 440, 640],
      ['04', 'Hi-Res\nDrivers',   '40 mm beryllium', '#ffb454', 55, 485, 880],
      ['05', 'Multipoint\nPairing', 'Two devices at once', '#ff6f91', -280, 405, 1160],
    ];
    const CARD_W = 230, CARD_H = 290;
    const cardLayers = (f, i) => {
      const [num, title, sub, color, z, CARD_Y, x] = f;
      const at = 1.5 + i * 0.28;                       // entrance time (composition time)
      const dur = DURATION - at;
      const bob = (dy) => ({ at: 0, to: { y: CARD_Y + dy - 9 }, duration: 1.7, ease: 'sine.inOut', repeat: 4, yoyo: true });
      const enter = { at: 0, from: { z: z - 260, alpha: 0 }, duration: 1.0, ease: 'power3.out' };
      const part = (spec, dy) => ({
        threeD: true, at, duration: dur, ...spec,
        initial: { x, y: CARD_Y + dy, z, ...spec.initial },
        keyframes: [enter, bob(dy), { at: CTA_AT - at, to: { alpha: 0.2 }, duration: 0.6 }],
      });
      return [
        part({ type: 'shape', shape: 'rect', width: CARD_W, height: CARD_H, cornerRadius: 24,
          fillGradient: { stops: [[0, '#232a5c'], [1, '#101431']] }, strokeColor: color, strokeWidth: 2, strokeAlpha: 0.7,
          initial: {} }, 0),
        part({ type: 'shape', shape: 'circle', radius: 28, initial: { fillColor: color, fillAlpha: 0.9 } }, -CARD_H / 2 + 62),
        part({ type: 'text', text: num, style: { fontSize: 26, fontWeight: '900', fill: '#0a0a1a', fontFamily: FONT },
          initial: { anchorX: 0.5, anchorY: 0.5 } }, -CARD_H / 2 + 62),
        part({ type: 'text', text: title, style: { fontSize: 27, fontWeight: 'bold', fill: '#ffffff', fontFamily: SANS, align: 'center', lineHeight: 32 },
          initial: { anchorX: 0.5, anchorY: 0.5 } }, 20),
        part({ type: 'text', text: sub, style: { fontSize: 15, fill: '#b9c2ee', fontFamily: SANS, align: 'center' },
          initial: { anchorX: 0.5, anchorY: 0.5 } }, 92),
      ];
    };
    const cards = FEATURES.flatMap(cardLayers);

    // ---------- headline: letters fly in from depth (z = 0 at rest, so the dolly zoom leaves it alone) ----------
    const HEAD = 'AURA', HSIZE = 170, HADV = HSIZE * 0.80;
    const headline = [...HEAD].map((ch, i) => ({
      type: 'text', text: ch, threeD: true,
      style: { fontSize: HSIZE, fontWeight: '900', fill: '#8fa8ff', fontFamily: FONT,
               dropShadow: { color: '#6a5cff', blur: 22, distance: 0, alpha: 0.9 }, padding: 50 },
      initial: { x: 640 + (i - (HEAD.length - 1) / 2) * HADV, y: 160, anchorX: 0.5, anchorY: 0.5,
                 z: 640, rotationY: 70, rotationX: -40, alpha: 0 },
      keyframes: [
        { at: 0.15 + i * 0.12, to: { z: 0, rotationY: 0, rotationX: 0 }, duration: 1.1, ease: 'expo.out' },
        { at: 0.15 + i * 0.12, to: { alpha: 1 }, duration: 0.35 },
        { at: 0.35 + i * 0.12, to: { fill: '#ffffff' }, duration: 0.9, ease: 'sine.out' },
        { at: CTA_AT - 0.2, to: { alpha: 0 }, duration: 0.5 },
      ],
    }));
    const tagline = {
      type: 'text', text: 'FEEL EVERY DIMENSION OF SOUND', at: 1.1, duration: DURATION - 1.1, threeD: true,
      style: { fontSize: 22, fontWeight: 'bold', fill: '#b9c2ee', fontFamily: SANS, letterSpacing: 8 },
      initial: { x: 640, y: 262, z: 0, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.8 }, { at: CTA_AT - 1.1, to: { alpha: 0 }, duration: 0.5 }],
    };

    // ---------- soft vignette + CTA (plain 2D, last = on top, ignore the camera) ----------
        const overlay = [
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', at: CTA_AT - 0.3, duration: DURATION - CTA_AT + 0.3,
        initial: { x: 'GW/2', y: 'GH/2', fillColor: '#05061a', fillAlpha: 0 },
        keyframes: [{ at: 0, to: { fillAlpha: 0.7 }, duration: 0.8, ease: 'power2.out' }] },
      { type: 'text', text: 'AURA  WIRELESS', at: CTA_AT, duration: DURATION - CTA_AT,
        style: { fontSize: 22, fontWeight: 'bold', fill: '#8fa8ff', fontFamily: SANS, letterSpacing: 10 },
        initial: { x: 'GW/2', y: 210, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0.1, to: { alpha: 1 }, duration: 0.6 }] },
      { type: 'text', text: 'Hear in 3D.', at: CTA_AT, duration: DURATION - CTA_AT,
        style: { fontSize: 78, fontWeight: '900', fill: '#ffffff', fontFamily: FONT },
        initial: { x: 'GW/2', y: 280, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { y: 310 }, to: { alpha: 1, y: 280 }, duration: 0.7, ease: 'power3.out' }] },
      { type: 'shape', shape: 'rect', width: 360, height: 72, cornerRadius: 36, at: CTA_AT + 0.25, duration: DURATION - CTA_AT - 0.25,
        initial: { x: 'GW/2', y: 400, scale: 0.6, alpha: 0 },
        fillGradient: { angle: 0, stops: [[0, '#5b8cff'], [1, '#b06bff']] },
        keyframes: [{ at: 0, to: { scale: 1, alpha: 1 }, duration: 0.6, ease: 'back.out(1.7)' }] },
      { type: 'text', text: 'PRE-ORDER  $299', at: CTA_AT + 0.25, duration: DURATION - CTA_AT - 0.25,
        style: { fontSize: 26, fontWeight: 'bold', fill: '#ffffff', fontFamily: SANS, letterSpacing: 3 },
        initial: { x: 'GW/2', y: 400, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0.2, to: { alpha: 1 }, duration: 0.4 }] },
      { type: 'text', text: 'aura-audio.example', at: CTA_AT + 0.6, duration: DURATION - CTA_AT - 0.6,
        style: { fontSize: 20, fill: '#9aa5d6', fontFamily: SANS, letterSpacing: 2 },
        initial: { x: 'GW/2', y: 480, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6 }] },
    ];
    const vignette = { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2' },
      fillGradient: { type: 'radial', radius: 0.75, stops: [[0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.6)']] } };

    const sequences = [...bg, camera, ...particles, ...cards, ...headline, tagline, ...overlay, vignette];

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        background: '#0a0a0f',
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
