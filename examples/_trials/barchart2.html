<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixi-effects video</title>
  <style>
    body { background: #0d1220; margin: 0; padding: 16px; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie, kenBurns, withFade } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';

    const W = 1280, H = 720, FPS = 30, DURATION = 8;

    // ---- DATA (change this array; the whole composition regenerates) ----
    const TITLE = 'Weekly Active Users by Region (k)';
    const DATA = [['North', 42], ['South', 68], ['East', 55], ['West', 87], ['Central', 73], ['Islands', 39], ['Overseas', 61]];

    // ---- layout derived from constants/data ----
    const PLOT_L = 150, PLOT_R = 1180, BASE = 620, PLOT_H = 400;
    const STEP = 25;                                                  // grid step
    const MAX = Math.max(...DATA.map(d => d[1]));
    const NICE = Math.ceil(MAX / STEP) * STEP;                        // axis top
    const SLOT = (PLOT_R - PLOT_L) / DATA.length, BAR_W = Math.min(110, SLOT * 0.62);
    const T_BAR = 1.0, STAGGER = 0.22, GROW = 1.3, EASE = 'power3.out';
    const T_HL = T_BAR + (DATA.length - 1) * STAGGER + GROW + 0.4;    // highlight after the last bar settles
    const T_CALL = T_HL + 0.8;
    const win = DATA.filter(d => d[1] === MAX)[0];
    const winX = PLOT_L + DATA.indexOf(win) * SLOT + SLOT / 2;

    const sequences = [
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2' },
        fillGradient: { stops: [[0, '#10162b'], [1, '#0a0d1a']] } },
      // title
      { type: 'text', text: TITLE, at: 0.1, style: { fontSize: 40, fontWeight: 'bold', fill: '#f4f6ff' },
        initial: { x: PLOT_L, y: 48, anchorX: 0, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1, y: 56 }, duration: 0.7, ease: 'power2.out' }] },
    ];

    // grid lines + y tick labels
    for (let v = 0; v <= NICE; v += STEP) {
      const y = BASE - PLOT_H * v / NICE;
      sequences.push({ type: 'shape', shape: 'line', from: [PLOT_L, y], to: [PLOT_R, y], at: 0.3,
        initial: { x: (PLOT_L + PLOT_R) / 2, y, strokeColor: v === 0 ? '#8791b5' : '#2a3354', strokeWidth: v === 0 ? 3 : 1, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });
      sequences.push({ type: 'text', text: String(v), at: 0.3, style: { fontSize: 20, fill: '#8791b5' },
        initial: { x: PLOT_L - 14, y, anchorX: 1, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });
    }
    // y axis line
    sequences.push({ type: 'shape', shape: 'line', from: [PLOT_L, BASE], to: [PLOT_L, BASE - PLOT_H], at: 0.3,
      initial: { x: PLOT_L, y: BASE - PLOT_H / 2, strokeColor: '#8791b5', strokeWidth: 3, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });

    // bars, counters, category labels
    DATA.forEach(([label, value], i) => {
      const x = PLOT_L + i * SLOT + SLOT / 2;
      const at = T_BAR + i * STAGGER;
      const h = PLOT_H * value / NICE;
      const isMax = value === MAX;
      sequences.push({
        type: 'shape', shape: 'rect', width: BAR_W, height: 0, cornerRadius: 8, anchorY: 1, at, colorSpace: 'oklab',
        initial: { x, y: BASE, fillColor: '#4f6df5' },
        keyframes: [
          { at: 0, to: { height: h }, duration: GROW, ease: EASE },
          ...(isMax
            ? [{ at: T_HL - at, to: { fillColor: '#ffd166' }, duration: 0.5 },
               { at: T_HL - at, to: { scaleX: 1.12 }, duration: 0.35, ease: 'sine.inOut', repeat: 1, yoyo: true }]
            : [{ at: T_HL - at, to: { alpha: 0.45 }, duration: 0.5 }]),
        ],
      });
      sequences.push({
        type: 'text', text: '{value}', at,
        style: { fontSize: 30, fontWeight: 'bold', fill: '#ffffff' },
        initial: { x, y: BASE - 14, anchorX: 0.5, anchorY: 1, value: 0 },
        keyframes: [
          { at: 0, to: { value, y: BASE - h - 14 }, duration: GROW, ease: EASE },
          ...(isMax ? [{ at: T_HL - at, to: { fill: '#ffd166' }, duration: 0.5 }]
                    : [{ at: T_HL - at, to: { alpha: 0.6 }, duration: 0.5 }]),
        ],
      });
      sequences.push({
        type: 'text', text: label, at, style: { fontSize: 24, fill: '#aab4d4' },
        initial: { x, y: BASE + 16, anchorX: 0.5, anchorY: 0, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.4 }],
      });
    });

    // final callout above the winning bar (x clamped inside the plot)
    const CALL_TEXT = `Peak: ${win[0]}  ${win[1]}k`;
    const CW = Math.ceil(CALL_TEXT.length * 28 * 0.58 + 56), CH = 56, CY = 150;
    const cx = Math.min(PLOT_R - CW / 2, Math.max(PLOT_L + CW / 2, winX));
    sequences.push({
      type: 'shape', shape: 'rect', width: CW, height: CH, cornerRadius: 28, at: T_CALL, name: 'callout',
      initial: { x: cx, y: CY, fillColor: '#ffd166' },
      keyframes: [{ at: 0, from: { alpha: 0, scale: 0.6 }, to: { alpha: 1, scale: 1 }, duration: 0.5, ease: 'back.out(1.7)' }],
    });
    sequences.push({
      type: 'shape', shape: 'polygon', points: [[-12, 0], [12, 0], [0, 14]], at: T_CALL,
      initial: { x: winX, y: CY + CH / 2 - 2, fillColor: '#ffd166' },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.5 }],
    });
    sequences.push({
      type: 'text', text: CALL_TEXT, at: T_CALL + 0.1,
      style: { fontSize: 28, fontWeight: 'bold', fill: '#1a1f3a' },
      initial: { x: cx, y: CY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.4 }],
    });

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        background: '#0a0a0f',
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
