<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pixi-effects — pixi-filters showcase</title>
  <style>
    body { background: #0a0a0f; margin: 0; font-family: sans-serif; color: #ccc; padding: 16px; }
    h1 { font-weight: 500; margin: 0 0 4px 0; }
    p { font-size: 13px; color: #888; margin: 0 0 16px 0; }
    p code { background: #1a1a22; padding: 1px 6px; border-radius: 3px; color: #b5d3ff; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
  </style>
</head>
<body>
  <h1>pixi-filters showcase</h1>
  <p>Animates filters from the <code>pixi-filters</code> package via the <code>{ type: 'custom', filter: ... }</code> adapter.</p>
  <canvas id="stage" width="1280" height="720"></canvas>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.10.0?bundle-deps",
      "pixi-filters":    "https://esm.sh/pixi-filters@6.1.4?external=pixi.js",
      "gsap":            "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":      "https://esm.sh/mediabunny"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../dist/index.js';
    import { Controller } from '../dist/Controller.js';
    import { GlowFilter, DropShadowFilter, OldFilmFilter, RGBSplitFilter } from 'pixi-filters';

    const movie = new Movie();
    window.__movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    await movie.init({
      canvas: document.getElementById('stage'),
      width: 1280, height: 720, duration: 8, frameRate: 30,
      background: '#0a0a0f',
      composition: {
        sequences: [

          // ── Hero text: glow + drop shadow that pulse together ────────────
          {
            type: 'text',
            text: 'pixi-filters',
            initial: { x: 'GW/2', y: 'GH * 0.32', anchorX: 0.5, anchorY: 0.5, alpha: 0, scale: 0.6 },
            keyframes: [
              { at: 0,    to: { alpha: 1, scale: 1 }, duration: 0.6, ease: 'back.out(1.7)' },
              // Pulse glow + shadow strength a few times
              { at: 1.5,  to: { 'filters.glow.outerStrength': 6, 'filters.shadow.alpha': 0.9 }, duration: 0.5, ease: 'sine.inOut' },
              { at: 2.0,  to: { 'filters.glow.outerStrength': 1, 'filters.shadow.alpha': 0.4 }, duration: 0.6, ease: 'sine.inOut' },
              { at: 3.5,  to: { 'filters.glow.outerStrength': 8, 'filters.shadow.alpha': 1.0 }, duration: 0.4, ease: 'sine.inOut' },
              { at: 3.9,  to: { 'filters.glow.outerStrength': 2, 'filters.shadow.alpha': 0.6 }, duration: 0.6, ease: 'sine.inOut' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 'glow',   filter: new GlowFilter({ distance: 24, outerStrength: 1, color: 0x55aaff }) },
              { type: 'custom', name: 'shadow', filter: new DropShadowFilter({ blur: 8, alpha: 0.7, offset: { x: 8, y: 8 }, color: 0xff44aa }) },
            ],
            style: { fontSize: 'GW * 0.085', fill: '#ffffff', fontWeight: 'bold' },
          },

          // ── Subtitle: slowly drifting RGB split (glitchy chroma offset) ──
          {
            type: 'text',
            text: 'community filters via { type: "custom" }',
            initial: { x: 'GW/2', y: 'GH * 0.46', anchorX: 0.5, anchorY: 0.5, alpha: 0 },
            keyframes: [
              { at: 0.5, to: { alpha: 1 }, duration: 0.7 },
              // Chroma split breathes from neutral → wide → neutral
              { at: 2.5, to: { 'filters.rgb.red':  -10, 'filters.rgb.blue':  10 }, duration: 1.5, ease: 'sine.inOut' },
              { at: 4.0, to: { 'filters.rgb.red':    0, 'filters.rgb.blue':   0 }, duration: 1.0, ease: 'sine.inOut' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 'rgb', filter: new RGBSplitFilter([0, 0], [0, 0], [0, 0]) },
            ],
            style: { fontSize: 'GW * 0.026', fill: '#88ccff', fontStyle: 'italic' },
          },

          // ── Three labels demonstrating individual filters ─────────────────
          {
            type: 'text', text: 'Glow',
            initial: { x: 'GW * 0.2', y: 'GH * 0.66', anchorX: 0.5, anchorY: 0.5, alpha: 0, scale: 0 },
            keyframes: [
              { at: 1.4,  to: { alpha: 1, scale: 1 }, duration: 0.45, ease: 'back.out(2.2)' },
              { at: 3.0,  to: { 'filters.g.outerStrength': 6 }, duration: 0.6, ease: 'sine.inOut' },
              { at: 3.6,  to: { 'filters.g.outerStrength': 2 }, duration: 0.6, ease: 'sine.inOut' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 'g', filter: new GlowFilter({ distance: 12, outerStrength: 2, color: 0xffaa55 }) },
            ],
            style: { fontSize: 'GW * 0.03', fill: '#ffaa55', fontWeight: 'bold' },
          },
          {
            type: 'text', text: 'Drop Shadow',
            initial: { x: 'GW * 0.5', y: 'GH * 0.66', anchorX: 0.5, anchorY: 0.5, alpha: 0, scale: 0 },
            keyframes: [
              { at: 1.6,  to: { alpha: 1, scale: 1 }, duration: 0.45, ease: 'back.out(2.2)' },
              { at: 3.5,  to: { 'filters.s.alpha': 1.0 }, duration: 0.4, ease: 'sine.inOut' },
              { at: 4.0,  to: { 'filters.s.alpha': 0.5 }, duration: 0.4, ease: 'sine.inOut' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 's', filter: new DropShadowFilter({ blur: 6, alpha: 0.7, offset: { x: 6, y: 6 }, color: 0x33ddff }) },
            ],
            style: { fontSize: 'GW * 0.03', fill: '#55ddaa', fontWeight: 'bold' },
          },
          {
            type: 'text', text: 'RGB Split',
            initial: { x: 'GW * 0.8', y: 'GH * 0.66', anchorX: 0.5, anchorY: 0.5, alpha: 0, scale: 0 },
            keyframes: [
              { at: 1.8,  to: { alpha: 1, scale: 1 }, duration: 0.45, ease: 'back.out(2.2)' },
              { at: 3.0,  to: { 'filters.rs.red': -8, 'filters.rs.blue': 8 }, duration: 1.0, ease: 'sine.inOut' },
              { at: 4.5,  to: { 'filters.rs.red':  0, 'filters.rs.blue': 0 }, duration: 1.0, ease: 'sine.inOut' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 'rs', filter: new RGBSplitFilter([0, 0], [0, 0], [0, 0]) },
            ],
            style: { fontSize: 'GW * 0.03', fill: '#ff77cc', fontWeight: 'bold' },
          },

          // ── OldFilmFilter applied to a vignette banner that crosses near the end ──
          {
            type: 'text', text: '~ vintage ~',
            initial: { x: 'GW/2', y: 'GH * 0.82', anchorX: 0.5, anchorY: 0.5, alpha: 0 },
            keyframes: [
              { at: 4.5, to: { alpha: 1 }, duration: 0.5 },
              { at: 5.0, to: { 'filters.film.noise': 0.5, 'filters.film.scratch': 0.6 }, duration: 0.6, ease: 'sine.in' },
              { at: 6.5, to: { 'filters.film.noise': 0.1, 'filters.film.scratch': 0.1 }, duration: 0.8, ease: 'sine.out' },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            filters: [
              { type: 'custom', name: 'film',
                filter: new OldFilmFilter({ noise: 0.1, noiseSize: 1, scratch: 0.1, scratchDensity: 0.3, scratchWidth: 1, vignetting: 0.4, vignettingAlpha: 0.6, vignettingBlur: 0.3 }) },
            ],
            style: { fontSize: 'GW * 0.026', fill: '#ddccaa', fontStyle: 'italic' },
          },

          // ── Footer hint ──────────────────────────────────────────────────
          {
            type: 'text',
            text: 'GlowFilter, DropShadowFilter, RGBSplitFilter, OldFilmFilter — all from `pixi-filters`',
            initial: { x: 'GW/2', y: 'GH * 0.92', anchorX: 0.5, anchorY: 0.5, alpha: 0 },
            keyframes: [
              { at: 1.0, to: { alpha: 1 }, duration: 0.6 },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            style: { fontSize: 'GW * 0.014', fill: '#666688', fontFamily: 'Menlo, monospace' },
          },

        ],
      },
    });
  </script>
</body>
</html>
