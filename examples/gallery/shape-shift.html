<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shape-shift — pixi-effects gallery</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #0d1220; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 8px; --pe-loader-bg: #0d1220; background: #0d1220; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">{
    "title": "Form Follows",
    "subtitle": "A Bauhaus-style poster in motion: a red square becomes a yellow circle becomes a blue triangle, a small black dot circles it, and the line of type changes to FUNCTION, FEELING and FUTURE with each shape",
    "tags": ["morph", "follow-path", "animate-text", "typography", "poster", "bauhaus", "sfx"],
    "width": 1280, "height": 720, "duration": 12, "model": "sonnet"
  }</script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js"
    }
  }
  </script>

  <script type="module">
    import { Movie, followPath, animateText } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 12;
    // the Bauhaus set: paper, ink, and the three primaries
    const PAPER = '#f0e8d6', INK = '#15120f', RED = '#d8402c', YELLOW = '#f2b632', BLUE = '#2a4f9e';
    const GROTESK = "'Helvetica Neue', Helvetica, Arial, 'Arial Black', sans-serif";
    const CX = 982, CY = 352;                                           // the centre of the shapes
    const S = 132;                                                      // half the side of the square, the radius of the circle

    // three outlines drawn around (CX, CY): a square, a circle (four cubic arcs) and a triangle
    const K = 0.5523 * S;
    const SQUARE = `M ${CX - S} ${CY - S} L ${CX + S} ${CY - S} L ${CX + S} ${CY + S} L ${CX - S} ${CY + S} Z`;
    const CIRCLE = `M ${CX} ${CY - S} C ${CX + K} ${CY - S} ${CX + S} ${CY - K} ${CX + S} ${CY} C ${CX + S} ${CY + K} ${CX + K} ${CY + S} ${CX} ${CY + S} C ${CX - K} ${CY + S} ${CX - S} ${CY + K} ${CX - S} ${CY} C ${CX - S} ${CY - K} ${CX - K} ${CY - S} ${CX} ${CY - S} Z`;
    const TRIANGLE = `M ${CX} ${CY - S} L ${CX + S * 1.1} ${CY + S * 0.85} L ${CX - S * 1.1} ${CY + S * 0.85} Z`;

    // one layer morphs from its `d` to its `morphTo`, so the three shapes are three layers that hand over (same outline, same colour)
    // each act holds its shape while its word is on screen and morphs just as the word is replaced (the 6th number: seconds into the act the morph starts)
    const ACTS = [[1.0, 5.9, SQUARE, CIRCLE, RED, YELLOW, 3.6], [5.9, 9.7, CIRCLE, TRIANGLE, YELLOW, BLUE, 2.5], [9.7, DURATION, TRIANGLE, null, BLUE, BLUE, 0]];
    const shapes = ACTS.map(([from, to, d, morphTo, a, b, start], i) => ({
      type: 'shape', shape: 'path', name: 'form-' + i, d, ...(morphTo ? { morphTo } : {}), at: from, duration: to - from,
      initial: { fillColor: a, ...(i === 0 ? { scale: 0 } : {}) },
      keyframes: [
        ...(i === 0 ? [{ at: 0, to: { scale: 1 }, duration: 0.6, ease: 'power4.out' }] : []),
        ...(morphTo ? [{ at: start, to: { morph: 1 }, duration: 1.3, ease: 'power3.inOut' }, { at: start, to: { fillColor: b }, duration: 1.3, ease: 'power3.inOut' }] : []),
      ],
    }));

    // a thin ring and the small black dot that rides it once round (the same circle path the dot follows is the ring)
    const R = 206;
    const RING = `M ${CX} ${CY - R} C ${CX + 0.5523 * R} ${CY - R} ${CX + R} ${CY - 0.5523 * R} ${CX + R} ${CY} C ${CX + R} ${CY + 0.5523 * R} ${CX + 0.5523 * R} ${CY + R} ${CX} ${CY + R} C ${CX - 0.5523 * R} ${CY + R} ${CX - R} ${CY + 0.5523 * R} ${CX - R} ${CY} C ${CX - R} ${CY - 0.5523 * R} ${CX - 0.5523 * R} ${CY - R} ${CX} ${CY - R} Z`;
    const ring = { type: 'shape', shape: 'path', name: 'ring', d: RING, at: 0.4, duration: DURATION - 0.4, trimEnd: 0, strokeCap: 'round',
      initial: { strokeColor: INK, strokeWidth: 1.5 }, keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1.4, ease: 'power2.inOut' }] };
    const dot = { type: 'shape', shape: 'circle', name: 'dot', radius: 9, at: 1.8, duration: DURATION - 1.8, initial: { fillColor: INK },
      keyframes: followPath({ d: RING, duration: DURATION - 1.8, ease: 'none', frameRate: FPS }) };

    // type: two big lines, one word that changes with the shape, a few small lines of fine print
    const BIG = { fontFamily: GROTESK, fontSize: 132, fontWeight: '900', fill: INK, letterSpacing: -3 };
    const lines = [
      ...animateText('FORM', BIG, { x: 84, y: 76, align: 'left', name: 'form', at: 0.5, duration: DURATION - 0.5, in: { from: { x: -70, alpha: 0 }, duration: 0.7, ease: 'power4.out' }, stagger: { each: 0.05 } }),
      ...animateText('FOLLOWS', BIG, { x: 84, y: 204, align: 'left', name: 'follows', at: 0.8, duration: DURATION - 0.8, in: { from: { x: -70, alpha: 0 }, duration: 0.7, ease: 'power4.out' }, stagger: { each: 0.045 } }),
    ];
    const WORDS = [['FUNCTION', 1.6, 4.5, RED], ['FEELING', 4.9, 8.3, YELLOW], ['FUTURE', 8.7, DURATION, BLUE]];
    const words = WORDS.flatMap(([word, from, to, color]) => animateText(word, { ...BIG, fontSize: 92, letterSpacing: -2, fill: color === YELLOW ? '#c98a00' : color }, {
      x: 84, y: 372, align: 'left', name: 'word-' + word.toLowerCase(), at: from, duration: to - from,
      in: { from: { y: 60, alpha: 0 }, duration: 0.5, ease: 'power4.out' }, out: to < DURATION ? { from: { y: -60, alpha: 0 }, duration: 0.4, ease: 'power3.in' } : false, stagger: { each: 0.03 },
    }));
    const small = (name, text, x, y, at, align = 'left') => ({
      type: 'text', name, text, at, duration: DURATION - at, style: { fontFamily: GROTESK, fontSize: 15, fontWeight: '700', fill: INK, letterSpacing: 5 },
      initial: { x, y, anchorX: align === 'right' ? 1 : 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6 }],
    });
    const fine = [
      small('plate', 'STUDY  NO. 3', 88, 664, 2.2), small('rule-label', 'THREE SHAPES, THREE WORDS', 1196, 664, 2.4, 'right'),
      { type: 'shape', shape: 'rect', name: 'baseline', width: W - 176, height: 3, anchorX: 0, at: 2.0, duration: DURATION - 2.0, initial: { x: 88, y: 640, fillColor: INK, scaleX: 0 },
        keyframes: [{ at: 0, to: { scaleX: 1 }, duration: 1.0, ease: 'power4.inOut' }] },
    ];

    const sounds = [
      { type: 'audio', sfx: 'pop', at: 1.0, volume: 0.4, pitch: -3 }, { type: 'audio', sfx: 'swipe', at: 4.6, volume: 0.35 }, { type: 'audio', sfx: 'swipe', at: 8.4, volume: 0.35, pitch: 3 },
      { type: 'audio', sfx: 'click', at: 1.6, volume: 0.3 }, { type: 'audio', sfx: 'click', at: 4.9, volume: 0.3 }, { type: 'audio', sfx: 'click', at: 8.7, volume: 0.3 },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 7.2,
        background: PAPER,
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'paper', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: PAPER } },
          ring, ...shapes, dot, ...lines, ...words, ...fine, ...sounds,
        ] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
