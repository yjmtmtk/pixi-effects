<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Again. — a title card, rewound</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #0b0b10; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 6px; --pe-loader-bg: #0b0b10; background: #0b0b10; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">{ "title": "Again.", "subtitle": "A title card is built, rewound like a tape, held, and replayed in slow motion — one composition with its own clock (speed / time), while the movie's own clock keeps running", "tags": ["time remap", "rewind", "slow motion", "typography", "sfx", "cubic-bezier", "vhs"], "width": 1280, "height": 720, "duration": 11, "model": "fable" }</script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie, splitText, measureText, wiggle } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 11;

    // ---------- palette: three colours + neutrals ----------
    const BG = '#0b0b10', OFF = '#f2efe8', ACC = '#ff4d3d';
    const HEAVY = '"Arial Black", "Helvetica Neue", Arial, sans-serif';
    const MONO = 'ui-monospace, Menlo, "SF Mono", monospace';

    // ---------- the two clocks ----------
    // The OUTER clock is the movie's. The act's OWN clock is driven by `time` keyframes on the composition.
    const PLAY_END = 2.2;                       // forward play reaches 2.2 s of act time
    const HOLD1 = 0.5, REW = 1.3, HOLD2 = 0.4, REPLAY = 6;
    const T_REW = PLAY_END + HOLD1;             // 2.7  the tape starts rewinding
    const T_STOP = T_REW + REW;                 // 4.0  the tape stops on an empty frame
    const T_REPLAY = T_STOP + HOLD2;            // 4.4  play again, slowly
    const ACT = 4.5;                            // the act's content, in ITS seconds (0 … 4.5)
    const ACT_LIFE = ACT + 2;                   // children outlive the clock's reach: a layer ending exactly at 4.5 would be hidden on the held end frame

    // ---------- title layout (measured, not guessed) ----------
    const TITLE = 'AGAIN.';
    const SIZE = 196;
    const titleStyle = { fontFamily: HEAVY, fontWeight: '900', fontSize: SIZE, fill: OFF, letterSpacing: -6 };
    const tm = measureText(TITLE, titleStyle);
    const R = 42, GAP = 66;                                  // the clock ring to the right of the word
    const blockW = tm.width + GAP + 2 * R;
    const LEFT = Math.round((W - blockW) / 2);
    const CY = 350;                                          // visual centre of the capitals
    const capTop = CY - SIZE * 0.358;                        // Arial Black caps are ~0.716 em tall
    const titleTop = Math.round(capTop - SIZE * 0.19);       // ascent (0.905) − cap height (0.716) above the caps
    const baseline = capTop + SIZE * 0.716;
    const BAR_Y = Math.round(capTop - 40), BAR_H = 12;
    const RULE_Y = Math.round(baseline + 34);
    const CAP_Y = RULE_Y + 40;
    const ringX = LEFT + tm.width + GAP + R, ringY = CY;
    const pieces = splitText(TITLE, titleStyle, { by: 'chars', x: LEFT, y: titleTop, align: 'left' });

    // ---------- the act: everything inside is written in the act's own seconds ----------
    // The rewind accelerates (power2.in is CUBIC in GSAP), so the dismantling bunches at its end: the letters land late
    // enough (0.5 … 1.9) that the middle of the rewind (act 1.65 s) shows the word half built.
    const LETTER_AT = 0.5, LETTER_STEP = 0.2, LETTER_DUR = 0.42;
    const RULE_AT = 1.9, CAP_AT = 2.4, RING_AT = 2.6, RING_DUR = 1.4, SETTLE_AT = RING_AT + RING_DUR;   // the ring completes at 4.0
    // forward play stops at 2.2: the word is complete, the rule half drawn; the caption, the clock and the settle are only seen in the slow replay

    const inAct = (layer) => ({ ...layer, parent: 'block', duration: layer.duration ?? (ACT_LIFE - (layer.at || 0)) });

    const letters = pieces.flatMap((p, i) => {
      const at = LETTER_AT + i * LETTER_STEP;
      return [
        inAct({
          type: 'text', name: 'letter-' + p.text, text: p.text, at, style: titleStyle,
          initial: { x: p.x, y: p.y },
          keyframes: [{ at: 0, from: { y: p.y - 130, alpha: 0 }, to: { y: p.y, alpha: 1 }, duration: LETTER_DUR, ease: 'power4.out' }],
        }),
        // each letter lands with a hit; the pitch climbs a step per letter, the full stop is a pop
        p.text === '.'
          ? { type: 'audio', name: 'sfx-stop', sfx: { preset: 'pop', pitch: 3 }, at: at + 0.1, volume: 0.9 }
          : { type: 'audio', name: 'sfx-hit-' + i, sfx: { preset: 'hit', pitch: (i - 2) * 1.5 }, at: at + 0.1, volume: 1 },
      ];
    });

    const act = {
      type: 'composition', name: 'act', width: W, height: H, duration: DURATION,
      // the act's OWN time (outer seconds → act seconds): play, hold, rewind, hold on empty, replay slowly
      keyframes: [
        { at: 0, from: { time: 0 }, to: { time: PLAY_END }, duration: PLAY_END, ease: 'none' },
        { at: PLAY_END, to: { time: PLAY_END }, duration: HOLD1 },
        { at: T_REW, to: { time: 0 }, duration: REW, ease: 'power2.in' },
        { at: T_STOP, to: { time: 0 }, duration: HOLD2 },
        { at: T_REPLAY, to: { time: ACT }, duration: REPLAY, ease: 'cubic-bezier(.2, .8, .2, 1)' },
        // tracking jitter while the tape rewinds: the composition's own x / y keyframes are OUTER time
        ...wiggle({ at: T_REW, duration: REW, freq: 14, seed: 7, ease: 'none', props: { x: { around: 0, amp: 5 }, y: { around: 0, amp: 2 } } }),
      ],
      sequences: [
        // a rig for the whole lock-up: a slow push during the glide (act 2.6 → 4.5 is only reached in the slow replay)
        { type: 'null', name: 'block', duration: ACT_LIFE, initial: { x: W / 2, y: CY, pivotX: W / 2, pivotY: CY },
          keyframes: [{ at: 2.6, to: { scale: 1.035 }, duration: ACT - 2.6, ease: 'none' }] },
        // 0.0–0.8 the accent bar wipes across
        inAct({ type: 'shape', shape: 'rect', name: 'bar', width: blockW, height: BAR_H, at: 0,
          initial: { x: LEFT, y: BAR_Y, anchorX: 0, anchorY: 0.5, fillColor: ACC, scaleX: 0 },
          keyframes: [{ at: 0, to: { scaleX: 1 }, duration: 0.8, ease: 'expo.out' }] }),
        { type: 'audio', name: 'sfx-bar', sfx: 'swoosh', at: 0, volume: 1 },
        // 0.3–1.4 the letters drop in
        ...letters,
        // 1.4–2.0 a thin rule draws on under the word
        inAct({ type: 'shape', shape: 'line', name: 'rule', from: [LEFT, RULE_Y], to: [LEFT + blockW, RULE_Y], trimEnd: 0, strokeCap: 'round', at: RULE_AT,
          initial: { strokeColor: OFF, strokeWidth: 2 },
          keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.5, ease: 'power3.inOut' }] }),
        { type: 'audio', name: 'sfx-rule', sfx: 'swipe', at: RULE_AT, volume: 0.7 },
        // 2.0–2.6 the caption fades up
        inAct({ type: 'text', name: 'caption', text: 'THE SAME FOUR SECONDS  —  ONCE MORE, SLOWLY', at: CAP_AT,
          style: { fontFamily: MONO, fontSize: 19, fill: OFF, letterSpacing: 5 },
          initial: { x: W / 2, y: CAP_Y, anchorX: 0.5, anchorY: 0.5 },
          keyframes: [{ at: 0, from: { alpha: 0, y: CAP_Y + 14 }, to: { alpha: 0.78, y: CAP_Y }, duration: 0.6, ease: 'power2.out' }] }),
        { type: 'audio', name: 'sfx-caption', sfx: { preset: 'pop', pitch: -4 }, at: CAP_AT, volume: 0.5 },
        // 2.4–4.0 a clock: the ring draws on while the hand sweeps once
        inAct({ type: 'shape', shape: 'arc', name: 'ring', radius: R, startAngle: -90, endAngle: -90, strokeCap: 'round', at: RING_AT,
          initial: { x: ringX, y: ringY, strokeColor: OFF, strokeWidth: 5 },
          keyframes: [{ at: 0, to: { endAngle: 270 }, duration: RING_DUR, ease: 'power1.inOut' }] }),
        inAct({ type: 'shape', shape: 'rect', name: 'hand', width: 3, height: R - 12, at: RING_AT,
          initial: { x: ringX, y: ringY, anchorX: 0.5, anchorY: 1, fillColor: ACC, rotation: 0 },
          keyframes: [{ at: 0, to: { rotation: 360 }, duration: RING_DUR, ease: 'power1.inOut' }] }),
        { type: 'audio', name: 'sfx-ring', sfx: { preset: 'riser', brightness: 0.2 }, at: RING_AT, duration: RING_DUR, volume: 0.5 },
        // 4.0–4.5 the settle: an accent dot pops, its halo grows to the ring's size and dissolves (in the glide this takes ~3 s), a chime rings
        inAct({ type: 'shape', shape: 'circle', name: 'dot', radius: 7, at: SETTLE_AT,
          initial: { x: ringX, y: ringY, fillColor: ACC, scale: 0 },
          keyframes: [{ at: 0, to: { scale: 1 }, duration: 0.25, ease: 'back.out(2.5)' }] }),
        inAct({ type: 'shape', shape: 'circle', name: 'dot-halo', radius: 7, at: SETTLE_AT + 0.1,
          initial: { x: ringX, y: ringY, strokeColor: ACC, strokeWidth: 2, strokeAlpha: 0.7, scale: 1 },
          keyframes: [{ at: 0, to: { scale: R / 7, strokeAlpha: 0 }, duration: ACT - SETTLE_AT - 0.1, ease: 'none' }] }),
        // the chime is given the act's remaining half second: the clock never runs past 4.5, so a 1.4 s chime would be left hanging
        { type: 'audio', name: 'sfx-chime', sfx: 'chime', at: SETTLE_AT, duration: ACT - SETTLE_AT, volume: 1 },
        { type: 'audio', name: 'sfx-dot', sfx: { preset: 'pop', pitch: 6 }, at: SETTLE_AT, volume: 0.7 },
      ],
    };

    // ---------- the OUTER time: an on-screen display that is NOT rewound ----------
    const osd = (name, text, at, duration, extra = {}) => ({
      type: 'text', name: 'osd-' + name, text, at, duration,
      style: { fontFamily: MONO, fontSize: 24, fill: OFF, letterSpacing: 4 },
      initial: { x: 64, y: 48, anchorY: 0.5, alpha: 0.55 },
      ...extra,
    });
    const osdLayers = [
      osd('play', '▶  PLAY', 0, PLAY_END),
      osd('pause', '❚❚  PAUSE', PLAY_END, HOLD1),
      osd('rew', '◀◀  REW', T_REW, REW, {
        style: { fontFamily: MONO, fontSize: 26, fontWeight: 'bold', fill: ACC, letterSpacing: 4 },
        initial: { x: 64, y: 48, anchorY: 0.5, alpha: 1 },
        keyframes: [{ at: 0, to: { alpha: 0.25 }, duration: REW / 12, repeat: 11, yoyo: true }],   // 12 half-blinks = exactly the rewind
      }),
      osd('stop', '■  STOP', T_STOP, HOLD2),
      osd('play2', '▶  PLAY', T_REPLAY, DURATION - T_REPLAY),
    ];

    // a frame counter that runs forward the whole time — also while the act runs backward
    const tc = (f) => `00:${String(Math.floor(f / FPS)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
    const timecode = {
      type: 'text', name: 'timecode', text: tc(0),
      style: { fontFamily: MONO, fontSize: 24, fill: OFF, letterSpacing: 4 },
      initial: { x: W - 64, y: 48, anchorX: 1, anchorY: 0.5, alpha: 0.55 },
      keyframes: Array.from({ length: DURATION * FPS - 1 }, (_, i) => ({ at: (i + 1) / FPS, set: { text: tc(i + 1) } })),
    };

    // VHS while the tape rewinds: snow (grain on an additive dark rect), a tracking band and fast scanlines sweeping down
    const vhs = {
      type: 'composition', name: 'vhs', at: T_REW, duration: REW, width: W, height: H,
      sequences: [
        { type: 'shape', shape: 'rect', name: 'snow', width: W, height: H, blendMode: 'add',
          initial: { x: W / 2, y: H / 2, fillColor: '#0d0d11', alpha: 0.35 },
          filters: [{ type: 'grain', amount: 0.32, size: 1.8, fps: 30, seed: 3 }],
          keyframes: [{ at: 0, to: { alpha: 1 }, duration: REW, ease: 'power2.in' }] },   // the snow thickens as the tape speeds up
        { type: 'shape', shape: 'rect', name: 'track-band', width: W + 60, height: 34,
          initial: { x: W / 2, y: -40, fillColor: OFF, fillAlpha: 0.08 },
          keyframes: [{ at: 0, to: { y: H + 40 }, duration: REW, ease: 'power1.in' }] },
        { type: 'shape', shape: 'rect', name: 'track-line', width: W + 60, height: 3,
          initial: { x: W / 2, y: -40 + 15, fillColor: OFF, fillAlpha: 0.35 },
          keyframes: [{ at: 0, to: { y: H + 55 }, duration: REW, ease: 'power1.in' }] },
        ...[0, 0.11, 0.22].map((ph, i) => ({ type: 'shape', shape: 'rect', name: 'scan-' + i, width: W, height: 2,
          initial: { x: W / 2, y: -10, fillColor: OFF, fillAlpha: 0.14 },
          keyframes: [{ at: ph, from: { y: -10 }, to: { y: H + 10 }, duration: 0.32, repeat: 2, ease: 'none' }] })),
      ],
    };

    // outer sounds: the tape motor under the rewind (a riser is loudest at its END = the stop), the stop clunk, the play click
    const outerSfx = [
      // a faint tape hiss for the whole piece (the player is on), so the held end frame is not dead silent; an sfx lasts 10 s at most, so two halves
      ...[0, 1].map(i => ({ type: 'audio', name: 'sfx-hiss-' + i, at: i * DURATION / 2, duration: DURATION / 2, volume: 0.07,
        sfx: { voices: [{ wave: 'noise', filter: { type: 'lowpass', freq: [2200, 2200] }, envelope: 'hold' }], seed: i } })),
      { type: 'audio', name: 'sfx-motor', sfx: { preset: 'riser', brightness: -0.5 }, at: T_REW, duration: REW, volume: 0.6 },
      { type: 'audio', name: 'sfx-clunk', sfx: { preset: 'hit', pitch: -7 }, at: T_STOP, volume: 0.8 },
      { type: 'audio', name: 'sfx-play', sfx: 'click', at: T_REPLAY, volume: 1 },
    ];

    const sequences = [
      { type: 'shape', shape: 'rect', name: 'bg', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: BG } },
      act,
      vhs,
      ...osdLayers,
      timecode,
      ...outerSfx,
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 10.2,
        background: BG,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
