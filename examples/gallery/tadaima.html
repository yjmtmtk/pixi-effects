<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tadaima</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    body { background: #121212; margin: 0; padding: 16px; box-sizing: border-box; min-height: 100vh; }
    .stage { position: relative; width: min(100%, calc((100vh - 32px) * 9 / 16)); margin: 0 auto; }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
  <script type="application/json" id="piece-meta">{ "title": "ただいま", "subtitle": "A small ball hops ten ledges down to the one spot that fits it; the trip is shown again as a chronophotograph.", "tags": ["vertical", "story", "physics", "music", "japanese"], "width": 720, "height": 1280, "duration": 13, "model": "opus" }</script>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="720" height="1280"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 720, H = 1280, FPS = 30, DURATION = 13;

    // ── palette & type ────────────────────────────────────────────────
    const PAPER = '#f1ece3', INK = '#1c2333', CORAL = '#ff5a3c';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", Georgia, serif';
    const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';

    // ── the world (scrolls under a null, then zooms out) ──────────────
    const R = 22, LEDGE_W = 120, LEDGE_H = 12;
    const LX = [200, 520], Y0 = 380, D = 200, N = 10;            // ledge k: x = LX[k % 2], y = Y0 + D k
    const ledgeX = k => LX[k % 2], ledgeY = k => Y0 + D * k;
    const rest = k => ledgeY(k) - LEDGE_H / 2 - R;                  // ball centre resting on ledge k
    const CUP_X = 360, CUP_Y = ledgeY(N - 1) + 440, CUP_R = 26;     // the socket: a dip in a floor line
    const homeY = CUP_Y + CUP_R - 2 - R;                            // ball centre seated in the socket

    // ── time: 120 bpm, one hop per beat ───────────────────────────────
    const BEAT = 0.5, C = 1 / 15;                                   // C = ground contact (2 frames)
    const L0 = 1.5;                                                 // push-off from ledge 0 (beat 3)
    const land = k => L0 + BEAT * k;                                // landing on ledge k (k = 1..9 → beats 4..12)
    const T_GO = 7.0, T_HOME = 7.5;                                 // last jump (beat 14), seated (beat 15)
    const T_REVEAL = 8.3;

    // projectile: rise for tu (power1.out), fall for td (power1.in); same gravity for every hop
    const HOP_H = 80, F = BEAT - C;
    const A = F / (Math.sqrt(HOP_H) + Math.sqrt(HOP_H + D));       // A = sqrt(2 / g)
    const tu = A * Math.sqrt(HOP_H), td = F - tu;
    const finalDrop = homeY - rest(N - 1), Tf = T_HOME - T_GO, m = Tf / A;
    const sF = (m * m - finalDrop) / (2 * m), FIN_H = sF * sF;
    const tuF = A * sF, tdF = Tf - tuF;

    // the ball's centre path as segments (one source for keyframes, the camera and the chronophotograph)
    const segs = [];   // { t0, t1, x0, x1, y0, y1, ease }
    const seg = (t0, t1, x0, x1, y0, y1, ease) => segs.push({ t0, t1, x0, x1, y0, y1, ease });
    for (let k = 0; k < N - 1; k++) {
      const t = land(k) + C, x0 = ledgeX(k), x1 = ledgeX(k + 1);
      const xm = x0 + (x1 - x0) * (tu / F);
      seg(t, t + tu, x0, xm, rest(k), rest(k) - HOP_H, 'power1.out');
      seg(t + tu, t + F, xm, x1, rest(k) - HOP_H, rest(k + 1), 'power1.in');
    }
    {
      const x0 = ledgeX(N - 1), xm = x0 + (CUP_X - x0) * (tuF / Tf);
      seg(T_GO, T_GO + tuF, x0, xm, rest(N - 1), rest(N - 1) - FIN_H, 'power1.out');
      seg(T_GO + tuF, T_HOME, xm, CUP_X, rest(N - 1) - FIN_H, homeY, 'power1.in');
    }
    const EASE = { 'power1.out': u => 1 - (1 - u) * (1 - u), 'power1.in': u => u * u };
    function ballAt(t) {
      if (t <= segs[0].t0) return { x: ledgeX(0), y: rest(0) };
      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        if (t <= s.t1) {
          if (t < s.t0) return { x: s.x0, y: s.y0 };               // contact / pause between segments
          const u = (t - s.t0) / (s.t1 - s.t0);
          return { x: s.x0 + (s.x1 - s.x0) * u, y: s.y0 + (s.y1 - s.y0) * EASE[s.ease](u) };
        }
      }
      return { x: CUP_X, y: homeY };
    }

    const r2 = v => Math.round(v * 1000) / 1000;
    const sequences = [];
    const add = (...l) => sequences.push(...l);

    add({ type: 'shape', shape: 'rect', name: 'paper', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: PAPER } });

    // ── camera: the world null follows a smoothed copy of the ball, then pulls back ──
    const SCREEN_Y = 560;
    const smoothY = t => { let s = 0; const n = 12; for (let i = 0; i < n; i++) s += ballAt(t - 0.4 + (0.6 * i) / (n - 1)).y; return s / n; };
    const camKeys = [];
    const CAM_DT = 1 / 15;
    for (let t = 1.2; t < 8.0 - 1e-6; t += CAM_DT) {
      camKeys.push({ at: r2(t), to: { y: r2(SCREEN_Y - smoothY(t + CAM_DT)) }, duration: r2(CAM_DT), ease: 'none' });
    }
    // final camera rest: ball seated at SCREEN_Y
    camKeys.push({ at: 8.0, to: { y: SCREEN_Y - homeY }, duration: 0.3, ease: 'sine.out' });
    // reveal: scale the whole trip down into the right-hand column
    const S = 0.4, TOP = 190, COL_X = 470;
    camKeys.push({ at: T_REVEAL, to: { scale: S, x: COL_X - S * 360, y: TOP - S * (rest(0) - R) }, duration: 1.5, ease: 'power3.inOut' });
    add({ type: 'null', name: 'world', initial: { x: 0, y: SCREEN_Y - smoothY(0) }, keyframes: camKeys });

    // ── chronophotograph: the ball every 2 frames, shown only after the pull-back ──
    const strobe = [];
    // evenly in time within each hop, so every hop leaves the same pattern (the landing is the next hop's first ghost)
    for (let k = 0; k < N - 1; k++) for (let i = 0; i < 7; i++) strobe.push(ballAt(land(k) + C + (F * i) / 7));
    for (let i = 0; i < 6; i++) strobe.push(ballAt(T_GO + (Tf * i) / 6));
    strobe.forEach((p, i) => add({
      type: 'shape', shape: 'circle', radius: R, parent: 'world', name: `ghost-${i}`,
      initial: { x: r2(p.x), y: r2(p.y), fillAlpha: 0, strokeColor: INK, strokeWidth: 3.5, alpha: 0 },

      keyframes: [{ at: r2(T_REVEAL + 0.9 + i * 0.011), to: { alpha: 0.5 }, duration: 0.25, ease: 'power1.out' }],
    }));

    // ── ledges: light up when touched and stay lit ──
    for (let k = 0; k < N; k++) {
      const t = k === 0 ? L0 : land(k);
      add({
        type: 'shape', shape: 'rect', name: `ledge-${k}`, parent: 'world',
        width: LEDGE_W, height: LEDGE_H, cornerRadius: LEDGE_H / 2,
        initial: { x: ledgeX(k), y: ledgeY(k), fillColor: INK },
        keyframes: [
          { at: t, set: { fillColor: CORAL } },                               // lit on contact (a tween passes through brown)
          { at: t, to: { y: ledgeY(k) + (k === 0 ? 5 : 9) }, duration: 0.06, ease: 'power2.out' },
          { at: t + 0.06, to: { y: ledgeY(k) }, duration: 0.5, ease: 'elastic.out(1,0.35)' },
        ],
      });
    }

    // impact ticks: two short strokes flick out from each landing and are gone in a quarter second
    for (let k = 1; k < N; k++) {
      const cx = ledgeX(k), cy = ledgeY(k) - LEDGE_H / 2 - 2, big = k === N - 1 ? 1.35 : 1;
      for (const side of [-1, 1]) add({
        type: 'shape', shape: 'line', name: `tick-${k}${side < 0 ? 'l' : 'r'}`, parent: 'world', at: land(k), duration: 0.3,
        from: [cx + side * 30 * big, cy - 6 * big], to: [cx + side * 50 * big, cy - 20 * big], trimEnd: 0, strokeCap: 'round',
        initial: { strokeColor: INK, strokeWidth: 3 },
        keyframes: [
          { at: 0, to: { trimEnd: 1 }, duration: 0.1, ease: 'power2.out' },
          { at: 0.08, to: { trimStart: 1 }, duration: 0.16, ease: 'power2.in' },
        ],
      });
    }

    // ── home: a floor line with a socket the exact size of the ball; it draws itself as the ball nears ──
    const cupPts = [];
    for (let i = 0; i <= 24; i++) { const a = Math.PI - (Math.PI * i) / 24; cupPts.push(`${r2(CUP_X + CUP_R * Math.cos(a))} ${r2(CUP_Y + CUP_R * Math.sin(a))}`); }
    const cupD = `M 110 ${CUP_Y} L ${CUP_X - CUP_R} ${CUP_Y} L ${cupPts.join(' L ')} L 610 ${CUP_Y}`;
    add({
      type: 'shape', shape: 'path', name: 'home', parent: 'world', d: cupD, trimEnd: 0, strokeCap: 'round', strokeJoin: 'round',
      initial: { strokeColor: INK, strokeWidth: 4, fillAlpha: 0 },   // a path is in its parent's coordinates: no x / y
      keyframes: [{ at: 5.6, to: { trimEnd: 1 }, duration: 1.1, ease: 'power2.inOut' }],
    });

    // ripples when the ball sits down
    for (let i = 0; i < 2; i++) add({
      type: 'shape', shape: 'circle', radius: R + 4, parent: 'world', name: `ripple-${i}`, at: T_HOME + i * 0.12, duration: 1.4,
      initial: { x: CUP_X, y: homeY, fillAlpha: 0, strokeColor: CORAL, strokeWidth: 3 - i, alpha: 0 },
      keyframes: [
        { at: 0, set: { alpha: 0.9 } },
        { at: 0, to: { scale: 4.2 - i * 0.9, alpha: 0, strokeWidth: 0.6 }, duration: 1.1, ease: 'power2.out' },
      ],
    });

    // ── the ball: a null (moves and squashes) with a body and an eye ──
    const bx = [], by = [], bs = [];
    // idle → a crouch → push off
    bs.push({ at: 1.05, to: { scaleX: 1.16, scaleY: 0.84 }, duration: 0.45, ease: 'power2.inOut' });
    by.push({ at: 1.05, to: { y: rest(0) + 3.5 }, duration: 0.45, ease: 'power2.inOut' });
    by.push({ at: L0, to: { y: rest(0) }, duration: C, ease: 'power1.out' });
    bs.push({ at: L0, to: { scaleX: 0.9, scaleY: 1.12 }, duration: C + 0.08, ease: 'power1.out' });
    for (let k = 0; k < N - 1; k++) {
      const t = land(k) + C;
      const [up, down] = [segs[2 * k], segs[2 * k + 1]];
      bx.push({ at: r2(t), to: { x: down.x1 }, duration: r2(F), ease: 'none' });
      by.push({ at: r2(up.t0), to: { y: r2(up.y1) }, duration: r2(tu), ease: 'power1.out' });
      by.push({ at: r2(down.t0), to: { y: r2(down.y1) }, duration: r2(td), ease: 'power1.in' });
      if (k > 0) bs.push({ at: r2(t), to: { scaleX: 0.9, scaleY: 1.12 }, duration: 0.08, ease: 'power1.out' });
      bs.push({ at: r2(t + 0.1), to: { scaleX: 1, scaleY: 1 }, duration: r2(tu - 0.1), ease: 'sine.inOut' });
      bs.push({ at: r2(down.t0), to: { scaleX: 0.93, scaleY: 1.09 }, duration: r2(td), ease: 'power1.in' });
      // landing on ledge k+1: squash for the contact frames (the last landing sticks)
      const Lk = land(k + 1);
      if (k + 1 < N - 1) {
        bs.push({ at: r2(Lk), to: { scaleX: 1.3, scaleY: 0.72 }, duration: r2(C), ease: 'power1.out' });
        by.push({ at: r2(Lk), to: { y: r2(rest(k + 1) + 6) }, duration: r2(C / 2), ease: 'power1.out' });
        by.push({ at: r2(Lk + C / 2), to: { y: r2(rest(k + 1)) }, duration: r2(C / 2), ease: 'power1.in' });
      }
    }
    // sticks the landing on the last ledge, wobbles, looks down, crouches, jumps home
    const L9 = land(N - 1);
    bs.push({ at: L9, to: { scaleX: 1.38, scaleY: 0.64 }, duration: 0.05, ease: 'power1.out' });
    by.push({ at: L9, to: { y: rest(N - 1) + 8 }, duration: 0.05, ease: 'power1.out' });
    bs.push({ at: L9 + 0.05, to: { scaleX: 1, scaleY: 1 }, duration: 0.7, ease: 'elastic.out(1,0.3)' });
    by.push({ at: L9 + 0.05, to: { y: rest(N - 1) }, duration: 0.7, ease: 'elastic.out(1,0.3)' });
    bs.push({ at: 6.6, to: { scaleX: 1.16, scaleY: 0.84 }, duration: 0.4, ease: 'power2.inOut' });
    by.push({ at: 6.6, to: { y: rest(N - 1) + 3.5 }, duration: 0.4, ease: 'power2.inOut' });
    {
      const [up, down] = [segs[segs.length - 2], segs[segs.length - 1]];
      bx.push({ at: T_GO, to: { x: CUP_X }, duration: Tf, ease: 'none' });
      by.push({ at: r2(up.t0), to: { y: r2(up.y1) }, duration: r2(tuF), ease: 'power1.out' });
      by.push({ at: r2(down.t0), to: { y: r2(down.y1) }, duration: r2(tdF), ease: 'power1.in' });
      bs.push({ at: T_GO, to: { scaleX: 0.88, scaleY: 1.14 }, duration: 0.09, ease: 'power1.out' });
      bs.push({ at: T_GO + 0.09, to: { scaleX: 1, scaleY: 1 }, duration: r2(tuF), ease: 'sine.inOut' });
      bs.push({ at: r2(down.t0 + 0.05), to: { scaleX: 0.92, scaleY: 1.1 }, duration: r2(tdF - 0.05), ease: 'power1.in' });
      // seated: a soft squash into the socket
      bs.push({ at: T_HOME, to: { scaleX: 1.22, scaleY: 0.8 }, duration: 0.05, ease: 'power1.out' });
      by.push({ at: T_HOME, to: { y: homeY + 4 }, duration: 0.05, ease: 'power1.out' });
      bs.push({ at: T_HOME + 0.05, to: { scaleX: 1, scaleY: 1 }, duration: 0.8, ease: 'elastic.out(1,0.35)' });
      by.push({ at: T_HOME + 0.05, to: { y: homeY }, duration: 0.8, ease: 'elastic.out(1,0.35)' });
    }
    add({ type: 'null', name: 'ball', parent: 'world', initial: { x: ledgeX(0), y: rest(0) }, keyframes: [...bx, ...by, ...bs] });
    add({ type: 'shape', shape: 'circle', name: 'ball-body', parent: 'ball', radius: R, initial: { x: 0, y: 0, fillColor: CORAL } });

    // the eye: looks where the ball is going; blinks at the start, closes contentedly at home
    const eye = [
      { at: 0.55, to: { scaleY: 0.12 }, duration: 0.06, ease: 'power1.in' },
      { at: 0.61, to: { scaleY: 1 }, duration: 0.1, ease: 'power1.out' },
      { at: 0.85, to: { x: 9, y: 3 }, duration: 0.18, ease: 'power2.out' },        // looks down at the way ahead
    ];
    for (let k = 0; k < N - 1; k++) {
      const dir = ledgeX(k + 1) > ledgeX(k) ? 1 : -1;
      eye.push({ at: r2(land(k) + C), to: { x: 8 * dir, y: -5 }, duration: 0.1, ease: 'power2.out' });
    }
    eye.push({ at: 6.35, to: { x: -6, y: 6 }, duration: 0.2, ease: 'power2.out' });   // looks down at home
    eye.push({ at: T_GO, to: { x: -8, y: -3 }, duration: 0.1, ease: 'power2.out' });
    eye.push({ at: T_HOME + 0.45, to: { x: 0, y: -4 }, duration: 0.25, ease: 'power2.inOut' });
    eye.push({ at: T_HOME + 0.75, to: { scaleY: 0.14, scaleX: 1.5 }, duration: 0.14, ease: 'power2.in' });
    add({ type: 'shape', shape: 'circle', name: 'ball-eye', parent: 'ball', radius: 4.5,
      initial: { x: 7, y: -6, fillColor: PAPER }, keyframes: eye });

    // ── type ──
    // opening line
    add({
      type: 'text', name: 'line-open', text: 'かえろう。', at: 0, duration: 2.4,
      style: { fontFamily: MINCHO, fontSize: 52, fill: INK, letterSpacing: 6 },
      initial: { x: 72, y: 300, anchorX: 0, anchorY: 0.5 },
      keyframes: [
        { at: 0.1, from: { alpha: 0, y: 318 }, to: { alpha: 1, y: 300 }, duration: 0.7, ease: 'power3.out' },
        { at: 1.6, to: { alpha: 0, y: 282 }, duration: 0.6, ease: 'power2.in' },
      ],
    });
    // hop counter (top right): ticks on each landing
    const cnt = [];
    for (let k = 1; k < N; k++) cnt.push({ at: land(k), set: { value: k } });
    cnt.push({ at: T_HOME, set: { value: N } });
    add({
      type: 'text', name: 'counter', text: 'HOP {value}', format: { pad: 2 },
      style: { fontFamily: MONO, fontSize: 22, fill: INK, letterSpacing: 3 },
      initial: { x: W - 64, y: 92, anchorX: 1, anchorY: 0.5, value: 0, alpha: 0 },
      keyframes: [{ at: 1.3, to: { alpha: 0.75 }, duration: 0.4, ease: 'power1.out' }, ...cnt],
    });
    // closing title, written vertically in the left column
    const TITLE = ['た', 'だ', 'い', 'ま'], TX = 190, TY = 420, TL = 104;
    TITLE.forEach((ch, i) => add({
      type: 'text', name: `title-${i}`, text: ch, at: 9.7 + i * 0.09,
      style: { fontFamily: MINCHO, fontSize: 88, fill: INK },
      initial: { x: TX, y: TY + i * TL, anchorX: 0.5, anchorY: 0.5 },
      keyframes: [{ at: 0, from: { alpha: 0, y: TY + i * TL + 22 }, to: { alpha: 1, y: TY + i * TL }, duration: 0.8, ease: 'power3.out' }],
    }));
    add({
      type: 'shape', shape: 'rect', name: 'title-rule', at: 10.25, width: 2, height: 64,
      initial: { x: TX, y: TY + 4 * TL + 30, fillColor: CORAL, anchorY: 0 },
      keyframes: [{ at: 0, from: { scaleY: 0 }, to: { scaleY: 1 }, duration: 0.5, ease: 'power3.out' }],
    });
    add({
      type: 'text', name: 'caption', text: 'A SHORT WAY HOME', at: 10.45,
      style: { fontFamily: MONO, fontSize: 17, fill: INK, letterSpacing: 4 },
      initial: { x: TX, y: TY + 4 * TL + 132, anchorX: 0.5, anchorY: 0.5 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 0.6 }, duration: 0.6, ease: 'power1.out' }],
    });

    // plate labels: elapsed time at the first ledge and at home (screen coordinates after the pull-back)
    const PX = COL_X - S * 360, PY = TOP - S * (rest(0) - R);
    const label = (name, text, x, y, ax, at) => add({
      type: 'text', name, text, at,
      style: { fontFamily: MONO, fontSize: 16, fill: INK, letterSpacing: 2 },
      initial: { x, y, anchorX: ax, anchorY: 0.5 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 0.6 }, duration: 0.5, ease: 'power1.out' }],
    });
    label('t-start', '0.0 s', PX + S * (ledgeX(0) - LEDGE_W / 2) - 14, PY + S * ledgeY(0), 1, 10.7);
    label('t-home', `${(T_HOME - L0).toFixed(1)} s`, PX + S * 610 + 14, PY + S * CUP_Y, 0, 10.85);

    // ── sound: one hop per beat at 120 bpm; a descending music-box run, resolved when the ball sits down ──
    add({ type: 'audio', name: 'score', at: 0, volume: 1.45, music: {
      bpm: 120, reverb: 0.3, humanize: 0,
      tracks: [
        { inst: 'pad', vol: 0.45, attack: 0.6, release: 1.2, notes: 'Fmaj7:4 Em7:4 Dm7:4 G7sus4:3 Cmaj9:11' },
        { inst: 'bass', vol: 0.5, tone: 0.4, notes: 'f2:4 e2:4 d2:4 g1:3 c2:11' },
        { inst: 'musicbox', vol: 0.9, ring: 1.2, notes: '_:3 g5:1 e6:1 d6:1 c6:1 a5:1 g5:1 e5:1 d5:1 c5:1 a4:3 [c5 e5 g5 c6]:4 _:7' },
        { inst: 'bell', vol: 0.35, notes: '_:15 e6:1 g6:1 _:9' },
      ],
    } });
    for (let k = 1; k < N; k++) add({ type: 'audio', name: `tap-${k}`, at: land(k), volume: 0.5, sfx: { preset: 'click', pitch: -5, brightness: -0.4, seed: k } });
    add({ type: 'audio', name: 'seat', at: T_HOME, volume: 0.7, sfx: { preset: 'pop', pitch: -7, brightness: -0.3 } });
    add({ type: 'audio', name: 'pull-back', at: T_REVEAL + 0.25, volume: 0.4, sfx: { preset: 'swoosh', brightness: -0.5 } });

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11.5,
        background: PAPER,
