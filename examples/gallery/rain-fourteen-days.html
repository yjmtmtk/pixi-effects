<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rain-fourteen-days</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    body { background: #0b0d0f; margin: 0; padding: 16px; min-height: calc(100vh - 32px); display: flex; align-items: center; justify-content: center; }
    .stage { position: relative; width: min(960px, 100%); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script type="application/json" id="piece-meta">{ "title": "Fourteen Days of Rain", "subtitle": "365 day-bars re-sort themselves: half a year's rain falls on 14 days (illustrative data)", "tags": ["data story", "chart", "sort", "japanese", "editorial"], "width": 1280, "height": 720, "duration": 13, "model": "opus" }</script>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 13;

    // ── palette & type (brief.md) ─────────────────────────────────────────
    const INK = '#0D1114', PAPER = '#E6EAED', SLATE = '#56626D', RAIN = '#7CCBFF';
    const SANS = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif';
    const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';

    // ── beat grid: 96 bpm, a bar = 2.5 s ─────────────────────────────────
    const BEAT = 60 / 96, BAR = 4 * BEAT;
    const T = {
      kicker: 0.1, grow: 0.55, growSpan: 2.0,
      cap1: BAR,                    // 2.5
      cap2: 4.375,                  // beat 7
      sort: 2 * BAR, sortDur: 1.7, sortSpread: 0.35,   // 5.0
      axis2: 6.875,                 // beat 11
      reveal: 3 * BAR,              // 7.5
      label: 8.125,                 // beat 13
      head: 9.375,                  // beat 15
    };

    // ── illustrative data: one invented city, a seeded year of daily rain ──
    function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function rainYear(seed) {
      const r = mulberry32(seed), out = [];
      for (let d = 0; d < 365; d++) {
        const wet = 0.27 + 0.2 * Math.exp(-(((d - 165) / 22) ** 2)) + 0.12 * Math.exp(-(((d - 255) / 25) ** 2)) + 0.06 * Math.sin(d / 365 * 2 * Math.PI - 1.4);
        if (r() < wet) {
          let mm = -Math.log(1 - r()) * 9;
          if (r() < 0.07) mm += 25 + r() * 70 * (1 + Math.exp(-(((d - 255) / 30) ** 2)));   // storms, more of them in typhoon season
          out.push(Math.round(mm * 2) / 2);
        } else out.push(0);
      }
      return out;
    }
    const rain = rainYear(20);
    const TOTAL = rain.reduce((a, b) => a + b, 0);
    const order = rain.map((v, d) => d).sort((a, b) => rain[b] - rain[a] || a - b);   // day indices, wettest first
    const rank = new Array(365); order.forEach((d, i) => { rank[d] = i; });
    let N = 0; for (let c = 0; c < TOTAL / 2; ) c += rain[order[N++]];               // days that carry half the year
    const WET_DAYS = rain.filter(v => v > 0).length;

    // ── grid ──────────────────────────────────────────────────────────────
    const L = 96, R = 1184, BASE = 590, TOP = 270, PLOT_H = BASE - TOP;
    const PITCH = (R - L) / 365, BAR_W = 2;
    const MM_MAX = 100, mmH = mm => PLOT_H * mm / MM_MAX;
    const xOf = i => L + i * PITCH + PITCH / 2;          // centre of slot i
    const shareY = s => BASE - PLOT_H * s;               // cumulative share → y

    const rise = (at, d = 0.5) => ({ at, from: { alpha: 0, y: '+=14' }, duration: d, ease: 'power3.out' });
    const fadeOut = (at, d = 0.3) => ({ at, to: { alpha: 0 }, duration: d, ease: 'power2.in' });

    const S = [];
    S.push({ type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: INK } });

    // mm gridlines (calendar view only), labels at the right end where the bars stay low
    for (const mm of [50, 100]) {
      const y = BASE - mmH(mm);
      S.push({ type: 'shape', shape: 'line', name: `grid${mm}`, from: [L, y], to: [R, y], at: 0.3, duration: T.reveal + 0.4 - 0.3,
        initial: { strokeColor: SLATE, strokeWidth: 1, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.35 }, duration: 0.8 }, fadeOut(-0.4)] });
      S.push({ type: 'text', name: `grid${mm}-label`, text: `${mm} mm`, at: 0.5, duration: T.reveal + 0.4 - 0.5,
        style: { fontFamily: MONO, fontSize: 14, fill: SLATE },
        initial: { x: R, y: y - 6, anchorX: 1, anchorY: 1, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.8 }, fadeOut(-0.4)] });
    }

    // baseline
    S.push({ type: 'shape', shape: 'line', name: 'baseline', from: [L, BASE + 0.5], to: [R, BASE + 0.5], trimEnd: 0,
      initial: { strokeColor: SLATE, strokeWidth: 1 },
      keyframes: [{ at: T.kicker, to: { trimEnd: 1 }, duration: 0.9, ease: 'power2.inOut' }] });

    // 365 bars: calendar order → wettest first → the first N light up
    for (let d = 0; d < 365; d++) {
      const v = rain[d], i = rank[d];
      const h = v > 0 ? Math.max(2, mmH(v)) : 1;
      const growAt = T.grow + (d / 364) * T.growSpan;
      const sortAt = T.sort + (i / 364) * T.sortSpread;
      const kf = [
        { at: growAt, to: { height: h }, duration: 0.5, ease: 'expo.out' },
        { at: sortAt, to: { x: xOf(i) }, duration: T.sortDur, ease: 'power3.inOut' },
      ];
      if (i < N) kf.push({ at: T.reveal + (i / N) * 0.6, to: { fillColor: RAIN, alpha: 1 }, duration: 0.5, ease: 'power2.out' });
      else kf.push({ at: T.reveal + 0.2, to: { alpha: v > 0 ? 0.45 : 0.3 }, duration: 0.6, ease: 'power2.out' });
      S.push({ type: 'shape', shape: 'rect', name: `day${d}`, width: BAR_W, height: 0, anchorY: 1, colorSpace: 'oklab',
        initial: { x: xOf(d), y: BASE, fillColor: v > 0 ? PAPER : SLATE, alpha: v > 0 ? 0.82 : 0.6 }, keyframes: kf });
    }

    // month labels (calendar view)
    const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    let acc = 0;
    MONTH_DAYS.forEach((n, m) => {
      const cx = xOf(acc + n / 2 - 0.5); acc += n;
      S.push({ type: 'text', name: `month${m + 1}`, text: `${m + 1}月`, at: T.grow + (acc - n / 2) / 364 * T.growSpan, duration: T.sort + 0.3 - (T.grow + (acc - n / 2) / 364 * T.growSpan),
        style: { fontFamily: SANS, fontSize: 16, fill: SLATE },
        initial: { x: cx, y: BASE + 18, anchorX: 0.5, anchorY: 0 },
        keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.4 }, fadeOut(-0.3)] });
    });

    // sorted axis labels
    S.push({ type: 'text', name: 'axis-wet', text: '← 雨の多かった日', at: T.axis2, duration: DURATION - T.axis2,
      style: { fontFamily: SANS, fontSize: 16, fill: SLATE }, initial: { x: L, y: BASE + 18 }, keyframes: [rise(0)] });
    S.push({ type: 'text', name: 'axis-dry', text: `雨の降らなかった日（${365 - WET_DAYS}日） →`, at: T.axis2, duration: DURATION - T.axis2,
      style: { fontFamily: SANS, fontSize: 16, fill: SLATE }, initial: { x: R, y: BASE + 18, anchorX: 1 }, keyframes: [rise(0)] });

    // cumulative curve (sorted order): rain blue up to the 50 % crossing, then a thin slate line
    let cum = 0;
    const pts = [[L, BASE]];
    order.forEach((day, i) => { cum += rain[day]; pts.push([L + (i + 1) * PITCH, shareY(cum / TOTAL)]); });
    const pathOf = list => list.map(([x, y], k) => `${k ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    S.push({ type: 'shape', shape: 'path', name: 'curve-tail', d: pathOf(pts.slice(N)), trimEnd: 0, strokeCap: 'round', strokeJoin: 'round', at: T.reveal,
      initial: { strokeColor: SLATE, strokeWidth: 1.5, fillAlpha: 0 },
      keyframes: [{ at: 0.55, to: { trimEnd: 1 }, duration: 1.8, ease: 'power2.inOut' }] });
    S.push({ type: 'shape', shape: 'path', name: 'curve-head', d: pathOf(pts.slice(0, N + 1)), trimEnd: 0, strokeCap: 'round', strokeJoin: 'round', at: T.reveal,
      initial: { strokeColor: RAIN, strokeWidth: 2.5, fillAlpha: 0 },
      keyframes: [{ at: 0.05, to: { trimEnd: 1 }, duration: 0.55, ease: 'power1.in' }] });

    // 50 % rule (dashes as sub-paths) and the point where the curve crosses it
    const xN = L + N * PITCH, y50 = shareY(0.5);
    let dash = '';
    for (let x = L; x < R - 4; x += 10) dash += `M ${x} ${y50} L ${Math.min(x + 5, R)} ${y50} `;
    S.push({ type: 'shape', shape: 'path', name: 'half-rule', d: dash, trimEnd: 0, at: T.reveal,
      initial: { strokeColor: PAPER, strokeWidth: 1, strokeAlpha: 0.5 },
      keyframes: [{ at: 0.5, to: { trimEnd: 1 }, duration: 1.1, ease: 'power2.inOut' }] });
    S.push({ type: 'text', name: 'half-label', text: '年間雨量の50%', at: T.reveal + 1.2, duration: DURATION - T.reveal - 1.2,
      style: { fontFamily: SANS, fontSize: 16, fill: PAPER }, initial: { x: R, y: y50 - 8, anchorX: 1, anchorY: 1, alpha: 0.7 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 0.7 }, duration: 0.4 }] });
    S.push({ type: 'text', name: 'full-label', text: '100%', at: T.reveal + 1.9, duration: DURATION - T.reveal - 1.9,
      style: { fontFamily: MONO, fontSize: 13, fill: SLATE }, initial: { x: R, y: TOP - 8, anchorX: 1, anchorY: 1 },
      keyframes: [{ at: 0, from: { alpha: 0 }, duration: 0.4 }] });
    // a bracket under the lit days: "these ones"
    S.push({ type: 'shape', shape: 'line', name: 'bracket', from: [L, BASE + 6], to: [xN, BASE + 6], trimEnd: 0, at: T.reveal,
      initial: { strokeColor: RAIN, strokeWidth: 3 },
      keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.6, ease: 'power2.out' }] });
    S.push({ type: 'shape', shape: 'circle', name: 'cross-dot', radius: 4.5, at: T.label,
      initial: { x: xN, y: y50, fillColor: RAIN },
      keyframes: [{ at: 0, from: { scale: 0 }, to: { scale: 1 }, duration: 0.35, ease: 'power3.out' }] });

    // the annotation: "14日" right of the steep curve; the long tail gets its own quiet line
    S.push({ type: 'text', name: 'n-days', text: `${N}日`, at: T.label, duration: DURATION - T.label,
      style: { fontFamily: SANS, fontSize: 64, fontWeight: '700', fill: RAIN },
      initial: { x: xN + 72, y: y50 - 12, anchorY: 1 }, keyframes: [rise(0, 0.6)] });
    S.push({ type: 'text', name: 'rest-days', text: `残りの${365 - N}日で、もう半分。`, at: T.label + 0.625, duration: DURATION - T.label - 0.625,
      style: { fontFamily: SANS, fontSize: 24, fill: PAPER },
      initial: { alpha: 0.65, x: xN + 76, y: y50 + 22 }, keyframes: [rise(0)] });

    // ── text column ─────────────────────────────────────────────────────
    S.push({ type: 'text', name: 'kicker', text: 'ある都市の、1年間の雨', at: T.kicker, duration: DURATION - T.kicker,
      style: { fontFamily: SANS, fontSize: 17, fontWeight: '600', fill: SLATE, letterSpacing: 3 },
      initial: { x: L, y: 72 }, keyframes: [rise(0)] });
    S.push({ type: 'text', name: 'cap1', text: `365日、降った雨は合計 ${Math.round(TOTAL).toLocaleString('en-US')} mm。`, at: T.cap1, duration: T.cap2 - T.cap1,
      style: { fontFamily: SANS, fontSize: 32, fontWeight: '500', fill: PAPER },
      initial: { x: L, y: 112 }, keyframes: [rise(0), fadeOut(-0.3)] });
    S.push({ type: 'text', name: 'cap2', text: '雨の多かった日から順に、並べ替えてみる。', at: T.cap2, duration: T.head - 0.3 - T.cap2,
      style: { fontFamily: SANS, fontSize: 32, fontWeight: '500', fill: PAPER },
      initial: { x: L, y: 112 }, keyframes: [rise(0), fadeOut(-0.3)] });
    S.push({ type: 'text', name: 'headline', at: T.head, duration: DURATION - T.head,
      style: { fontFamily: SANS, fontSize: 50, fontWeight: '700', fill: PAPER, align: 'left', lineHeight: 66 },
      spans: ['1年分の雨の半分は、\nたった', { text: `${N}日`, fill: RAIN }, 'に降った。'],
      initial: { x: L, y: 104, anchorX: 0, anchorY: 0 }, keyframes: [rise(0, 0.6)] });

    // honest small print
    S.push({ type: 'text', name: 'fineprint', text: 'illustrative data · 架空の都市の架空のデータ', at: 0.3, duration: DURATION - 0.3,
      style: { fontFamily: MONO, fontSize: 13, fill: SLATE }, initial: { x: R, y: 668, anchorX: 1, anchorY: 1 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.6 }] });
    S.push({ type: 'text', name: 'legend', text: '1本 = 1日の降水量', at: 0.3, duration: DURATION - 0.3,
      style: { fontFamily: SANS, fontSize: 13, fill: SLATE }, initial: { x: L, y: 668, anchorY: 1 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.6 }] });

    // ── sound: a quiet tune on the same 96 bpm grid, two cues ────────────
    S.push({ type: 'audio', name: 'score', volume: 1.1,
      keyframes: [{ at: -1.5, to: { volume: 0 }, duration: 1.5 }],
      music: { bpm: 96, reverb: 0.4, tracks: [
        { inst: 'pad', vol: 0.45, notes: 'Fmaj7:4 Em7:4 Dm7:4 Am7:4 Fmaj7:5' },
        { inst: 'pluck', vol: 0.35, notes: '_:1 e5:0.5 c5:0.5 a4:1 _:1 _:1 d5:0.5 b4:0.5 g4:1 _:1 _:0.5 a4:0.5 c5:0.5 f5:0.5 e5:1 _:1 g5:0.5 _:0.5 e5:0.5 _:0.5 c5:2 a4:4' },
        { inst: 'bass', vol: 0.5, notes: 'f2:4 e2:4 d2:4 a1:4 f1:5' },
      ], drums: { from: 8, to: 16, shaker: 'o.o.o.o.o.o.o.o.' } } });
    S.push({ type: 'audio', name: 'sort-swoosh', sfx: { preset: 'swoosh', brightness: -0.4 }, at: T.sort - 0.1, volume: 0.8 });
    S.push({ type: 'audio', name: 'reveal-chime', sfx: { preset: 'chime', pitch: -5, brightness: -0.2 }, at: T.label, volume: 0.8 });

    const sequences = S;

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11.8,
        background: INK,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
