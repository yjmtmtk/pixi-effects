<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>間 MA — the space between</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #0e0d0b; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 8px; --pe-loader-bg: #0e0d0b; --pe-loader-color: #efe8da; --pe-loader-track: rgba(239, 232, 218, 0.16); background: #0e0d0b; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1920" height="1080"></canvas><div class="pe-loader" data-label="間"></div></div>

  <script type="application/json" id="piece-meta">
  { "title": "間 MA — the space between", "subtitle": "A 48-second kinetic essay about one word: a hairline of light becomes a gate, a corridor, a silence, a sun and a seal, cut to a score written as text", "tags": ["kinetic-typography", "2.5d", "japanese", "essay", "music", "silence", "title-sequence"], "width": 1920, "height": 1080, "duration": 48, "model": "opus" }
  </script>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/presenter":  "../../dist/Presenter.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie, animateText, measureText, wiggle, random, musicEnvelope, react, particles } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    // ─────────────────────────── frame, time, palette, type ───────────────────────────
    const W = 1920, H = 1080, FPS = 30, DURATION = 48;
    const BPM = 80, BEAT = 60 / BPM, BAR = 4 * BEAT;          // 0.75 s, 3 s
    const beat = n => n * BEAT;                                 // beat n from the top
    const F = (H / 2) / Math.tan(20 * Math.PI / 180);           // camera distance for 1:1 at fov 40 (1483.8)

    const INK = '#0e0d0b', DOOR = '#1c1a17', PAPER = '#efe8da', STONE = '#8c857a', VERMILION = '#e2432a', LIGHT = '#ffe9c4';
    const LIGHT_A = a => `rgba(255,233,196,${a})`;
    const VERM_A = a => `rgba(226,67,42,${a})`;

    const SERIF = { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: 54, fill: PAPER };
    const CAPS = { fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", fontSize: 15, fontWeight: '500', letterSpacing: 5, fill: STONE };
    const NUMERAL = { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: 24, fill: STONE };
    const KANJI = { fontFamily: "'Hiragino Mincho ProN', 'Yu Mincho', serif", fontWeight: '600', fontSize: 760 };
    const MARGIN = 120;

    // ─────────────────────────── the score (80 bpm, D minor → D major) ───────────────────────────
    const x8 = (n, k) => Array(k).fill(n + ':0.5').join(' ');
    const arp = (notes, k) => Array(k).fill(notes.map(n => n + ':0.25').join(' ')).join(' ');
    // A: bars 1–10 (0 – 29.25 s). The last beat of bar 10 is silence: the layer is cut there.
    const MUSIC_A = {
      bpm: BPM, reverb: 0.32, seed: 11,
      tracks: [
        { inst: 'pluck', vol: [[0, 1.1], [8, 0.62], [24, 0.7], [39, 1.0]], pan: -0.12, reverb: 0.55, tone: 0.62, notes:
          '_:1 d5:1.5 a4:0.5 bb4:1 | a4:2 g4:1 a4:1 | ' +
          'd4:0.5 a4:0.5 e5:1 _:0.5 a4:0.5 d5:1 | eb4:0.5 bb4:0.5 g5:1 _:0.5 bb4:0.5 d5:1 | ' +
          'g3:0.5 d4:0.5 a4:1 _:0.5 d4:0.5 bb4:1 | a3:0.5 e4:0.5 d5:1 _:0.5 e4:0.5 g4:1 | ' +
          'd4:0.5 a4:0.5 d5:0.5 f5:0.5 a4:0.5 d5:0.5 f5:0.5 a5:0.5 | eb4:0.5 bb4:0.5 eb5:0.5 g5:0.5 bb4:0.5 eb5:0.5 g5:0.5 bb5:0.5 | ' +
          arp(['g4', 'bb4', 'd5', 'g5'], 4) + ' | ' + arp(['a4', 'c#5', 'e5', 'a5'], 3) + ' _:1' },
        { inst: 'pad', attack: 1.6, release: 1.2, tone: 0.5, vol: [[0, 0], [4, 0.18], [8, 0.28], [24, 0.36], [39, 0.85]], notes:
          '_:4 | [d3 a3]:4 | [d3 a3 e4]:4 | [eb3 bb3 d4 g4]:4 | [g2 d3 bb3 f4 a4]:4 | [a2 e3 g3 d4]:4 | ' +
          '[d3 a3 f4]:4 | [eb3 bb3 g4]:4 | [g2 d3 bb3 g4]:4 | [a2 e3 g3 c#4]:3 _:1' },
        { inst: 'sub', vol: 0.3, notes: '_:8 | d2:4 | eb2:4 | g1:4 | a1:4 | _:16' },
        { inst: 'bass', vol: [[24, 0.6], [39, 1.05]], reverb: 0.05, notes: '_:24 | ' + x8('d2', 8) + ' | ' + x8('eb2', 8) + ' | ' + x8('g1', 8) + ' | ' + x8('a1', 6) + ' _:1' },
        { inst: 'bell', vol: 0.42, ring: 2.4, reverb: 0.7, notes: '_:10 a5:2 _:2 bb5:2 _:2 d6:2 _:20' },
      ],
      drumVol: 0.72,
      drums: [
        { from: 24, to: 32, kick: 'x.......x.......', rim: '............x...', shaker: 'o.o.o.o.o.o.o.o.' },
        { from: 32, to: 36, kick: 'x.....x.x.......', rim: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', shaker: 'o.o.o.o.o.o.o.o.' },
        { from: 36, to: 39, kick: 'x...x...x...', snare: 'o.o.oxoxxxxx', hat: 'xxxxxxxxxxxx' },
      ],
    };
    // B: bars 11–16 (30 – 48 s): the hit, the groove, the Picardy D major, the tail.
    const MUSIC_B = {
      bpm: BPM, reverb: 0.3, seed: 12,
      tracks: [
        { inst: 'pad', attack: 0.08, release: 2.5, tone: 0.55, vol: [[0, 0.66], [12, 0.6], [16, 0.42], [24, 0.28]], notes:
          '[d3 a3 e4 f4]:4 | [bb2 f3 a3 d4]:4 | [g2 d3 bb3 f4]:2 [a2 e3 g3 c#4]:2 | [eb3 bb3 d4 g4]:4 | [d3 a3 f#4 a4]:8' },
        { inst: 'lead', vol: 0.5, reverb: 0.45, notes:
          'd5:1.5 e5:0.5 f5:1 a5:1 | g5:0.5 f5:0.5 e5:1 d5:1 a4:1 | bb4:1 d5:1 c#5:1 e5:1 | d5:4 | _:8' },
        { inst: 'pluck', vol: 0.62, pan: 0.15, reverb: 0.4, notes:
          'd4:0.5 a4:0.5 e5:0.5 a4:0.5 f5:0.5 a4:0.5 e5:0.5 a4:0.5 | bb3:0.5 f4:0.5 a4:0.5 f4:0.5 d5:0.5 f4:0.5 a4:0.5 f4:0.5 | ' +
          'g3:0.5 d4:0.5 bb4:0.5 d4:0.5 a3:0.5 e4:0.5 c#5:0.5 e4:0.5 | eb4:1 bb4:1 d5:1 g5:1 | [d4 a4 d5 f#5]:4 | _:4' },
        { inst: 'bass', vol: 0.85, reverb: 0.05, notes: 'd2:1.5 d2:0.5 a1:1 d2:1 | bb1:1.5 bb1:0.5 f2:1 bb1:1 | g1:2 a1:2 | eb2:4 | d2:4 | _:4' },
        { inst: 'sub', vol: 0.9, notes: 'd2:3 _:21' },
        { inst: 'bell', vol: 0.5, ring: 2.8, reverb: 0.75, notes: '_:16 f#5:1 a5:1 d6:2 _:2 d6:2' },
      ],
      drums: [
        { from: 0, to: 4, crash: 'x...............' },
        { from: 0, to: 12, kick: 'x.........x.....', clap: '........x.......', hat: 'x.xox.xox.xox.xo', shaker: '.o.o.o.o.o.o.o.o' },
        { from: 11, to: 12, tom: 'x.xx' },
        { from: 12, to: 16, kick: 'x...............', shaker: 'o.o.o.o.o.o.o.o.' },
      ],
    };
    const B_AT = 30;                     // bar 11
    const SILENCE = beat(39);            // 29.25: the last beat of bar 10

    // ─────────────────────────── small builders ───────────────────────────
    const R = random(2026);
    const rect = (o) => ({ type: 'shape', shape: 'rect', ...o });
    const full = (fill, o = {}) => rect({ width: W, height: H, ...o, initial: { x: W / 2, y: H / 2, fillColor: fill, ...(o.initial || {}) } });
    const fullGrad = (name, fillGradient, o = {}) => rect({ name, width: W, height: H, ...o, initial: { x: W / 2, y: H / 2, ...(o.initial || {}) }, fillGradient });
    const P = pts => pts.map((p, i) => (i ? 'L ' : 'M ') + p[0] + ' ' + p[1]).join(' ');
    const circleD = (cx, cy, r) => {
      const k = 0.5523 * r;
      return `M ${cx} ${cy - r} C ${cx + k} ${cy - r} ${cx + r} ${cy - k} ${cx + r} ${cy} C ${cx + r} ${cy + k} ${cx + k} ${cy + r} ${cx} ${cy + r} ` +
             `C ${cx - k} ${cy + r} ${cx - r} ${cy + k} ${cx - r} ${cy} C ${cx - r} ${cy - k} ${cx - k} ${cy - r} ${cx} ${cy - r} Z`;
    };
    const fadeKF = (inAt, inDur, outAt, outDur, ease = 'sine.inOut') => [
      { at: inAt, from: { alpha: 0 }, to: { alpha: 1 }, duration: inDur, ease },
      ...(outAt != null ? [{ at: outAt, to: { alpha: 0 }, duration: outDur, ease }] : []),
    ];

    // an essay line: words rise out of a soft blur of time, then leave in the same wave
    const essay = (text, at, until, o = {}) => animateText(text, { ...SERIF, ...(o.style || {}) }, {
      by: 'words', x: o.x ?? MARGIN, y: o.y ?? 842, align: o.align ?? 'left', name: o.name ?? 'essay-' + Math.round(at * 100), at, duration: until - at,
      in: { from: { y: 26, alpha: 0 }, duration: 1.0, ease: 'power3.out' },
      out: { from: { y: -14, alpha: 0 }, duration: 0.6, ease: 'power2.in' },
      stagger: { each: 0.085 }, styleFor: o.styleFor,
    });

    // a chapter label: italic numeral, a hairline that draws, tracked caps
    const label = (num, word, at, until, color = STONE) => {
      const nw = measureText(num, NUMERAL).width;
      const x1 = MARGIN + nw + 16, x2 = x1 + 34, y = 104;
      const k = fadeKF(0, 0.6, until - at - 0.5, 0.5);
      return [
        { type: 'text', name: 'label-num-' + num, text: num, at, duration: until - at, style: { ...NUMERAL, fill: color },
          initial: { x: MARGIN, y, anchorY: 0.5 }, keyframes: [...k, { at: 0, from: { x: MARGIN - 12 }, to: { x: MARGIN }, duration: 0.8, ease: 'power3.out' }] },
        { type: 'shape', shape: 'line', name: 'label-rule-' + num, from: [x1, y + 1], to: [x2, y + 1], at: at + 0.15, duration: until - at - 0.15, trimEnd: 0,
          initial: { strokeColor: color, strokeWidth: 1.5 }, keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.7, ease: 'power3.inOut' }, { at: -0.5, to: { alpha: 0 }, duration: 0.5 }] },
        { type: 'text', name: 'label-word-' + num, text: word, at: at + 0.3, duration: until - at - 0.3, style: { ...CAPS, fill: color },
          initial: { x: x2 + 16, y: y + 1, anchorY: 0.5 }, keyframes: [...fadeKF(0, 0.6, until - at - 0.8, 0.5), { at: 0, from: { x: x2 + 30 }, to: { x: x2 + 16 }, duration: 0.9, ease: 'power3.out' }] },
      ];
    };

    // ─────────────────────────── the gate (a monoline 門, world units on the z = 0 plane) ───────────────────────────
    const G = { L: -60, R: 1980, T: -700, M: -430, BB: -160, IL: 860, IR: 1060, FOOT: 1160 };
    // one subpath per layer: a draw-on (trimEnd) over several subpaths in one path stops short of the later ones
    const GATE_PARTS = [
      P([[G.L, G.FOOT], [G.L, G.T], [G.IL, G.T], [G.IL, G.BB], [G.L, G.BB]]), P([[G.L, G.M], [G.IL, G.M]]),
      P([[1885, 1085], [G.R, G.FOOT], [G.R, G.T], [G.IR, G.T], [G.IR, G.BB], [G.R, G.BB]]), P([[G.R, G.M], [G.IR, G.M]]),
    ];
    const GOX = 230, GOY = 860, GW_ = 2500, GH_ = 2150;     // the card's local origin offset and size (margin for the glow)
    const shift = d => d.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, (_, a, b) => `${+a + GOX} ${+b + GOY}`);
    const gateStrokes = (draw, cardAt, cardEnd) => {
      const layers = [];
      for (const [w, a] of [[46, 0.05], [18, 0.14], [5, 1]]) {
        for (const [j, d] of GATE_PARTS.entries()) {
          const dr = draw && (j % 2 ? { at: draw.at + draw.duration * 0.45, duration: draw.duration * 0.55 } : draw);
          layers.push({ type: 'shape', shape: 'path', name: 'stroke', d: shift(d), strokeCap: w > 5 ? 'round' : 'square', strokeJoin: w > 5 ? 'round' : 'miter',
            ...(draw ? { trimEnd: 0 } : {}),
            initial: { strokeColor: LIGHT, strokeWidth: w, strokeAlpha: a },
            keyframes: [...(dr ? [{ at: dr.at, to: { trimEnd: 1 }, duration: dr.duration, ease: 'power2.inOut' }] : []),
              ...(w > 5 ? react(envA, { at: 18 - cardAt, duration: cardEnd - 18 - 0.05, audioOffset: 18, props: { alpha: { base: 0.55, amount: 0.9, beats: true, decay: 0.32 } } }) : [])] });
        }
      }
      return layers;
    };
    const gateCard = (name, z, at, duration, keyframes, draw) => ({
      type: 'composition', name, threeD: true, at, duration, width: GW_, height: GH_,
      initial: { x: -GOX + GW_ / 2, y: -GOY + GH_ / 2, z, pivotX: GW_ / 2, pivotY: GH_ / 2 },
      keyframes, sequences: gateStrokes(draw, at, at + duration),
    });

    // a door: a dark fusuma slab with a frame, a round finger-pull and a lit inner edge (a threeD card, hinged on its outer edge)
    const DOOR_W = 958, DOOR_H = 1240;
    const doorCard = (name, side, z, at, duration, keyframes = []) => {
      const left = side === 'left';
      const edge = left ? DOOR_W - 1 : 1;
      return {
        type: 'composition', name, threeD: true, at, duration, width: DOOR_W, height: DOOR_H,
        initial: { x: left ? 0 : W, y: H / 2, z, pivotX: left ? 0 : DOOR_W, pivotY: DOOR_H / 2 },
        keyframes,
        sequences: [
          rect({ name: 'slab', width: DOOR_W, height: DOOR_H, initial: { x: DOOR_W / 2, y: DOOR_H / 2 },
            fillGradient: { angle: 0, stops: left ? [[0, '#121110'], [0.8, DOOR], [1, '#26231f']] : [[0, '#26231f'], [0.2, DOOR], [1, '#121110']] } }),
          rect({ name: 'frame', width: DOOR_W - 240, height: DOOR_H - 240, initial: { x: DOOR_W / 2, y: DOOR_H / 2, strokeColor: STONE, strokeWidth: 2, strokeAlpha: 0.1 } }),
          rect({ name: 'rail', width: DOOR_W - 240, height: 2, initial: { x: DOOR_W / 2, y: DOOR_H * 0.3, fillColor: STONE, fillAlpha: 0.07 } }),
          { type: 'shape', shape: 'circle', name: 'pull', radius: 17, initial: { x: left ? DOOR_W - 110 : 110, y: DOOR_H / 2 + 40, strokeColor: STONE, strokeWidth: 2, strokeAlpha: 0.22, fillColor: '#0c0b0a', fillAlpha: 0.6 } },
          rect({ name: 'rim', width: 2, height: DOOR_H, initial: { x: edge, y: DOOR_H / 2, fillColor: LIGHT, fillAlpha: 0.38 } }),
        ],
      };
    };
    // the light in the gap (behind the doors) and its glow (in front of them)
    const gapLight = (name, z, at, duration, keyframes = []) => [
      rect({ name: name + '-line', threeD: true, at, duration, width: 4, height: DOOR_H, initial: { x: W / 2, y: H / 2, z: z - 2, fillColor: LIGHT }, keyframes }),
      { type: 'shape', shape: 'circle', name: name + '-glow', threeD: true, blendMode: 'add', at, duration, radius: 100,
        initial: { x: W / 2, y: H / 2, z: z + 2, scaleX: 0.9, scaleY: 7 }, fillGradient: { type: 'radial', stops: [[0, LIGHT_A(0.5)], [0.22, LIGHT_A(0.16)], [0.6, LIGHT_A(0.04)], [1, LIGHT_A(0)]] }, keyframes },
    ];

    // ─────────────────────────── the camera path (scene II pull-back, scene III rush) ───────────────────────────
    const ZC_BACK = 3600, Y_BACK = 230, X_BACK = W / 2 - 900;
    const PASS = [21, 24, 25.5, 27, 27.75, 28.5];                     // gate k leaves the frame on these beats
    const SPACING = 3000, PASS_DIST = 1700;
    const knots = [[18, ZC_BACK], ...PASS.map((t, k) => [t, -k * SPACING + PASS_DIST]), [SILENCE, -(PASS.length - 1) * SPACING + PASS_DIST - 1500]];
    const Z_STOP = knots[knots.length - 1][1], Z_DOORS = Z_STOP - F;
    // monotone cubic (Fritsch–Carlson) through the knots, flat at both ends
    const tangents = (() => {
      const n = knots.length, s = [], m = new Array(n).fill(0);
      for (let i = 0; i < n - 1; i++) s.push((knots[i + 1][1] - knots[i][1]) / (knots[i + 1][0] - knots[i][0]));
      for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : (s[i - 1] + s[i]) / 2;
      for (let i = 0; i < n - 1; i++) {
        if (s[i] === 0) { m[i] = m[i + 1] = 0; continue; }
        const a = m[i] / s[i], b = m[i + 1] / s[i], h = a * a + b * b;
        if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * s[i]; m[i + 1] = t * b * s[i]; }
      }
      return m;
    })();
    const rush = t => {
      let i = 0;
      while (i < knots.length - 2 && t > knots[i + 1][0]) i++;
      const [t0, z0] = knots[i], [t1, z1] = knots[i + 1], h = t1 - t0, u = Math.min(1, Math.max(0, (t - t0) / h));
      const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
      return h00 * z0 + h10 * h * tangents[i] + h01 * z1 + h11 * h * tangents[i + 1];
    };
    const inout2 = u => (u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2);
    const camZ = t => (t <= 17 ? F + (ZC_BACK - F) * inout2(Math.min(1, Math.max(0, (t - 6) / 11))) : t <= 18 ? ZC_BACK : rush(t));

    const CAM_A_AT = 6, CAM_A_END = SILENCE;
    const camKeys = [
      { at: 0, to: { z: ZC_BACK, lookAtZ: ZC_BACK - F, y: Y_BACK, lookAtY: Y_BACK, x: X_BACK, lookAtX: X_BACK }, duration: 11, ease: 'power2.inOut' },
      { at: 11.4, to: { y: 380, lookAtY: 380, x: W / 2, lookAtX: W / 2 }, duration: 3.2, ease: 'sine.inOut' },
      { at: 21.4, to: { y: H / 2, lookAtY: H / 2 }, duration: SILENCE - 27.4, ease: 'power2.inOut' },
      ...wiggle({ at: 0.5, duration: 11, freq: 0.5, seed: 4, props: { fov: { around: 40, amp: 0.35 } } }),
    ];
    for (let f = Math.round(18 * FPS); f < Math.round(CAM_A_END * FPS); f++) {
      const t = (f + 1) / FPS;
      camKeys.push({ at: f / FPS - CAM_A_AT, to: { z: camZ(t), lookAtZ: camZ(t) - F }, duration: 1 / FPS, ease: 'none' });
    }
    // depth fog for a far gate: alpha from its distance to the camera, sampled
    const fog = (z, at, until) => {
      const k = [];
      const a = t => Math.max(0, Math.min(1, (14000 - (camZ(t) - z)) / 7000)) * Math.max(0, Math.min(1, (t - 18) / 1.6));
      for (let t = at; t < until - 1e-6; t += 0.2) k.push({ at: t - at, to: { alpha: a(Math.min(until, t + 0.2)) }, duration: 0.2, ease: 'none' });
      return [{ at: 0, set: { alpha: a(at) } }, ...k];
    };

    // a gate leaves the stack just before the camera reaches its plane (its strokes are long off screen by then)
    const gone = z => { let t = 18; while (t < CAM_A_END && camZ(t) - z > 250) t += 1 / FPS; return Math.floor(t * FPS) / FPS; };

    // ─────────────────────────── audio envelopes (for react) ───────────────────────────
    const envA = await musicEnvelope(MUSIC_A, { frameRate: FPS });
    const envB = await musicEnvelope(MUSIC_B, { frameRate: FPS });

    // ═══════════════════════════ the film ═══════════════════════════
    const S = [];
    S.push(full(INK, { name: 'ink', duration: 31 }));

    // ── I · THE LINE (0 – 6) ─────────────────────────────────────────
    const LINE_AT = beat(1);
    S.push({ type: 'shape', shape: 'ellipse', name: 'line-ambient', blendMode: 'add', at: LINE_AT, duration: 6.6 - LINE_AT, radiusX: 560, radiusY: 560,
      initial: { x: W / 2, y: H / 2 }, fillGradient: { type: 'radial', stops: [[0, LIGHT_A(0.07)], [1, LIGHT_A(0)]] },
      keyframes: [...fadeKF(0, 2.5, 6.0 - LINE_AT, 0.6)] });

    const GRAIN_W = 2112, GRAIN_H = 1272;
    const grainSrc = (() => {
      const c = Object.assign(document.createElement('canvas'), { width: GRAIN_W, height: GRAIN_H });
      const g = c.getContext('2d'), img = g.createImageData(GRAIN_W, GRAIN_H), d = img.data, r = random(77);
      for (let i = 0; i < d.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
      g.putImageData(img, 0, 0);
      return c.toDataURL('image/jpeg', 0.9);
    })();
    const grain = (name, mode, alpha, at, until) => {
      const r = random(name.length * 13), k = [];
      for (let f = 0; f < Math.round((until - at) * FPS); f += 2) k.push({ at: f / FPS, set: { x: -48 - r() * 96, y: -48 - r() * 96 } });
      return { type: 'image', name, asset: 'grain', blendMode: mode, at, duration: until - at, initial: { x: -96, y: -96, alpha }, keyframes: k };
    };
    S.splice(S.findIndex(l => l.name === 'vignette'), 0, grain('grain-dark', 'screen', 0.045, 0, 30.4), grain('grain-paper', 'multiply', 0.065, 30, 46.6));

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage'), theme: { accent: VERMILION } });
    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 43.5, background: INK, assets: [{ name: 'grain', src: grainSrc }],
        composition: { sequences: S },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
