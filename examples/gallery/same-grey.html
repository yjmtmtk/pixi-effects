<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>same-grey</title>
  <script type="application/json" id="piece-meta">{ "title": "同じ灰色 — Same Grey", "subtitle": "One #808080 looks light, dark, graded, and then disappears: value is decided by the neighbour.", "tags": ["colour", "value", "albers", "illusion", "minimal", "music"], "width": 1080, "height": 1080, "duration": 14, "model": "opus" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #101010; margin: 0; padding: 16px; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; }
    .stage { position: relative; width: min(100%, calc(100vh - 32px)); max-width: 960px; }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie, kenBurns, withFade } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, sequences }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1080, H = 1080, FPS = 30, DURATION = 14;
    const BEAT = 0.5, BAR = 2;                      // 120 bpm: every act starts on a bar line
    const INK = '#141414', PAPER = '#ECEBE7', GREY = '#808080';
    const M = 90, SPLIT = 540, SQ = 240, CY = 540;   // 12 columns of 90 px
    const BAR_W = W - 2 * M, BAR_H = 120;            // the band of acts 3-5
    const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif';
    const T = { wipe: 0, left: 1, right: 2, ask: 2.5, lab1: 3, lab2: 3.5, fuse: 4, grad: 6, rot: 8, flat: 10, trace: 12, say: 12.4 };

    const caption = (name, text, x, anchorX, fill, extra = {}) => ({
      type: 'text', name, text, at: 0, duration: DURATION,
      style: { fontFamily: MONO, fontSize: 18, letterSpacing: 3, fill },
      initial: { x, y: M, anchorX, anchorY: 0, alpha: 0 }, ...extra,
    });

    const sequences = [
      // the fields: dark everywhere, the light half wipes in from the split
      { type: 'shape', name: 'dark', shape: 'rect', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: INK } },
      { type: 'shape', name: 'light', shape: 'rect', width: W - SPLIT, height: H, anchorX: 0,
        initial: { x: SPLIT, y: H / 2, fillColor: PAPER, scaleX: 0 },
        keyframes: [{ at: T.wipe, to: { scaleX: 1 }, duration: 0.8, ease: 'power3.inOut' }] },
      // FIG. 2: the hard split melts into a black -> white gradient (it starts as exactly the split), the gradient turns
      // half a circle (the band's light end and dark end swap; at 90 deg it vanishes for a moment), FIG. 3: it settles on the patch's own grey
      { type: 'shape', name: 'field', shape: 'rect', width: W, height: H, at: T.grad, duration: DURATION - T.grad,
        fillGradient: { angle: 0, stops: [[0, INK], [0.5, INK], [0.5, PAPER], [1, PAPER]] },
        initial: { x: W / 2, y: H / 2 },
        keyframes: [
          { at: 0, to: { fillGradient: { stops: [[0, INK], [0.5, GREY], [0.5, GREY], [1, PAPER]] } }, duration: 1.6, ease: 'sine.inOut' },
          { at: T.rot - T.grad, to: { fillGradient: { angle: 180 } }, duration: 1.6, ease: 'sine.inOut' },
          { at: T.flat - T.grad, to: { fillGradient: { stops: [[0, GREY], [0.5, GREY], [0.5, GREY], [1, GREY]] } }, duration: 1.6, ease: 'sine.inOut' },
        ] },

      // the two patches: the same #808080. Each widens toward the split and they fuse into one band.
      { type: 'shape', name: 'patchL', shape: 'rect', width: SQ, height: SQ, anchorX: 0, at: T.left, duration: DURATION - T.left,
        initial: { x: SPLIT / 2 - SQ / 2, y: CY, fillColor: GREY },
        keyframes: [
          { at: T.fuse - T.left, to: { width: SPLIT - (SPLIT / 2 - SQ / 2) }, duration: 1, ease: 'power3.inOut' },
          { at: T.grad - T.left, to: { x: M, width: SPLIT - M, height: BAR_H }, duration: 1, ease: 'power3.inOut' },
        ] },
      { type: 'shape', name: 'patchR', shape: 'rect', width: SQ, height: SQ, anchorX: 1, at: T.right, duration: DURATION - T.right,
        initial: { x: SPLIT + SPLIT / 2 + SQ / 2, y: CY, fillColor: GREY },
        keyframes: [
          { at: T.fuse - T.right, to: { width: SPLIT / 2 + SQ / 2 }, duration: 1, ease: 'power3.inOut' },
          { at: T.grad - T.right, to: { x: W - M, width: SPLIT - M, height: BAR_H }, duration: 1, ease: 'power3.inOut' },
        ] },

      // the labels: what the patches really are
      { type: 'text', name: 'labL', text: GREY.toUpperCase(), at: T.lab1, duration: T.fuse + 0.4 - T.lab1,
        style: { fontFamily: MONO, fontSize: 24, letterSpacing: 2, fill: PAPER, align: 'left' },
        initial: { x: SPLIT / 2 - SQ / 2, y: CY + SQ / 2 + 28, anchorX: 0, visibleChars: 0 },
        keyframes: [{ at: 0, to: { visibleChars: 7 }, duration: 0.3, ease: 'none' }, { at: -0.4, to: { alpha: 0 }, duration: 0.4 }] },
      { type: 'text', name: 'labR', text: GREY.toUpperCase(), at: T.lab2, duration: T.fuse + 0.4 - T.lab2,
        style: { fontFamily: MONO, fontSize: 24, letterSpacing: 2, fill: INK, align: 'left' },
        initial: { x: SPLIT + SPLIT / 2 - SQ / 2, y: CY + SQ / 2 + 28, anchorX: 0, visibleChars: 0 },
        keyframes: [{ at: 0, to: { visibleChars: 7 }, duration: 0.3, ease: 'none' }, { at: -0.4, to: { alpha: 0 }, duration: 0.4 }] },

      // corner captions, like a plate in a colour book
      caption('fig', 'FIG. 1', M, 0, PAPER, { keyframes: [
        { at: 1, to: { alpha: 0.75 }, duration: 0.4, ease: 'power2.out' },
        { at: T.grad, set: { text: 'FIG. 2' } },
        { at: T.rot, to: { alpha: 0 }, duration: 0.4, ease: 'power2.out' },          // the field turns under it: step aside
        { at: T.flat, set: { text: 'FIG. 3', fill: INK } },
        { at: T.flat + 1.2, to: { alpha: 0.75 }, duration: 0.4, ease: 'power2.out' },
      ] }),
      caption('what', 'SIMULTANEOUS CONTRAST', W - M, 1, INK, { keyframes: [
        { at: 1, to: { alpha: 0.75 }, duration: 0.4, ease: 'power2.out' },
        { at: T.grad, set: { text: 'ON A GRADIENT' } },
        { at: T.rot, to: { alpha: 0 }, duration: 0.4, ease: 'power2.out' },
        { at: T.flat, set: { text: 'ON ITSELF' } },
        { at: T.flat + 1.2, to: { alpha: 0.75 }, duration: 0.4, ease: 'power2.out' },
      ] }),

      // the question, then the answer
      { type: 'text', name: 'ask', text: 'どちらが明るい？', at: T.ask, duration: T.fuse + 0.5 - T.ask,
        style: { fontFamily: MINCHO, fontSize: 46, fill: PAPER },
        initial: { x: M, y: H - M - 46 * 1.4, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.4, ease: 'power2.out' }, { at: -0.5, to: { alpha: 0 }, duration: 0.5 }] },

      // FIG. 3: the band is still there; a hairline says where
      { type: 'shape', name: 'trace', shape: 'rect', width: BAR_W, height: BAR_H, at: T.trace, duration: DURATION - T.trace,
        trimEnd: 0,
        initial: { x: W / 2, y: CY, fillAlpha: 0, strokeColor: INK, strokeWidth: 2 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.9, ease: 'power2.inOut' }] },
      { type: 'text', name: 'labBand', text: GREY.toUpperCase(), at: T.trace + 0.6, duration: DURATION - T.trace - 0.6,
        style: { fontFamily: MONO, fontSize: 24, letterSpacing: 2, fill: INK, align: 'left' },
        initial: { x: M, y: CY + BAR_H / 2 + 24, anchorX: 0, visibleChars: 0 },
        keyframes: [{ at: 0, to: { visibleChars: 7 }, duration: 0.3, ease: 'none' }] },
      { type: 'text', name: 'say', text: '明るさは、となりで決まる。', at: T.say, duration: DURATION - T.say,
        style: { fontFamily: MINCHO, fontSize: 46, fill: INK },
        initial: { x: M, y: H - M - 46 * 1.4 - 40, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5, ease: 'power2.out' }] },
      { type: 'text', name: 'sayEn', text: 'VALUE IS DECIDED BY THE NEIGHBOUR', at: T.say + 0.3, duration: DURATION - T.say - 0.3,
        style: { fontFamily: MONO, fontSize: 18, letterSpacing: 3, fill: INK },
        initial: { x: M, y: H - M - 18, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.75 }, duration: 0.5, ease: 'power2.out' }] },

      // sound: a pad that changes around a constant G (the score's #808080); a bell plays that G whenever a grey appears
      { type: 'audio', name: 'score', at: 0, volume: 1.2, music: {
          bpm: 120, reverb: 0.35,
          tracks: [
            { inst: 'pad', vol: 0.7, attack: 0.4, release: 1.2,
              notes: '[c3 eb3 g3]:4 | [c4 e4 g4]:4 | [ab2 c3 eb3 g3]:4 | [eb3 bb3 d4 g4]:4 | [f3 a3 c4 g4]:4 | [g2 g3 g4]:4 | [g3 g4]:4' },
            { inst: 'bass', vol: 0.5, tone: 0.3, notes: 'c2:4 | c2:4 | ab1:4 | eb2:4 | f1:4 | g1:4 | g1:4' },
            { inst: 'bell', vol: 0.6, reverb: 0.6, notes: '_:2 g5:2 | g5:6 | g5:6 | g5:8 | g5:4' },
          ],
      } },
      { type: 'audio', name: 'wipe', sfx: { preset: 'swoosh', brightness: -0.4 }, at: T.wipe + 0.1, volume: 0.5 },
      { type: 'audio', name: 'tick1', sfx: { preset: 'typewriter' }, at: T.lab1, volume: 0.8 },
      { type: 'audio', name: 'tick2', sfx: { preset: 'typewriter', pitch: 0 }, at: T.lab2, volume: 0.8 },
      { type: 'audio', name: 'tick3', sfx: { preset: 'typewriter' }, at: T.trace + 0.6, volume: 0.8 },
    ];

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 7.6,        // the moment that stands for the video before it plays (pick your most striking one)
        background: '#141414',
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
