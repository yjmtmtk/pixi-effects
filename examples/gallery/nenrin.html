<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nenrin</title>
  <script type="application/json" id="piece-meta">{ "title": "年輪 nenrin", "subtitle": "A hundred springs, summers, autumns and winters, written into one tree as rings", "tags": ["nature", "japanese", "generative", "time-lapse", "music"], "width": 1080, "height": 1350, "duration": 13.2, "model": "opus" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #161513; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .stage { position: relative; width: min(94vw, calc((100vh - 32px) * 1080 / 1350)); }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1350"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, sequences }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1080, H = 1350, FPS = 30, DURATION = 13.2;

    // ── palette (brief.md: four colours) ──────────────────────────────
    const PAPER = '#EDE7DA', SUMI = '#2A2520', WOOD = '#B8955F', SHU = '#A8432F';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif';
    const NUM = 'Georgia, "Times New Roman", serif';

    // ── the clock: 100 bpm, a beat 0.6 s, a bar 2.4 s ─────────────────
    const BEAT = 0.6, BAR = 2.4;
    const YEARS = 100;
    const T_Y1 = BAR, T_Y2 = 2 * BAR, T_Y3 = 2 * BAR + 2 * BEAT, T_END = 4 * BAR;   // 2.4, 4.8, 6.0, 9.6

    // seeded randomness (never Math.random)
    function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const rnd = rng(31);

    // ── year schedule: year 1 = one bar, year 2 = half a bar, 3..100 accelerate into 9.6 s and land ──
    const yStart = [], yDur = [];
    yStart[1] = T_Y1; yDur[1] = BAR;
    yStart[2] = T_Y2; yDur[2] = BAR / 2;
    {
      const raw = [];
      for (let k = 3; k <= YEARS; k++) {
        const u = (k - 3) / (YEARS - 3);
        const land = 1 + 2.2 * Math.pow(Math.max(0, (u - 0.86) / 0.14), 2);   // the last years slow down a little
        raw[k] = Math.max(0.018, 0.9 * Math.pow(0.62, k - 2)) * land;
      }
      const sum = raw.slice(3).reduce((a, b) => a + b, 0);
      let t = T_Y3;
      for (let k = 3; k <= YEARS; k++) { yStart[k] = t; yDur[k] = raw[k] * (T_END - T_Y3) / sum; t += yDur[k]; }
    }

    // ── ring radii: wide young rings, thin old ones (real dendrology) ──
    const R0 = 5, RMAX = 335;
    const ringR = [R0];
    {
      const w = []; let s = 0;
      for (let k = 1; k <= YEARS; k++) { w[k] = (16 * Math.exp(-k / 18) + 1.8) * (0.8 + 0.4 * rnd()); s += w[k]; }
      let r = R0;
      for (let k = 1; k <= YEARS; k++) { r += w[k] * (RMAX - R0) / s; ringR[k] = r; }
    }

    // ── the outline of the trunk: lobed, slightly eccentric (the pith sits up-left) ──
    const CX = 612, CY = 640;                 // where the pith sits on the canvas
    const EX = 19, EY = 22;                   // how far the outer rings drift down-right of the pith at RMAX
    function contour(R, seed, jitter, startDeg = -90) {
      const n = Math.max(48, Math.min(220, Math.round(R * 0.5)));
      const r2 = rng(seed); const p1 = r2() * 6.28, p2 = r2() * 6.28;
      const k = R / RMAX, pts = [];
      for (let i = 0; i <= n; i++) {
        const th = (startDeg * Math.PI / 180) + (i / n) * Math.PI * 2;
        const lobe = 1 + 0.032 * Math.sin(2 * th + 0.7) + 0.02 * Math.sin(3 * th + 2.1) + 0.011 * Math.sin(5 * th + 0.3);
        const j = 1 + jitter * (0.6 * Math.sin(7 * th + p1) + 0.4 * Math.sin(12 * th + p2));
        const r = R * lobe * j;
        pts.push([(EX * k + r * Math.cos(th)).toFixed(1), (EY * k + r * Math.sin(th)).toFixed(1)]);
      }
      return 'M ' + pts.map(p => p.join(' ')).join(' L ') + ' Z';
    }

    // ── camera: the section is a null at the pith; we start close and pull back as the years run ──
    const Z0 = 8.6, Z1 = 8.0;                       // year 1 is seen 8x close
    const S1 = ringR[1] * Z1, SF = 0.0;            // screen radius of the edge at 4.8 s; at 9.6 s zoom is exactly 1
    const zoomKeys = [{ at: 0, to: { scale: Z1 }, duration: T_Y2, ease: 'sine.inOut' }];
    {
      const sineInOut = u => -(Math.cos(Math.PI * u) - 1) / 2;
      let prevT = T_Y2;
      for (let k = 3; k <= YEARS + 1; k++) {
        const t = k <= YEARS ? yStart[k] : T_END;
        const u = (t - T_Y2) / (T_END - T_Y2);
        const S = S1 + (RMAX - S1) * sineInOut(u);
        const z = S / ringR[k - 1];
        zoomKeys.push({ at: prevT, to: { scale: z }, duration: t - prevT, ease: 'none' });
        prevT = t;
      }
    }

    // ── the growing cut face: one outline at RMAX scaled from the pith (a nested null) ──
    const faceKeys = [];
    for (let k = 1; k <= YEARS; k++) {
      faceKeys.push({ at: yStart[k], to: { scale: ringR[k] / RMAX }, duration: yDur[k] * (k <= 2 ? 0.5 : 0.7), ease: k <= 2 ? 'sine.inOut' : 'none' });
    }
    const rays = [];
    for (let i = 0; i < 64; i++) {
      const th = (i / 64) * Math.PI * 2 + rnd() * 0.05;
      const a = 0.08 + rnd() * 0.5, b = 0.92 + rnd() * 0.06;
      rays.push(`M ${(EX * a + RMAX * a * Math.cos(th)).toFixed(1)} ${(EY * a + RMAX * a * Math.sin(th)).toFixed(1)} L ${(EX * b + RMAX * b * Math.cos(th)).toFixed(1)} ${(EY * b + RMAX * b * Math.sin(th)).toFixed(1)}`);
    }

    // ── the rings: drawn on in their autumn, red while they are this year's, then ink ──
    const rings = [];
    for (let k = 1; k <= YEARS; k++) {
      const draw0 = yStart[k] + yDur[k] * 0.5, drawD = Math.max(1 / FPS, yDur[k] * 0.25);
      const settle = k <= 2 ? yStart[k] + yDur[k] : draw0 + drawD;       // year 1, 2: stay red through their winter
      const dark = (k % 9 === 4 || k % 13 === 7);                            // a few hard years leave a darker line
      const alpha = dark ? 0.7 : (k < 40 ? 0.38 : 0.22) + rnd() * 0.2;
      const width = (k <= 3 ? 0.6 : dark ? 1.4 : (k < 40 ? 0.7 : 0.55) + rnd() * 0.45);
      rings.push({
        type: 'shape', shape: 'path', name: `ring${k}`, parent: 'section', at: draw0, duration: DURATION - draw0,
        d: contour(ringR[k], 100 + k, Math.min(0.012, 0.3 * (ringR[k] - ringR[k - 1]) / ringR[k]) * (0.5 + 0.5 * rnd()), -90 + (rnd() - 0.5) * 40),
        trimEnd: 0, strokeCap: 'round', strokeJoin: 'round',
        initial: { strokeColor: SHU, strokeWidth: width, strokeAlpha: 0.95 },
        keyframes: [
          { at: 0, to: { trimEnd: 1 }, duration: drawD, ease: k <= 2 ? 'power2.inOut' : 'none' },
          { at: settle - draw0, to: { strokeColor: SUMI, strokeAlpha: alpha }, duration: k <= 2 ? 0.5 : 0.45, ease: 'sine.out' },
        ],
      });
    }

    // ── seasons: 春 夏 秋 冬, the season that is now lights red (years 1-4), then they blur together ──
    const SEASONS = ['春', '夏', '秋', '冬'];
    const SEASON_X = 150, SEASON_Y0 = 560, SEASON_STEP = 72;
    const LAST_STEPPED = 4;
    const tBlur = yStart[LAST_STEPPED + 1];
    const seasonLayers = [];
    SEASONS.forEach((ch, s) => {
      const y = SEASON_Y0 + s * SEASON_STEP;
      const style = { fontFamily: MINCHO, fontSize: 44, fill: SUMI };
      seasonLayers.push({
        type: 'text', name: `season${s}`, text: ch, at: 0.6, duration: DURATION - 0.6, style,
        initial: { x: SEASON_X, y, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [
          { at: 0.2 + s * 0.12, to: { alpha: 0.22 }, duration: 0.9, ease: 'power3.out' },
          { at: tBlur - 0.6, to: { alpha: 0.55 }, duration: 0.4, ease: 'sine.out' },
          { at: T_END - 0.6, to: { alpha: 0.18 }, duration: 1.2, ease: 'sine.inOut' },
        ],
      });
      const lit = [];
      for (let k = 1; k <= LAST_STEPPED; k++) {
        const t = yStart[k] + s * yDur[k] / 4, d = yDur[k] / 4;
        lit.push({ at: t, to: { alpha: 1 }, duration: Math.min(0.12, d * 0.4), ease: 'power2.out' });
        lit.push({ at: t + d, to: { alpha: 0 }, duration: Math.min(0.25, d * 0.6), ease: 'sine.out' });
      }
      seasonLayers.push({
        type: 'text', name: `seasonLit${s}`, text: ch, style: { ...style, fill: SHU },
        initial: { x: SEASON_X, y, anchorX: 0.5, anchorY: 0.5, alpha: 0 }, keyframes: lit,
      });
    });

    // ── the age counter, bottom left ──
    const ageKeys = [];
    for (let k = 2; k <= YEARS; k++) ageKeys.push({ at: yStart[k] - 2.0, set: { value: k } });
    const counter = [
      { type: 'text', name: 'ageLabel', text: '樹齢', at: 2.0, duration: DURATION - 2.0,
        style: { fontFamily: MINCHO, fontSize: 22, fill: SUMI, letterSpacing: 6 },
        initial: { x: 96, y: 1112, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.6 }, duration: 0.9, ease: 'power3.out' }] },
      { type: 'text', name: 'age', text: '{value}', at: 2.0, duration: DURATION - 2.0,
        style: { fontFamily: NUM, fontSize: 76, fill: SUMI },
        initial: { x: 262, y: 1146, anchorX: 1, value: 1, alpha: 0 }, format: { decimals: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.9, ease: 'power3.out' }, ...ageKeys] },
      { type: 'text', name: 'ageUnit', text: '年', at: 2.0, duration: DURATION - 2.0,
        style: { fontFamily: MINCHO, fontSize: 28, fill: SUMI },
        initial: { x: 274, y: 1190, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.8 }, duration: 0.9, ease: 'power3.out' }] },
    ];

    // ── the end: bark closes the section, then the title (vertical) and one line ──
    // bark: an engraved band of short radial strokes, swept on round the trunk (trimEnd walks the sub-paths in order)
    function edgePoint(R, th) {
      const lobe = 1 + 0.032 * Math.sin(2 * th + 0.7) + 0.02 * Math.sin(3 * th + 2.1) + 0.011 * Math.sin(5 * th + 0.3);
      const k = R / RMAX;
      return [EX * k + R * lobe * Math.cos(th), EY * k + R * lobe * Math.sin(th), lobe];
    }
    const barkRnd = rng(77), ticks = [];
    const N_TICKS = 1600;
    for (let i = 0; i < N_TICKS; i++) {
      const th = -Math.PI / 3 + (i / N_TICKS) * Math.PI * 2 + (barkRnd() - 0.5) * 0.012;
      const thick = 8.5 + 3 * Math.sin(3 * th + 1.3) + 1.6 * Math.sin(11 * th + 0.4) + 0.6 * Math.sin(29 * th) + barkRnd() * 1.4;
      const [x0, y0] = edgePoint(RMAX + 3, th), [x1, y1] = edgePoint(RMAX + 3 + thick, th);
      ticks.push(`M ${x0.toFixed(1)} ${y0.toFixed(1)} L ${x1.toFixed(1)} ${y1.toFixed(1)}`);
    }
    const bark = [
      { type: 'shape', shape: 'path', name: 'cambium', parent: 'section', at: T_END, duration: DURATION - T_END,
        d: contour(RMAX + 2, 7, 0.002, -60), trimEnd: 0, strokeCap: 'round', strokeJoin: 'round',
        initial: { strokeColor: SUMI, strokeWidth: 1.6, strokeAlpha: 0 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1.3, ease: 'power2.inOut' }, { at: 0, to: { strokeAlpha: 0.8 }, duration: 0.15 }] },
      { type: 'shape', shape: 'path', name: 'bark', parent: 'section', at: T_END, duration: DURATION - T_END,
        d: ticks.join(' '), trimEnd: 0, strokeCap: 'round',
        initial: { strokeColor: SUMI, strokeWidth: 1.9, strokeAlpha: 0.78 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1.3, ease: 'power2.inOut' }] },
    ];
    const TITLE_X = 150, TITLE_Y = 150, TITLE_SIZE = 112;
    const title = ['年', '輪'].map((ch, i) => ({
      type: 'text', name: `title${i}`, text: ch, at: T_END + 0.3 + i * 0.25, duration: DURATION - (T_END + 0.3 + i * 0.25),
      style: { fontFamily: MINCHO, fontSize: TITLE_SIZE, fill: SUMI },
      initial: { x: TITLE_X, y: TITLE_Y + i * (TITLE_SIZE + 18), anchorX: 0.5, anchorY: 0, alpha: 0 },
      keyframes: [{ at: 0, from: { y: TITLE_Y + i * (TITLE_SIZE + 18) + 16 }, to: { y: TITLE_Y + i * (TITLE_SIZE + 18), alpha: 1 }, duration: 1.1, ease: 'power3.out' }],
    }));
    const caption = {
      type: 'text', name: 'caption', text: '百の春夏秋冬を、一本の木は覚えている。', at: T_END + 1.1, duration: DURATION - T_END - 1.1,
      style: { fontFamily: MINCHO, fontSize: 26, fill: SUMI, letterSpacing: 5 },
      initial: { x: 984, y: 1204, anchorX: 1, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 0.85 }, duration: 1.2, ease: 'power3.out' }],
    };

    // ── sound: a musicbox on the seasons of year 1, a pad, a pluck that runs with the years, one held chord ──
    const music = {
      type: 'audio', name: 'music', at: 0, volume: 1.1, music: {
        bpm: 100, reverb: 0.42,
        tracks: [
          { inst: 'pad', vol: [[0, 0.2], [4, 0.6], [16, 0.75], [22, 0.6]], attack: 1.2, release: 2, notes: 'Dmaj9:4 | Bm9:4 | Gmaj7:2 Em9:2 | Gmaj9:2 A7sus4:2 | Dmaj9:6' },
          { inst: 'bass', vol: 0.45, tone: 0.3, notes: 'd2:4 | b1:4 | g1:2 e2:2 | g1:2 a1:2 | d2:6' },
          { inst: 'musicbox', vol: 0.75, ring: 1.6, reverb: 0.7, notes: '_:2 a4:1 d5:1 | a5:1 f#5:1 e5:1 d5:1 | a5:0.5 f#5:0.5 e5:0.5 d5:0.5 _:2 | _:4 | _:6' },
          { inst: 'pluck', vol: [[10, 0.15], [15, 0.55], [16, 0.0]], step: 0.25, reverb: 0.5,
            notes: '_:10 b4 d5 g5 d5 b4 d5 f#5 d5 | e4 g4 b4 g4 e4 g4 d5 b4 | g4 b4 d5 b4 a4 c#5 e5 c#5 | _:6' },
          { inst: 'bell', vol: 0.55, ring: 3, reverb: 0.8, notes: '_:16 [d5 a5 f#6]:6' },
        ],
      },
    };

    const sequences = [
      { type: 'shape', shape: 'rect', name: 'paper', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: PAPER } },
      { type: 'null', name: 'section', initial: { x: CX, y: CY, scale: Z0 }, keyframes: zoomKeys },
      { type: 'null', name: 'faceRig', parent: 'section', initial: { x: 0, y: 0, scale: R0 / RMAX }, keyframes: faceKeys },
      { type: 'shape', shape: 'path', name: 'face', parent: 'faceRig', at: 0.6, duration: DURATION - 0.6, d: contour(RMAX, 1, 0),
        initial: { fillColor: WOOD, fillAlpha: 0, strokeColor: WOOD, strokeWidth: 3, strokeAlpha: 0 },
        keyframes: [{ at: 0, to: { fillAlpha: 0.3, strokeAlpha: 0.5 }, duration: 1.2, ease: 'sine.out' }] },
      { type: 'shape', shape: 'path', name: 'rays', parent: 'faceRig', at: T_Y3, duration: DURATION - T_Y3, d: rays.join(' '),
        initial: { strokeColor: SUMI, strokeWidth: 0.8, strokeAlpha: 0 },
        keyframes: [{ at: 0, to: { strokeAlpha: 0.07 }, duration: 3, ease: 'sine.inOut' }] },
      ...rings,
      { type: 'shape', shape: 'path', name: 'pith', parent: 'section', at: 0.6, duration: DURATION - 0.6, d: contour(R0 * 0.45, 3, 0.05),
        initial: { fillColor: SUMI, fillAlpha: 0 },
        keyframes: [{ at: 0, to: { fillAlpha: 0.85 }, duration: 1.0, ease: 'sine.out' }] },
      ...bark,
      ...seasonLayers,
      ...counter,
      ...title,
      caption,
      music,
    ];
    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 12.2,
        background: PAPER,
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
