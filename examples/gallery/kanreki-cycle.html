<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kanreki-cycle</title>
  <script type="application/json" id="piece-meta">{ "title": "還暦 — Kanreki", "subtitle": "A 60th-birthday greeting: one vermilion line travels the sixty-year calendar from 丙午 1966 back to 丙午 2026", "tags": ["celebration", "birthday", "japanese", "typography", "music"], "width": 1280, "height": 720, "duration": 12.5, "model": "opus" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #111214; margin: 0; padding: 16px; }
    .stage { position: relative; width: min(960px, 100%); }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, sequences }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1280, H = 720, FPS = 30, DURATION = 12.5;
    const BEAT = 60 / 96, BAR = 4 * BEAT;                    // 96 bpm: a bar is 2.5 s

    // palette (brief.md): four colours
    const INK = '#15171c', PAPER = '#ece4d4', SHU = '#d0462c', GOLD = '#a8925f';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif';
    const SERIF = 'Georgia, "Times New Roman", serif';

    // the ring
    const CX = 430, CY = 360, START_X = 640, R_LABEL = 262, R_LINE = 240, R_DECADE = 200;
    const SWEEP_AT = BAR, SWEEP = 2 * BAR, CLOSE = SWEEP_AT + SWEEP;   // 2.5 -> 7.5 s
    const STEMS = '甲乙丙丁戊己庚辛壬癸', BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
    const BIRTH = 42;                                         // 丙午 = index 42 of the sixty (1966, 2026)
    const BIRTH_YEAR = 1966;

    // sine.inOut maps time to progress; its inverse tells when the line passes year k
    const passAt = k => SWEEP_AT + SWEEP * Math.acos(1 - 2 * (k / 60)) / Math.PI;
    const angleOf = k => -90 + k * 6;                         // 丙午 at twelve o'clock, clockwise
    const polar = (r, k) => { const a = angleOf(k) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };   // from the ring's centre (the null 'ring')

    const nameOf = k => { const i = (BIRTH + k) % 60; return STEMS[i % 10] + BRANCHES[i % 12]; };
    const labels = [];
    for (let k = 0; k < 60; k++) {
      const i = (BIRTH + k) % 60;
      const [x, y] = polar(R_LABEL, k);
      const isBirth = k === 0;
      const appear = 0.3 + k * 0.022;                         // the names arrive clockwise from 丙午
      labels.push({
        type: 'text', name: 'name' + k, parent: 'ring', text: STEMS[i % 10] + '\n' + BRANCHES[i % 12], at: 0, duration: DURATION,
        style: { fontFamily: MINCHO, fontSize: 14, lineHeight: 16, fill: isBirth ? SHU : PAPER, align: 'center' },
        initial: { x, y, anchorX: 0.5, anchorY: 0.5, rotation: angleOf(k) + 90, alpha: 0 },
        keyframes: isBirth
          ? [{ at: 0.2, to: { alpha: 1 }, duration: 0.8, ease: 'power2.out' }]
          : [{ at: appear, to: { alpha: 0.34 }, duration: 0.6, ease: 'power2.out' },
             { at: passAt(k), to: { alpha: 1 }, duration: 0.25, ease: 'power2.out' },
             { at: CLOSE + 0.3, to: { alpha: 0.42 }, duration: 1.2, ease: 'power2.inOut' }],
      });
    }

    // decade numerals inside the line: they appear as the line reaches them
    const decades = [], clicks = [];
    for (let k = 10; k < 60; k += 10) {
      const [x, y] = polar(R_DECADE, k);
      decades.push({
        type: 'text', name: 'decade' + k, parent: 'ring', text: String(BIRTH_YEAR + k), at: 0, duration: DURATION,
        style: { fontFamily: SERIF, fontSize: 11, letterSpacing: 1.5, fill: GOLD },
        initial: { x, y, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: passAt(k), to: { alpha: 0.9 }, duration: 0.3, ease: 'power2.out' }],
      });
      clicks.push({ type: 'audio', sfx: { preset: 'click', pitch: -7, brightness: -0.4 }, at: passAt(k), volume: 0.5 });
    }

    const sweepKey = (prop, from, to) => ({ at: SWEEP_AT, from: { [prop]: from }, to: { [prop]: to }, duration: SWEEP, ease: 'sine.inOut' });

    const ring = [
      // the whole dial: centred while the years pass, then it steps aside for the greeting
      { type: 'null', name: 'ring', initial: { x: START_X, y: CY },
        keyframes: [{ at: CLOSE + 0.1, to: { x: CX }, duration: 1.0, ease: 'power3.inOut' }] },
      // the hairline track the line will travel on
      { type: 'shape', name: 'track', parent: 'ring', shape: 'circle', radius: R_LINE,
        initial: { x: 0, y: 0, strokeColor: GOLD, strokeWidth: 1, strokeAlpha: 0.45, alpha: 0 },
        keyframes: [{ at: 0.2, to: { alpha: 1 }, duration: 1.2, ease: 'power2.out' }] },
      // the vermilion line: sixty years
      { type: 'shape', name: 'line', parent: 'ring', shape: 'arc', radius: R_LINE + 2, innerRadius: R_LINE - 2, startAngle: -90, endAngle: -90,
        initial: { x: 0, y: 0, fillColor: SHU },
        keyframes: [sweepKey('endAngle', -90, 270)] },
      // its head
      { type: 'null', name: 'hand', parent: 'ring', initial: { x: 0, y: 0, rotation: 0 }, keyframes: [sweepKey('rotation', 0, 360)] },
      { type: 'shape', name: 'head', shape: 'circle', radius: 5, parent: 'hand',
        initial: { x: 0, y: -R_LINE, fillColor: SHU, alpha: 0 },
        keyframes: [{ at: 0.6, to: { alpha: 1 }, duration: 0.6 }, { at: CLOSE + 0.2, to: { alpha: 0 }, duration: 0.6 }] },
      // the closure: one hairline ripple runs inward from the completed line, into the empty centre (never across the names)
      { type: 'shape', name: 'ripple', parent: 'ring', shape: 'circle', radius: R_LINE, at: CLOSE, duration: 1.4,
        initial: { x: 0, y: 0, strokeColor: SHU, strokeWidth: 1.5, alpha: 0 },
        keyframes: [{ at: 0, from: { scale: 0.985, alpha: 0.9 }, to: { scale: 0.62, alpha: 0 }, duration: 1.4, ease: 'power2.out' }] },
      ...labels,
      ...decades,
    ];

    // centre: the year counts with the line, then gives way to the name of the year
    const centre = [
      { type: 'text', name: 'year', parent: 'ring', text: '{value}', at: 0, duration: CLOSE + 0.8,
        style: { fontFamily: SERIF, fontSize: 64, fill: PAPER, letterSpacing: 2 },
        initial: { x: 0, y: -8, anchorX: 0.5, anchorY: 0.5, value: BIRTH_YEAR, alpha: 0 },
        keyframes: [{ at: 0.6, to: { alpha: 1 }, duration: 0.9, ease: 'power2.out' },
                    sweepKey('value', BIRTH_YEAR, BIRTH_YEAR + 60),
                    { at: CLOSE + 0.2, to: { alpha: 0 }, duration: 0.5, ease: 'power2.in' }] },
      // under the year, the year's own name in the sixty: 丙午, 丁未, 戊申 ... and 丙午 again
      { type: 'text', name: 'yearName', parent: 'ring', text: nameOf(0), at: 0, duration: CLOSE + 0.8,
        style: { fontFamily: MINCHO, fontSize: 15, fill: GOLD, letterSpacing: 6 },
        initial: { x: 3, y: 50, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0.9, to: { alpha: 1 }, duration: 0.9, ease: 'power2.out' },
                    ...Array.from({ length: 60 }, (_, k) => ({ at: passAt(k + 0.5), set: { text: nameOf((k + 1) % 60) } })),
                    { at: CLOSE + 0.2, to: { alpha: 0 }, duration: 0.5, ease: 'power2.in' }] },
      { type: 'text', name: 'eto', parent: 'ring', text: '丙午', at: CLOSE + 0.5, duration: DURATION - CLOSE - 0.5,
        style: { fontFamily: MINCHO, fontSize: 72, fill: PAPER, letterSpacing: 6 },
        initial: { x: 0, y: -10, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 4 }, to: { alpha: 1, y: -10 }, duration: 0.9, ease: 'power3.out' }] },
      { type: 'text', name: 'etoYears', parent: 'ring', text: '1966  —  2026', at: CLOSE + 0.9, duration: DURATION - CLOSE - 0.9,
        style: { fontFamily: SERIF, fontSize: 13, fill: GOLD, letterSpacing: 3 },
        initial: { x: 0, y: 48, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.8, ease: 'power2.out' }] },
    ];

    // right column: the greeting arrives only once the calendar has come round
    const COL = 800;
    const rise = (y, dy = 16) => [{ at: 0, from: { alpha: 0, y: y + dy }, to: { alpha: 1, y }, duration: 0.9, ease: 'power3.out' }];
    const column = [
      { type: 'text', name: 'kicker', text: 'KANREKI  ·  THE SIXTIETH YEAR', at: CLOSE + 2 * BEAT, duration: DURATION - CLOSE - 2 * BEAT,
        style: { fontFamily: SERIF, fontSize: 12, letterSpacing: 4, fill: GOLD },
        initial: { x: COL, y: 214 },
        keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 1.0, ease: 'power2.out' }] },
      { type: 'text', name: 'title', text: '還暦', at: CLOSE + 2 * BEAT, duration: DURATION - CLOSE - 2 * BEAT,
        style: { fontFamily: MINCHO, fontSize: 150, fill: PAPER, letterSpacing: 8 },
        initial: { x: COL - 6, y: 236 }, keyframes: rise(236, 20) },
      { type: 'text', name: 'greeting', text: 'おめでとうございます', at: CLOSE + 2.5 * BEAT, duration: DURATION - CLOSE - 2.5 * BEAT,
        style: { fontFamily: MINCHO, fontSize: 30, fill: PAPER, letterSpacing: 4 },
        initial: { x: COL, y: 418 }, keyframes: rise(418) },
      { type: 'shape', name: 'rule', shape: 'rect', width: 48, height: 1, at: CLOSE + 3 * BEAT, duration: DURATION - CLOSE - 3 * BEAT,
        initial: { x: COL + 24, y: 488, fillColor: SHU },
        keyframes: [{ at: 0, from: { scaleX: 0 }, to: { scaleX: 1 }, duration: 0.7, ease: 'power3.inOut' }] },
      { type: 'text', name: 'message', text: '六十年で、暦はひと巡り。\nふたたび丙午の春に、ありがとうを込めて。',
        at: CLOSE + 3.5 * BEAT, duration: DURATION - CLOSE - 3.5 * BEAT,
        style: { fontFamily: MINCHO, fontSize: 18, lineHeight: 34, fill: PAPER, align: 'left' },
        initial: { x: COL, y: 510, alpha: 0.85 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 522 }, to: { alpha: 0.85, y: 510 }, duration: 1.0, ease: 'power3.out' }] },
    ];

    // sound: a yo-scale koto line over a pad; a bell when the ring closes
    const music = {
      bpm: 96, reverb: 0.34, humanize: 0.008,
      tracks: [
        { inst: 'pad',   vol: 0.45, attack: 0.8, release: 2, notes: 'Gmaj7:4 | Bm7:4 | Em7:2 A7sus4:2 | Dadd9:4 | ~:4' },
        { inst: 'bass',  vol: 0.55, tone: 0.4, notes: 'g1:4 | b1:4 | e2:2 a1:2 | d2:4 | ~:4' },
        { inst: 'pluck', vol: 0.6, pan: -0.2, reverb: 0.5,
          notes: '_:1 d5:0.5 e5:0.5 g5:1 e5:1 | d5:0.5 b4:0.5 a4:1 b4:0.5 d5:0.5 e5:1 | g5:0.5 e5:0.5 d5:0.5 b4:0.5 a4:0.5 b4:0.5 d5:0.5 e5:0.5 | a5:2 _:2 | _:4' },
        { inst: 'bell',  vol: 0.5, pan: 0.2, ring: 2.5, notes: '_:12 | d6:1 a5:1 d6:1 e6:1 | [d6 a6]:4' },
      ],
    };
    const sound = [
      { type: 'audio', name: 'music', music, at: 0, volume: 1.3,
        keyframes: [{ at: -1.6, to: { volume: 0 }, duration: 1.6, ease: 'sine.in' }] },   // let the last bell die away with the picture held
      ...clicks,
      { type: 'audio', name: 'close', sfx: { preset: 'chime', pitch: -5, brightness: -0.3 }, at: CLOSE, volume: 0.7 },
    ];

    const sequences = [
      { type: 'shape', name: 'paper', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: INK } },
      ...ring,
      ...centre,
      ...column,
      ...sound,
    ];

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11,
        background: INK,
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
