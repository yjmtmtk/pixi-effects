<!DOCTYPE html>

<head>

  <title>escapement</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>

    .stage { position: relative; width: min(960px, 100%); }

  <script type="application/json" id="piece-meta">{ "title": "Escapement", "subtitle": "A watch movement seen from its heartbeat outward: five exact steps a second turn every wheel.", "tags": ["mechanism", "macro", "procedural", "shader", "music", "japanese"], "width": 1280, "height": 720, "duration": 12.8, "model": "opus" }</script>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 12.8;

    // ── palette (brief.md) ───────────────────────────────────────────
    const VOID = '#0c0e11', BRASS = '#c9a25b', STEEL = '#b8bfc6', RUBY = '#a3122f';
    const BRASS_STOPS = [[0, '#8f6c2f'], [0.22, '#d6b46c'], [0.42, '#a98340'], [0.62, '#dcbd78'], [0.8, '#b08944'], [0.93, '#e2c684'], [1, '#7e5e27']];
    const STEEL_STOPS = [[0, '#6f767d'], [0.3, '#d3d9de'], [0.55, '#8d949b'], [0.8, '#c9cfd4'], [1, '#5d636a']];
    const TAU = Math.PI * 2, DEG = 180 / Math.PI;

    // ── time: 150 bpm, one tick on every 8th note = 5 beats a second (18,000 vph) ──
    const BEAT = 0.4, STEP = BEAT / 2, T0 = 0.2;
    const TICKS = []; for (let t = T0; t < DURATION - 0.1; t += STEP) TICKS.push(+t.toFixed(3));

    // ── geometry helpers (world units = px at the final framing) ────
    const f = n => n.toFixed(2);
    const polar = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
    const toD = (pts) => 'M ' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join(' L ') + ' Z';
    function arcPts(r, a0, a1, n) { const out = []; for (let i = 0; i <= n; i++) out.push(polar(r, a0 + (a1 - a0) * i / n)); return out; }

    // a watch wheel / pinion: ogival teeth, a tooth centred on `phase` (degrees)
    function toothOutline(N, rp, m, phaseDeg) {
      const P = TAU / N, ra = rp + 1.15 * m, rr = rp - 1.35 * m, hw = 0.2 * P, ph = phaseDeg / DEG, pts = [];
      for (let i = 0; i < N; i++) {
        const th = ph + i * P;
        pts.push(...arcPts(rr, th - 0.5 * P, th - hw, 2));
        for (let s = 0; s <= 5; s++) { const q = s / 10 * Math.PI; pts.push(polar(rp + (ra - rp) * Math.sin(q), th - hw * Math.cos(q))); }
        for (let s = 4; s >= 0; s--) { const q = s / 10 * Math.PI; pts.push(polar(rp + (ra - rp) * Math.sin(q), th + hw * Math.cos(q))); }
        pts.push(...arcPts(rr, th + hw, th + 0.5 * P, 2).slice(0));
      }
      return pts;
    }
    // open crossings (cut-outs between straight spokes), each a sub-path
    function crossings(ri, rh, n, sw, phaseDeg) {
      let d = '';
      for (let k = 0; k < n; k++) {
        const a0 = phaseDeg / DEG + k * TAU / n, a1 = a0 + TAU / n;
        const dO = Math.asin(sw / ri), dI = Math.asin(Math.min(0.95, sw / rh));
        const outer = arcPts(ri, a0 + dO, a1 - dO, 10), inner = arcPts(rh, a1 - dI, a0 + dI, 4);
        d += ' ' + toD([...outer, ...inner]);
      }
      return d;
    }
    const wheelD = (N, rp, m, phaseDeg) => toD(toothOutline(N, rp, m, phaseDeg));
    const crossD = (rp, m, spokes, phaseDeg) => crossings(rp - 1.35 * m - Math.max(4, rp * 0.09), Math.max(9, rp * 0.2), spokes, Math.max(2.2, rp * 0.045), phaseDeg + 90 / spokes).trim();
    // club-tooth escape wheel (20 teeth), steel
    function escapeD(N, rTip, phaseDeg) {
      const P = TAU / N, rr = rTip * 0.78, pts = [], ph = phaseDeg / DEG;
      for (let i = 0; i < N; i++) {
        const b = ph + i * P;
        pts.push(polar(rr, b));
        pts.push(polar(rr + (rTip - rr) * 0.55, b + 0.18 * P));
        pts.push(polar(rTip, b + 0.36 * P));
        pts.push(polar(rTip - 1.2, b + 0.52 * P));
        pts.push(polar(rr + (rTip - rr) * 0.3, b + 0.6 * P));
        pts.push(...arcPts(rr, b + 0.7 * P, b + P, 2).slice(0, 2));
      }
      return toD(pts);
    }

    // ── the movement layout (world coordinates; plate centre M) ─────
    const M = [400, 400], PLATE_R = 300, MOD = 2.4;
    const at = (p, r, deg) => [p[0] + r * Math.cos(deg / DEG), p[1] + r * Math.sin(deg / DEG)];
    const dir = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) * DEG;
    const rpOf = n => MOD * n / 2;
    const AX = {};
    AX.C = { p: M, N: 72, n: 12 };
    AX.B = { p: at(M, rpOf(90) + rpOf(12), 180), N: 90 };
    AX.T = { p: at(M, rpOf(72) + rpOf(10), -50), N: 64, n: 10 };
    AX.F = { p: at(AX.T.p, rpOf(64) + rpOf(10), 10), N: 60, n: 10 };
    AX.E = { p: at(AX.F.p, rpOf(60) + rpOf(8), 100), n: 8, rTip: 46 };
    const BAL = [470, 580], BAL_R = 78;
    const FORK = (() => { const e = AX.E.p, d = Math.hypot(BAL[0] - e[0], BAL[1] - e[1]); return [e[0] + (BAL[0] - e[0]) * 58 / d, e[1] + (BAL[1] - e[1]) * 58 / d]; })();

    // degrees per tick (escape wheel 9° = half a tooth); each driven pinion turns against its wheel
    const RATE = { E: 9 };
    RATE.F = -RATE.E * AX.E.n / AX.F.N;
    RATE.T = -RATE.F * AX.F.n / AX.T.N;
    RATE.C = -RATE.T * AX.T.n / AX.C.N;
    RATE.B = -RATE.C * AX.C.n / AX.B.N;

    // phases so that every tooth meets a gap on the line of centres
    const PH = {
      Bw: dir(AX.B.p, AX.C.p),               Cp: dir(AX.C.p, AX.B.p) + 180 / AX.C.n,
      Cw: dir(AX.C.p, AX.T.p),               Tp: dir(AX.T.p, AX.C.p) + 180 / AX.T.n,
      Tw: dir(AX.T.p, AX.F.p),               Fp: dir(AX.F.p, AX.T.p) + 180 / AX.F.n,
      Fw: dir(AX.F.p, AX.E.p),               Ep: dir(AX.E.p, AX.F.p) + 180 / AX.E.n,
    };

    // a null that turns by `rate` degrees at every tick, in a sharp step
    function stepper(name, p, rate) {
      return { type: 'null', name, initial: { x: p[0], y: p[1], rotation: 0 },
        keyframes: TICKS.map((t, k) => ({ at: t, to: { rotation: +(rate * (k + 1)).toFixed(4) }, duration: 0.07, ease: 'power4.out' })) };
    }
    const brassFill = { type: 'radial', stops: BRASS_STOPS };
    const steelFill = { type: 'radial', stops: STEEL_STOPS };
    const darkSteelFill = { type: 'radial', stops: [[0, '#4a5057'], [0.35, '#9aa1a8'], [0.6, '#62686f'], [0.85, '#8e959c'], [1, '#3f454b']] };
    const darkBrassFill = { type: 'radial', stops: [[0, '#5e4519'], [0.3, '#9c7a3a'], [0.55, '#6f5424'], [0.8, '#a3823f'], [0.93, '#b8975a'], [1, '#4f3a14']] };
    // a part; `holes` (path data) are punched out with an inverted mask so the plate shows through
    const part = (name, parent, d, fill, stroke = '#3d2c10', sw = 0.7, holes = null) => ({ type: 'shape', shape: 'path', name, parent, d, fillGradient: fill, initial: { strokeColor: stroke, strokeWidth: sw },
      ...(holes ? { mask: { invert: true, layer: { type: 'shape', shape: 'path', d: holes, initial: { fillColor: '#ffffff' } } } } : {}) });
    // the lower plane is out of focus in the macro shot and sharpens as the camera pulls back
    const soft = (layer, strength) => ({ ...layer, filters: [{ type: 'blur', name: 'dof', strength }],
      keyframes: [{ at: 3.2, to: { 'filters.dof.strength': 0 }, duration: 3.4, ease: 'power2.inOut' }] });

    function jewel(name, p, r = 5.5) {
      return [
        { type: 'shape', shape: 'circle', name: name + '-chaton', radius: r, initial: { x: p[0], y: p[1], strokeColor: '#4b5056', strokeWidth: 0.8 }, fillGradient: steelFill },
        { type: 'shape', shape: 'circle', name: name + '-ruby', radius: r * 0.52, initial: { x: p[0], y: p[1], fillColor: RUBY } },
        { type: 'shape', shape: 'circle', name: name + '-glint', radius: r * 0.16, initial: { x: p[0] - r * 0.18, y: p[1] - r * 0.2, fillColor: '#ffffff', alpha: 0.75 } },
      ];
    }

    // Côtes de Genève as a striped linear gradient
    function genevaStops(n) {
      const s = [];
      for (let i = 0; i < n; i++) { const a = i / n, w = 1 / n; s.push([a, '#4f565d'], [a + w * 0.45, '#aab1b8'], [a + w * 0.62, '#767d84'], [Math.min(1, a + w * 0.98), '#474e55']); }
      return s;
    }

    // balance cock: a tapered arm from the plate rim to the balance staff
    function cockD() {
      const A0 = 36, A1 = 72, a0 = dir(BAL, at(M, PLATE_R, (A0 + A1) / 2));
      const head = arcPts(24, (a0 + 75) / DEG, (a0 + 285) / DEG, 18).map(q => [q[0] + BAL[0], q[1] + BAL[1]]);
      const rim = arcPts(PLATE_R - 3, A0 / DEG, A1 / DEG, 12).map(q => [q[0] + M[0], q[1] + M[1]]);
      return toD([...head, ...rim]);
    }

    // barrel bridge: the lower-left of the plate, an S-curved inner edge
    function bridgeD() {
      const rim = arcPts(PLATE_R - 3, 200 / DEG, 104 / DEG, 24).map(q => [q[0] + M[0], q[1] + M[1]]);
      const bez = (p0, p1, p2, n) => { const o = []; for (let i = 1; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]); } return o; };
      const s = rim[rim.length - 1];
      const edge = [...bez(s, [330, 600], [270, 562], 10), ...bez([270, 562], [200, 520], [186, 432], 10), ...bez([186, 432], [176, 330], rim[0], 8)];
      return toD([...rim, ...edge]);
    }

    // hairspring: an Archimedean spiral (open path)
    function spiralD(r0, r1, turns) {
      const pts = [], n = 260;
      for (let i = 0; i <= n; i++) { const u = i / n, a = u * turns * TAU; pts.push(polar(r0 + (r1 - r0) * u, a)); }
      return 'M ' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join(' L ');
    }

    // pallet fork (local to its pivot)
    function forkParts() {
      const e = AX.E.p, toE = dir(FORK, e), aIn = dir(e, FORK) - 40, aOut = dir(e, FORK) + 40;
      const sIn = at(e, AX.E.rTip + 6, aIn), sOut = at(e, AX.E.rTip + 6, aOut);
      const loc = q => [q[0] - FORK[0], q[1] - FORK[1]];
      const li = loc(sIn), lo = loc(sOut), tail = loc(at(FORK, Math.hypot(BAL[0] - FORK[0], BAL[1] - FORK[1]) - 22, dir(FORK, BAL)));
      const ta = Math.atan2(tail[1], tail[0]), nx = -Math.sin(ta), ny = Math.cos(ta), hx = Math.cos(ta), hy = Math.sin(ta);
      const horns = ` M ${f(tail[0] + nx * 6)} ${f(tail[1] + ny * 6)} L ${f(tail[0] + nx * 6 + hx * 9)} ${f(tail[1] + ny * 6 + hy * 9)} M ${f(tail[0] - nx * 6)} ${f(tail[1] - ny * 6)} L ${f(tail[0] - nx * 6 + hx * 9)} ${f(tail[1] - ny * 6 + hy * 9)} M ${f(tail[0] + nx * 6)} ${f(tail[1] + ny * 6)} L ${f(tail[0] - nx * 6)} ${f(tail[1] - ny * 6)}`;
      const d = `M ${f(li[0])} ${f(li[1])} L 0 0 L ${f(lo[0])} ${f(lo[1])} M 0 0 L ${f(tail[0])} ${f(tail[1])}` + horns;
      const stone = (q, a, nm) => ({ type: 'shape', shape: 'rect', name: nm, parent: 'fork', width: 11, height: 4.2,
        initial: { x: q[0], y: q[1], rotation: a, fillColor: RUBY, strokeColor: '#5a0718', strokeWidth: 0.5 } });
      return [
        { type: 'shape', shape: 'path', name: 'fork-arms', parent: 'fork', d, strokeCap: 'round', strokeJoin: 'round', initial: { strokeColor: '#5f666d', strokeWidth: 8 } },
        { type: 'shape', shape: 'path', name: 'fork-arms-hi', parent: 'fork', d, strokeCap: 'round', strokeJoin: 'round', initial: { strokeColor: '#c9cfd4', strokeWidth: 4 } },
        stone(loc(at(e, AX.E.rTip - 1, aIn)), aIn, 'pallet-in'),
        stone(loc(at(e, AX.E.rTip - 1, aOut)), aOut, 'pallet-out'),
      ];
    }

    const FORK_A = 6, BAL_A = 160;
    function forkNull() {
      return { type: 'null', name: 'fork', initial: { x: FORK[0], y: FORK[1], rotation: -FORK_A },
        keyframes: TICKS.map((t, k) => ({ at: t, to: { rotation: k % 2 ? -FORK_A : FORK_A }, duration: 0.045, ease: 'power4.out' })) };
    }
    function swingNull(name, amp) {
      return { type: 'null', name, initial: { x: BAL[0], y: BAL[1], rotation: -amp },
        keyframes: TICKS.map((t, k) => ({ at: Math.max(0, t - STEP / 2), to: { rotation: k % 2 ? -amp : amp }, duration: STEP, ease: 'sine.inOut' })) };
    }
    function balanceParts() {
      const out = [
        { type: 'shape', shape: 'circle', name: 'bal-rim', parent: 'balance', radius: BAL_R, initial: { strokeColor: BRASS, strokeWidth: 9, fillAlpha: 0 } },
        { type: 'shape', shape: 'circle', name: 'bal-rim-hi', parent: 'balance', radius: BAL_R + 2, initial: { strokeColor: '#ecd59a', strokeWidth: 1.4, fillAlpha: 0, alpha: 0.8 } },
      ];
      let arms = '';
      for (let k = 0; k < 3; k++) { const a = k * TAU / 3, p = polar(BAL_R - 3, a); arms += ` M 0 0 L ${f(p[0])} ${f(p[1])}`; }
      out.push({ type: 'shape', shape: 'path', name: 'bal-arms', parent: 'balance', d: arms.trim(), strokeCap: 'round', initial: { strokeColor: BRASS, strokeWidth: 6 } });
      for (let k = 0; k < 10; k++) { const p = polar(BAL_R + 6.5, k * TAU / 10 + 0.31); out.push({ type: 'shape', shape: 'circle', name: 'bal-screw-' + k, parent: 'balance', radius: 4.2, initial: { x: p[0], y: p[1], strokeColor: '#3d2c10', strokeWidth: 0.6 }, fillGradient: brassFill }); }
      const ip = polar(13, dir(BAL, FORK) / DEG);
      out.push({ type: 'shape', shape: 'circle', name: 'roller', parent: 'balance', radius: 15, initial: { strokeColor: '#4b5056', strokeWidth: 0.8 }, fillGradient: steelFill });
      out.push({ type: 'shape', shape: 'circle', name: 'impulse-pin', parent: 'balance', radius: 3, initial: { x: ip[0], y: ip[1], fillColor: RUBY } });
      return out;
    }

    // ── the world (a 2D composition the camera moves) ──────────────
    const world = [];
    // wheels, bottom plane first: F < T < C < barrel; pinions above; escapement on top
    world.push(stepper('axF-w', AX.F.p, RATE.F), soft(part('wheel-F', 'axF-w', wheelD(AX.F.N, rpOf(AX.F.N), MOD, PH.Fw), brassFill, undefined, undefined, crossD(rpOf(AX.F.N), MOD, 5, PH.Fw)), 2.2));
    world.push(stepper('axT-w', AX.T.p, RATE.T), soft(part('wheel-T', 'axT-w', wheelD(AX.T.N, rpOf(AX.T.N), MOD, PH.Tw), brassFill, undefined, undefined, crossD(rpOf(AX.T.N), MOD, 5, PH.Tw)), 2.2));
    world.push(stepper('axC-w', AX.C.p, RATE.C), soft(part('wheel-C', 'axC-w', wheelD(AX.C.N, rpOf(AX.C.N), MOD, PH.Cw), brassFill, undefined, undefined, crossD(rpOf(AX.C.N), MOD, 6, PH.Cw)), 2.2));
    world.push(stepper('axB-w', AX.B.p, RATE.B), soft(part('wheel-B', 'axB-w', wheelD(AX.B.N, rpOf(AX.B.N), MOD, PH.Bw), darkBrassFill), 2.2));
    world.push({ type: 'shape', shape: 'path', name: 'barrel-bridge', d: bridgeD(), fillGradient: { type: 'linear', angle: 115, stops: genevaStops(14) }, initial: { strokeColor: '#30353a', strokeWidth: 1 } });
    world.push(stepper('axB-r', AX.B.p, RATE.B), { type: 'shape', shape: 'path', name: 'ratchet', parent: 'axB-r', d: toD((() => { const p = []; const N = 40, r1 = 56, r0 = 51; for (let i = 0; i < N; i++) { const a = i * TAU / N; p.push(polar(r0, a), polar(r1, a + TAU / N * 0.75)); } return p; })()), fillGradient: darkSteelFill, initial: { strokeColor: '#3b4046', strokeWidth: 0.7 } });
    world.push(...jewel('j-B', AX.B.p, 9));
    world.push(stepper('axF-p', AX.F.p, RATE.F), part('pinion-F', 'axF-p', toD(toothOutline(AX.F.n, rpOf(AX.F.n), MOD, PH.Fp)), steelFill, '#3b4046'));
    world.push(stepper('axT-p', AX.T.p, RATE.T), part('pinion-T', 'axT-p', toD(toothOutline(AX.T.n, rpOf(AX.T.n), MOD, PH.Tp)), steelFill, '#3b4046'));
    world.push(stepper('axC-p', AX.C.p, RATE.C), part('pinion-C', 'axC-p', toD(toothOutline(AX.C.n, rpOf(AX.C.n), MOD, PH.Cp)), steelFill, '#3b4046'));
    // escape wheel + pinion
    world.push(stepper('axE-w', AX.E.p, RATE.E), part('escape-wheel', 'axE-w', escapeD(20, AX.E.rTip, 0), steelFill, '#30353a', 0.8, crossings(AX.E.rTip * 0.78 - 5, 9, 4, 2.4, 45).trim()));
    world.push(stepper('axE-p', AX.E.p, RATE.E), part('pinion-E', 'axE-p', toD(toothOutline(AX.E.n, rpOf(AX.E.n), MOD, PH.Ep)), steelFill, '#3b4046'));
    // pallet fork
    world.push(forkNull(), ...forkParts());
    // balance + hairspring (the spring turns a little with the balance: it breathes)
    world.push(swingNull('hairspring', BAL_A * 0.06), { type: 'shape', shape: 'path', name: 'spring', parent: 'hairspring', d: spiralD(21, 50, 8), initial: { strokeColor: '#cfd5da', strokeWidth: 0.8, alpha: 0.7 } });
    world.push(swingNull('balance', BAL_A), ...balanceParts());
    // balance cock with Côtes de Genève
    world.push({ type: 'shape', shape: 'path', name: 'cock', d: cockD(), fillGradient: { type: 'linear', angle: 35, stops: genevaStops(10) }, initial: { strokeColor: '#3b4046', strokeWidth: 1 } });
    // jewels on every pivot
    world.push(...jewel('j-C', AX.C.p, 7), ...jewel('j-T', AX.T.p), ...jewel('j-F', AX.F.p), ...jewel('j-E', AX.E.p, 5), ...jewel('j-fork', FORK, 4.5), ...jewel('j-bal', BAL, 8));
    // screws
    for (const [i, p] of [at(M, PLATE_R - 22, 46), at(M, PLATE_R - 22, 64), at(M, PLATE_R - 24, 128), at(M, PLATE_R - 24, 176)].entries()) {
      world.push({ type: 'shape', shape: 'circle', name: 'screw-' + i, radius: 8, initial: { x: p[0], y: p[1], strokeColor: '#33383d', strokeWidth: 0.8 }, fillGradient: steelFill });
      world.push({ type: 'shape', shape: 'rect', name: 'screw-slot-' + i, width: 13, height: 2, initial: { x: p[0], y: p[1], rotation: 30 + i * 70, fillColor: '#2a2e33' } });
    }

    // ── camera: one motion-control move from the escapement out to the whole movement ──
    const CAM0 = { px: 522, py: 446, s: 3.3 }, CAM1 = { px: 508, py: 468, s: 3.0 }, CAM2 = { px: 180, py: 400, s: 1.0 }, CAM3 = { px: 187.4, py: 400, s: 1.035 };
    const MOVE_AT = 3.2, MOVE_DUR = 6.4, CAM_EASE = 'power2.inOut';
    const camKeys = (map) => [
      { at: 0, to: map(CAM1), duration: MOVE_AT, ease: 'sine.inOut' },
      { at: MOVE_AT, to: map(CAM2), duration: MOVE_DUR, ease: CAM_EASE },
      { at: MOVE_AT + MOVE_DUR, to: map(CAM3), duration: DURATION - MOVE_AT - MOVE_DUR, ease: 'sine.out' },   // a slow push while the type reads
    ];

    const PLATE_FRAG = `
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
        vec2 scr = vec2(fragCoord.x, iResolution.y - fragCoord.y);
        vec2 w = cam.xy + (scr - vec2(640.0, 360.0)) / cam.z;
        vec2 d = w - vec2(400.0, 400.0);
        float r = length(d);
        float px = 1.0 / cam.z;
        // perlage: overlapping circular grains, the latest on top
        float cell = 16.0, best = -1.0, shade = 0.35;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 c = (floor(w / cell) + vec2(float(i), float(j)) + 0.5) * cell;
            vec2 q = w - c;
            float rr = length(q), rad = cell * 0.8;
            float o = hash(c);
            if (rr < rad && o > best) {
              best = o;
              float a = atan(q.y, q.x);
              float aniso = 0.5 + 0.5 * cos(2.0 * (a + 0.7 + o));
              float rings = 0.5 + 0.5 * sin(rr * 2.6 + o * 6.283);
              shade = 0.55 * aniso + 0.15 * rings + 0.3 * smoothstep(rad, rad - 2.0 * px, rr) * (1.0 - rr / rad);
            }
          }
        }
        vec3 steel = vec3(0.722, 0.749, 0.776);
        float light = 0.72 + 0.38 * dot(normalize(d + 0.001), vec2(-0.6, -0.8)) * smoothstep(0.0, 300.0, r);
        vec3 plate = steel * (0.16 + 0.10 * shade) * light;
        // the polished chamfer at the rim
        float bevel = smoothstep(292.0, 296.0, r) * (1.0 - smoothstep(299.0, 300.0, r));
        plate = mix(plate, steel * (0.55 + 0.35 * dot(normalize(d + 0.001), vec2(-0.6, -0.8))), bevel);
        vec3 voidc = vec3(0.047, 0.055, 0.067) * (1.0 - 0.25 * smoothstep(300.0, 700.0, r));
        float inside = 1.0 - smoothstep(300.0 - px, 300.0 + px, r);
        fragColor = vec4(mix(voidc, plate, inside), 1.0);
      }`;

    const sequences = [
      { type: 'shader', name: 'plate', fragment: PLATE_FRAG, uniforms: { cam: [CAM0.px, CAM0.py, CAM0.s] },
        filters: [{ type: 'blur', name: 'dof', strength: 5 }],
        keyframes: [...camKeys(c => ({ 'uniforms.cam.0': c.px, 'uniforms.cam.1': c.py, 'uniforms.cam.2': c.s })),
          { at: MOVE_AT, to: { 'filters.dof.strength': 0 }, duration: 3.5, ease: 'power2.inOut' }] },
      { type: 'composition', name: 'movement', width: 800, height: 800, sequences: world,
        filters: [{ type: 'dropShadow', name: 'shadow', offset: { x: 3, y: 5 }, blur: 2, alpha: 0.55, color: '#000000' }],
        initial: { x: 640, y: 360, pivotX: CAM0.px, pivotY: CAM0.py, scale: CAM0.s },
        keyframes: camKeys(c => ({ pivotX: c.px, pivotY: c.py, scale: c.s })) },
      // raking light glint, twice
      ...[[0.9, 2.2], [10.0, 1.8]].map(([t, d], i) => ({ type: 'shape', shape: 'rect', name: 'glint-' + i, at: t, duration: d, width: 360, height: 1800, blendMode: 'soft-light',
        fillGradient: { type: 'linear', angle: 0, stops: [[0, 'rgba(255,236,200,0)'], [0.5, 'rgba(255,236,200,0.85)'], [1, 'rgba(255,236,200,0)']] },
        initial: { x: -300, y: 360, rotation: 22 }, keyframes: [{ at: 0, to: { x: 1600 }, duration: d, ease: 'sine.inOut' }],
        ...(i ? { mask: { type: 'shape', shape: 'circle', radius: 306, initial: { x: 864, y: 360, fillColor: '#ffffff' } } } : {}) })),
      // vignette
      { type: 'shape', shape: 'rect', name: 'vignette', width: W * 1.3, height: H * 1.6, blendMode: 'multiply',
        fillGradient: { type: 'radial', stops: [[0, 'rgba(0,0,0,0)'], [0.45, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.85)']] }, initial: { x: W / 2, y: H / 2 } },
      // fade from black
      { type: 'shape', shape: 'rect', name: 'black', width: W, height: H, duration: 1.8, initial: { x: W / 2, y: H / 2, fillColor: '#000000' },
        keyframes: [{ at: 0.3, to: { alpha: 0 }, duration: 1.4, ease: 'power2.inOut' }] },

      // ── type ──
      { type: 'text', name: 'cap-open', text: 'ESCAPEMENT  ·  18,000 A/h', at: 1.2, duration: 2.4,
        style: { fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: 14, letterSpacing: 3, fill: STEEL },
        initial: { x: 1184, y: 640, anchorX: 1, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.75 }, duration: 0.6, ease: 'power2.out' }, { at: -0.6, to: { alpha: 0 }, duration: 0.6, ease: 'power2.in' }] },
      { type: 'text', name: 'cap', text: 'CALIBRE 27  ·  21 JEWELS', at: 9.3, duration: DURATION - 9.3,
        style: { fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: 14, letterSpacing: 3, fill: STEEL },
        initial: { x: 96, y: 262 }, keyframes: [{ at: 0, from: { alpha: 0, y: 270 }, to: { alpha: 0.7, y: 262 }, duration: 0.9, ease: 'power2.out' }] },
      ...['一秒を、', '五つに刻む。'].map((txt, i) => ({ type: 'text', name: 'title-' + i, text: txt, at: 9.6 + i * 0.25, duration: DURATION - 9.6 - i * 0.25,
        style: { fontFamily: '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif', fontSize: 50, letterSpacing: 4, fill: '#e4e7ea' },
        initial: { x: 92, y: 298 + i * 70 }, keyframes: [{ at: 0, from: { alpha: 0, y: 306 + i * 70 }, to: { alpha: 1, y: 298 + i * 70 }, duration: 0.9, ease: 'power2.out' }] })),
      { type: 'text', name: 'sub', text: 'Five beats to every second.', at: 10.3, duration: DURATION - 10.3,
        style: { fontFamily: 'Georgia, "Times New Roman", serif', fontStyle: 'italic', fontSize: 19, fill: BRASS },
        initial: { x: 96, y: 450 }, keyframes: [{ at: 0, from: { alpha: 0, y: 458 }, to: { alpha: 0.9, y: 450 }, duration: 0.9, ease: 'power2.out' }] },
      { type: 'shape', shape: 'line', name: 'rule', at: 9.3, duration: DURATION - 9.3, from: [96, 290], to: [176, 290], trimEnd: 0,
        initial: { strokeColor: BRASS, strokeWidth: 1.2 }, keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.8, ease: 'power3.out' }] },

      // ── sound ──
      ...TICKS.map((t, k) => {
        const tick = k % 2 === 0;
        const v = t < 3.2 ? 1 : t < 9.6 ? 0.7 : 0.8 - 0.5 * (t - 9.6) / 3.2;
        return { type: 'audio', name: 'tick-' + k, at: t, duration: 0.07, volume: +(v * 1.6).toFixed(3),
          sfx: { voices: [
            { wave: 'noise', filter: { type: 'bandpass', freq: tick ? 5200 : 3900, q: 6 }, envelope: 'fall', gain: 0.9, pan: tick ? 0.15 : -0.15 },
            { wave: 'sine', freq: tick ? 3320 : 2490, envelope: 'fall', gain: 0.35 },
            { wave: 'triangle', freq: tick ? 1180 : 940, envelope: 'fall', gain: 0.2, to: 0.5 },
          ] } };
      }),
      { type: 'audio', name: 'air', at: 3.0, duration: 6.6, volume: 0.6,
        sfx: { voices: [{ wave: 'noise', filter: { type: 'bandpass', freq: [300, 2400], q: 1.2 }, envelope: 'swell', gain: 0.8 }] } },
      { type: 'audio', name: 'thump', at: 9.6, duration: 1.2, volume: 0.9,
        sfx: { voices: [{ wave: 'sine', freq: [98, 49], envelope: 'fall', gain: 1 }, { wave: 'noise', filter: { type: 'lowpass', freq: [900, 200] }, envelope: 'fall', gain: 0.25, to: 0.2 }] } },
      { type: 'audio', name: 'score', volume: 1.05, keyframes: [{ at: 11.2, to: { volume: 0.2 }, duration: 1.6, ease: 'sine.in' }], music: { bpm: 150, reverb: 0.45, tail: 3, tracks: [
        { inst: 'pad', vol: [[0, 0.35], [8, 0.6], [24, 0.7]], notes: 'Dm9:8 Bbmaj7:8 Gm9:4 A7sus4:4 Dmaj9:8' },
        { inst: 'bass', vol: 0.45, notes: 'd2:8 bb1:8 g1:4 a1:4 d2:8' },
        { inst: 'musicbox', vol: 0.55, notes: '_:8 ' + ['d5 f5 a5 c6 a5 f5 d5 f5', 'd5 f5 a5 d6 c6 a5 f5 a5', 'bb4 d5 f5 a5 bb5 a5 f5 d5', 'a4 d5 e5 g5 a5 g5 e5 c#5'].map(b => b.split(' ').map(n => n + ':0.5').join(' ')).join(' ') + ' f#5:1 a5:1 c#6:2 e6:4' },
        { inst: 'bell', vol: 0.5, notes: '_:24 a5:2 d6:6' },
      ] } },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 12.3,
        background: VOID,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
