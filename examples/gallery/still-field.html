<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Still Field</title>
  <script type="application/json" id="piece-meta">{ "title": "Still Field", "subtitle": "633 strokes of a lattice, raked into rings: one wave goes out ember and comes back pale, a seamless 12 s loop", "tags": ["generative", "loop", "pattern", "music"], "width": 1080, "height": 1080, "duration": 12, "model": "opus" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #111110; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .stage { position: relative; width: min(860px, 100%, calc(100vh - 32px)); }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie, kenBurns, withFade } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, sequences }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1080, H = 1080, FPS = 30, DURATION = 12;

    // ── palette ───────────────────────────────────────────────
    const INK = '#0e0e0d', BONE = '#ebe5d9', DIM = '#6f6a62', EMBER = '#ff4a2b';

    // ── the field: an N x N grid of short strokes; one wave of half-turns runs out from the centre ──
    const N = 29, GAP = 26, LEN = 20, THICK = 2.6, R = 14.2;   // R: the disc's radius in grid steps
    const ORIGIN = (W - (N - 1) * GAP) / 2;            // 180: the grid sits in the middle two thirds
    const C = (N - 1) / 2;
    const HOLD = 0.75;                                 // the whole field is still at the loop point (0.75 s here + 0.25 s at the end); 0.75 s = beat 1 at 80 bpm
    const TURN = 3.3;                                  // seconds a stroke takes for one half turn
    const SPREAD = 2.2;                                // seconds a wave takes between the centre and the corners
    const MAXD = R;
    const OUT_END = HOLD + SPREAD + TURN;              // the corners finish the outward wave, then start the inward one
    const ease = 'sine.inOut';
    const REST_ALPHA = 0.68;

    // at rest every stroke is tangent to a circle round the centre (raked rings); the wave turns it through radial and back
    const field = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const dx = i - C, dy = j - C;
      if (Math.hypot(dx, dy) > R) continue;            // only a disc of the lattice
      const d = Math.hypot(dx, dy) / MAXD;             // 0 centre .. 1 rim
      const rest = (dx || dy) ? Math.atan2(dy, dx) * 180 / Math.PI + 90 : 0;
      const tOut = HOLD + d * SPREAD;                  // outward wave
      const tIn = OUT_END + (1 - d) * SPREAD;          // inward wave, back to the centre
      const kf = [];
      // out: clockwise, the stroke flares ember as it turns; back: it unwinds the same half turn and only brightens (exhale warm, inhale pale)
      for (const [t0, a, hot] of [[tOut, rest + 180, EMBER], [tIn, rest, BONE]]) {
        kf.push({ at: t0, to: { rotation: a }, duration: TURN, ease });
        kf.push({ at: t0, to: { scaleX: 1.4, alpha: 1 }, duration: TURN / 2, ease: 'sine.inOut' });
        kf.push({ at: t0 + TURN / 2, to: { scaleX: 1, alpha: REST_ALPHA }, duration: TURN / 2, ease: 'sine.inOut' });
        if (hot !== BONE) {
          kf.push({ at: t0 + TURN * 0.25, to: { fillColor: hot }, duration: TURN * 0.25, ease: 'sine.inOut' });
          kf.push({ at: t0 + TURN * 0.5, to: { fillColor: BONE }, duration: TURN * 0.35, ease: 'sine.inOut' });
        }
      }
      field.push({
        type: 'shape', shape: 'rect', name: `s-${i}-${j}`,
        width: LEN, height: THICK, cornerRadius: THICK / 2,
        initial: { x: ORIGIN + i * GAP, y: ORIGIN + j * GAP, rotation: rest, fillColor: BONE, alpha: REST_ALPHA },
        keyframes: kf,
      });
    }

    // ── sound: 80 bpm, one bar = 3 s, four bars = the loop; the out wave starts on beat 1 ──
    const SCORE = {
      bpm: 80, reverb: 0.45, humanize: 0,
      tracks: [
        { inst: 'pad', vol: 0.5, attack: 1.2, release: 1.4, tone: 0.45, notes: 'Dmaj9:4 Bm9:4 Gmaj9:4 A7sus4:4' },
        { inst: 'sub', vol: 0.45, notes: 'd2:4 b1:4 g1:4 a1:4' },
        { inst: 'musicbox', vol: 0.4, reverb: 0.8, pan: 0.2, notes: '_:1 a5:2 e5:2 f#5:3 _:4 c#6:1 b5:1 a5:2' },
      ],
    };

    // ── type: a quiet caption, the way a print is labelled ──
    const sans = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
    const mono = 'ui-monospace, "SF Mono", Menlo, monospace';
    const LEFT = ORIGIN - LEN / 2, RIGHT = ORIGIN + (N - 1) * GAP + LEN / 2;
    const caption = [
      { type: 'text', name: 'title', text: 'Still Field', style: { fontFamily: sans, fontSize: 26, fontWeight: '600', fill: BONE, letterSpacing: 0.5 },
        initial: { x: LEFT, y: 104 } },
      { type: 'text', name: 'meta', text: `${field.length} STROKES · OUT AND BACK · 12 S LOOP`, style: { fontFamily: mono, fontSize: 15, fill: DIM, letterSpacing: 2 },
        initial: { x: RIGHT, y: 110, anchorX: 1 } },
      { type: 'text', name: 'no', text: 'No. 01', style: { fontFamily: mono, fontSize: 15, fill: DIM, letterSpacing: 2 },
        initial: { x: LEFT, y: 958 } },
    ];

    // the phase, bottom right: STILL / OUT / BACK / STILL (the loop starts and ends on the same word)
    const IN_START = OUT_END, IN_END = OUT_END + SPREAD + TURN;
    const phase = (text, at, until) => ({
      type: 'text', name: 'phase-' + text.toLowerCase() + '-' + Math.round(at * 10), text, at, duration: until - at,
      style: { fontFamily: mono, fontSize: 15, fill: text === 'OUT' ? EMBER : DIM, letterSpacing: 2 },
      initial: { x: RIGHT, y: 958, anchorX: 1, alpha: 1 },
    });
    const phases = [
      phase('STILL', 0, HOLD), phase('OUT', HOLD, OUT_END), phase('BACK', IN_START, IN_END), phase('STILL', IN_END, DURATION),
    ];

    const sequences = [
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: INK } },
      ...field,
      ...caption,
      ...phases,
      { type: 'audio', name: 'score', at: 0, volume: 1.4, music: SCORE },
    ];

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 4.4,                     // the outward wave reaches the rim: an ember ring round a calm core
        background: INK,
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
