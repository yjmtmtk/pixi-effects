<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hanon-trio-night</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #0e0d0c; margin: 0; padding: 16px; min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; }
    .stage { position: relative; width: min(960px, 100%); margin: 0 auto; }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="application/json" id="piece-meta">{ "title": "Hanon Trio Night", "subtitle": "A basement jazz bar's poster, set note by note by a walking bass, a Rhodes and a vibes line", "tags": ["typography", "music", "jazz", "poster", "japanese"], "width": 1280, "height": 720, "duration": 14, "model": "opus" }</script>

  <script type="module">
    import { Movie, musicEvents, measureText } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 14;
    const INK = '#141110', CREAM = '#EFE6D2', BRASS = '#C99A45', OX = '#7E2B22';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", serif';
    const GOTHIC = '"Hiragino Sans", "Yu Gothic", sans-serif';
    const MONO = 'ui-monospace, Menlo, Consolas, monospace';
    const ML = 96;                                   // left / right margin

    // ── the music: 120 bpm, a bar = 2 s. | Gm7 C7 | Fmaj9 D7b9 | Gm9 C13 | Am7 D7b9 | Gm9 Gb9 | Fmaj9 |
    const score = {
      bpm: 120, swing: 0.3, reverb: 0.24, seed: 14, humanize: 0.008,
      tracks: [
        { inst: 'bass', vol: 1.0, legato: 0.9, tone: 0.55, reverb: 0.1,
          notes: '_:4 | g2 bb2 c2 e2 | f2 a2 d2 f#2 | g2 d2 c2 bb1 | a1 e2 d2 f#2 | g2 bb2 db3 gb2 | f2:4' },
        { inst: 'keys', vol: 0.62, pan: -0.2, strum: 0.012, tone: 0.5,
          notes: '_:4 | Gm7:1 _:0.5 Gm7:1 _:0.5 C7:1 | Fmaj9:1 _:0.5 Fmaj9:1 _:0.5 D7b9:1 | Gm9:1 _:0.5 Gm9:1 _:0.5 C13:1 | _:0.5 Am7:1 _:1 D7b9:0.5 _:1 | Gm9:1.5 _:1 Gb9:1.5 | Fmaj9@3:4' },
        { inst: 'bell', vol: 0.5, pan: 0.25, tone: 0.35, ring: 1.4, reverb: 0.5,
          notes: '_:12 | a4:0.5 c5:0.5 d5:1 f5:1.5 e5:0.5 | _:0.5 e5:0.5 d5:0.5 c5:0.5 a4:2 | bb4:0.5 d5:0.5 f5:0.5 a5:1 ab5:1.5 | g5:4' },
      ],
      drums: [
        { from: 0, to: 4, rim: 'x...x...x...x...', clap: 'o...o...o...x...' },   // the count-in: finger snaps
        { from: 4, to: 24, hat: 'x...x.o.x...x.o.', rim: '............o...', kick: 'o.......o.......' },
        { from: 24, to: 25, crash: 'x...', kick: 'x...' },
      ],
    };
    const ev = await musicEvents(score);
    window.__cues = { keys: ev.tracks[1].notes.map(n => n.time), bass: ev.tracks[0].notes.map(n => n.time), bell: ev.tracks[2].notes.map(n => n.time) };
    const [bassN, keysN, bellN] = ev.tracks.map(t => t.notes);
    const keysT = keysN.map(n => n.time), bellT = bellN.map(n => n.time), bassT = bassN.map(n => n.time);

    // ── helpers ────────────────────────────────────────────────
    // type that rises out of an invisible slot (inline mask = the slot)
    function rise(text, style, x, y, at, { dur = 0.38, name, drop, life } = {}) {
      const m = measureText(text, style);
      const d = drop ?? m.height;
      return {
        type: 'text', name, text, style, at, duration: life ?? DURATION - at,
        initial: { x, y },
        keyframes: [{ at: 0, from: { y: y + d }, to: { y }, duration: dur, ease: 'power4.out' }],
        mask: { type: 'shape', shape: 'rect', width: m.width + 80, height: m.height + 4,
                initial: { x: x + m.width / 2, y: y + m.height / 2, fillColor: '#ffffff' } },
      };
    }
    // small tracked caps that wipe on from the left
    function caps(text, x, y, at, { fill = BRASS, size = 14 } = {}) {
      const style = { fontFamily: MONO, fontSize: size, fill, letterSpacing: 3 };
      const m = measureText(text, style);
      return {
        type: 'text', text, style, at, duration: DURATION - at, initial: { x, y },
        mask: { type: 'shape', shape: 'rect', width: m.width + 8, height: m.height + 4,
                initial: { x: x - 4, y: y + m.height / 2, anchorX: 0, fillColor: '#ffffff', scaleX: 0 },
                keyframes: [{ at: 0, to: { scaleX: 1 }, duration: 0.45, ease: 'power3.out' }] },
      };
    }

    const seq = [];
    seq.push({ type: 'shape', shape: 'rect', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: INK } });

    // ── the colour field: drops from the top on the Rhodes' first chord ──
    const PANEL_X = 768, PANEL_H = 548;
    seq.push({ type: 'shape', name: 'panel', shape: 'rect', width: W - PANEL_X, height: PANEL_H, at: keysT[0],
      initial: { x: (W + PANEL_X) / 2, y: 0, anchorY: 0, fillColor: OX, scaleY: 0 },
      keyframes: [{ at: 0, to: { scaleY: 1 }, duration: 0.6, ease: 'expo.out' }] });

    // ── the bass line: one brass dash per note, x = time, y = pitch ──
    const T0 = 2, BX = ML, PX = (W - 2 * ML) / 12;   // the band plays 2 s → 14 s across the width
    const lo = Math.min(...bassN.map(n => n.midi[0])), hi = Math.max(...bassN.map(n => n.midi[0]));
    const BY0 = 668, BY1 = 604;
    const pitchY = m => BY0 - (m - lo) / (hi - lo) * (BY0 - BY1);
    for (let b = 1; b <= 7; b++) {                    // bar lines: faint ticks, one per bar
      seq.push({ type: 'shape', shape: 'rect', width: 1, height: BY0 + 6 - 560, at: Math.min(b * 2, 12.6),
        initial: { x: BX + (b * 2 - T0) * PX, y: (BY0 + 6 + 560) / 2, fillColor: CREAM, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 0.18 }, duration: 0.3 }] });
    }
    bassN.forEach((n, i) => {
      seq.push({ type: 'shape', shape: 'rect', width: n.seconds * PX - 8, height: 5, at: n.time,
        initial: { x: BX + (n.time - T0) * PX + 3, y: pitchY(n.midi[0]), anchorX: 0, fillColor: BRASS, scaleX: 0 },
        keyframes: [{ at: 0, to: { scaleX: 1 }, duration: i === bassN.length - 1 ? 1.2 : 0.14, ease: 'power2.out' }] });
    });

    // lead-sheet chord symbols over the bass line, each on its own beat
    const CHORDS = [[4, 'Gm7'], [6, 'C7'], [8, 'Fmaj9'], [10, 'D7♭9'], [12, 'Gm9'], [14, 'C13'], [16, 'Am7'], [18, 'D7♭9'], [20, 'Gm9'], [22, 'G♭9'], [24, 'Fmaj9']];
    const CHORD = { fontFamily: 'Georgia, "Times New Roman", serif', fontStyle: 'italic', fontSize: 19, fill: '#B9AF9C' };
    for (const [beat, name] of CHORDS) {
      const t = beat * 60 / score.bpm;
      seq.push(rise(name, CHORD, BX + (t - T0) * PX + 8, 560, t, { dur: 0.3 }));
    }

    // ── left field: the event ──
    seq.push(caps('BAR HANON PRESENTS — VOL.27', ML, 76, 0.1));
    const DISPLAY = { fontFamily: 'Georgia, "Times New Roman", serif', fontStyle: 'italic', fontSize: 176, fill: CREAM };
    // the count-in: 1 2 3 4 on the rim clicks, in the slot where "Trio" will land
    ['1', '2', '3', '4'].forEach((d, i) => seq.push(rise(d, DISPLAY, ML, 92, i * 0.5, { dur: 0.22, life: 0.5 })));
    seq.push(rise('Trio', DISPLAY, ML - 6, 92, keysT[1], { name: 'trio' }));
    seq.push(rise('Night', DISPLAY, ML + 116, 264, keysT[2], { name: 'night' }));

    // line-up on the bass notes of bar 5
    const LINEUP = [['PIANO', '森 透子'], ['BASS', '加賀 進'], ['DRUMS', '戸川 ユウ']];
    LINEUP.forEach(([role, who], i) => {
      const t = bassT[16 + i];
      const x = ML + i * 200;
      seq.push(caps(role, x, 484, t, { size: 13 }));
      seq.push(rise(who, { fontFamily: GOTHIC, fontSize: 22, fill: CREAM, fontWeight: '500' }, x, 506, t + 0.05, { name: 'who' + i }));
    });

    // ── right field: date, door, venue ──
    const RX = PANEL_X + 44;
    seq.push(rise('SAT', { fontFamily: '"Arial Black", Arial, sans-serif', fontWeight: '900', fontSize: 24, fill: INK, letterSpacing: 4 }, RX, 84, keysT[0] + 0.3, { name: 'sat' }));
    seq.push(rise('11.14', { fontFamily: '"Arial Black", Arial, sans-serif', fontWeight: '900', fontSize: 92, fill: CREAM }, RX - 4, 112, keysT[3], { name: 'date' }));
    seq.push(caps('OPEN 19:30 / START 20:00', RX, 236, keysT[4], { fill: CREAM, size: 14 }));
    seq.push(caps('CHARGE ¥2,500 + 1 DRINK', RX, 260, keysT[5], { fill: CREAM, size: 14 }));

    // the venue's name: shown a semitone flat on the Gb9, resolved up on the last chord
    const MARK = { fontFamily: MINCHO, fontWeight: '600', fontSize: 112, fill: INK };   // drawn in ink while it is "flat"
    const markY = 318, flat = 30;
    seq.push({ type: 'text', name: 'hanon', text: '半音', style: MARK, at: keysT[12], duration: DURATION - keysT[12],
      initial: { x: RX - 6, y: markY + flat, alpha: 0 },
      keyframes: [
        { at: 0, to: { alpha: 1 }, duration: 0.2, ease: 'power2.out' },
        { at: keysT[13] - keysT[12], to: { y: markY, fill: CREAM }, duration: 0.32, ease: 'power4.out' },
      ] });
    seq.push(caps('HANON · 高円寺 B1F · 14 SEATS', RX, 456, keysT[13] + 0.25, { fill: CREAM, size: 13 }));

    // vertical copy, one character per layer, revealed on the vibes' notes (bars 3–4)
    const COPY = ['土曜', 'の', '夜', 'は、', '半', '音', 'ず', 'らし', 'て。'];
    const VX = W - ML - 18, VY = 96, VS = 34, VF = 28;
    let k = 0;
    COPY.forEach((chunk, ni) => {
      for (const ch of chunk) {
        const punct = '、。'.includes(ch);
        seq.push({ type: 'text', text: ch, at: bellT[ni], duration: DURATION - bellT[ni],
          style: { fontFamily: MINCHO, fontSize: VF, fill: CREAM, fontWeight: '500' },
          initial: { x: VX + (punct ? VF * 0.6 : 0), y: VY + k * VS - (punct ? VF * 0.55 : 0), anchorX: 0.5, anchorY: 0.5, alpha: 0 },
          keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.18, ease: 'power2.out' }] });
        k++;
      }
    });

    // ── sound ──
    seq.push({ type: 'audio', name: 'band', at: 0, volume: 1.3, music: score });

    const sequences = seq;
    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 13,
        background: INK,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
