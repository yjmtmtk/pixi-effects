<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>binary-count</title>
  <script type="application/json" id="piece-meta">{ "title": "Binary, Counted", "subtitle": "One digit that holds only 0 or 1: when it overflows, a new digit is born, worth twice as much", "tags": ["explainer", "typography", "japanese", "math"], "width": 1280, "height": 720, "duration": 13, "model": "opus" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #0b0c0d; margin: 0; padding: 16px; min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
    .stage { position: relative; width: min(960px, 100%); }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // import { registerThree, three } from 'pixi-effects/three';   // only for a three.js layer; call registerThree() before init
    // import * as THREE from 'three';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, sequences }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1280, H = 720, FPS = 30, DURATION = 13;

    // ---- palette & type ---------------------------------------------------
    const BG = '#101113', INK = '#ECE7DC', DIM = '#7C7F86', LINE = '#34363B', OFF = '#4E5157', AMBER = '#FFB240';
    const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';
    const SANS = '"Hiragino Sans", "Yu Gothic", system-ui, sans-serif';
    const DIGITS = '"Helvetica Neue", system-ui, "Segoe UI", Arial, sans-serif';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", Georgia, serif';

    // ---- grid ---------------------------------------------------------------
    const LEFT = 170;                     // the text column = the left edge of the 16 tile
    const S = 120, GAP = 20, PITCH = S + GAP;
    const TY = 338;                       // tiles' centre line
    const slotX = k => LEFT + S / 2 + (4 - k) * PITCH;   // slot 0 (ones) is the rightmost
    const NUM_R = 1130;                   // right edge of the decimal readout
    const WY = TY + S / 2 + 40;           // weight labels' centre line

    // ---- the count: n -> time (on a 120 bpm grid: 0.5 s a beat) ---------------
    const T = { 0: 1.0, 1: 2.0, 2: 3.0, 3: 4.0, 4: 5.0, 5: 6.0, 6: 6.5, 7: 7.0, 8: 8.0,
                9: 8.5, 10: 8.75, 11: 9.0, 12: 9.25, 13: 9.5, 14: 9.75, 15: 10.0 };
    const GHOST_AT = 10.75;
    const bitsOf = n => [0, 1, 2, 3].map(k => (n >> k) & 1);

    // every bit change, with the carry rippling right -> left
    const changes = [[], [], [], []];     // per slot: { t, v }
    const born = [T[0], null, null, null];
    const carries = [];                   // { t, depth, d }
    const LAND = { 0: T[0] };             // when the carry lands = when the number is complete
    for (let n = 1; n <= 15; n++) {
      const prev = bitsOf(n - 1), cur = bitsOf(n);
      let depth = 0; while (prev[depth] === 1) depth++;          // trailing ones that roll over
      const isBirth = n >= 2 && (n & (n - 1)) === 0;
      const d = n >= 9 ? 0.05 : isBirth ? 0.16 : 0.1;
      for (let k = 0; k < 4; k++) {
        if (prev[k] === cur[k]) continue;
        const t = T[n] + (k <= depth ? k * d : 0);
        if (isBirth && k === depth) born[k] = t;
        changes[k].push({ t, v: cur[k] });
      }
      if (depth > 0) carries.push({ t: T[n], depth, d });
      LAND[n] = +(T[n] + depth * d).toFixed(3);
    }
    // value shown in each slot at its birth
    const bornValue = k => (k === 0 ? 0 : 1);

    const seq = [];
    const add = l => (seq.push(l), l);

    // ---- background -----------------------------------------------------------
    add({ type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: BG } });

    // ---- headline -------------------------------------------------------------
    add({ type: 'text', name: 'kicker', text: 'HOW BINARY COUNTS', at: 0.1, duration: DURATION - 0.1,
      style: { fontFamily: MONO, fontSize: 15, letterSpacing: 4, fill: AMBER },
      initial: { x: LEFT, y: 86, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6, ease: 'power2.out' }] });
    add({ type: 'text', name: 'title', text: '0と1だけで、数をかぞえる。', at: 0.25, duration: DURATION - 0.25,
      style: { fontFamily: MINCHO, fontSize: 44, fill: INK, letterSpacing: 3 },
      initial: { x: LEFT, y: 112, alpha: 0 },
      keyframes: [{ at: 0, from: { y: 126 }, to: { y: 112, alpha: 1 }, duration: 0.8, ease: 'power3.out' }] });

    // ---- column labels --------------------------------------------------------
    add({ type: 'text', name: 'lab-bin', text: 'BINARY', at: 0.8, duration: DURATION - 0.8,
      style: { fontFamily: MONO, fontSize: 14, letterSpacing: 3, fill: DIM },
      initial: { x: slotX(0) + S / 2, y: TY - S / 2 - 44, anchorX: 1, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6 }] });
    add({ type: 'text', name: 'lab-dec', text: 'DECIMAL', at: 0.8, duration: DURATION - 0.8,
      style: { fontFamily: MONO, fontSize: 14, letterSpacing: 3, fill: DIM },
      initial: { x: NUM_R, y: TY - S / 2 - 44, anchorX: 1, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6 }] });

    // ---- the tiles --------------------------------------------------------------
    for (let k = 0; k < 4; k++) {
      const at = born[k], life = DURATION - at, v0 = bornValue(k);
      const local = t => +(t - at).toFixed(3);
      const later = changes[k].filter(c => c.t > at + 1e-6);
      const birthKf = [{ at: 0, from: { scale: 0.55, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.5, ease: 'back.out(1.7)' }];

      // warm light behind a lit tile
      add({ type: 'shape', shape: 'rect', name: `glow${k}`, width: S + 10, height: S + 10, cornerRadius: 16, at, duration: life,
        filters: [{ type: 'blur', strength: 26, quality: 4 }], filterArea: { x: -S, y: -S, width: 2 * S, height: 2 * S },
        initial: { x: slotX(k), y: TY, fillColor: AMBER, alpha: v0 * 0.32 },
        keyframes: later.map(c => ({ at: local(c.t), to: { alpha: c.v * 0.32 }, duration: c.v ? 0.25 : 0.4, ease: 'power2.out' })) });
      // tile
      add({ type: 'shape', shape: 'rect', name: `tile${k}`, width: S, height: S, cornerRadius: 6, at, duration: life,
        initial: { x: slotX(k), y: TY, fillColor: AMBER, fillAlpha: v0, strokeColor: v0 ? AMBER : OFF, strokeWidth: 2 },
        keyframes: [...birthKf, ...later.flatMap(c => [
          { at: local(c.t), to: { fillAlpha: c.v, strokeColor: c.v ? AMBER : OFF }, duration: 0.12, ease: 'power2.out' },
          { at: local(c.t), from: { scale: c.v ? 1.08 : 0.94 }, to: { scale: 1 }, duration: 0.32, ease: 'power3.out' },
        ])] });
      // digit
      add({ type: 'text', name: `digit${k}`, text: String(v0), at, duration: life,
        style: { fontFamily: DIGITS, fontSize: 82, fontWeight: '300', fill: v0 ? BG : OFF },
        initial: { x: slotX(k), y: TY + 2, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [...birthKf, ...later.flatMap(c => [
          { at: local(c.t), set: { text: String(c.v) } },
          { at: local(c.t), to: { fill: c.v ? BG : OFF }, duration: 0.1 },
          { at: local(c.t), from: { scale: c.v ? 1.08 : 0.94 }, to: { scale: 1 }, duration: 0.32, ease: 'power3.out' },
        ])] });
      // weight
      add({ type: 'text', name: `weight${k}`, text: String(1 << k), at: at + 0.1, duration: life - 0.1,
        style: { fontFamily: MONO, fontSize: 24, fill: v0 ? AMBER : DIM },
        initial: { x: slotX(k), y: WY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { y: WY + 10 }, to: { y: WY, alpha: 1 }, duration: 0.5, ease: 'power3.out' },
          ...later.map(c => ({ at: +(c.t - at - 0.1).toFixed(3), to: { fill: c.v ? AMBER : DIM }, duration: 0.12 }))] });
      // x2 between this weight and the one on its right
      if (k > 0) add({ type: 'text', name: `x2-${k}`, text: '×2', at: Math.max(at + 0.25, 5.4 + (k - 1) * 0.12), duration: DURATION,
        style: { fontFamily: MONO, fontSize: 16, fill: OFF },
        initial: { x: slotX(k) + PITCH / 2, y: WY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });
    }

    // ---- the carry: a spark that runs from the ones to the digit it lands on ---------------
    carries.forEach((c, i) => {
      const dur = c.depth * c.d;
      add({ type: 'shape', shape: 'circle', name: `carry${i}`, radius: 5, at: c.t, duration: dur + 0.18,
        initial: { x: slotX(0), y: TY + S / 2 + 14, fillColor: AMBER },
        keyframes: [{ at: 0, to: { x: slotX(c.depth) }, duration: dur, ease: 'power1.inOut' },
                    { at: dur, to: { alpha: 0, scale: 0.4 }, duration: 0.18 }] });
    });

    // ---- the ghost: the 16s digit, waiting ------------------------------------------------
    add({ type: 'shape', shape: 'rect', name: 'ghost', width: S, height: S, cornerRadius: 6, at: GHOST_AT, duration: DURATION - GHOST_AT,
      initial: { x: slotX(4), y: TY, fillAlpha: 0, fillColor: AMBER, strokeColor: AMBER, strokeWidth: 2, strokeAlpha: 0.55, alpha: 0 },
      keyframes: [{ at: 0, from: { scale: 0.8 }, to: { scale: 1, alpha: 1 }, duration: 0.6, ease: 'power3.out' }] });
    add({ type: 'text', name: 'ghost-q', text: '?', at: GHOST_AT + 0.15, duration: DURATION - GHOST_AT - 0.15,
      style: { fontFamily: DIGITS, fontSize: 62, fontWeight: '300', fill: AMBER },
      initial: { x: slotX(4), y: TY + 2, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 0.6 }, duration: 0.5 }] });
    add({ type: 'text', name: 'ghost-w', text: '16', at: GHOST_AT + 0.25, duration: DURATION - GHOST_AT - 0.25,
      style: { fontFamily: MONO, fontSize: 24, fill: AMBER },
      initial: { x: slotX(4), y: WY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, from: { y: WY + 10 }, to: { y: WY, alpha: 0.7 }, duration: 0.5, ease: 'power3.out' }] });
    add({ type: 'text', name: 'x2-4', text: '×2', at: GHOST_AT + 0.35, duration: DURATION,
      style: { fontFamily: MONO, fontSize: 16, fill: OFF },
      initial: { x: slotX(4) + PITCH / 2, y: WY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });

    // ---- decimal readout and the sum of the lit weights ---------------------------------
    const sumText = n => n === 0 ? '0' : [8, 4, 2, 1].filter(w => n & w).join(' + ');
    const numKf = [], sumKf = [];
    for (let n = 1; n <= 15; n++) {
      const t = +(LAND[n] - T[0]).toFixed(3);
      const t0 = +(T[n] - T[0]).toFixed(3);
      if (t - t0 >= 0.2) numKf.push({ at: t0, to: { alpha: 0.35 }, duration: 0.08 }, { at: t, to: { alpha: 1 }, duration: 0.08 });
      numKf.push({ at: t, set: { text: String(n) } }, { at: t, from: { scale: 1.06 }, to: { scale: 1 }, duration: 0.3, ease: 'power3.out' });
      sumKf.push({ at: t, set: { text: sumText(n) } });
    }
    add({ type: 'text', name: 'eq', text: '=', at: T[0], duration: DURATION - T[0],
      style: { fontFamily: MONO, fontSize: 48, fill: OFF },
      initial: { x: (slotX(0) + S / 2 + NUM_R - 170) / 2, y: TY, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }] });
    add({ type: 'text', name: 'decimal', text: '0', at: T[0], duration: DURATION - T[0],
      style: { fontFamily: DIGITS, fontSize: 150, fontWeight: '200', fill: INK },
      initial: { x: NUM_R, y: TY + 4, anchorX: 1, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }, ...numKf] });
    add({ type: 'text', name: 'sum', text: '0', at: T[0], duration: DURATION - T[0],
      style: { fontFamily: MONO, fontSize: 22, fill: AMBER },
      initial: { x: NUM_R, y: WY, anchorX: 1, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }, ...sumKf] });

    // ---- captions -----------------------------------------------------------------------
    const captions = [
      [1.0, 2.85, 'ひとつの桁に入るのは、0 か 1 だけ。'],
      [3.0, 4.85, 'あふれたら、左に新しい桁が生まれる。'],
      [5.0, 7.85, '新しい桁の重みは、ひとつ前の 2 倍。'],
      [8.0, 10.75, '点いている重みを足すと、その数になる。'],
      [10.75, DURATION, '全部 1 になったら、次は 16 の桁へ。'],
    ];
    captions.forEach(([a, b, text], i) => {
      const last = i === captions.length - 1;
      add({ type: 'text', name: `cap${i}`, text, at: a, duration: b - a,
        style: { fontFamily: SANS, fontSize: 28, fontWeight: '500', fill: INK, letterSpacing: 1 },
        initial: { x: LEFT + 28, y: 566, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { x: LEFT + 40 }, to: { x: LEFT + 28, alpha: 1 }, duration: 0.5, ease: 'power3.out' },
          ...(last ? [] : [{ at: -0.25, to: { alpha: 0 }, duration: 0.25, ease: 'power1.in' }])] });
    });
    add({ type: 'shape', shape: 'rect', name: 'cap-bar', width: 3, height: 28, at: 1.0, duration: DURATION - 1.0,
      initial: { x: LEFT + 1.5, y: 566, fillColor: AMBER, scaleY: 0 },
      keyframes: [{ at: 0, to: { scaleY: 1 }, duration: 0.4, ease: 'power3.out' }] });

    // ---- sound ------------------------------------------------------------------------
    add({ type: 'audio', name: 'bed', at: 0, volume: 1.1, music: {
      bpm: 120, reverb: 0.35,
      tracks: [
        { inst: 'pad',  vol: [[0, 0.15], [4, 0.42]], attack: 0.6, release: 1.2, notes: 'Fmaj7:4 Am7:4 Dm7:4 Bbmaj7:4 Csus4:4 Fmaj9:6' },
        { inst: 'bass', vol: 0.5, tone: 0.4, notes: '_:4 a1:4 d2:4 bb1:4 c2:4 f1:6' },
      ] } });
    // a tick for every digit that turns over, a soft pop where the carry lands, a chime for each new digit (an octave up each time: x2 = one octave)
    changes.forEach((list, k) => list.forEach(c => {
      if (born[k] !== null && Math.abs(c.t - born[k]) < 1e-6) return;
      add({ type: 'audio', at: c.t, volume: c.v ? 1.1 : 0.9, sfx: { preset: c.v ? 'pop' : 'click', pitch: c.v ? 4 + k * 2 : -2, brightness: -0.3 } });
    }));
    [1, 2, 3].forEach((k, i) => add({ type: 'audio', at: born[k], volume: 1.0, sfx: { preset: 'chime', pitch: -12 + i * 12, brightness: -0.4 } }));
    add({ type: 'audio', at: GHOST_AT, volume: 0.6, sfx: { preset: 'chime', pitch: 24, brightness: -0.6 } });

    const sequences = seq;

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11.6,        // the moment that stands for the video before it plays (pick your most striking one)
        background: '#101113',
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
