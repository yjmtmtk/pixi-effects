<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kōbe, 2040 — isometric city</title>
  <style>
    html, body { height: 100%; }
    body { background: #0d1220; margin: 0; padding: 16px; box-sizing: border-box; display: grid; place-items: center; }
    canvas { width: min(960px, 100%); border-radius: 8px; display: block; }
  </style>
  <script type="application/json" id="piece-meta">
  { "title": "Kōbe, 2040",
    "subtitle": "A seeded isometric city builds itself from dawn to dusk — three polygon faces per block, oklab light, windows that wake up",
    "tags": ["procedural", "isometric", "oklab", "masks", "audio"],
    "width": 1280, "height": 720, "duration": 12, "posterFrame": 335, "model": "fable" }
  </script>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 12;
    const POSTER_FRAME = 335;

    // ---------------------------------------------------------------- seeded randomness (every run and export identical)
    let seed = 2040;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = arr => arr[Math.floor(rnd() * arr.length)];

    // ---------------------------------------------------------------- colour maths (build-time only; tweens happen in oklab)
    const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const rgb2hex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    const mix = (a, b, t) => a.map((v, k) => v + (b[k] - v) * t);
    const shade = (hex, k, tint = '#ffffff', amount = 0) => rgb2hex(mix(hex2rgb(hex).map(v => v * k), hex2rgb(tint), amount));

    // ---------------------------------------------------------------- the day: dawn -> day -> dusk (global times)
    const T_DAY = [3.0, 6.0], T_DUSK = [7.0, 10.0];
    // stops: [[globalTime, colour, ease?], ...] piecewise-linear; equal neighbours = hold
    const phases = (dawn, day, dusk) => [[0, dawn], [T_DAY[0], dawn], [T_DAY[1], day], [T_DUSK[0], day], [T_DUSK[1], dusk]];
    const stopsOf = ([a, b, c]) => phases(a, b, c);
    const shadeStops = ([a, b, c], k, tint, amt) => phases(shade(a, k, tint, amt), shade(b, k, tint, amt), shade(c, k, tint, amt));

    function colorAt(stops, t) {
      if (t <= stops[0][0]) return stops[0][1];
      for (let k = 0; k < stops.length - 1; k++) {
        const [ta, ca] = stops[k], [tb, cb] = stops[k + 1];
        if (t >= ta && t <= tb) return tb === ta ? cb : rgb2hex(mix(hex2rgb(ca), hex2rgb(cb), (t - ta) / (tb - ta)));
      }
      return stops[stops.length - 1][1];
    }
    // A global colour schedule -> { initial, keyframes } for a layer that lives [t0, t0 + d). Keyframe `at` is layer-local.
    function colorKeys(prop, stops, t0, d) {
      const initial = { [prop]: colorAt(stops, t0) };
      const keyframes = [];
      for (let k = 0; k < stops.length - 1; k++) {
        const [ta, ca] = stops[k], [tb, cb, ease = 'sine.inOut'] = stops[k + 1];
        if (ca === cb || tb <= t0) continue;
        const start = Math.max(ta, t0);
        if (start - t0 >= d) continue;                        // would start after the layer ends
        keyframes.push({ at: start - t0, to: { [prop]: cb }, duration: Math.min(tb, t0 + d) - start, ease });
      }
      return { initial, keyframes };
    }

    // ---------------------------------------------------------------- palette (dawn, day, dusk)
    const COL = {
      ground: ['#8f9b80', '#9cc97c', '#4a4860'],
      road:   ['#6f6773', '#8e9399', '#35324a'],
      lot:    ['#a6a894', '#c3beb3', '#575164'],
      park:   ['#7e9570', '#84c06c', '#3b4853'],
      canopy: ['#5a7a4e', '#479947', '#2a3842'],
      trunk:  ['#5f4738', '#6d5241', '#2b2531'],
      river:  ['#ad94b8', '#5fb2dc', '#d9806a'],
      deck:   ['#b9aea8', '#d1ccc4', '#5e5569'],
      rail:   ['#7b6e6e', '#8c8a86', '#37304a'],
    };
    const WIN = { dawn: '#8a7386', day: '#6c8ea4', dark: '#3a3651', lit: '#ffd07c' };
    const BASES = ['#efe8da', '#efe8da', '#d9c4a3', '#d9c4a3', '#c96f57', '#5f7284', '#8fb4b0'];
    const CAR_COLORS = ['#f4f1ea', '#e9c46a', '#d7533f', '#4f8fd6', '#2b2b33'];
    // per face: [brightness, tint, tint amount] — the sun is low on the LEFT at dawn, overhead at noon, low on the RIGHT at dusk
    const LIGHT = {
      dawn: { top: [0.96, '#ffb48a', 0.22], left: [1.02, '#ffb48a', 0.32], right: [0.60, '#6a5680', 0.32] },
      day:  { top: [1.10, '#ffffff', 0.00], left: [0.90, '#ffffff', 0.00], right: [0.70, '#cfdcec', 0.14] },
      dusk: { top: [0.66, '#ff8a4a', 0.22], left: [0.42, '#3b3258', 0.42], right: [0.90, '#ff7a3c', 0.42] },
    };
    const faceStops = (base, face) => phases(...['dawn', 'day', 'dusk'].map(p => { const [k, tint, a] = LIGHT[p][face]; return shade(base, k, tint, a); }));

    // ---------------------------------------------------------------- isometric grid
    const N = 12, TW = 72, TH = 36, CX = 640, CY = 194, INSET = 0.1, FLOOR_H = 13;
    const iso = (i, j) => [CX + (i - j) * TW / 2, CY + (i + j) * TH / 2];
    const up = ([x, y], h) => [x, y - h];
    const ROAD_I = [3, 8], ROAD_J = [3, 8], RIVER_J = [5, 6];
    const SLOPE_DEG = Math.atan(TH / TW) * 180 / Math.PI;          // 26.57°, the iso axis angle on screen
    const FW = (1 - 2 * INSET) * TW / 2;                            // a building face's screen width

    const poly = (name, points, stops, t0, d, extra = {}) => {
      const { initial, keyframes } = colorKeys('fillColor', stops, t0, d);
      return { type: 'shape', shape: 'polygon', name, points, colorSpace: 'oklab', initial: { ...initial, ...(extra.initial || {}) }, keyframes: [...keyframes, ...(extra.keyframes || [])] };
    };
    // three visible faces of an iso box standing on tile corners (i0,j0)-(i1,j1), `lift` px above the ground
    function boxFaces(i0, j0, i1, j1, h, lift, base, t0, d) {
      const B = up(iso(i0, j0), lift), R = up(iso(i1, j0), lift), F = up(iso(i1, j1), lift), L = up(iso(i0, j1), lift);
      return [
        poly('left',  [L, F, up(F, h), up(L, h)], faceStops(base, 'left'), t0, d),
        poly('right', [F, R, up(R, h), up(F, h)], faceStops(base, 'right'), t0, d),
        poly('top',   [up(B, h), up(R, h), up(F, h), up(L, h)], faceStops(base, 'top'), t0, d),
      ];
    }

    // ---------------------------------------------------------------- window textures (one per floor count / side / variant, 2x for crispness)
    const assets = [], texCache = new Set(), GLOW_PAD = 10;
    // returns the asset name; `${name}-glow` is the same windows blurred (with GLOW_PAD px around) for an additive bloom
    function winTex(floors, side, variant) {
      const key = `win-${side}-${floors}-${variant}`;
      if (texCache.has(key)) return key;
      const S = 2, h = floors * FLOOR_H, drop = FW / 2;
      const slope = side === 'left' ? x => x / 2 : x => (FW - x) / 2;   // the face's top edge in texture space
      const pad = 4, ww = (FW - pad * 3) / 2, wh = FLOOR_H - 6, quads = [];
      for (let r = 0; r < floors; r++) for (let col = 0; col < 2; col++) {
        if (rnd() > 0.8) continue;                                       // a few windows stay dark
        const x0 = pad + col * (ww + pad), y0 = r * FLOOR_H + 3.5;
        quads.push([[x0, y0 + slope(x0)], [x0 + ww, y0 + slope(x0 + ww)], [x0 + ww, y0 + slope(x0 + ww) + wh], [x0, y0 + slope(x0) + wh]]);
      }
      const draw = (name, margin, blur) => {
        const c = document.createElement('canvas');
        c.width = Math.ceil((FW + 2 * margin) * S); c.height = Math.ceil((h + drop + 2 * margin) * S);
        const g = c.getContext('2d'); g.scale(S, S); g.translate(margin, margin); g.fillStyle = '#ffffff';
        if (blur) g.filter = `blur(${blur}px)`;
        for (const q of quads) { g.beginPath(); q.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); }
        assets.push({ name, src: c.toDataURL() });
      };
      draw(key, 0, 0);
      draw(key + '-glow', GLOW_PAD, 3);
      texCache.add(key);
      return key;
    }

    // ---------------------------------------------------------------- tiles
    const isRoad = (i, j) => ROAD_I.includes(i) || ROAD_J.includes(j);
    const isRiver = (i, j) => RIVER_J.includes(j);
    const tiles = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      if (isRoad(i, j) || isRiver(i, j)) continue;
      const r = rnd();
      const kind = r < 0.7 ? 'building' : r < 0.86 ? 'park' : 'lot';
      const dist = Math.hypot(i + 0.5 - N / 2, j + 0.5 - N / 2) / (N / 2 * Math.SQRT2);   // 0 centre .. 1 corner
      const t0 = 1.6 + ((i + j) / (2 * N)) * 2.4 + rnd() * 0.45;                           // the build sweeps from the back
      const floors = Math.max(2, Math.min(11, Math.round(2 + Math.pow(1 - dist, 1.7) * 8.5 * (0.5 + rnd()))));
      tiles.push({ i, j, kind, dist, t0, floors, base: pick(BASES), variant: rnd() < 0.5 ? 0 : 1, tLit: 8.7 + dist * 1.0 + rnd() * 0.6 });
    }
    tiles.sort((a, b) => (a.i + a.j) - (b.i + b.j) || a.i - b.i);       // painter's order: far first
    const buildings = tiles.filter(t => t.kind === 'building');
    [...buildings].sort((a, b) => b.floors - a.floors).slice(0, 3).forEach(t => { t.crown = true; });

    function building(tile) {
      const { i, j, floors, base, t0 } = tile, h = floors * FLOOR_H, d = DURATION - t0;
      const i0 = i + INSET, i1 = i + 1 - INSET, j0 = j + INSET, j1 = j + 1 - INSET;
      const L = iso(i0, j1), F = iso(i1, j1), R = iso(i1, j0), C = iso(i + 0.5, j + 0.5);
      const winStops = [[0, WIN.dawn], [T_DAY[0], WIN.dawn], [T_DAY[1], WIN.day], [T_DUSK[0], WIN.day], [8.6, WIN.dark], [tile.tLit, WIN.dark], [tile.tLit + 0.5, WIN.lit, 'power2.out']];
      const faces = [['left', L[0], L[1] - h], ['right', F[0], R[1] - h]];
      const windows = faces.map(([side, x, y]) => {
        const { initial, keyframes } = colorKeys('tint', winStops, t0, d);
        return { type: 'image', asset: winTex(floors, side, tile.variant), name: `win-${side}`, colorSpace: 'oklab', initial: { x, y, scale: 0.5, ...initial }, keyframes };
      });
      // additive bloom around the lit windows (blurred copy of the same texture), fades up as they wake
      const glow = faces.map(([side, x, y]) => ({
        type: 'image', asset: winTex(floors, side, tile.variant) + '-glow', name: `glow-${side}`, blendMode: 'add',
        initial: { x: x - GLOW_PAD, y: y - GLOW_PAD, scale: 0.5, tint: '#ff9a40', alpha: 0 },
        keyframes: [{ at: tile.tLit - t0, to: { alpha: 0.45 }, duration: 0.7, ease: 'power2.out' }],
      }));
      const crown = tile.crown ? boxFaces(i0 + 0.26, j0 + 0.26, i1 - 0.26, j1 - 0.26, 12, h, shade(base, 0.96), t0, d) : [];
      return {
        type: 'composition', name: `bldg-${i}-${j}`, width: W, height: H, at: t0, duration: d,
        initial: { x: C[0], y: C[1], pivotX: C[0], pivotY: C[1], scaleY: 0 },
        keyframes: [{ at: 0, to: { scaleY: 1 }, duration: 0.8, ease: 'back.out(1.5)' }],
        sequences: [...boxFaces(i0, j0, i1, j1, h, 0, base, t0, d), ...windows, ...glow, ...crown],
      };
    }

    const patch = (name, i, j, stops, t0) => poly(name, [iso(i + 0.08, j + 0.08), iso(i + 0.92, j + 0.08), iso(i + 0.92, j + 0.92), iso(i + 0.08, j + 0.92)], stops, t0, DURATION - t0,
      { initial: { alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5, ease: 'power2.out' }] });

    function park(tile) {
      const { i, j, t0 } = tile, d = DURATION - t0;
      const layers = [{ ...patch(`park-${i}-${j}`, i, j, stopsOf(COL.park), t0), at: t0, duration: d }];
      const n = 1 + Math.floor(rnd() * 3);
      const spots = Array.from({ length: n }, () => [0.22 + rnd() * 0.56, 0.22 + rnd() * 0.56]).sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
      spots.forEach(([u, v], k) => {
        const [x, y] = iso(i + u, j + v), r = 5 + rnd() * 3.5, tt = t0 + 0.15 + k * 0.12, dd = DURATION - tt;
        const trunk = colorKeys('fillColor', stopsOf(COL.trunk), tt, dd), leaf = colorKeys('fillColor', stopsOf(COL.canopy), tt, dd);
        layers.push({ type: 'shape', shape: 'rect', name: `trunk-${i}-${j}-${k}`, width: 3, height: 0, anchorY: 1, at: tt, duration: dd, colorSpace: 'oklab',
          initial: { x, y, ...trunk.initial }, keyframes: [{ at: 0, to: { height: 9 }, duration: 0.45, ease: 'power3.out' }, ...trunk.keyframes] });
        layers.push({ type: 'shape', shape: 'circle', name: `tree-${i}-${j}-${k}`, radius: 0, at: tt, duration: dd, colorSpace: 'oklab',
          initial: { x, y: y - 8 - r * 0.7, ...leaf.initial }, keyframes: [{ at: 0.1, to: { radius: r }, duration: 0.6, ease: 'back.out(1.6)' }, ...leaf.keyframes] });
      });
      return layers;
    }

    // ---------------------------------------------------------------- bands (roads, river) revealed by a mask that grows along them
    function band(name, pts, stops, t0, dir, revealDur, extra = {}) {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      return {
        ...poly(name, pts, stops, t0, DURATION - t0, extra), at: t0, duration: DURATION - t0,
        mask: {
          type: 'shape', shape: 'rect', width: 0, height: y1 - y0 + 8, anchorX: dir === 'ltr' ? 0 : 1,
          initial: { x: dir === 'ltr' ? x0 - 3 : x1 + 3, y: (y0 + y1) / 2, fillColor: '#ffffff' },
          keyframes: [{ at: 0, to: { width: x1 - x0 + 6 }, duration: revealDur, ease: 'power2.inOut' }],
        },
      };
    }
    const rowBand = j => [iso(0, j), iso(N, j), iso(N, j + 1), iso(0, j + 1)];
    const colBand = i => [iso(i, 0), iso(i + 1, 0), iso(i + 1, N), iso(i, N)];

    function bridge(i, t0) {
      const d = DURATION - t0, lift = 5;
      const j0 = RIVER_J[0] - 0.03, j1 = RIVER_J[RIVER_J.length - 1] + 1.03;
      const B = iso(i, j0), R = iso(i + 1, j0), F = iso(i + 1, j1), L = iso(i, j1), u = p => up(p, lift);
      const pts = [B, R, F, L], xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) - lift - 4, y1 = Math.max(...ys);
      return {
        type: 'composition', name: `bridge-${i}`, width: W, height: H, at: t0, duration: d,
        sequences: [
          poly('side-l', [L, F, u(F), u(L)], shadeStops(COL.deck, 0.7), t0, d),
          poly('side-r', [F, R, u(R), u(F)], shadeStops(COL.deck, 0.84), t0, d),
          poly('deck', [u(B), u(R), u(F), u(L)], stopsOf(COL.deck), t0, d),
          poly('rail-l', [u(B), u(L), up(L, lift + 3), up(B, lift + 3)], stopsOf(COL.rail), t0, d),
          poly('rail-r', [u(R), u(F), up(F, lift + 3), up(R, lift + 3)], stopsOf(COL.rail), t0, d),
        ],
        mask: {
          type: 'shape', shape: 'rect', width: 0, height: y1 - y0 + 8, anchorX: 1,
          initial: { x: x1 + 3, y: (y0 + y1) / 2, fillColor: '#ffffff' },
          keyframes: [{ at: 0, to: { width: x1 - x0 + 6 }, duration: 0.5, ease: 'power2.inOut' }],
        },
      };
    }

    // ---------------------------------------------------------------- cars: tiny rotated boxes on linear, repeating tweens
    function cars() {
      const lanes = [];
      for (const j of ROAD_J) {
        lanes.push({ a: iso(0.04, j + 0.3), b: iso(N - 0.04, j + 0.3), rot: SLOPE_DEG });
        lanes.push({ a: iso(N - 0.04, j + 0.7), b: iso(0.04, j + 0.7), rot: SLOPE_DEG });
      }
      for (const i of ROAD_I) {
        lanes.push({ a: iso(i + 0.3, 0.04), b: iso(i + 0.3, N - 0.04), rot: -SLOPE_DEG });
        lanes.push({ a: iso(i + 0.7, N - 0.04), b: iso(i + 0.7, 0.04), rot: -SLOPE_DEG });
      }
      const out = [];
      lanes.forEach(({ a, b, rot }, k) => {
        const D = 4 + rnd() * 2.5, first = 2.6 + rnd() * 1.8, extra = rnd() < 0.5;
        [first, ...(extra ? [first + D / 2] : [])].forEach((tc, c) => {
          const d = DURATION - tc;
          out.push({
            type: 'shape', shape: 'rect', name: `car-${k}-${c}`, width: 11, height: 6, cornerRadius: 1.2, at: tc, duration: d,
            initial: { x: a[0], y: a[1] - 1, rotation: rot, fillColor: pick(CAR_COLORS) },
            keyframes: [{ at: 0, from: { x: a[0], y: a[1] - 1 }, to: { x: b[0], y: b[1] - 1 }, duration: D, ease: 'none', repeat: Math.max(0, Math.ceil(d / D) - 1) }],
          });
        });
      });
      return out;
    }

    // ---------------------------------------------------------------- the city (one composition, slow push-in)
    const slabCentre = iso(N / 2, N / 2);
    const down = ([x, y], k) => [x, y + k];
    const slab = {
      type: 'composition', name: 'slab', width: W, height: H,
      initial: { x: slabCentre[0], y: slabCentre[1], pivotX: slabCentre[0], pivotY: slabCentre[1], alpha: 0, scale: 0.9 },
      keyframes: [{ at: 0, to: { alpha: 1, scale: 1 }, duration: 0.8, ease: 'power3.out' }],
      sequences: [
        poly('slab-side-l', [iso(0, N), iso(N, N), down(iso(N, N), 16), down(iso(0, N), 16)], shadeStops(COL.ground, 0.52, '#3b3258', 0.2), 0, DURATION),
        poly('slab-side-r', [iso(N, N), iso(N, 0), down(iso(N, 0), 16), down(iso(N, N), 16)], shadeStops(COL.ground, 0.66), 0, DURATION),
        poly('ground', [iso(0, 0), iso(N, 0), iso(N, N), iso(0, N)], stopsOf(COL.ground), 0, DURATION),
      ],
    };
    const roads = [
      band('river', [iso(0, RIVER_J[0]), iso(N, RIVER_J[0]), iso(N, RIVER_J[1] + 1), iso(0, RIVER_J[1] + 1)], stopsOf(COL.river), 1.0, 'ltr', 1.2),
      band('road-j3', rowBand(ROAD_J[0]), stopsOf(COL.road), 0.7, 'ltr', 1.0),
      band('road-j8', rowBand(ROAD_J[1]), stopsOf(COL.road), 0.9, 'ltr', 1.0),
      band('road-i3', colBand(ROAD_I[0]), stopsOf(COL.road), 1.2, 'rtl', 1.0),
      band('road-i8', colBand(ROAD_I[1]), stopsOf(COL.road), 1.4, 'rtl', 1.0),
      bridge(ROAD_I[0], 2.1), bridge(ROAD_I[1], 2.3),
    ];
    const blocks = tiles.flatMap(t => t.kind === 'building' ? [building(t)] : t.kind === 'park' ? park(t) : [{ ...patch(`lot-${t.i}-${t.j}`, t.i, t.j, stopsOf(COL.lot), t.t0), at: t.t0, duration: DURATION - t.t0 }]);
    const city = {
      type: 'composition', name: 'city', width: W, height: H,
      initial: { x: slabCentre[0], y: slabCentre[1], pivotX: slabCentre[0], pivotY: slabCentre[1], scale: 0.97 },
      keyframes: [{ at: 0, to: { scale: 1.03 }, duration: DURATION, ease: 'none' }],
      sequences: [slab, ...roads, ...cars(), ...blocks],
    };

    // ---------------------------------------------------------------- sky, sun, stars
    const skyRect = (name, stops, keyframes = [], alpha = 1) => ({
      type: 'shape', shape: 'rect', name, width: W, height: H, initial: { x: W / 2, y: H / 2, alpha }, fillGradient: { stops }, keyframes,
    });
    const sky = [
      skyRect('sky-dawn', [[0, '#4a3f66'], [0.55, '#b87b90'], [1, '#f6bb8e']]),
      skyRect('sky-day',  [[0, '#4b90d4'], [0.6, '#9fcde9'], [1, '#e2eef5']], [{ at: T_DAY[0], to: { alpha: 1 }, duration: T_DAY[1] - T_DAY[0], ease: 'sine.inOut' }], 0),
      skyRect('sky-dusk', [[0, '#1b1834'], [0.5, '#6a3a68'], [1, '#f08a5a']], [{ at: T_DUSK[0], to: { alpha: 1 }, duration: T_DUSK[1] - T_DUSK[0], ease: 'sine.inOut' }], 0),
    ];
    const stars = [];
    while (stars.length < 40) {
      const x = 40 + rnd() * 1200, y = 24 + rnd() * 150;
      if ((x < 620 && y < 185) || (x > 900 && y < 100)) continue;        // keep the title and the label clean
      const t = 10.3 + rnd() * 0.9;
      stars.push({ type: 'shape', shape: 'circle', name: `star-${stars.length}`, radius: 0.9 + rnd() * 1, initial: { x, y, fillColor: '#fff4dc', alpha: 0 },
        keyframes: [{ at: t, to: { alpha: 0.5 + rnd() * 0.45 }, duration: 0.8, ease: 'sine.out' }] });
    }
    const sunPath = [
      { at: 0.3, from: { x: 320 }, to: { x: 980 }, duration: 10.5, ease: 'none' },
      { at: 0.3, to: { y: 112 }, duration: 5.25, ease: 'sine.out' },
      { at: 5.55, to: { y: 384 }, duration: 5.25, ease: 'sine.in' },
    ];
    const sunStops = phases('#ffb27a', '#fff3d2', '#ff7444');
    const sunColour = colorKeys('fillColor', sunStops, 0, DURATION);
    const sun = [
      { type: 'shape', shape: 'circle', name: 'sun-halo', radius: 170, blendMode: 'add', initial: { x: 320, y: 384 }, keyframes: sunPath,
        fillGradient: { type: 'radial', stops: [[0, 'rgba(255,170,100,0.5)'], [0.45, 'rgba(255,140,80,0.14)'], [1, 'rgba(255,140,80,0)']] } },
      { type: 'shape', shape: 'circle', name: 'sun', radius: 44, colorSpace: 'oklab', initial: { x: 320, y: 384, ...sunColour.initial }, keyframes: [...sunPath, ...sunColour.keyframes] },
    ];
    const vignette = { type: 'shape', shape: 'rect', name: 'vignette', width: W, height: H, initial: { x: W / 2, y: H / 2 },
      fillGradient: { type: 'radial', radius: 0.78, stops: [[0.5, 'rgba(18,14,34,0)'], [1, 'rgba(18,14,34,0.42)']] } };

    // ---------------------------------------------------------------- type
    const SERIF = 'Georgia, "Times New Roman", serif';
    const SANS = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif';
    const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    const text = [
      { type: 'text', name: 'label', text: `seed 2040  ·  ${N} × ${N}  ·  ${buildings.length} buildings`, at: 0.5, style: { fontSize: 15, fontFamily: MONO, fill: '#fff5e8', letterSpacing: 1 },
        initial: { x: 1184, y: 72, anchorX: 1, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 0.55 }, duration: 0.8 }] },
      { type: 'text', name: 'title', text: 'Kōbe, 2040', at: 10.0, style: { fontSize: 62, fontFamily: SERIF, fill: '#fff3e4', letterSpacing: 1 },
        initial: { x: 96, y: 92, anchorX: 0, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 104 }, to: { alpha: 1, y: 92 }, duration: 1.0, ease: 'power3.out' }] },
      { type: 'shape', shape: 'rect', name: 'rule', width: 0, height: 2, anchorX: 0, at: 10.2, initial: { x: 98, y: 140, fillColor: '#ffcf7c' },
        keyframes: [{ at: 0, to: { width: 64 }, duration: 0.7, ease: 'power3.out' }] },
      { type: 'text', name: 'subtitle', text: '神戸  —  a city that builds itself', at: 10.35, style: { fontSize: 19, fontFamily: SANS, fill: '#fff3e4', letterSpacing: 2 },
        initial: { x: 98, y: 165, anchorX: 0, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 173 }, to: { alpha: 0.78, y: 165 }, duration: 0.9, ease: 'power3.out' }] },
    ];

    // ---------------------------------------------------------------- sound: a bed, a whoosh for the river, pops for the tallest towers, a chime for the title
    const landmarks = [...buildings].sort((a, b) => b.floors - a.floors).slice(0, 7);
    const audio = [
      { type: 'audio', name: 'bgm', asset: 'bgm', loop: true, volume: 0, keyframes: [{ at: 0, to: { volume: 0.3 }, duration: 1.5 }, { at: -2.5, to: { volume: 0 }, duration: 2.5 }] },
      { type: 'audio', name: 'swoosh-river', sfx: 'swoosh', at: 1.0, volume: 0.43 },
      ...landmarks.map((t, k) => ({ type: 'audio', name: `pop-${k}`, sfx: 'pop', at: Math.round(t.t0 * FPS) / FPS, volume: 0.25 })),
      { type: 'audio', name: 'chime-title', sfx: 'chime', at: 10.0, volume: 0.1 },
    ];
    assets.push(
      { name: 'bgm', src: '../_assets/bgm.mp3' },
    );

    const sequences = [...sky, ...stars, ...sun, city, vignette, ...text, ...audio];

    const movie = new Movie();
    window.movie = movie;
    window.POSTER_FRAME = POSTER_FRAME;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        background: '#1b1834',
        assets,
        composition: { sequences },
      });
      window.__ready = true;
      if (new URLSearchParams(location.search).has('poster')) await movie.gotoFrame(POSTER_FRAME, true);
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
