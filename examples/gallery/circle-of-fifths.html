<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circle of Fifths — chords by tonal (pixi-effects)</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #07080b; margin: 0; padding: 16px; min-height: 100vh; box-sizing: border-box;
           display: flex; align-items: center; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 8px; --pe-loader-bg: #07080b; background: #07080b; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script type="application/json" id="piece-meta">{
    "title": "Circle of Fifths",
    "subtitle": "The progression I–V–vi–IV played in four keys, one step round the wheel each time: the wheel, a keyboard and the music all come from the same chords, which tonal works out",
    "tags": ["tonal", "music-theory", "circle-of-fifths", "piano", "music", "editorial"],
    "width": 1280, "height": 720, "duration": 21.5, "model": "sonnet"
  }</script>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0",
      "tonal":                   "https://cdn.jsdelivr.net/npm/tonal@6.5.0/+esm"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    import { Key, Chord, Note } from 'tonal';

    // ---------------------------------------------------------------- canvas / timeline
    const W = 1280, H = 720, FPS = 30, M = 72;
    const INK = '#f1ede6', BG = '#07080b', OR = '#ff5a1f', BL = '#3d6bff', DIM = '#7d8190', RING = '#10131c', EDGE = '#2b3045';
    const SANS = 'Helvetica Neue, Helvetica, Arial, sans-serif', MONO = 'Menlo, Consolas, monospace';
    const BPM = 120, BEAT = 60 / BPM, T0 = 2.0, CHORD = 2 * BEAT, KEYS = ['C', 'G', 'D', 'A'];   // a chord lasts two beats; the film starts at 2 s
    const DEG = [0, 4, 5, 3], ROMAN = ['I', 'V', 'vi', 'IV'];                                    // I V vi IV, as indexes into the key's seven triads
    const KEY_LEN = DEG.length * CHORD, DURATION = T0 + KEYS.length * KEY_LEN + 3.5;

    // ---------------------------------------------------------------- tonal knows the theory: the wheel, the chords, their notes
    // The circle of fifths: C G D A E B, F#, then the flats back to F (tonal spells them: transposeFifths).
    const wheel = Array.from({ length: 12 }, (_, i) => Note.transposeFifths('C', i < 7 ? i : i - 12));
    const minorOf = (k) => Key.majorKey(k).minorRelative + 'm';                                  // the relative minor sits inside the same step
    const keySig = (k) => { const n = Key.majorKey(k).alteration; return n === 0 ? 'no ♯ or ♭' : Math.abs(n) + (n > 0 ? ' ♯' : ' ♭'); };
    // Every chord of the film: its name, its notes (with octaves, from tonal) and where it sits on the wheel.
    const events = KEYS.flatMap((k, ki) => {
      const triads = Key.majorKey(k).triads;
      return DEG.map((d, di) => {
        const name = triads[d], c = Chord.get(name), notes = Chord.notes(c.type, c.tonic + '3');
        const minor = c.type === 'minor';
        const ring = minor ? wheel.indexOf(Key.minorKey(c.tonic).relativeMajor) : wheel.indexOf(c.tonic);
        return { n: ki * DEG.length + di, key: k, ki, roman: ROMAN[di], name, notes, tonic: c.tonic, minor, pos: ring, at: T0 + ki * KEY_LEN + di * CHORD, dur: CHORD };
      });
    });
    // the film ends on the home chord of the last key, held (the music does the same)
    { const k = KEYS[KEYS.length - 1], name = Key.majorKey(k).triads[0], c = Chord.get(name);
      events.push({ n: events.length, key: k, ki: KEYS.length - 1, roman: 'I', name, notes: Chord.notes(c.type, c.tonic + '3'), tonic: c.tonic, minor: false, pos: wheel.indexOf(c.tonic), at: T0 + KEYS.length * KEY_LEN, dur: 3.5 }); }

    // ---------------------------------------------------------------- the wheel (a polygon is placed by the centre of its bounds)
    const CX = 372, CY = 392, R1 = 268, R0 = 188, R00 = 176, R000 = 104;
    const pt = (r, deg) => [CX + r * Math.sin(deg * Math.PI / 180), CY - r * Math.cos(deg * Math.PI / 180)];
    const annulus = (rIn, rOut, a0, a1) => {
      const n = Math.max(2, Math.ceil((a1 - a0) / 3)), out = [], inn = [];
      for (let i = 0; i <= n; i++) { out.push(pt(rOut, a0 + (a1 - a0) * i / n)); inn.unshift(pt(rIn, a0 + (a1 - a0) * i / n)); }
      return [...out, ...inn];
    };
    const poly = (pts, initial, extra = {}) => {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), mx = (Math.min(...xs) + Math.max(...xs)) / 2, my = (Math.min(...ys) + Math.max(...ys)) / 2;
      return { type: 'shape', shape: 'polygon', points: pts.map(p => [p[0] - mx, p[1] - my]), initial: { x: mx, y: my, ...initial }, ...extra };
    };
    const seg = (i, minor) => { const c = i * 30, g = 1.2; return minor ? annulus(R000, R00, c - 15 + g, c + 15 - g) : annulus(R0, R1, c - 15 + g, c + 15 - g); };
    const fadeIn = (at, d = 0.3) => ({ at, to: { alpha: 1 }, duration: d });

    const wheelSegs = wheel.flatMap((_, i) => [
      poly(seg(i, false), { fillColor: RING, strokeColor: EDGE, strokeWidth: 1.5, alpha: 0 }, { keyframes: [fadeIn(0.1 + i * 0.05)] }),
      poly(seg(i, true), { fillColor: RING, strokeColor: EDGE, strokeWidth: 1.5, alpha: 0 }, { keyframes: [fadeIn(0.4 + i * 0.05)] }),
    ]);
    const label = (text, x, y, size, color, at, weight = '700', mono = false) => ({ type: 'text', text, style: { fontSize: size, fontFamily: mono ? MONO : SANS, fontWeight: weight, fill: color }, initial: { x, y, anchorX: 0.5, anchorY: 0.5, alpha: 0 }, keyframes: [fadeIn(at)] });
    const labels = wheel.flatMap((k, i) => {
      const [x, y] = pt((R0 + R1) / 2, i * 30), [mx, my] = pt((R00 + R000) / 2, i * 30);
      return [label(k, x, y, 36, INK, 0.3 + i * 0.05), label(minorOf(k), mx, my, 24, DIM, 0.6 + i * 0.05, '400')];
    });
    // the three neighbours IV, I, V of a key (and its relative minor) are one small corner of the wheel
    const regions = KEYS.map((k, ki) => {
      const i = wheel.indexOf(k), at = T0 + ki * KEY_LEN - 0.2;
      return poly(annulus(R000 - 4, R1 + 6, (i - 1) * 30 - 15, (i + 1) * 30 + 15), { fillColor: BL, alpha: 0 }, { at, duration: KEY_LEN + 0.6,
        keyframes: [{ at: 0, to: { alpha: 0.28 }, duration: 0.3 }, { at: -0.3, to: { alpha: 0 }, duration: 0.3 }] });
    });
    // the chord that sounds lights its own segment (outer ring for a major chord, inner ring for the minor)
    const lit = events.map(e => poly(seg(e.pos, e.minor), { fillColor: OR, alpha: 0 }, { at: e.at, duration: e.dur, keyframes: [{ at: 0, to: { alpha: 0.95 }, duration: 0.08 }, { at: 0.12, to: { alpha: 0.7 }, duration: Math.min(e.dur - 0.2, 0.9) }] }));
    const litLabels = events.map(e => { const [x, y] = pt(e.minor ? (R00 + R000) / 2 : (R0 + R1) / 2, e.pos * 30);
      return { type: 'text', text: e.minor ? minorOf(wheel[e.pos]) : wheel[e.pos], at: e.at, duration: e.dur, style: { fontSize: e.minor ? 26 : 38, fontFamily: SANS, fontWeight: '700', fill: '#07080b' }, initial: { x, y, anchorX: 0.5, anchorY: 0.5 } }; });
    // a line from the last chord to this one
    const links = events.slice(1).map((e, i) => { const p = events[i], a = pt(p.minor ? (R00 + R000) / 2 : (R0 + R1) / 2, p.pos * 30), b = pt(e.minor ? (R00 + R000) / 2 : (R0 + R1) / 2, e.pos * 30);
      return p.pos === e.pos && p.minor === e.minor ? null : { type: 'shape', shape: 'line', from: a, to: b, trimEnd: 0, at: e.at, duration: Math.min(e.dur, CHORD), strokeCap: 'round', initial: { strokeColor: OR, strokeWidth: 3 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.22, ease: 'power2.out' }, { at: CHORD - 0.35, to: { strokeAlpha: 0 }, duration: 0.3 }] }; }).filter(Boolean);
    const hub = [
      { type: 'text', text: KEYS[0], style: { fontSize: 84, fontFamily: SANS, fontWeight: '800', fill: INK, letterSpacing: -3 }, initial: { x: CX, y: CY - 14, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...KEYS.map((k, ki) => ({ at: T0 + ki * KEY_LEN, set: { text: k } }))] },
      { type: 'text', text: keySig(KEYS[0]), style: { fontSize: 22, fontFamily: MONO, fill: DIM }, initial: { x: CX, y: CY + 44, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...KEYS.map((k, ki) => ({ at: T0 + ki * KEY_LEN, set: { text: keySig(k) } }))] },
    ];

    // ---------------------------------------------------------------- the right side: what is sounding, and the keys under it
    const side = [
      { type: 'text', text: `key of ${KEYS[0]} major`, style: { fontSize: 24, fontFamily: MONO, fill: DIM }, initial: { x: 716, y: 128, anchorX: 0, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...KEYS.map((k, ki) => ({ at: T0 + ki * KEY_LEN, set: { text: `key of ${k} major · ${keySig(k)}` } }))] },
      { type: 'text', text: events[0].name, style: { fontSize: 190, fontFamily: SANS, fontWeight: '800', fill: INK, letterSpacing: -8 }, initial: { x: 706, y: 250, anchorX: 0, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...events.flatMap(e => [{ at: e.at, set: { text: e.name } }, { at: e.at, from: { scale: 1.12, fill: OR }, to: { scale: 1, fill: INK }, duration: 0.35, ease: 'expo.out' }])] },
      { type: 'text', text: events[0].roman, style: { fontSize: 40, fontFamily: SANS, fontWeight: '300', fill: BL }, initial: { x: 716, y: 372, anchorX: 0, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...events.map(e => ({ at: e.at, set: { text: e.roman } }))] },
      { type: 'text', text: events[0].notes.map(n => n.replace(/\d/, '')).join('  '), style: { fontSize: 28, fontFamily: MONO, fill: INK }, initial: { x: 800, y: 372, anchorX: 0, anchorY: 0.5, alpha: 0 },
        keyframes: [fadeIn(T0 - 0.3), ...events.map(e => ({ at: e.at, set: { text: e.notes.map(n => n.replace(/\d/, '')).join('  ') } }))] },
    ];
    const KX = 716, KY = 440, KW = 540 / 14, KH = 150, BW = KW * 0.6, BH = 92, BASE = 48;           // two octaves from C3
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const keyX = (midi) => { const o = Math.floor((midi - BASE) / 12), pc = ((midi - BASE) % 12 + 12) % 12, wi = o * 7 + WHITE.filter(w => w <= pc).length - 1;
      return WHITE.includes(pc) ? KX + wi * KW + KW / 2 : KX + (wi + 1) * KW; };
    const isWhite = (midi) => WHITE.includes(((midi - BASE) % 12 + 12) % 12);
    const midis = Array.from({ length: 24 }, (_, i) => BASE + i);
    const keyboard = [
      ...midis.filter(isWhite).map((m, i) => ({ type: 'shape', shape: 'rect', width: KW - 3, height: KH, cornerRadius: 5, anchorY: 0, initial: { x: keyX(m), y: KY, fillColor: INK, alpha: 0 }, keyframes: [fadeIn(0.8 + i * 0.03)] })),
      ...events.flatMap(e => e.notes.map(n => Note.midi(n)).filter(m => isWhite(m)).map(m => ({ type: 'shape', shape: 'rect', width: KW - 3, height: KH, cornerRadius: 5, anchorY: 0, at: e.at, duration: e.dur, initial: { x: keyX(m), y: KY, fillColor: OR, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.08 }, { at: e.dur - 0.15, to: { alpha: 0 }, duration: 0.15 }] }))),
      ...midis.filter(m => !isWhite(m)).map((m, i) => ({ type: 'shape', shape: 'rect', width: BW, height: BH, cornerRadius: 4, anchorY: 0, initial: { x: keyX(m), y: KY, fillColor: '#12151f', strokeColor: EDGE, strokeWidth: 1.5, alpha: 0 }, keyframes: [fadeIn(0.9 + i * 0.03)] })),
      ...events.flatMap(e => e.notes.map(n => Note.midi(n)).filter(m => !isWhite(m)).map(m => ({ type: 'shape', shape: 'rect', width: BW, height: BH, cornerRadius: 4, anchorY: 0, at: e.at, duration: e.dur, initial: { x: keyX(m), y: KY, fillColor: OR, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.08 }, { at: e.dur - 0.15, to: { alpha: 0 }, duration: 0.15 }] }))),
    ];

    // ---------------------------------------------------------------- words
    const rise = (text, x, y, size, o = {}) => ({ type: 'text', text, at: o.at ?? 0, duration: o.duration, style: { fontSize: size, fontFamily: o.mono ? MONO : SANS, fontWeight: o.weight ?? '700', fill: o.fill ?? INK, letterSpacing: o.spacing ?? -size * 0.04 },
      mask: { type: 'shape', shape: 'rect', width: 1100, height: size * 1.15, initial: { x, y: y - size * 0.14, anchorX: 0, anchorY: 0, fillColor: '#ffffff' } },
      initial: { x, y: y + size * 1.15, anchorX: 0, anchorY: 0 }, keyframes: [{ at: 0, to: { y }, duration: 0.5, ease: 'expo.out' }] });
    const words = [
      rise('Circle of fifths', M, 46, 40, { at: 0.1 }),
      rise('I – V – vi – IV, four keys, one small step each', M, H - 74, 22, { mono: true, weight: '400', fill: DIM, at: 1.0, spacing: 0 }),
      { type: 'text', text: 'same four chords, one step round the circle', at: T0 + KEYS.length * KEY_LEN, style: { fontSize: 26, fontFamily: SANS, fontWeight: '300', fill: INK }, initial: { x: 716, y: 632, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [fadeIn(0, 0.5)] },
      { type: 'text', text: 'chords and keys: tonal  ·  the music is text', at: T0 + KEYS.length * KEY_LEN + 0.6, style: { fontSize: 20, fontFamily: MONO, fill: DIM }, initial: { x: 716, y: 672, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [fadeIn(0, 0.5)] },
    ];

    // ---------------------------------------------------------------- sound: written as text from the SAME chords the picture shows
    const low = (n) => n.toLowerCase();
    const body16 = events.slice(0, -1), home = events[events.length - 1];
    const pad = body16.map(e => `[${e.notes.map(low).join(' ')}]:2`).join(' ');
    const bass = body16.map(e => `${low(e.tonic)}2:1.5 ${low(e.tonic)}2:0.5`).join(' ');
    const arp = body16.map(e => { const up = e.notes.map(n => low(Note.transpose(n, '8P'))); return [0, 1, 2, 1].map(i => `${up[i % up.length]}:0.5`).join(' '); }).join(' ');
    const last = home, outroChord = `[${home.notes.map(low).join(' ')}]:7`;
    const music = { type: 'audio', at: 0, duration: DURATION, volume: 0.7, music: { bpm: BPM, reverb: 0.3, tail: 2, seed: 9, tracks: [
      { inst: 'pad', vol: 0.5, notes: `_:4 ${pad} ${outroChord}` },
      { inst: 'bass', vol: 0.45, notes: `_:4 ${bass} ${low(last.tonic)}2:7` },
      { inst: 'pluck', vol: 0.32, notes: `_:4 ${arp}` },
    ], drums: { kick: 'x...x...x...x...', hat: '..x...x...x...x.' } } };
    const sfx = [...KEYS.slice(1).map((_, ki) => ({ type: 'audio', sfx: 'swoosh', at: T0 + (ki + 1) * KEY_LEN - 0.05, volume: 0.4 })),
      { type: 'audio', sfx: 'chime', at: T0 + KEYS.length * KEY_LEN + 0.05, volume: 0.5 }];

    const bgLayers = [
      { type: 'shape', shape: 'rect', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: BG } },
      { type: 'shape', shape: 'circle', radius: 640, initial: { x: CX, y: CY }, fillGradient: { type: 'radial', stops: [[0, 'rgba(61,107,255,0.22)'], [1, 'rgba(61,107,255,0)']] } },
      { type: 'shape', shape: 'circle', radius: 520, initial: { x: 1180, y: 640 }, fillGradient: { type: 'radial', stops: [[0, 'rgba(255,90,31,0.16)'], [1, 'rgba(255,90,31,0)']] } },
    ];
    const sequences = [...bgLayers, ...wheelSegs, ...regions, ...lit, ...links, ...labels, ...litLabels, ...hub, ...side, ...keyboard, ...words, music, ...sfx];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: W, height: H, duration: DURATION, frameRate: FPS, poster: T0 + KEY_LEN * 2 + CHORD * 2 + 0.3, background: BG,
        composition: { sequences, filters: [{ type: 'grain', name: 'g', amount: 0.02, size: 1.4, color: 0.2 }] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
