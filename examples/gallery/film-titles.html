<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Long Night — title sequence</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    body { background: #0b0d0e; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 6px; --pe-loader-bg: #0b0d0e; background: #0b0d0e; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">{ "title": "The Long Night", "subtitle": "Main-title sequence for an imaginary thriller: a PixiJS 3D shard in fog, letterboxed credits, film grain", "tags": ["PixiJS 3D", "title sequence", "typography", "film grain", "letterbox"], "width": 1280, "height": 720, "duration": 14, "model": "opus" }</script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/3d":         "../../dist/3d.js",
      "@pixi/3d":                "https://cdn.jsdelivr.net/npm/@pixi/3d@0.1.0/dist/pixijs-3d.min.mjs"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    import { register3D } from 'pixi-effects/3d';
    import { Container3D, DirectionalLight, FlatMaterial, Geometry3D, Material3D, Mesh3D, ParticleContainer3D, PointLight, TorusGeometry } from '@pixi/3d';
    import { BlurFilter } from 'pixi.js';

    register3D();     // before movie.init

    const W = 1280, H = 720, FPS = 30, DURATION = 14;
    const POSTER_FRAME = 405;

    // ---------- palette (desaturated teal / amber) ----------
    const C = {
      night:  '#070b0c',
      fog:    0x0a1315,
      teal:   '#6f9497',
      amber:  '#c4975c',
      paper:  '#e4ddcf',
      dim:    '#8f8a80',
    };
    const SERIF = 'Georgia, "Times New Roman", serif';
    const BAR = Math.round((H - W / 2.39) / 2);       // 2.39:1 letterbox -> 92 px bars
    const EASE_IN = 'power2.out', EASE_OUT = 'power2.in', EASE_MOVE = 'sine.inOut';

    // seeded RNG (Park–Miller) so playback, scrubbing and export are identical
    const rng = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const SWEEP_PEAK = 115;                            // the passing light's peak (see the sweep light below)

    const blur = (name, strength) => ({ type: 'custom', name, filter: new BlurFilter({ strength, quality: 3 }) });

    // ---------- 3D: a faceted shard in fog, amber key, teal rim, a passing light ----------
    // the stone: an icosahedron split once (each face into four, pushed out to the sphere), every corner pulled in or out
    // by a seeded amount and stretched in y, so it reads as a cut stone, not a ball; flat faces, one normal per triangle
    function shardGeometry() {
      const g = (1 + Math.sqrt(5)) / 2;
      const V = [[-1, g, 0], [1, g, 0], [-1, -g, 0], [1, -g, 0], [0, -1, g], [0, 1, g], [0, -1, -g], [0, 1, -g], [g, 0, -1], [g, 0, 1], [-g, 0, -1], [-g, 0, 1]];
      const F = [0, 11, 5, 0, 5, 1, 0, 1, 7, 0, 7, 10, 0, 10, 11, 1, 5, 9, 5, 11, 4, 11, 10, 2, 10, 7, 6, 7, 1, 8,
                 3, 9, 4, 3, 4, 2, 3, 2, 6, 3, 6, 8, 3, 8, 9, 4, 9, 5, 2, 4, 11, 6, 2, 10, 8, 6, 7, 9, 8, 1];
      const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
      const tri = [];                                            // one subdivision: 4 triangles per face, in a fixed order
      for (let f = 0; f < F.length; f += 3) {
        const [a, b, c] = [V[F[f]], V[F[f + 1]], V[F[f + 2]]];
        const a1 = lerp(a, c, 0.5), b1 = lerp(b, c, 0.5);
        const v = [[a, lerp(a, b, 0.5), lerp(a, b, 1)], [a1, lerp(a1, b1, 1)], [lerp(a, c, 1)]];
        tri.push(v[0][1], v[1][0], v[0][0],  v[0][1], v[1][1], v[1][0],  v[0][2], v[1][1], v[0][1],  v[1][1], v[2][0], v[1][0]);
      }
      const R = 1.22, r = rng(11), moved = new Map();
      const pos = new Float32Array(tri.length * 3);
      tri.forEach((p, i) => {
        const inv = 1 / (Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]) || 1), s = p.map(n => n * inv * R);
        const f32 = Float32Array.from(s);
        const key = Array.from(f32, n => n.toFixed(3)).join(',');
        if (!moved.has(key)) moved.set(key, 0.82 + r() * 0.3);
        const k = moved.get(key);
        pos.set([f32[0] * k, f32[1] * k * 1.25, f32[2] * k], i * 3);
      });
      const nrm = new Float32Array(pos.length);
      for (let i = 0; i < pos.length; i += 9) {
        const e1 = [pos[i + 3] - pos[i], pos[i + 4] - pos[i + 1], pos[i + 5] - pos[i + 2]];
        const e2 = [pos[i + 6] - pos[i], pos[i + 7] - pos[i + 1], pos[i + 8] - pos[i + 2]];
        const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
        const l = Math.hypot(...n);
        for (let k = 0; k < 3; k++) nrm.set([n[0] / l, n[1] / l, n[2] / l], i + k * 3);
      }
      // its edges: every side of every triangle once (the facets all differ, so every side is a crease)
      const seen = new Set(), lines = [];
      const keyOf = (i) => `${pos[i * 3].toFixed(4)},${pos[i * 3 + 1].toFixed(4)},${pos[i * 3 + 2].toFixed(4)}`;
      for (let t = 0; t < pos.length / 9; t++) for (const [a, b] of [[0, 1], [1, 2], [2, 0]]) {
        const ia = t * 3 + a, ib = t * 3 + b, ka = keyOf(ia), kb = keyOf(ib), k = ka < kb ? ka + '|' + kb : kb + '|' + ka;
        if (seen.has(k)) continue;
        seen.add(k);
        lines.push(...pos.subarray(ia * 3, ia * 3 + 3), ...pos.subarray(ib * 3, ib * 3 + 3));
      }
      return {
        solid: new Geometry3D({ positions: pos, normals: nrm }),
        edges: new Geometry3D({ positions: new Float32Array(lines), topology: 'line-list' }),
      };
    }

    const shard = {
      type: 'scene3d', name: 'shard', width: 'GW', height: 'GH',
      initial: { x: 0, y: 0 },
      // no background: the 2D haze behind shows through; the fog colours the stone and the dust only
      view: { toneMapping: 'none', fog: { type: 'exp2', color: C.fog, density: 0.075 },
              environment: { skyColor: 0x2c4a4d, groundColor: 0x050607, intensity: 0.9 / Math.PI } },    // the hemisphere fill
      setup: ({ root, camera }) => {
        const { solid, edges } = shardGeometry();
        const stone = new Mesh3D({ geometry: solid, material: new Material3D({ baseColor: 0x1b2427, roughness: 0.42, metallic: 0.35, flatShading: true }) });
        stone.addChild(new Mesh3D({ geometry: edges, castShadow: false,
          material: new FlatMaterial({ baseColor: 0x7fa6a8, alphaMode: 'blend', alpha: 0.18 }) }));
        const pivot = new Container3D();
        pivot.addChild(stone);
        pivot.position.set(0, 0.62, 0);
        pivot.rotation.z = 0.12;
        root.addChild(pivot);

        // a thin orbit ring, barely there (a torus lies in XZ: stood up into XY, then tilted)
        const ring = new Container3D();
        ring.rotation.set(1.32, 0.18, 0);
        ring.addChild(new Mesh3D({ geometry: new TorusGeometry({ radius: 2.25, tube: 0.006, radialSegments: 6, tubularSegments: 220 }),
          rotation: { x: Math.PI / 2, y: 0, z: 0 }, castShadow: false,
          material: new FlatMaterial({ baseColor: 0xc4975c, alphaMode: 'blend', alpha: 0.35 }) }));
        pivot.addChild(ring);

        // dust in the fog (seeded; the cloud drifts purely from t in update): small square specks, sized in world units
        // (0.014: one to three pixels across, as far as the dust reaches)
        const dr = rng(5), N = 160;
        const dust = new ParticleContainer3D({ capacity: N, space: 'local' });
        for (let i = 0; i < N; i++) {
          dust.setParticleAt(i, (dr() - 0.5) * 12, (dr() - 0.5) * 7, (dr() - 0.5) * 8, 0.014, 0, 0x9fb6b4, 0.35);
        }
        dust.upload();
        root.addChild(dust);

        const key = new DirectionalLight({ color: 0xd29a58, intensity: 3.4, position: { x: -4, y: 3, z: 3 } });
        key.lookAt({ x: 0, y: 0, z: 0 });
        const rim = new DirectionalLight({ color: 0x6f9a9a, intensity: 2.2, position: { x: 3.5, y: 1.5, z: -4 } });
        rim.lookAt({ x: 0, y: 0, z: 0 });
        // headlights passing, driven by keyframes; PixiJS 3D's point light falls with the square of the distance (three.js's decay 1.2 fell slower),
        // so its peak is set higher for the same light on the stone as it passes in front
        const sweep = new PointLight({ color: 0xe0a865, intensity: 0, range: 14, position: { x: -7, y: -0.6, z: 3.2 } });
        root.addChild(key, rim, sweep);

        camera.fov = 50; camera.near = 0.1; camera.far = 2000;
        camera.position.set(0, 0.15, 8.2);
        camera.lookAt({ x: 0, y: 0.2, z: 0 });      // the push-in below moves it along z; it keeps this aim
        return { objects: { stone, pivot, key, sweep, dust } };
      },
      update: (t, { objects: { dust } }) => {
        dust.rotation.y = t * 0.018;
        dust.position.y = t * 0.025;
      },
      keyframes: [
        { at: 0, to: { 'scene3d.pivot.rotation.y': Math.PI * 0.85 }, duration: DURATION, ease: 'none' },
        { at: 0, to: { 'scene3d.stone.rotation.x': 0.35 }, duration: DURATION, ease: EASE_MOVE },
        // the slow push-in
        { at: 0, to: { 'scene3d.camera.position.z': 5.9 }, duration: DURATION, ease: 'power1.inOut' },
        // a light passes left -> right, like a car outside
        { at: 4.6, to: { 'scene3d.sweep.intensity': SWEEP_PEAK }, duration: 1.6, ease: 'sine.in' },
        { at: 4.6, to: { 'scene3d.sweep.position.x': 7 }, duration: 5.2, ease: EASE_MOVE },
        { at: 8.2, to: { 'scene3d.sweep.intensity': 0 }, duration: 1.6, ease: 'sine.out' },
        // the key light drops when the title arrives: the night closes in
        { at: 9.6, to: { 'scene3d.key.intensity': 1.5 }, duration: 2.4, ease: EASE_MOVE },
      ],
    };

    // vignette over the 3D, under the type
    const vignette = {
      type: 'shape', shape: 'rect', name: 'vignette', width: W, height: H,
      initial: { x: W / 2, y: H / 2, fillGradient: { type: 'radial', stops: [[0, 'rgba(4,7,8,0)'], [0.55, 'rgba(4,7,8,0.15)'], [1, 'rgba(4,7,8,0.85)']] } },
    };

    // ---------- credits ----------
    // a credit = small italic role line + tracked caps name; fade/drift in, hold, fade out
    function credit({ name, at, dur, role, names, x, y, align = 'left' }) {
      const ax = align === 'left' ? 0 : align === 'right' ? 1 : 0.5;
      const drift = (k) => [
        { at: 0, from: { alpha: 0 }, duration: 1.0, ease: EASE_IN },
        { at: 0, from: { y: y + k + 10 }, to: { y: y + k - 4 }, duration: dur, ease: 'none' },
        { at: -0.8, to: { alpha: 0 }, duration: 0.8, ease: EASE_OUT },
      ];
      const layers = [{
        type: 'text', name: `${name}-role`, text: role, at, duration: dur,
        style: { fontFamily: SERIF, fontStyle: 'italic', fontSize: 19, fill: C.amber, letterSpacing: 1 },
        initial: { x, y, anchorX: ax, anchorY: 0.5 },
        keyframes: drift(0),
      }];
      names.forEach((n, i) => layers.push({
        type: 'text', name: `${name}-name${i}`, text: n, at: at + 0.25 + i * 0.35, duration: dur - 0.25 - i * 0.35,
        style: { fontFamily: SERIF, fontSize: 30, fill: C.paper, letterSpacing: 7 },
        filters: [blur('soft', 4)],
        initial: { x, y, anchorX: ax, anchorY: 0.5 },
        keyframes: [
          ...drift(38 + i * 46).map(k => ({ ...k })),
          { at: 0, to: { 'filters.soft.strength': 0 }, duration: 1.1, ease: EASE_IN },
        ],
      }));
      return layers;
    }

    const credits = [
      ...credit({ name: 'c1', at: 2.3, dur: 2.7, role: 'Northlight Pictures presents', names: ['A NOCTURNE PRODUCTION'], x: 128, y: 470 }),
      ...credit({ name: 'c2', at: 5.3, dur: 2.7, role: 'a film by', names: ['MIRA HALVERSEN'], x: W - 128, y: 172, align: 'right' }),
      ...credit({ name: 'c3', at: 8.0, dur: 2.3, role: 'starring', names: ['ELIAS MARCH', 'JUNE TAVERNER'], x: 128, y: 424 }),
    ];

    // ---------- main title, one layer per letter (Georgia is proportional: measure it) ----------
    const TITLE = 'THE LONG NIGHT', T_SIZE = 66, T_TRACK = 0.34 * T_SIZE, T_Y = 494, T_AT = 10.4;
    const meas = document.createElement('canvas').getContext('2d');
    meas.font = `400 ${T_SIZE}px ${SERIF}`;
    const adv = [...TITLE].map(ch => meas.measureText(ch).width);
    const total = adv.reduce((s, a) => s + a, 0) + T_TRACK * (TITLE.length - 1);
    let cursor = W / 2 - total / 2;
    const centers = adv.map(a => { const c = cursor + a / 2; cursor += a + T_TRACK; return c; });
    const order = centers.map((c, i) => [Math.abs(c - W / 2), i]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
    const titleLetters = [...TITLE].flatMap((ch, i) => {
      if (ch === ' ') return [];
      const rank = order.indexOf(i), cx = centers[i];
      const start = T_AT + rank * 0.075;
      const creep = (cx - W / 2) * 0.045;               // the title slowly breathes outward while it holds
      return [{
        type: 'text', name: `title-${i}-${ch}`, text: ch, at: start, duration: DURATION - start,
        style: { fontFamily: SERIF, fontSize: T_SIZE, fill: C.paper, padding: 24 },
        filters: [blur('soft', 10)],
        initial: { x: cx, y: T_Y, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [
          { at: 0, to: { alpha: 1 }, duration: 1.3, ease: EASE_IN },
          { at: 0, to: { 'filters.soft.strength': 0 }, duration: 1.4, ease: EASE_IN },
          { at: 0, to: { x: cx + creep }, duration: DURATION - start, ease: 'none' },
        ],
      }];
    });

    const RULE_AT = 11.6, TAG_AT = 12.2;
    const titleExtras = [
      {
        type: 'shape', shape: 'rect', name: 'title-rule', at: RULE_AT, duration: DURATION - RULE_AT,
        width: 1, height: 1,
        initial: { x: W / 2, y: T_Y + 58, width: 0, height: 1, fillColor: C.amber, alpha: 0.9 },
        keyframes: [{ at: 0, to: { width: 220 }, duration: 1.4, ease: 'expo.out' }],
      },
      {
        type: 'text', name: 'tagline', text: 'some doors only open after dark', at: TAG_AT, duration: DURATION - TAG_AT,
        style: { fontFamily: SERIF, fontStyle: 'italic', fontSize: 20, fill: C.dim, letterSpacing: 2 },
        initial: { x: W / 2, y: T_Y + 92, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 1.2, ease: EASE_IN }],
      },
    ];

    // ---------- film grain: a seeded dot texture that jumps every 2 frames ----------
    function grainAsset(name, seed, count) {
      const gw = W + 200, gh = H + 200;
      const c = Object.assign(document.createElement('canvas'), { width: gw, height: gh });
      const g = c.getContext('2d'), r = rng(seed);
      for (let i = 0; i < count; i++) {
        const light = r() < 0.4, a = 0.04 + r() * 0.16, s = r() < 0.9 ? 1 : 2;
        g.fillStyle = light ? `rgba(230,222,205,${a})` : `rgba(0,0,0,${a * 1.6})`;
        g.fillRect(Math.floor(r() * gw), Math.floor(r() * gh), s, s);
      }
      return { name, src: c.toDataURL() };
    }
    function grainLayer(name, asset, seed) {
      const r = rng(seed), keys = [];
      for (let f = 0; f < DURATION * FPS; f += 2) {
        keys.push({ at: f / FPS, set: { x: -Math.round(r() * 200), y: -Math.round(r() * 200) } });
      }
      return { type: 'image', name, asset, initial: { x: 0, y: 0, alpha: 0.55 }, keyframes: keys };
    }
    // dust specks / hairs that pop for one or two frames
    function specks() {
      const r = rng(23), out = [];
      for (let i = 0; i < 26; i++) {
        const t = Math.round((0.6 + r() * (DURATION - 1.2)) * FPS) / FPS;
        const x = 80 + r() * (W - 160), y = BAR + 20 + r() * (H - 2 * BAR - 40);
        const hair = r() < 0.25;
        out.push(hair ? {
          type: 'shape', shape: 'path', name: `hair-${i}`, at: t, duration: 2 / FPS,
          d: `M ${x} ${y} q ${8 + r() * 10} ${-6 - r() * 8} ${16 + r() * 18} ${2 + r() * 6}`,
          initial: { strokeColor: '#d8d0bf', strokeWidth: 1, strokeAlpha: 0.35 },
        } : {
          type: 'shape', shape: 'circle', name: `speck-${i}`, at: t, duration: (r() < 0.5 ? 1 : 2) / FPS,
          radius: 0.8 + r() * 1.6,
          initial: { x, y, fillColor: r() < 0.6 ? '#e6dccb' : '#000000', fillAlpha: 0.45 },
        });
      }
      return out;
    }
    // projector flicker: a black veil whose alpha jitters every 2 frames
    function flicker() {
      const r = rng(31), keys = [];
      for (let f = 0; f < DURATION * FPS; f += 2) keys.push({ at: f / FPS, set: { alpha: r() * 0.06 } });
      return { type: 'shape', shape: 'rect', name: 'flicker', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: '#000000', alpha: 0 }, keyframes: keys };
    }

    // ---------- letterbox + fade from black ----------
    const bars = [
      { type: 'shape', shape: 'rect', name: 'bar-top', width: W, height: BAR + 2,
        initial: { x: W / 2, y: 0, anchorY: 1, fillColor: '#000000' },
        keyframes: [{ at: 0.6, to: { y: BAR + 2 }, duration: 2.0, ease: 'power3.inOut' }] },
      { type: 'shape', shape: 'rect', name: 'bar-bottom', width: W, height: BAR + 2,
        initial: { x: W / 2, y: H, anchorY: 0, fillColor: '#000000' },
        keyframes: [{ at: 0.6, to: { y: H - BAR - 2 }, duration: 2.0, ease: 'power3.inOut' }] },
    ];
    const fadeIn = {
      type: 'shape', shape: 'rect', name: 'from-black', width: W, height: H, duration: 2.4,
      initial: { x: W / 2, y: H / 2, fillColor: '#000000' },
      keyframes: [{ at: 0.2, to: { alpha: 0 }, duration: 2.2, ease: EASE_MOVE }],
    };

    // ---------- sound: an original score in D minor, 100 bpm, written to the picture ----------
    // One bar = 4 beats = 2.4 s. The music starts at 0.8 s, so the bar lines fall on
    // 0.8 | 3.2 | 5.6 | 8.0 (starring) | 10.4 (THE LONG NIGHT) | 12.8; the rule (11.6) is beat 3 and
    // the tagline (12.2) beat 4 of the title bar. A beat b is at MUSIC_AT + b * BEAT seconds.
    const BPM = 100, BEAT = 60 / BPM, MUSIC_AT = 0.8;
    const atBeat = (b) => +(MUSIC_AT + b * BEAT).toFixed(3);
    // the bass ostinato: eighths in a 3+3+2 accent pattern over a D pedal (bars 2-4), it stops dead for the title
    const ost = (a, b, c) => `${a}!:0.5 ${a}:0.5, ${a}:0.5, ${b}!:0.5 ${b}:0.5, ${b}:0.5, ${c}!:0.5 ${c}:0.5,`;
    const score = {
      bpm: BPM, reverb: 0.38, seed: 3, tail: 0.6, drumVol: 0.42,
      tracks: [
        // the night itself: a slow pad, i - bVI - iv - bII - V(b9) - i(add9); every chord over D
        { inst: 'pad', vol: [[0, 0.35], [12, 0.6], [16, 0.75], [20, 0.5]], attack: 1.6, release: 0.9, tone: 0.45,
          notes: '[d3 a3 f4]:4 | [d3 f3 bb3]:4 | [d3 g3 bb3]:4 | [d3 eb3 g3 bb3]:2 [c#3 e3 g3 bb3]:2 | [d2 a2 e3 f3 a3]:4 | _:1' },
        // a sine drone under it from bar 2 (d2: d1 was a 37 Hz rumble that only ate headroom); the title strikes it again
        { inst: 'sub', vol: 0.3, notes: '_:4 | d2:4 ~:4 ~:4 | d2:3! _:2' },
        // the pulse (dry, dark)
        { inst: 'bass', vol: [[4, 0.35], [12, 0.55], [16, 0.7]], tone: 0.3, reverb: 0.08, legato: 0.7,
          notes: `_:4 | ${ost('d2', 'd2', 'a2')} | ${ost('d2', 'd2', 'bb2')} | ${ost('d2', 'eb2', 'c#2')} | _:5` },
        // a cold harp figure over the passing light and the starring card
        { inst: 'pluck', vol: [[8, 0.18], [16, 0.42]], pan: 0.3, step: 0.5, tone: 0.55,
          notes: '_:8 | d5 bb4 g4 bb4 d5 bb4 g4 bb4 | eb5 bb4 g4 bb4 e5 bb4 g4 c#5 | _:5' },
        // the theme, one note per credit as its name sharpens: D (2.6) F (5.6) E (8.0) A (8.6) ... D (tagline)
        { inst: 'musicbox', vol: 0.5, pan: -0.2, ring: 1.6, reverb: 0.7,
          notes: '_:3 d5:5 | f5:4 | e5:1 a4:3 | _:3 d5:2' },
        // the amber rule: one high bell
        { inst: 'bell', vol: 0.65, pan: 0.15, ring: 1.8, notes: '_:18 a5:3' },
        // the title chord, and the last chord on the tagline (left to ring out before 14 s)
        { inst: 'keys', vol: 0.55, strum: 0.02, tone: 0.4, notes: '_:16 [d2 a2 d3]:3! [d3 f3 a3 e4]:2' },
      ],
      // the heartbeat kick enters with the passing light; a soft tick in the last bar before the title
      drums: [
        { from: 8, to: 12, kick: 'x..x............' },
        { from: 12, to: 16, kick: 'x..x....x..x....', hat: '..o...o...o...o.' },
      ],
    };
    const sound = [
      { type: 'audio', name: 'score', at: MUSIC_AT, volume: 1.2, music: score },
      // the letterbox bars close in (0.6-2.6, loudest at their middle 1.6)
      { type: 'audio', name: 'sfx-bars', sfx: { preset: 'swoosh', pitch: -10, brightness: -0.7 }, at: 0.96, duration: 2.0, volume: 0.6 },
      // the headlights pass left -> right behind the shard (swoosh pans left -> right; loudest as the light crosses, ~7.2)
      { type: 'audio', name: 'sfx-headlights', sfx: { preset: 'swoosh', pitch: -14, brightness: -0.6, seed: 2 }, at: 5.92, duration: 4.0, volume: 0.8 },
      // the night closes in: a dark riser that peaks on the title
      { type: 'audio', name: 'sfx-riser', sfx: { preset: 'riser', pitch: -5, brightness: -0.5 }, at: atBeat(12), duration: atBeat(16) - atBeat(12), volume: 0.4 },
      // THE LONG NIGHT: a deep hit on the downbeat
      { type: 'audio', name: 'sfx-title', sfx: { preset: 'hit', pitch: -6, brightness: -0.5 }, at: atBeat(16), volume: 1.3 },
      // the rule draws out: a soft, dark swipe
      { type: 'audio', name: 'sfx-rule', sfx: { preset: 'swipe', pitch: -12, brightness: -0.6 }, at: atBeat(18), volume: 0.33 },
    ];

    const sequences = [
      { type: 'shape', shape: 'rect', name: 'bg', width: W, height: H, initial: { x: W / 2, y: H / 2, fillColor: C.night } },
      { type: 'shape', shape: 'rect', name: 'haze', width: W, height: H, initial: { x: W / 2, y: H / 2, fillGradient: { type: 'radial', center: [0.5, 0.36], radius: 0.75, stops: [[0, 'rgba(46,72,74,0.85)'], [0.45, 'rgba(22,36,38,0.6)'], [1, 'rgba(7,11,12,0)']] } } },
      shard,
      vignette,
      ...credits,
      ...titleLetters,
      ...titleExtras,
      grainLayer('grain-a', 'grainA', 3),
      grainLayer('grain-b', 'grainB', 9),
      ...specks(),
      flicker(),
      ...bars,
      fadeIn,
      ...sound,
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS, poster: POSTER_FRAME / FPS,
        background: C.night,
        assets: [grainAsset('grainA', 101, 26000), grainAsset('grainB', 202, 14000)],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
