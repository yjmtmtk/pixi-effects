<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ひかりの音</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    html, body { height: 100%; }
    body { background: #0a0b0e; margin: 0; padding: 16px; box-sizing: border-box; display: flex; justify-content: center; align-items: flex-start; }
    .stage { position: relative; width: min(720px, 100%, calc((100vh - 32px) * 0.5625)); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="720" height="1280"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script type="application/json" id="piece-meta">{ "title": "ひかりの音", "subtitle": "A four-line poem written top to bottom, right to left, each syllable landing on a note of its own tune", "tags": ["lyric", "vertical", "japanese", "typography", "music"], "width": 720, "height": 1280, "duration": 13.5, "model": "opus" }</script>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 720, H = 1280, FPS = 30, DURATION = 13.5;

    // ── palette ─────────────────────────────────────────────
    const INK = '#0b0c10', PAPER = '#ebe5d8', MUTED = '#8c877d', AMBER = '#f0b45a';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif CJK JP", serif';

    // ── tempo: 100 bpm, one beat = 0.6 s ────────────────────
    const BPM = 100, BEAT = 60 / BPM, MUSIC_AT = 0;
    const t = beat => MUSIC_AT + beat * BEAT;

    // ── the poem: one column per line, one note per syllable ─
    // よるの底で / ちいさく鳴る / きみの名前は / ひかりの音
    const LINES = [
      { chars: 'よるの底で',   notes: ['f#5', 'e5', 'd5', 'b4', 'd5'],        beats: [.5, .5, .5, .5, 2] },
      { chars: 'ちいさく鳴る', notes: ['d5', 'e5', 'f#5', 'a5', 'b5', 'a5'],  beats: [.5, .5, .5, .5, .5, 1.5] },
      { chars: 'きみの名前は', notes: ['g5', 'f#5', 'e5', 'd5', 'b4', 'e5'],  beats: [.5, .5, .5, .5, .5, 1.5] },
      { chars: 'ひかりの音',   notes: ['d5', 'e5', 'f#5', 'a5', 'f#5'],       beats: [.5, .5, .5, .5, 6] },
    ];
    const FIRST_BEAT = 2;                                   // a two-beat breath before the first word

    // ── layout: columns right to left, top aligned ─────────
    const FONT = 74, PITCH = 104, TOP = 330, OTO_SIZE = 98;
    const COL_X = [558, 426, 294, 162];
    const RULE_X = [624, 492, 360, 228, 96], RULE_TOP = 250, RULE_H = 690;   // letter-paper rules between the columns
    const GAP_BEFORE_LAST = 0.95;                           // 「音」 sits apart: a visual rest that matches the held note

    // place every glyph and its note time
    // a slow push-in: everything on the page hangs from one null and grows 4 % over the film
    const RIG_X = W / 2, RIG_Y = 600, PUSH = 1.04, PUSH_EASE = 'sine.inOut';
    const rel = (x, y) => ({ x: x - RIG_X, y: y - RIG_Y });
    const pushed = (x, y) => [RIG_X + (x - RIG_X) * PUSH, RIG_Y + (y - RIG_Y) * PUSH];

    const glyphs = [];
    let beat = FIRST_BEAT;
    LINES.forEach((line, li) => {
      [...line.chars].forEach((ch, ci) => {
        const isLast = li === LINES.length - 1 && ci === line.chars.length - 1;
        const y = TOP + (ci + (isLast ? GAP_BEFORE_LAST : 0)) * PITCH;
        glyphs.push({ ch, li, ci, x: COL_X[li], y, at: t(beat), isLast });
        beat += line.beats[ci];
      });
    });
    const OTO = glyphs[glyphs.length - 1];                  // 「音」
    const LAND = OTO.at;                                    // 9.6 s

    // ── music ───────────────────────────────────────────────
    const melody = '_:' + FIRST_BEAT + ' ' + LINES.map(l => l.notes.map((n, i) => n + ':' + l.beats[i]).join(' ')).join(' | ');
    const music = {
      bpm: BPM, reverb: 0.42, humanize: 0,
      tracks: [
        { inst: 'musicbox', vol: 0.95, reverb: 0.55, ring: 1.6, notes: melody },
        { inst: 'pad',  vol: [[0, 0.15], [2, 0.5], [14, 0.5], [16, 0.8], [22, 0.35]], attack: 0.9, release: 2.2, tone: 0.45,
          notes: 'Gmaj7:2 | Bm7:4 | Gmaj9:4 | Em9:2 A7sus4:2 | Gmaj7:2 Dmaj9:6' },
        { inst: 'sub',  vol: 0.7, notes: '_:2 | b1:4 | g1:4 | e1:2 a1:2 | g1:2 d1:6' },
        { inst: 'bell', vol: 0.5, reverb: 0.8, ring: 3, notes: 'a5:2 | _:4 | _:4 | _:4 | _:2 [d6 f#6]:1 a6:1 _:4' },
      ],
    };

    const seq = [];

    // ── background: ink, a warm glow and the ripples of 「音」 ──
    seq.push({
      type: 'shader', name: 'ground',
      uniforms: { cx: OTO.x, cy: OTO.y, glow: 0, land: LAND, warm: AMBER },
      fragment: `
        float ring(float d, float t, float speed, float amp) {
          if (t <= 0.0) return 0.0;
          float r = t * speed;
          float w = 1.1 + t * 0.5;
          return amp * exp(-pow((d - r) / w, 2.0)) * exp(-t * 0.75);
        }
        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = fragCoord / iResolution.xy;
          vec2 c = vec2(cx, iResolution.y - cy);
          float d = length(fragCoord - c);
          vec3 ink = vec3(0.043, 0.047, 0.063);
          float vig = smoothstep(1.15, 0.15, length((uv - vec2(0.5, 0.55)) * vec2(1.0, 0.8)));
          vec3 col = ink * (0.55 + 0.65 * vig);
          col += warm * glow * (0.20 * exp(-d / 210.0) + 0.05 * exp(-d / 700.0));
          float rings = ring(d, iTime - 0.05, 150.0, 0.16);
          for (int i = 0; i < 4; i++) {
            rings += ring(d, iTime - land - float(i) * 0.42, 190.0, 0.30 - float(i) * 0.05);
          }
          col += warm * rings;
          fragColor = vec4(col, 1.0);
        }`,
      keyframes: [
        { at: LAND - 0.05, to: { 'uniforms.glow': 1 }, duration: 1.6, ease: 'power2.out' },
        { at: 0, to: { 'uniforms.cx': pushed(OTO.x, OTO.y)[0], 'uniforms.cy': pushed(OTO.x, OTO.y)[1] }, duration: DURATION, ease: PUSH_EASE },
      ],
    });

    seq.push({ type: 'null', name: 'rig', initial: { x: RIG_X, y: RIG_Y, scale: 1 },
      keyframes: [{ at: 0, to: { scale: PUSH }, duration: DURATION, ease: PUSH_EASE }] });

    // ── the letter paper: five hairlines drawn top to bottom, right to left ──
    RULE_X.forEach((x, i) => seq.push({
      type: 'shape', shape: 'rect', name: `rule${i}`, width: 1, height: RULE_H, at: 0.15 + i * 0.12, duration: DURATION,
      parent: 'rig', initial: { ...rel(x, RULE_TOP), anchorY: 0, fillColor: PAPER, alpha: 0.11, scaleY: 0 },
      keyframes: [{ at: 0, to: { scaleY: 1 }, duration: 1.3, ease: 'power3.inOut' }],
    }));

    // ── the point of light: waits where 「音」 will land ─────
    seq.push({
      type: 'shape', shape: 'circle', name: 'spark', radius: 4, at: 0, duration: LAND + 0.1,
      parent: 'rig', initial: { ...rel(OTO.x, OTO.y), fillColor: AMBER, alpha: 0, scale: 0.2 },
      filters: [{ type: 'glow', distance: 18, outerStrength: 3, color: AMBER, quality: 0.3 }],
      keyframes: [
        { at: 0, to: { alpha: 1, scale: 1 }, duration: 0.5, ease: 'power3.out' },
        // it breathes while it waits, two beats in, two beats out
        ...Array.from({ length: 6 }, (_, i) => ({ at: 1.2 + i * 1.2, to: { alpha: i % 2 ? 0.75 : 0.3, scale: i % 2 ? 0.9 : 0.6 }, duration: 1.2, ease: 'sine.inOut' })),
        { at: LAND - 0.5, to: { alpha: 1, scale: 1.3 }, duration: 0.45, ease: 'power2.in' },
      ],
    });

    // ── the glyphs ──────────────────────────────────────────
    glyphs.forEach((g, i) => {
      const style = { fontFamily: MINCHO, fontSize: g.isLast ? OTO_SIZE : FONT, fill: g.isLast ? AMBER : PAPER, fontWeight: g.isLast ? '600' : '400' };
      const lead = 0.03;
      const layer = {
        type: 'text', name: g.isLast ? 'oto' : `g${g.li}-${g.ci}`, text: g.ch, style,
        at: g.at - lead, duration: DURATION - g.at + lead,
        parent: 'rig', initial: { ...rel(g.x, g.y), anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        filters: [{ type: 'blur', name: 'soft', strength: 10, quality: 3 }],
        keyframes: [
          { at: 0, from: { y: rel(0, g.y - 22).y, alpha: 0 }, to: { y: rel(0, g.y).y, alpha: 1 }, duration: 0.7, ease: 'power3.out' },
          { at: 0, to: { 'filters.soft.strength': 0 }, duration: 0.55, ease: 'power2.out' },
        ],
      };
      if (g.isLast) {
        layer.filters.push({ type: 'glow', name: 'halo', distance: 24, outerStrength: 0, color: AMBER, quality: 0.3 });
        layer.keyframes = [
          { at: 0, from: { alpha: 0, scale: 1.25 }, to: { alpha: 1, scale: 1 }, duration: 1.0, ease: 'expo.out' },
          { at: 0, to: { 'filters.soft.strength': 0 }, duration: 0.35, ease: 'power2.out' },
          { at: 0, to: { 'filters.halo.outerStrength': 2.2 }, duration: 0.3, ease: 'power2.out' },
          { at: 0.3, to: { 'filters.halo.outerStrength': 0.9 }, duration: 2.2, ease: 'sine.out' },
        ];
      } else {
        // when 「音」 lands the other words step back
        layer.keyframes.push({ at: LAND - g.at + lead, to: { alpha: 0.55 }, duration: 1.4, ease: 'sine.inOut' });
      }
      seq.push(layer);
    });

    // ── colophon: arrives after the last note settles ───────
    const COLO_AT = LAND + 1.4, CX = RULE_X[4], CY = RULE_TOP + RULE_H + 52;
    seq.push(
      { type: 'shape', shape: 'rect', name: 'rule', width: 36, height: 1.5, at: COLO_AT, duration: DURATION - COLO_AT,
        parent: 'rig', initial: { ...rel(CX, CY), anchorX: 0, fillColor: AMBER, alpha: 0.9, scaleX: 0 },
        keyframes: [{ at: 0, to: { scaleX: 1 }, duration: 0.7, ease: 'power3.inOut' }] },
      { type: 'text', name: 'title', text: 'ひかりの音', at: COLO_AT + 0.15, duration: DURATION - COLO_AT - 0.15,
        style: { fontFamily: MINCHO, fontSize: 30, fill: PAPER, letterSpacing: 6 },
        parent: 'rig', initial: { ...rel(CX, CY + 22), alpha: 0 },
        keyframes: [{ at: 0, from: { y: rel(0, CY + 34).y, alpha: 0 }, to: { y: rel(0, CY + 22).y, alpha: 1 }, duration: 0.8, ease: 'power3.out' }] },
      { type: 'text', name: 'subtitle', text: 'the sound of light', at: COLO_AT + 0.35, duration: DURATION - COLO_AT - 0.35,
        style: { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: 19, fill: MUTED, letterSpacing: 1 },
        parent: 'rig', initial: { ...rel(CX, CY + 70), alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.9, ease: 'sine.out' }] },
    );

    // ── sound ───────────────────────────────────────────────
    seq.push({ type: 'audio', name: 'song', at: MUSIC_AT, volume: 1.2, music });

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 12.0,
        background: INK,
        composition: { sequences: seq, filters: [{ type: 'grain', amount: 0.035, size: 1.4 }] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
