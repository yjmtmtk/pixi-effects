<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORRI ONE — product turntable</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #111214; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 6px; --pe-loader-bg: #111214; background: #111214; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">{ "title": "ORRI ONE", "subtitle": "A glossy PixiJS 3D product turntable with spec callouts and a brand lock-up, studio white to graphite", "tags": ["PixiJS 3D", "product", "PBR", "callouts", "lock-up"], "width": 1280, "height": 720, "duration": 12, "model": "opus" }</script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/3d":         "../../dist/3d.js",
      "@pixi/3d":                "https://cdn.jsdelivr.net/npm/@pixi/3d@0.1.0/dist/pixijs-3d.min.mjs"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    import { register3D } from 'pixi-effects/3d';
    import { Container3D, CylinderGeometry, FlatMaterial, Geometry3D, Material3D, Mesh3D, SphereGeometry, TorusGeometry,
      equirectToCube, linearToSrgb, srgbToLinear } from '@pixi/3d';
    import { CanvasSource, Texture } from 'pixi.js';

    register3D();     // before movie.init

    const W = 1280, H = 720, FPS = 30, DURATION = 12;
    const POSTER_FRAME = 246;

    // ───────────── palette & type ─────────────
    const C = {
      studio: '#f7f7f5', studioEdge: '#d8d9dc',
      graphite: '#3a3d43', graphiteEdge: '#121316',
      ink: '#1b1d21', mute: '#7d8088', accent: '#ff5a1f', accentInk: '#e04e17',
      paper: '#f4f2ee', floorLight: '#d9dadd', floorDark: '#131416',
    };
    const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    const SANS = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
    const SERIF = 'Georgia, "Times New Roman", serif';
    const IN = 'expo.out', OUT = 'power2.in', MOVE = 'power3.inOut';

    // ───────────── timing (composition seconds) ─────────────
    const T = {
      revealEnd: 3.2,                 // camera pull-back from the cap to the full product
      ledOn: 1.0,
      callouts: [3.3, 4.4, 5.5, 6.6],
      calloutsOut: 8.5,
      toGraphite: 8.8,                // background + floor go dark, camera trucks right
      lockup: 9.8,
    };

    // ───────────── camera poses (a look-at point + an elevation + a distance; the scene3d camera is placed from them in update) ─────────────
    const FOV = 30;
    const POSE = {
      open:   { x: 0,    y: 2.05, rx: -0.30, z: 5.0 },
      spec:   { x: 0,    y: 1.35, rx: -0.16, z: 9.2 },
      lockup: { x: 1.55, y: 1.30, rx: -0.13, z: 9.8 },
    };
    // where the camera of a pose sits: on the +z axis of a rig at the look-at point, tilted by rx around x
    const camAt = (p) => ({ x: p.x, y: p.y - p.z * Math.sin(p.rx), z: p.z * Math.cos(p.rx) });
    // project a world point to canvas px for a pose (used to pin the 2D callouts onto the product)
    function project([px, py, pz], pose) {
      const c = camAt(pose), cos = Math.cos(pose.rx), sin = Math.sin(pose.rx);
      const dx = px - c.x, dy = py - c.y, dz = pz - c.z;
      const xc = dx, yc = dy * cos + dz * sin, zc = -dy * sin + dz * cos;      // camera axes: x, (0, cos, sin), (0, -sin, cos)
      const f = 1 / Math.tan(FOV * Math.PI / 360);
      const nx = xc / -zc * f / (W / H), ny = yc / -zc * f;
      return [Math.round((nx + 1) / 2 * W), Math.round((1 - ny) / 2 * H)];
    }

    // ───────────── procedural textures ─────────────
    function canvasTex(w, h, draw) {
      const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
      draw(c.getContext('2d'), w, h);
      return new Texture({ source: new CanvasSource({ resource: c, autoGenerateMipmaps: true, maxAnisotropy: 8 }) });
    }
    const grilleTex = () => canvasTex(2048, 512, (g, w, h) => {
      g.fillStyle = '#383a3f'; g.fillRect(0, 0, w, h);
      const step = 16;
      for (let row = 0, y = step / 2; y < h; row++, y += step * 0.866) {
        for (let x = (row % 2) * step / 2; x < w + step; x += step) {
          g.fillStyle = '#121316'; g.beginPath(); g.arc(x, y, 4.2, 0, Math.PI * 2); g.fill();
        }
      }
    });
    const discTex = () => canvasTex(1024, 1024, (g, w) => {
      const c = w / 2;
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, w);
      g.strokeStyle = 'rgba(0,0,0,0.07)'; g.lineWidth = 2;
      for (const r of [0.30, 0.55, 0.80, 0.985]) { g.beginPath(); g.arc(c, c, r * c, 0, Math.PI * 2); g.stroke(); }
      for (let i = 0; i < 120; i++) {
        const a = i / 120 * Math.PI * 2, long = i % 10 === 0;
        g.strokeStyle = long ? 'rgba(0,0,0,0.30)' : 'rgba(0,0,0,0.14)'; g.lineWidth = long ? 3 : 2;
        g.beginPath(); g.moveTo(c + Math.cos(a) * c * (long ? 0.88 : 0.91), c + Math.sin(a) * c * (long ? 0.88 : 0.91));
        g.lineTo(c + Math.cos(a) * c * 0.955, c + Math.sin(a) * c * 0.955); g.stroke();
      }
      g.strokeStyle = C.accent; g.lineWidth = 9;      // one accent tick: makes the turn readable
      g.beginPath(); g.moveTo(c, c + c * 0.84); g.lineTo(c, c + c * 0.955); g.stroke();
    });
    const shadowTex = () => canvasTex(256, 256, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, 'rgba(0,0,0,0.62)'); gr.addColorStop(0.42, 'rgba(0,0,0,0.30)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    });

    // ───────────── studio light: a gradient dome + five HDR softboxes, written as a float panorama ─────────────
    // (no lights at all: the product is lit by the environment, as by a photo studio). Each pixel of the panorama is the light seen
    // from the centre in that direction: a softbox in front of the dome, or the dome.
    const lin = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255].map(v => srgbToLinear(v / 255)); };
    function studioEnvironment() {
      const PW = 512, PH = 256, data = new Float32Array(PW * PH * 3);
      const top = lin('#f2f2f0'), bottom = lin('#1a1b1e');
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const norm = (a) => { const l = Math.hypot(...a); return a.map(v => v / l); };
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      //               w    h    x    y    z   radiance
      const boxes = [[7,   5,   -8,  7,   7,  7  ],   // key, high left front
                     [1.4, 9,    9,  3,   2,  9  ],   // tall strip, right
                     [1.2, 9,   -7,  3,  -7,  6  ],   // rim strip, back left
                     [6,   6,    0,  13,  0,  3  ],   // overhead
                     [3,   1.5,  4,  0.8, 9,  2.5]]   // low front fill
        .map(([w, h, x, y, z, k]) => {
          const P = [x, y, z], Z = norm([-x, 1.2 - y, -z]), X = norm(cross([0, 1, 0], Z)), Y = cross(Z, X);   // each faces the point (0, 1.2, 0)
          return { P, Z, X, Y, w, h, k, pz: dot(P, Z) };
        });
      for (let py = 0; py < PH; py++) {
        const lat = (0.5 - (py + 0.5) / PH) * Math.PI;
        for (let px = 0; px < PW; px++) {
          const lon = ((px + 0.5) / PW - 0.5) * 2 * Math.PI;
          const d = [Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)];
          const s = Math.min(1, Math.max(0, (d[1] + 0.35) / 0.9)), k = s * s * (3 - 2 * s);
          let c = [0, 1, 2].map(i => (bottom[i] + (top[i] - bottom[i]) * k) * 0.9), near = 30;
          for (const b of boxes) {
            const dn = dot(d, b.Z);
            if (Math.abs(dn) < 1e-6) continue;
            const t = b.pz / dn;
            if (t <= 0 || t >= near) continue;
            const hit = [d[0] * t - b.P[0], d[1] * t - b.P[1], d[2] * t - b.P[2]];
            if (Math.abs(dot(hit, b.X)) <= b.w / 2 && Math.abs(dot(hit, b.Y)) <= b.h / 2) { near = t; c = [b.k, b.k, b.k]; }
          }
          data.set(c, (py * PW + px) * 3);
        }
      }
      return equirectToCube({ width: PW, height: PH, data }, 128, 'orri-studio');
    }

    // ───────────── geometry PixiJS 3D has no built-in for ─────────────
    // a lathe (a profile turned around +y), smooth: each profile point's normal averages its two segments
    function latheGeometry(profile, segments) {
      const n = profile.length, rows = segments + 1;
      const positions = new Float32Array(rows * n * 3), normals = new Float32Array(rows * n * 3), uvs = new Float32Array(rows * n * 2);
      const pn = [];
      let prev = null;
      for (let j = 0; j < n; j++) {
        if (j === n - 1) { const l = Math.hypot(prev[0], prev[1]); pn.push([prev[0] / l, prev[1] / l]); break; }
        const dx = profile[j + 1][0] - profile[j][0], dy = profile[j + 1][1] - profile[j][1];
        const cur = [dy, -dx];
        const v = j === 0 ? cur : [cur[0] + prev[0], cur[1] + prev[1]];
        const l = Math.hypot(v[0], v[1]); pn.push([v[0] / l, v[1] / l]);
        prev = cur;
      }
      for (let i = 0; i < rows; i++) {
        const phi = i / segments * Math.PI * 2, sin = Math.sin(phi), cos = Math.cos(phi);
        for (let j = 0; j < n; j++) {
          const k = i * n + j, [r, y] = profile[j];
          positions.set([r * sin, y, r * cos], k * 3);
          normals.set([pn[j][0] * sin, pn[j][1], pn[j][0] * cos], k * 3);
          uvs.set([i / segments, j / (n - 1)], k * 2);
        }
      }
      const indices = new Uint32Array(segments * (n - 1) * 6);
      let o = 0;
      for (let i = 0; i < segments; i++) for (let j = 0; j < n - 1; j++) {
        const a = j + i * n, b = a + n, c = b + 1, d = a + 1;
        indices.set([a, b, d, c, d, b], o); o += 6;
      }
      return new Geometry3D({ positions, normals, uvs, indices });
    }
    // a flat disc facing +y, drawn `drop` below its node: transparent surfaces are drawn back to front by their NODE's distance,
    // so lifting the node (not the surface) makes the floor draw after the reflection under it, and the contact shadow after the floor.
    // The texture's centre is the disc's centre.
    function discGeometry(radius, segments, drop) {
      const positions = [0, -drop, 0], normals = [0, 1, 0], uvs = [0.5, 0.5], indices = [];
      for (let i = 0; i <= segments; i++) {
        const a = i / segments * Math.PI * 2, x = Math.sin(a) * radius, z = Math.cos(a) * radius;
        positions.push(x, -drop, z); normals.push(0, 1, 0); uvs.push(z / (2 * radius) + 0.5, 0.5 - x / (2 * radius));
        if (i > 0) indices.push(0, i, i + 1);
      }
      return new Geometry3D({ positions: new Float32Array(positions), normals: new Float32Array(normals), uvs: new Float32Array(uvs), indices: new Uint32Array(indices) });
    }

    // the tone curve: the Khronos PBR Neutral curve (exposure 1.12), which keeps product colours true and gives the darks a soft toe.
    // PixiJS 3D's view curves are 'aces', 'reinhard' and 'uncharted2' (all shift colours), so each lit material applies Neutral itself, after all its light,
    // and the view stays at 'none' (the sRGB encode alone). The unlit contact shadow keeps its colours as drawn.
    const neutralBit = {
      name: 'orriNeutralTone',
      gpu: { fragment: { lobePostLighting: `{
        var nc = finalColor * 1.12;
        let nx = min(nc.r, min(nc.g, nc.b));
        nc = nc - select(0.04, nx - 6.25 * nx * nx, nx < 0.08);
        let np = max(nc.r, max(nc.g, nc.b));
        if (np >= 0.76) {
          let nnp = 1.0 - 0.0576 / (np - 0.52);
          nc = nc * (nnp / np);
          nc = mix(nc, vec3<f32>(nnp), 1.0 - 1.0 / (0.15 * (np - nnp) + 1.0));
        }
        finalColor = nc;
      }` } },
      gl: { fragment: { lobePostLighting: `{
        vec3 nc = finalColor * 1.12;
        float nx = min(nc.r, min(nc.g, nc.b));
        nc -= (nx < 0.08 ? nx - 6.25 * nx * nx : 0.04);
        float np = max(nc.r, max(nc.g, nc.b));
        if (np >= 0.76) {
          float nnp = 1.0 - 0.0576 / (np - 0.52);
          nc *= nnp / np;
          nc = mix(nc, vec3(nnp), 1.0 - 1.0 / (0.15 * (np - nnp) + 1.0));
        }
        finalColor = nc;
      }` } },
    };
    // how much of the studio a surface reflects (1 = all of it): the floor turns most of it down for the dark end. With no lights in the scene, all its light is the studio's.
    const envScaleBit = {
      name: 'orriEnvScale',
      bindings: { material: { envScale: 'f32' } },
      gpu: { fragment: { lobePostLighting: '{ finalColor = finalColor * material.envScale; }' } },
      gl: { fragment: { lobePostLighting: '{ finalColor = finalColor * material.envScale; }' } },
    };
    const lit = (options, bits = []) => new Material3D({ ...options, extraBits: [...bits, neutralBit] });

    // reflection copy: the same meshes mirrored below the floor, alpha fading with depth (a shader bit on a copy of each material)
    const FADE_DEPTH = 0.62;
    const fadeCode = (y) => `{ alpha = alpha * 0.7 * pow(clamp(1.0 + ${y} / ${FADE_DEPTH.toFixed(2)}, 0.0, 1.0), 1.7); }`;
    const mirrorFadeBit = {
      name: 'orriMirrorFade',
      gpu: { fragment: { material: fadeCode('input.vPosition.y') } },
      gl: { fragment: { material: fadeCode('vPosition.y') } },
    };
    function mirrorMaterial(mat) {
      const m = mat.clone({ alphaMode: 'blend', extraBits: [mirrorFadeBit] });
      m.state.cullMode = 'front';       // a node scaled by -1 turns its triangles inside out: keep the faces that now point at the camera
      return m;
    }

    // ───────────── the product (world units; floor at y = 0) ─────────────
    const BODY_R = 0.62;
    const Y = { ring: 2.37, core: 1.72, sound: 0.80, base: 0.17 };
    function productParts() {
      const mats = {
        body: lit({ baseColor: '#f1f0ec', roughness: 0.34, metallic: 0, clearcoat: { factor: 1, roughness: 0.06 } }),
        alu: lit({ baseColor: '#c8cbd0', metallic: 1, roughness: 0.26 }),
        grille: lit({ baseColorTexture: grilleTex(), roughness: 0.82, metallic: 0 }),
        rubber: lit({ baseColor: '#25272b', roughness: 0.55, metallic: 0 }),
        ring: lit({ baseColor: '#202124', roughness: 0.3, metallic: 0, emissive: { color: C.accent, strength: 0 } }),
      };
      const profile = [[0, 0], [0.50, 0], [0.57, 0.012], [0.605, 0.04], [0.62, 0.09], [0.62, 2.20], [0.612, 2.28], [0.59, 2.33], [0.555, 2.36], [0, 2.36]];
      // [geometry, material key, position, rotation, scale]
      const parts = [
        [latheGeometry(profile, 128), 'body'],
        [new CylinderGeometry({ radiusTop: 0.627, radiusBottom: 0.627, height: 0.95, radialSegments: 160, openEnded: true }), 'grille', [0, Y.sound, 0]],
        ...[Y.sound - 0.485, Y.sound + 0.485].map(y =>                                      // thin aluminium trims at the grille edges
          [new TorusGeometry({ radius: 0.628, tube: 0.008, radialSegments: 8, tubularSegments: 160 }), 'alu', [0, y, 0]]),
        [new TorusGeometry({ radius: 0.565, tube: 0.026, radialSegments: 8, tubularSegments: 64 }), 'rubber', [0, 0.03, 0]],
        [new TorusGeometry({ radius: 0.566, tube: 0.022, radialSegments: 16, tubularSegments: 160 }), 'ring', [0, Y.ring, 0]],
        [new CylinderGeometry({ radiusTop: 0.53, radiusBottom: 0.55, height: 0.14, radialSegments: 128 }), 'alu', [0, 2.43, 0]],
        [new SphereGeometry({ radius: 0.53, widthSegments: 96, heightSegments: 48 }), 'alu', [0, 2.5, 0], null, [1, 0.16, 1]],   // its lower half is inside the cap
        [new TorusGeometry({ radius: 0.3, tube: 0.048, radialSegments: 24, tubularSegments: 80, arc: Math.PI }), 'rubber', [0, 2.53, 0], [-Math.PI / 2, 0, 0]],   // carry loop
        [new SphereGeometry({ radius: 0.085, widthSegments: 32, heightSegments: 16 }), 'alu', [0, Y.core + 0.02, BODY_R - 0.012], null, [1, 1, 0.35]],   // button
        [new SphereGeometry({ radius: 0.018, widthSegments: 16, heightSegments: 8 }), 'ring', [0, Y.core + 0.15, BODY_R - 0.004], null, [1, 1, 0.4]],    // status pip
      ];
      const build = (materials) => {
        const g = new Container3D();
        for (const [geometry, key, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]] of parts) {
          const m = new Mesh3D({ geometry, material: materials[key] });
          m.position.set(...p); m.rotation.set(...(r || [0, 0, 0])); m.scale.set(...(s || [1, 1, 1]));
          g.addChild(m);
        }
        return g;
      };
      return { mats, build };
    }

    // ───────────── the 3D layer (PixiJS 3D) ─────────────
    const floorLight = lin(C.floorLight), floorDark = lin(C.floorDark);
    const product3d = {
      type: 'scene3d', name: 'product', width: W, height: H, resolution: 1.5,
      initial: { x: W / 2, y: H / 2, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      view: { toneMapping: 'none' },          // the curve is in the materials (neutralBit)
      setup: ({ view, root, camera }) => {
        view.environment = studioEnvironment();

        const turntable = new Container3D(); turntable.rotation.y = 0.55; root.addChild(turntable);
        const { mats, build } = productParts();
        turntable.addChild(build(mats));

        // reflection
        const mirrored = Object.fromEntries(Object.entries(mats).map(([k, m]) => [k, mirrorMaterial(m)]));
        const mirror = build(mirrored);
        mirror.scale.y = -1;
        turntable.addChild(mirror);

        // floor disc (glossy, translucent so the reflection reads through it) + a soft contact shadow on it
        const discMat = lit({ baseColor: C.floorLight, baseColorTexture: discTex(), roughness: 0.2, metallic: 0,
          clearcoat: { factor: 1, roughness: 0.04 }, alphaMode: 'blend', alpha: 0.6 }, [envScaleBit]);
        discMat.data.envScale = 1;
        const discTop = new Mesh3D({ geometry: discGeometry(2.0, 192, 1), material: discMat, position: { x: 0, y: 1, z: 0 } });
        const discEdge = new Mesh3D({ geometry: new CylinderGeometry({ radiusTop: 2.0, radiusBottom: 2.0, height: 0.07, radialSegments: 192, openEnded: true }),
          material: discMat, position: { x: 0, y: -0.035, z: 0 } });
        const shadow = new Mesh3D({ geometry: discGeometry(0.975, 96, 1.497), material: new FlatMaterial({ baseColorTexture: shadowTex(), alphaMode: 'blend' }),
          position: { x: 0, y: 1.5, z: 0 } });
        turntable.addChild(discTop, discEdge, shadow);

        camera.fov = FOV; camera.near = 0.1; camera.far = 100;
        // what the keyframes move: the rig (look-at point, tilt, distance) and how dark the floor is
        const rig = { ...POSE.open }, floor = { dark: 0 };
        return { objects: { rig, floor, turntable, ringMat: mats.ring, ringMatM: mirrored.ring, discMat } };
      },
      update: (t, { camera, objects: { rig, floor, discMat } }) => {
        const c = camAt(rig);
        camera.position.set(c.x, c.y, c.z);
        camera.lookAt({ x: rig.x, y: rig.y, z: 0 });
        // the floor colour mixes in linear light
        discMat.baseColor = floorLight.map((a, i) => linearToSrgb(a + (floorDark[i] - a) * floor.dark));
      },
      keyframes: [
        { at: 0, to: { alpha: 1 }, duration: 0.9, ease: 'power2.out' },
        { at: 0, to: { 'scene3d.turntable.rotation.y': 0.55 + Math.PI * 2 }, duration: DURATION, ease: 'none' },
        // reveal: from a close look at the cap, pull back to the whole product
        { at: 0, to: { 'scene3d.rig.z': POSE.spec.z, 'scene3d.rig.y': POSE.spec.y, 'scene3d.rig.rx': POSE.spec.rx }, duration: T.revealEnd, ease: MOVE },
        { at: T.ledOn, to: { 'scene3d.ringMat.emissive.strength': 1.25, 'scene3d.ringMatM.emissive.strength': 1.25 }, duration: 0.9, ease: 'power2.out' },
        // lock-up: truck right (product moves left), floor darkens with the background
        { at: T.toGraphite, to: { 'scene3d.rig.x': POSE.lockup.x, 'scene3d.rig.y': POSE.lockup.y, 'scene3d.rig.rx': POSE.lockup.rx, 'scene3d.rig.z': POSE.lockup.z }, duration: 1.6, ease: MOVE },
        { at: T.toGraphite, to: { 'scene3d.floor.dark': 1, 'scene3d.discMat.data.envScale': 0.5, 'scene3d.discMat.clearcoat.factor': 0.1 }, duration: 1.1, ease: 'power2.inOut' },
      ],
    };

    // ───────────── 2D helpers ─────────────
    const rect = (name, x, y, w, h, fill, extra = {}) => ({ type: 'shape', shape: 'rect', name, width: w, height: h, ...extra, initial: { x, y, fillColor: fill, ...(extra.initial || {}) } });
    const text = (name, str, style, initial, extra = {}) => ({ type: 'text', name, text: str, style, initial, ...extra });

    // a text that rises out of (or drops from) a line: masked slide
    function revealText(name, str, style, x, y, anchorX, anchorY, at, until, dir, box, extra = {}) {
      const { initial: xInit = {}, keyframes: xKeys = [], exit = true, ...rest } = extra;
      return text(name, str, style, { x, y: y + dir * box.h, anchorX, anchorY, ...xInit }, {
        at, duration: until - at, ...rest,
        mask: { type: 'shape', shape: 'rect', name: name + '-mask', width: box.w, height: box.h, initial: { x: box.cx, y: box.cy, fillColor: '#ffffff' } },
        keyframes: [
          { at: 0, to: { y }, duration: 0.7, ease: IN },
          ...(exit ? [{ at: -0.3, to: { alpha: 0 }, duration: 0.3, ease: OUT }] : []),
          ...xKeys,
        ],
      });
    }

    // ───────────── spec callouts ─────────────
    const SPECS = [
      { key: 'ring',  side: +1, y: Y.ring,  r: 0.566, eyebrow: '01 · HALO RING',    value: '16M-colour light' },
      { key: 'core',  side: -1, y: Y.core,  r: BODY_R, eyebrow: '02 · THERMAL CORE', value: '24 h cold · 12 h hot' },
      { key: 'sound', side: +1, y: Y.sound, r: 0.627, eyebrow: '03 · 360° SOUND',   value: '12 W omni driver' },
      { key: 'base',  side: -1, y: Y.base,  r: BODY_R, eyebrow: '04 · BATTERY',      value: '{value} h playback', count: 30 },
    ];
    const COL_IN = 248, COL_OUT = 548;          // text column: inner edge / line end, measured from the canvas centre
    const EYEBROW = { fontFamily: MONO, fontSize: 13, fontWeight: '600', letterSpacing: 2.5, fill: C.accentInk };
    const VALUE = { fontFamily: SANS, fontSize: 27, fontWeight: '600', fill: C.ink, letterSpacing: -0.3 };

    function callout(s, i) {
      const at = T.callouts[i], until = T.calloutsOut + 0.35 + i * 0.06;   // texts fade with the line retraction
      const surf = [s.side * s.r * 0.72, s.y, s.r * 0.69];             // a point on the front surface
      const [dx, dy] = project(surf, POSE.spec);
      const lineEnd = W / 2 + s.side * COL_OUT, textX = W / 2 + s.side * COL_IN;
      const len = Math.abs(lineEnd - dx);
      const ax = s.side > 0 ? 0 : 1;                                 // text aligned to the inner column edge
      const name = `callout-${s.key}`;
      const exitAt = T.calloutsOut + i * 0.06 - at;
      const boxW = COL_OUT - COL_IN + 30, boxCx = W / 2 + s.side * (COL_IN + COL_OUT) / 2;
      const layers = [
        // leader line grows out of the dot, retracts into it
        rect(`${name}-line`, dx, dy, 0, 1.5, C.ink, { anchorX: s.side > 0 ? 0 : 1, at, duration: until - at,
          initial: { fillAlpha: 0.85 },
          keyframes: [{ at: 0.1, to: { width: len }, duration: 0.6, ease: IN }, { at: exitAt, to: { width: 0 }, duration: 0.35, ease: OUT }] }),
        { type: 'shape', shape: 'circle', name: `${name}-end`, radius: 3, at: at + 0.5, duration: until - at - 0.5,
          initial: { x: lineEnd, y: dy, fillColor: C.ink, scale: 0 },
          keyframes: [{ at: 0, to: { scale: 1 }, duration: 0.3, ease: 'back.out(3)' }, { at: exitAt - 0.5, to: { scale: 0 }, duration: 0.2, ease: OUT }] },
        // hotspot on the product: dot + a halo that breathes
        { type: 'shape', shape: 'circle', name: `${name}-halo`, radius: 13, at, duration: until - at,
          initial: { x: dx, y: dy, fillAlpha: 0, strokeColor: C.accent, strokeWidth: 1.5, strokeAlpha: 0.9, scale: 0 },
          keyframes: [{ at: 0, to: { scale: 1 }, duration: 0.45, ease: 'back.out(2.2)' },
                      { at: 0.6, to: { scale: 1.35, strokeAlpha: 0.25 }, duration: 0.8, ease: 'sine.inOut', repeat: 3, yoyo: true },
                      { at: exitAt, to: { scale: 0 }, duration: 0.3, ease: OUT }] },
        { type: 'shape', shape: 'circle', name: `${name}-dot`, radius: 4.5, at, duration: until - at,
          initial: { x: dx, y: dy, fillColor: C.accent, strokeColor: '#ffffff', strokeWidth: 1.5, scale: 0 },
          keyframes: [{ at: 0, to: { scale: 1 }, duration: 0.4, ease: 'back.out(3)' }, { at: exitAt, to: { scale: 0 }, duration: 0.3, ease: OUT }] },
        revealText(`${name}-eyebrow`, s.eyebrow, EYEBROW, textX, dy - 10, ax, 1, at + 0.3, until, +1,
          { w: boxW, h: 24, cx: boxCx, cy: dy - 10 - 12 }),
        revealText(`${name}-value`, s.value, VALUE, textX, dy + 9, ax, 0, at + 0.38, until, -1,
          { w: boxW, h: 40, cx: boxCx, cy: dy + 9 + 20 },
          s.count ? { initial: { value: 0 }, format: { decimals: 0 }, keyframes: [{ at: 0.1, to: { value: s.count }, duration: 1.1, ease: 'power2.out' }] } : {}),
      ];
      return layers;
    }
    const callouts = SPECS.flatMap(callout);

    // ───────────── chrome (white phase) ─────────────
    // keyframe `at` is layer-local: give the layer's own start so the exit lands at the same composition time
    const chromeOut = (start = 0) => ({ at: T.toGraphite - 0.3 - start, to: { alpha: 0 }, duration: 0.5, ease: OUT });
    const chromeIn = (d = 0.5) => ({ at: d, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.8, ease: 'power2.out' });
    const chrome = [
      text('mark-brand', 'ORRI', { fontFamily: MONO, fontSize: 15, fontWeight: '800', letterSpacing: 6, fill: C.ink }, { x: 72, y: 48 },
        { duration: T.toGraphite + 0.4, keyframes: [chromeIn(0.4), chromeOut()] }),
      text('mark-model', 'ONE', { fontFamily: MONO, fontSize: 15, fontWeight: '800', letterSpacing: 6, fill: C.accentInk }, { x: 142, y: 48 },
        { duration: T.toGraphite + 0.4, keyframes: [chromeIn(0.5), chromeOut()] }),
      text('mark-film', 'PRODUCT FILM  /  2026', { fontFamily: MONO, fontSize: 12, fontWeight: '500', letterSpacing: 3, fill: C.mute }, { x: W - 72, y: 50, anchorX: 1 },
        { duration: T.toGraphite + 0.4, keyframes: [chromeIn(0.6), chromeOut()] }),
      text('spec-label', 'SPEC', { fontFamily: MONO, fontSize: 12, fontWeight: '600', letterSpacing: 3, fill: C.mute }, { x: 72, y: 652 },
        { at: T.callouts[0], duration: T.toGraphite + 0.4 - T.callouts[0], keyframes: [chromeIn(0), chromeOut(T.callouts[0])] }),
      text('spec-index', '0{value} / 04', { fontFamily: MONO, fontSize: 12, fontWeight: '700', letterSpacing: 3, fill: C.ink }, { x: 124, y: 652, value: 1 },
        { at: T.callouts[0], duration: T.toGraphite + 0.4 - T.callouts[0], format: { decimals: 0 },
          keyframes: [chromeIn(0), ...T.callouts.slice(1).map((t, i) => ({ at: t - T.callouts[0], set: { value: i + 2 } })), chromeOut(T.callouts[0])] }),
      ...T.callouts.flatMap((t, i) => {
        const x = 236 + i * 36;
        return [
          rect(`spec-seg-${i}`, x, 659, 28, 3, C.studioEdge, { anchorX: 0, at: T.callouts[0], duration: T.toGraphite + 0.4 - T.callouts[0],
            keyframes: [chromeIn(0), chromeOut(T.callouts[0])] }),
          rect(`spec-seg-on-${i}`, x, 659, 0, 3, C.accent, { anchorX: 0, at: t, duration: T.toGraphite + 0.4 - t,
            keyframes: [{ at: 0.05, to: { width: 28 }, duration: 0.5, ease: IN }, chromeOut(t)] }),
        ];
      }),
    ];

    // ───────────── lock-up (graphite phase) ─────────────
    const LX = 736;
    const lockup = [
      rect('lockup-rule', LX, 438, 0, 3, C.accent, { anchorX: 0, at: T.lockup, duration: DURATION - T.lockup,
        keyframes: [{ at: 0.3, to: { width: 40 }, duration: 0.6, ease: IN }] }),
      revealText('lockup-wordmark', 'ORRI', { fontFamily: SANS, fontSize: 132, fontWeight: '700', letterSpacing: 16, fill: C.paper },
        LX - 6, 268, 0, 0, T.lockup + 0.1, DURATION, +1, { w: 560, h: 150, cx: LX + 270, cy: 268 + 75 }, { exit: false }),
      revealText('lockup-model', 'ONE · SMART BOTTLE SPEAKER', { fontFamily: MONO, fontSize: 15, fontWeight: '600', letterSpacing: 4, fill: C.accent },
        LX + 56, 428, 0, 0, T.lockup + 0.35, DURATION, -1, { w: 520, h: 24, cx: LX + 56 + 250, cy: 428 + 12 }, { exit: false }),
      revealText('lockup-tagline', 'Carry the sound.', { fontFamily: SERIF, fontSize: 34, fontStyle: 'italic', fill: '#c9cbd0' },
        LX, 466, 0, 0, T.lockup + 0.55, DURATION, -1, { w: 560, h: 50, cx: LX + 270, cy: 466 + 25 }, { exit: false }),
    ];

    // ───────────── backgrounds ─────────────
    const backgrounds = [
      rect('bg-studio', W / 2, H / 2, W, H, undefined, { fillGradient: { type: 'radial', center: [0.5, 0.45], radius: 0.8, stops: [[0, C.studio], [0.55, '#ececea'], [1, C.studioEdge]] } }),
      text('ghost-one', 'ONE', { fontFamily: '"Arial Black", "Helvetica Neue", Arial, sans-serif', fontSize: 400, fontWeight: '900', fill: '#e8e8e5', letterSpacing: 10 },
        { x: W / 2 + 30, y: H / 2 - 20, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        { duration: T.callouts[0] + 0.4, keyframes: [
          { at: 0.6, to: { alpha: 1 }, duration: 1.6, ease: 'power2.out' },
          { at: 0, to: { x: W / 2 - 20 }, duration: T.callouts[0] + 0.4, ease: 'none' },
          { at: -0.7, to: { alpha: 0 }, duration: 0.7, ease: 'power1.in' }] }),
      rect('bg-graphite', W / 2, H / 2, W, H, undefined, { at: T.toGraphite, duration: DURATION - T.toGraphite,
        initial: { alpha: 0 },
        fillGradient: { type: 'radial', center: [0.33, 0.52], radius: 0.85, stops: [[0, C.graphite], [0.5, '#24262a'], [1, C.graphiteEdge]] },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 1.1, ease: 'power2.inOut' }] }),
    ];

    // ───────────── audio ─────────────
    const audio = [
      { type: 'audio', name: 'bgm', asset: 'bgm', loop: true, initial: { volume: 0 },
        keyframes: [{ at: 0, to: { volume: 0.3 }, duration: 1.2 }, { at: -1.6, to: { volume: 0 }, duration: 1.6 }] },
      ...T.callouts.map((t, i) => ({ type: 'audio', name: `sfx-pop-${i}`, sfx: 'pop', at: t, volume: 0.41 })),
      { type: 'audio', name: 'sfx-swoosh', sfx: 'swoosh', at: T.toGraphite - 0.05, volume: 0.51 },
      { type: 'audio', name: 'sfx-chime', sfx: 'chime', at: T.lockup + 0.1, volume: 0.13 },
    ];

    const sequences = [...backgrounds, product3d, ...callouts, ...chrome, ...lockup, ...audio];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS, poster: POSTER_FRAME / FPS,
        background: C.studio,
        assets: [
          { name: 'bgm', src: '../_assets/bgm.mp3' },
        ],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
