<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eight Bars — pixi-effects</title>
  <script type="application/json" id="piece-meta">{ "title": "Eight Bars", "subtitle": "A four-bar tune written as text, falling down a piano roll: each bar flashes and rings the moment its note sounds", "tags": ["music", "piano roll", "sound from text", "rhythm", "minimal", "typography"], "width": 1080, "height": 1080, "duration": 14, "model": "haiku" }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.20.0/dist/loader.css" />
  <style>
    body { background: #0d0f14; margin: 0; padding: 16px; }
    .stage { position: relative; width: min(720px, 100%, 80vh); margin: 0 auto; }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1080, H = 1080, FPS = 30, DURATION = 14;
    const INK = '#0d0f14', PAPER = '#f2efe8', ACC = '#ff6b4a', TINT = '#ffb3a0';

    // ── THE SONG: written once, used for BOTH the sound (text) and the falling bars ──
    // A 4-bar tune in 3/4 at 120 BPM (a bar = 1.5 s). Events are [note, startBeat, lengthBeats].
    const BPM = 120, BEAT = 60 / BPM, BAR_BEATS = 3;
    const PASS = 4 * BAR_BEATS;          // one pass of the tune = 12 beats
    const REPEAT = PASS;                 // the repeat starts at beat 12
    const TOTAL = 2 * PASS;              // 24 beats = eight bars
    const MELODY = [
      ['e5', 0, 1], ['g5', 1, 1], ['a5', 2, 1],     // bar 1
      ['g5', 3, 2], ['e5', 5, 1],                   // bar 2
      ['d5', 6, 1], ['e5', 7, 1], ['g5', 8, 1],     // bar 3
      ['a5', 9, 2], ['c5', 11, 1],                  // bar 4: home on C
    ];
    const BASS = [                                  // oom-pah under C, Am, F, G (ends on C)
      ['c2', 0, 1.5], ['g2', 1.5, 1.5], ['a1', 3, 1.5], ['e2', 4.5, 1.5],
      ['f1', 6, 1.5], ['c2', 7.5, 1.5], ['g1', 9, 1.5], ['c2', 10.5, 1.5],
    ];
    // helpers: an octave down, shift in time, and the events as a music string with rests between them
    const down = n => n.replace(/\d/, d => String(Number(d) - 1));          // 'e5' -> 'e4'
    const shift = (ev, by) => ev.map(([n, s, l]) => [n, s + by, l]);
    const twice = ev => [...ev, ...shift(ev, REPEAT)];                      // the tune, then its repeat
    const score = (ev, total) => {                                          // [[n,s,l]…] -> 'e5:1 _:0.5 …'
      const out = []; let pos = 0;
      for (const [n, s, l] of [...ev].sort((a, b) => a[1] - b[1])) {
        if (s > pos) out.push(`_:${s - pos}`);
        out.push(`${n}:${l}`); pos = s + l;
      }
      if (pos < total) out.push(`_:${total - pos}`);
      return out.join(' ');
    };
    const VOICES = {
      melody: twice(MELODY),                                                // pass 1 and pass 2
      bass: twice(BASS),                                                    // both passes
      second: shift(MELODY.map(([n, s, l]) => [down(n), s, l]), REPEAT),    // pass 2 only: the second colour
    };

    // ── the picture is built from the same events ──
    const LANES = ['c4', 'd4', 'e4', 'g4', 'a4', 'c5', 'd5', 'e5', 'g5', 'a5'];   // pentatonic lanes
    const laneX = n => 540 + (LANES.indexOf(n) - 4.5) * 75;
    const HIT_Y = 800, ROLL_TOP = 150, MUSIC_AT = 1.5;                       // the tune starts after a 1.5 s lead-in
    const TRAVEL = 1.5, V = HIT_Y / TRAVEL;                                  // a bar falls from the top edge to the hit line in 1.5 s
    const hitTime = beat => MUSIC_AT + beat * BEAT;

    const seq = [];

    // lanes: faint hairlines
    LANES.forEach((n, i) => seq.push({
      type: 'shape', shape: 'rect', name: `lane-${i}`, width: 1.5, height: HIT_Y - ROLL_TOP,
      initial: { x: laneX(n), y: ROLL_TOP, anchorX: 0.5, anchorY: 0, fillColor: PAPER, alpha: 0.16 },
    }));

    // hit line: a soft glow that pulses on each bar's downbeat, and a crisp core
    const barStarts = [0, 1, 2, 3, 4, 5, 6, 7].map(k => MUSIC_AT + k * BAR_BEATS * BEAT);
    seq.push({
      type: 'shape', shape: 'rect', name: 'hit-glow', width: 900, height: 110,
      initial: { x: 540, y: HIT_Y, anchorX: 0.5, anchorY: 0.5, alpha: 0.4,
                 fillGradient: { angle: 90, stops: [[0, 'rgba(255,107,74,0)'], [0.5, 'rgba(255,107,74,0.5)'], [1, 'rgba(255,107,74,0)']] } },
      keyframes: barStarts.map(t => ({ at: t, from: { alpha: 1 }, to: { alpha: 0.4 }, duration: 1.2, ease: 'power2.out' })),
    });
    seq.push({ type: 'shape', shape: 'rect', name: 'hit-line', width: 900, height: 3,
      initial: { x: 540, y: HIT_Y, anchorX: 0.5, anchorY: 0.5, fillColor: PAPER, alpha: 0.9 } });

    // one falling bar + one ring per note. Bar: its bottom edge reaches the hit line exactly at the note's start.
    const FALL_AFTER = 0.35;                                                 // seconds it keeps falling after the hit, then fades
    const bars = (events, colour, flash, label) => events.forEach(([n, beat, len], i) => {
      const hit = hitTime(beat), at = hit - TRAVEL, life = TRAVEL + FALL_AFTER;
      const x = laneX(n), h = len * BEAT * V * 0.92;                        // height proportional to the note length
      seq.push({
        type: 'shape', shape: 'rect', name: `n-${label}-${i}`, at, duration: life,
        width: 50, height: h, cornerRadius: 10,
        initial: { x, y: 0, anchorX: 0.5, anchorY: 1, fillColor: colour, alpha: 1 },
        keyframes: [
          { at: 0, to: { y: HIT_Y + FALL_AFTER * V }, duration: life, ease: 'none' },   // a steady fall
          { at: TRAVEL, set: { fillColor: flash } },                                    // the flash on the note
          { at: TRAVEL + 0.07, set: { fillColor: colour } },
          { at: TRAVEL, to: { scaleX: 1.35 }, duration: 0.07, ease: 'power2.out' },
          { at: TRAVEL + 0.07, to: { scaleX: 1 }, duration: 0.25, ease: 'power2.out' },
          { at: TRAVEL, to: { alpha: 0 }, duration: FALL_AFTER, ease: 'power1.in' },
        ],
      });
      seq.push({
        type: 'shape', shape: 'circle', name: `r-${label}-${i}`, at: hit, duration: 0.6,
        initial: { x, y: HIT_Y, radius: 16, fillAlpha: 0, strokeColor: colour, strokeWidth: 5, alpha: 1 },
        keyframes: [{ at: 0, to: { radius: 110, alpha: 0, strokeWidth: 1 }, duration: 0.6, ease: 'power2.out' }],
      });
    });
    bars(VOICES.melody, ACC, PAPER, 'm');
    bars(VOICES.second, TINT, PAPER, 's');

    // the curtain: the roll fades into the header band
    seq.push({ type: 'shape', shape: 'rect', name: 'curtain', width: W, height: 230, cornerRadius: 0,
      initial: { x: 0, y: 0, anchorX: 0, anchorY: 0, fillGradient: { angle: 90, stops: [[0, 'rgba(13,15,20,1)'], [0.65, 'rgba(13,15,20,1)'], [1, 'rgba(13,15,20,0)']] } } });

    // header: the bar counter (set keyframes in time with the bars); the title is added after the veil (it grows into the lock-up)
    seq.push({ type: 'text', name: 'bar-counter', text: 'BAR --', at: 0,
      style: { fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: 36, fontWeight: 'bold', fill: ACC, letterSpacing: 2 },
      initial: { x: 1020, y: 52, anchorX: 1 },
      keyframes: barStarts.map((t, k) => ({ at: t, set: { text: `BAR ${String(k + 1).padStart(2, '0')}` } })) });

    // the end: the roll veils to ink, then the lock-up (held ~0.5 s)
    const END = 13.0;
    seq.push({ type: 'shape', shape: 'rect', name: 'veil', at: END, width: W, height: H,
      initial: { x: 0, y: 0, anchorX: 0, anchorY: 0, fillColor: INK, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5, ease: 'power2.inOut' }] });
    // the title grows from the top-left into the centre (the lock-up), then holds for ~0.5 s
    seq.push({ type: 'text', name: 'title', text: 'EIGHT BARS', at: 0,
      style: { fontFamily: '"Arial Black", Impact, system-ui, sans-serif', fontSize: 46, fill: PAPER, letterSpacing: 3 },
      initial: { x: 60, y: 46, anchorX: 0, anchorY: 0, scale: 1 },
      keyframes: [{ at: END, to: { x: 540, y: 470, anchorX: 0.5, anchorY: 0.5, scale: 2.3 }, duration: 0.5, ease: 'expo.inOut' }] });
    seq.push({ type: 'shape', shape: 'rect', name: 'lockup-rule', at: END, width: 420, height: 6,
      initial: { x: 540, y: 600, anchorX: 0.5, anchorY: 0.5, fillColor: ACC, scaleX: 0 },
      keyframes: [{ at: 0.3, to: { scaleX: 1 }, duration: 0.5, ease: 'expo.out' }] });

    // the tune: text in, sound out. Melody = bell, bass, the second voice (pluck) enters on the repeat;
    // the kick runs both passes, the hat joins on the repeat.
    const musicLayer = {
      type: 'audio', name: 'tune', at: MUSIC_AT, volume: 0.8,
      music: {
        bpm: BPM,
        tracks: [
          { inst: 'bell', vol: 0.8, ring: 0.6, notes: score(VOICES.melody, TOTAL) },
          { inst: 'bass', vol: 0.75, notes: score(VOICES.bass, TOTAL) },
          { inst: 'pluck', vol: 0.55, notes: score(VOICES.second, TOTAL) },
        ],
        grid: 2,
        drums: [{ kick: 'x.x...' }, { from: REPEAT, hat: 'x.x.x.' }],
      },
    };

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 9.0,
        background: INK,
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'ground', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: INK } },
          ...seq,
          musicLayer,
        ] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
