<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FLOW — liquid gradient title · pixi-effects</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    html, body { height: 100%; }
    body { background: #15161a; margin: 0; padding: 16px; box-sizing: border-box; display: grid; place-items: center; }
    /* The Controller wraps the canvas in a full-width div.movie-controller-wrap (position: relative) so the bar can overlay it:
       size and centre the WRAPPER, or the canvas sits at the left of it and the bar spans the whole page. */
    .movie-controller-wrap { width: min(960px, 100%); margin: 0 auto; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 8px; --pe-loader-bg: #15161a; background: #15161a; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">
  { "title": "Flow",
    "subtitle": "Blurred colour blobs drift and saturate on a pale field, then the field drains into the wordmark",
    "tags": ["title", "gradient", "liquid", "oklch", "alpha-handoff", "blur", "blendMode"],
    "width": 1280, "height": 720, "duration": 10, "model": "fable" }
  </script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    import { BlurFilter } from 'pixi.js';

    // ---------------------------------------------------------------- constants
    const W = 1280, H = 720, FPS = 30, DURATION = 10;
    const POSTER_FRAME = 213;                     // 7.1 s: the field half-drained, the word already vivid

    const PALE = '#f6f1f5';                       // the field at the start and the cover at the end: the piece closes on its opening colour
    const INK = '#3b2f4a';
    const FAMILY = "system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif";

    // Timeline (composition seconds). One place to tune the whole choreography.
    const T = {
      gatherFrom: 4.4,  gatherTo: 6.4,            // the blobs stop wandering and settle onto the word's band
      resolve: 6.2,     resolveDur: 1.3,          // the pale cover fades in, cut by the FLOW mask
      chime: 6.55,
      caption: 7.5,
      hueDrift: 7.6,                              // a last slow colour move inside the letters, ends at 9.9
    };
    const WORD_Y = 360;                           // vertical centre of the wordmark

    // ---------------------------------------------------------------- blobs (data)
    // cx/cy: drift centre · ax/ay: drift amplitude · wx/wy: angular speed (rad/s) · px/py: phase · r: radius
    // tx/ty: where the blob settles for the wordmark (left → right along the band, warm → cool)
    // colors: pastel → mid → vivid → end-hold drift
    const BLOBS = [
      { name: 'amber',   cx: 300,  cy: 240, ax: 150, ay: 110, wx: 0.55, wy: 0.42, px: 0.2, py: 1.9, r: 240, tx: 250,  ty: 350, colors: ['#fff1c4', '#ffd37a', '#ffb03a', '#ffbe55'] },
      { name: 'coral',   cx: 520,  cy: 500, ax: 170, ay: 120, wx: 0.46, wy: 0.63, px: 2.4, py: 0.6, r: 260, tx: 420,  ty: 390, colors: ['#ffd3c4', '#ff9c86', '#ff5c6a', '#ff6a5e'] },
      { name: 'rose',    cx: 700,  cy: 220, ax: 160, ay: 110, wx: 0.60, wy: 0.50, px: 4.0, py: 2.8, r: 230, tx: 590,  ty: 330, colors: ['#ffdada', '#ffa0b8', '#ff5f9e', '#ff4f8f'] },
      { name: 'magenta', cx: 820,  cy: 520, ax: 180, ay: 120, wx: 0.42, wy: 0.56, px: 1.1, py: 4.3, r: 270, tx: 760,  ty: 400, colors: ['#ffd0e8', '#ff92cf', '#ff3fae', '#f23ac4'] },
      { name: 'violet',  cx: 1000, cy: 260, ax: 140, ay: 120, wx: 0.52, wy: 0.44, px: 3.1, py: 1.4, r: 250, tx: 930,  ty: 340, colors: ['#e8d6ff', '#c498ff', '#8f4dff', '#7f55ff'] },
      { name: 'blue',    cx: 1060, cy: 500, ax: 150, ay: 100, wx: 0.48, wy: 0.60, px: 5.2, py: 3.5, r: 240, tx: 1080, ty: 390, colors: ['#d2e0ff', '#93b6ff', '#4f7dff', '#4a8cff'] },
    ];
    const BLUR = 70;
    const blurred = (strength, halfW, halfH) => ({          // a blur filter + the filterArea that gives it room (layer's own coordinates)
      filters: [{ type: 'custom', name: 'blur', filter: new BlurFilter({ strength, quality: 10 }) }],
      filterArea: { x: -(halfW + strength * 3), y: -(halfH + strength * 3), width: 2 * (halfW + strength * 3), height: 2 * (halfH + strength * 3) },
    });

    // ---------------------------------------------------------------- blob motion: a smooth path sampled into short linear keyframes
    // There is no per-frame expression in the DSL, so (like orbit()) the path is sampled every 0.1 s.
    // Wander = a Lissajous figure around the drift centre; from gatherFrom to gatherTo the centre glides to the band target
    // and the amplitude shrinks to 30 %, so the blobs keep breathing inside the letters.
    const STEP = 0.1;
    const smooth = u => { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); };
    const posAt = (b, t) => {
      const s = smooth((t - T.gatherFrom) / (T.gatherTo - T.gatherFrom));
      const wob = 1 - 0.7 * s;
      const cx = b.cx + (b.tx - b.cx) * s, cy = b.cy + (b.ty - b.cy) * s;
      return { x: cx + b.ax * wob * Math.sin(b.wx * t + b.px), y: cy + b.ay * wob * Math.sin(b.wy * t + b.py) };
    };
    const pathKeyframes = b => {
      const n = Math.round(DURATION / STEP);
      return Array.from({ length: n }, (_, k) => ({ at: k * STEP, to: posAt(b, (k + 1) * STEP), duration: STEP, ease: 'none' }));
    };

    const blob = (b, i) => ({
      type: 'shape', shape: 'circle', name: 'blob-' + b.name, radius: b.r, colorSpace: 'oklch',
      ...blurred(BLUR, b.r, b.r),
      initial: { ...posAt(b, 0), fillColor: b.colors[0], alpha: 0, scale: 0.5 },
      keyframes: [
        { at: 0, to: { alpha: 0.95, scale: 1 }, duration: 1.6 + i * 0.15, ease: 'sine.out' },      // pastel blooms
        { at: 1.6 + i * 0.2,  to: { fillColor: b.colors[1] }, duration: 2.2, ease: 'sine.inOut' },  // → mid
        { at: 4.3 + i * 0.15, to: { fillColor: b.colors[2] }, duration: 1.9, ease: 'sine.inOut' },  // → vivid, as they gather
        { at: T.hueDrift,     to: { fillColor: b.colors[3] }, duration: 2.3, ease: 'sine.inOut' },  // quiet drift during the hold
        ...pathKeyframes(b),
      ],
    });

    // a bright core riding each blob, additive: where blobs merge the light adds up instead of covering
    const core = b => ({
      type: 'shape', shape: 'circle', name: 'core-' + b.name, radius: b.r * 0.42, colorSpace: 'oklch', blendMode: 'add',
      ...blurred(44, b.r * 0.42, b.r * 0.42),
      initial: { ...posAt(b, 0), fillColor: b.colors[2], alpha: 0 },
      keyframes: [
        { at: 3.6, to: { alpha: 0.32 }, duration: 2.4, ease: 'sine.inOut' },
        ...pathKeyframes(b),
      ],
    });

    // ---------------------------------------------------------------- the cover: the pale field with the word punched out of it (alpha handoff)
    // A text mask is only its bounding box in Pixi v8 (stencil), and an image mask ignores `maskInverted`,
    // so the "everything but the letters" cover is drawn once on a canvas: pale fill, letters cut with destination-out.
    function coverAsset() {
      const S = 2;                                                          // drawn at 2x for crisp letter edges
      const c = Object.assign(document.createElement('canvas'), { width: W * S, height: H * S });
      const g = c.getContext('2d');
      g.scale(S, S);
      g.fillStyle = PALE; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'destination-out';
      g.font = `800 320px ${FAMILY}`;
      g.letterSpacing = '14px';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000000';
      g.fillText('FLOW', W / 2 + 7, WORD_Y);                                // +7: half the trailing letter-spacing
      return { name: 'cover', src: c.toDataURL() };
    }

    // ---------------------------------------------------------------- composition
    const sequences = [
      // the field: pale → soft lilac → deep violet (oklch, so no grey midpoints); the cover brings the pale back
      { type: 'shape', shape: 'rect', name: 'field', width: W, height: H, colorSpace: 'oklch',
        initial: { x: W / 2, y: H / 2, fillColor: PALE },
        keyframes: [
          { at: 1.5, to: { fillColor: '#e9dcff' }, duration: 2.5, ease: 'sine.inOut' },
          { at: 4.4, to: { fillColor: '#5a35e8' }, duration: 2.0, ease: 'sine.inOut' },
        ] },

      // a wide bed of colour that gathers under the word, so the letters are never hollow
      { type: 'shape', shape: 'ellipse', name: 'bed', radiusX: 540, radiusY: 150, colorSpace: 'oklch',
        ...blurred(BLUR, 540, 150),
        initial: { x: W / 2, y: WORD_Y + 5, fillColor: '#ffd9e6', alpha: 0 },
        keyframes: [
          { at: 3.8, to: { alpha: 0.9 }, duration: 2.4, ease: 'sine.inOut' },
          { at: 3.8, to: { fillColor: '#ff86b4' }, duration: 2.6, ease: 'sine.inOut' },
          { at: T.hueDrift, to: { fillColor: '#ff6fa0' }, duration: 2.3, ease: 'sine.inOut' },
          { at: 0, to: { scaleX: 1.05 }, duration: 2.5, ease: 'sine.inOut', repeat: 3, yoyo: true },
        ] },

      ...BLOBS.map(blob),
      ...BLOBS.map(core),

      // the resolve: the pale field returns everywhere EXCEPT inside the letters — the colour drains into the word
      { type: 'image', asset: 'cover', name: 'cover', at: T.resolve,
        initial: { x: W / 2, y: H / 2, anchorX: 0.5, anchorY: 0.5, scale: 0.52, alpha: 0 },         // the image is 2x
        keyframes: [
          { at: 0, to: { alpha: 1 }, duration: T.resolveDur, ease: 'sine.inOut' },
          { at: 0, to: { scale: 0.5 }, duration: 1.8, ease: 'sine.out' },                          // the word settles as it resolves
        ] },

      // hairline + caption, after the word has resolved
      { type: 'shape', shape: 'rect', name: 'rule', width: 0, height: 2, at: T.caption - 0.1,
        initial: { x: W / 2, y: 528, fillColor: INK, alpha: 0.4 },
        keyframes: [{ at: 0, to: { width: 140 }, duration: 0.9, ease: 'power2.out' }] },
      { type: 'text', text: 'LIQUID GRADIENT STUDY  ·  N° 01', name: 'caption', at: T.caption,
        style: { fontSize: 20, fontWeight: '500', fontFamily: FAMILY, letterSpacing: 7, fill: INK },
        initial: { x: W / 2, y: 574, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 586 }, to: { alpha: 0.85, y: 574 }, duration: 0.8, ease: 'sine.out' }] },

      // a soft chime at the resolve (a synthesised one-shot: no duration, it lasts as long as the sound)
      { type: 'audio', name: 'chime', sfx: 'chime', at: T.chime, volume: 0.16 },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS, poster: POSTER_FRAME / FPS,
        background: PALE,
        assets: [coverAsset()],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
