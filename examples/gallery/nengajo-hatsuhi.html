<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nengajo-hatsuhi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    body { background: #121212; margin: 0; padding: 16px; box-sizing: border-box; min-height: 100vh; }
    .stage { position: relative; width: min(100%, calc((100vh - 32px) * 1080 / 1350)); margin: 0 auto; }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  </style>
</head>
<body>
  <script type="application/json" id="piece-meta">{ "title": "Nengajo: Hatsuhi", "subtitle": "A New Year card: the first sunrise over washi, a mizuhiki cord tied in gold and vermilion, a seal to close", "tags": ["japanese", "new-year", "card", "typography", "vertical-text", "draw-on", "music"], "width": 1080, "height": 1350, "duration": 12, "model": "opus" }</script>
  <div class="stage">
    <canvas id="stage" width="1080" height="1350"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/present":  "../../dist/present.js",
      "pixi-effects/three":      "../../dist/three.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/index.js" />

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1080, H = 1350, FPS = 30, DURATION = 12;
    const BEAT = 0.6, BAR = 2.4;                       // 100 bpm: every entrance sits on a beat

    // Palette: washi, sumi, vermilion, gold
    const PAPER_A = '#f5efe3', PAPER_B = '#e9dfcd';
    const SUMI = '#231d19', SUMI_SOFT = '#6d6158';
    const SHU = '#b8352b', GOLD = '#ad8b4c', GOLD_LIGHT = '#fff1c9';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif';

    // seeded random (deterministic)
    function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ── Washi paper (static shader) ─────────────────────────────────────────
    const paper = {
      type: 'shader', name: 'washi',
      uniforms: { paperA: PAPER_A, paperB: PAPER_B },
      fragment: `
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = fragCoord / iResolution.xy;
          float n = 0.0, a = 0.5; vec2 p = fragCoord / 340.0;
          for (int i = 0; i < 5; i++) { n += a * noise(p); p *= 2.07; a *= 0.5; }
          float fa = noise(vec2(fragCoord.x / 1.6 + fragCoord.y / 5.0, fragCoord.y / 38.0 - fragCoord.x / 70.0));
          float fb = noise(vec2(fragCoord.y / 1.6 - fragCoord.x / 6.0, fragCoord.x / 34.0) + 17.0);
          float fib = smoothstep(0.9, 1.0, fa) + smoothstep(0.92, 1.0, fb);
          float grain = hash(floor(fragCoord)) - 0.5;
          vec3 col = mix(paperA, paperB, 0.55 * smoothstep(0.3, 0.75, n));
          col += fib * 0.022 + grain * 0.008;
          float v = distance(uv, vec2(0.5, 0.52));
          col *= 1.0 - 0.09 * smoothstep(0.3, 0.8, v);
          fragColor = vec4(col, 1.0);
        }`,
    };

    // ── Gold leaf flakes (kinpaku) ──────────────────────────────────────────
    function flakes() {
      const r = rng(2027), out = [];
      const zones = [[90, 80, 520, 230, 14], [900, 760, 110, 160, 3], [80, 610, 200, 200, 4]];
      let k = 0;
      for (const [zx, zy, zw, zh, n] of zones) {
        for (let i = 0; i < n; i++, k++) {
          const cx = zx + r() * zw, cy = zy + r() * zh, s = 2.5 + r() * r() * 9;
          if (Math.hypot(cx - 340, cy - 400) < 150) { r(); r(); r(); r(); r(); r(); r(); r(); r(); r(); continue; }
          const pts = [0, 1, 2, 3].map(j => { const a = j * Math.PI / 2 + r() * 0.9, rr = s * (0.6 + r() * 0.6); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });
          const t0 = 0.1 + r() * 1.6;
          out.push({ type: 'shape', shape: 'polygon', name: `flake${k}`, points: pts, at: t0, duration: DURATION - t0,
            initial: { fillColor: r() < 0.25 ? '#c9a862' : GOLD, fillAlpha: 0, },
            keyframes: [{ at: 0, to: { fillAlpha: 0.45 + r() * 0.4 }, duration: 1.4, ease: 'sine.out' }] });
        }
      }
      return out;
    }

    // ── Hatsuhi: the first sun rising behind a gold horizon ─────────────────
    const HORIZON_Y = 488, SUN_X = 340, SUN_R = 118;
    const sun = [
      { type: 'shape', shape: 'circle', name: 'sun', radius: SUN_R, at: 0.2, duration: DURATION - 0.2,
        initial: { x: SUN_X, y: HORIZON_Y + SUN_R + 8,
          fillGradient: { type: 'radial', stops: [[0, '#c9442f'], [1, SHU]] } },
        keyframes: [{ at: 0, to: { y: HORIZON_Y - SUN_R + 34 }, duration: 3.0, ease: 'power2.out' }],
        mask: { type: 'shape', shape: 'rect', width: 600, height: 500, initial: { x: SUN_X, y: HORIZON_Y - 250, fillColor: '#ffffff' } } },
      { type: 'shape', shape: 'line', name: 'horizon', from: [150, HORIZON_Y], to: [560, HORIZON_Y], at: 0.1, duration: DURATION - 0.1,
        initial: { strokeColor: GOLD, strokeWidth: 2, trimEnd: 0 }, strokeCap: 'round',
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1.6, ease: 'power3.inOut' }] },
      { type: 'text', name: 'latin', text: 'A HAPPY NEW YEAR  2027', at: 2.0, duration: DURATION - 2.0,
        style: { fontFamily: 'Georgia, "Times New Roman", serif', fontSize: 19, letterSpacing: 6, fill: GOLD },
        initial: { x: 152, y: HORIZON_Y + 22, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 1.2, ease: 'sine.out' }] },
    ];

    // ── 謹賀新年, vertical, one layer per character, one per beat ───────────
    const TITLE = '謹賀新年', TITLE_X = 800, TITLE_Y0 = 196, TITLE_STEP = 136;
    const title = [...TITLE].map((ch, i) => {
      const t0 = BAR + i * BEAT;
      return { type: 'text', name: `title${i}`, text: ch, at: t0, duration: DURATION - t0,
        style: { fontFamily: MINCHO, fontSize: 116, fill: SUMI, fontWeight: '400' },
        initial: { x: TITLE_X, y: TITLE_Y0 + i * TITLE_STEP, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, from: { y: TITLE_Y0 + i * TITLE_STEP + 18 }, to: { y: TITLE_Y0 + i * TITLE_STEP, alpha: 1 }, duration: 1.3, ease: 'power2.out' }] };
    });

    // ── Mizuhiki: five cords along one looped curve (a prolate cycloid) ─────
    const MZ = { cx: 540, cy: 830, sx: 170, sy: 95, r: 1, d: 2.2 };
    const curve = t => [MZ.cx + MZ.sx * (MZ.r * t - MZ.d * Math.sin(t)), MZ.cy - MZ.sy * MZ.d * Math.cos(t)];
    function cordPath(offset) {
      const pts = [], N = 260;
      for (let i = 0; i <= N; i++) {
        const t = -Math.PI + (2 * Math.PI * i) / N;
        const [x, y] = curve(t), [x2, y2] = curve(t + 0.001);
        const dx = x2 - x, dy = y2 - y, len = Math.hypot(dx, dy) || 1;
        pts.push([x - (dy / len) * offset, y + (dx / len) * offset]);
      }
      const first = pts[0], last = pts[pts.length - 1];
      pts.unshift([-120, first[1]]);
      pts.push([W + 120, last[1]]);
      return pts.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    }
    const CORDS = [GOLD, SHU, GOLD, SHU, GOLD], SPACING = 8;
    const DRAW_AT = 1.0, DRAW_DUR = 2.8;
    const mizuhiki = CORDS.flatMap((color, i) => {
      const d = cordPath((i - 2) * SPACING), t0 = DRAW_AT + i * 0.09;
      const cord = { type: 'shape', shape: 'path', name: `cord${i}`, d, at: t0, duration: DURATION - t0, strokeCap: 'round', strokeJoin: 'round',
        initial: { strokeColor: color, strokeWidth: 4.5, trimEnd: 0 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: DRAW_DUR, ease: 'power2.inOut' }] };
      if (color !== GOLD) return [cord];
      // a glint that travels along the gold cords on bar 4
      const g0 = 3 * BAR + i * 0.05;
      const glint = { type: 'shape', shape: 'path', name: `glint${i}`, d, at: g0, duration: 2.0, strokeCap: 'round', 
        initial: { strokeColor: GOLD_LIGHT, strokeWidth: 2, strokeAlpha: 0.95, trimStart: 0, trimEnd: 0 },
        keyframes: [
          { at: 0, to: { trimEnd: 1 }, duration: 1.7, ease: 'sine.inOut' },
          { at: 0.14, to: { trimStart: 1 }, duration: 1.7, ease: 'sine.inOut' },
        ] };
      return [cord, glint];
    });

    // ── Greeting, bottom left ───────────────────────────────────────────────
    const TX = 150;
    const lines = [
      { text: 'あけましておめでとうございます', size: 38, fill: SUMI, y: 1112, at: 2 * BAR },
      { text: '本年もどうぞよろしくお願い申し上げます', size: 25, fill: SUMI_SOFT, y: 1176, at: 2 * BAR + BEAT },
      { text: '二〇二七年　元旦', size: 22, fill: SUMI_SOFT, y: 1226, at: 2 * BAR + 2 * BEAT },
    ];
    const greeting = lines.map((l, i) => ({ type: 'text', name: `greet${i}`, text: l.text, at: l.at, duration: DURATION - l.at,
      style: { fontFamily: MINCHO, fontSize: l.size, fill: l.fill, letterSpacing: l.size * 0.12 },
      initial: { x: TX, y: l.y, alpha: 0 },
      keyframes: [{ at: 0, from: { x: TX - 14 }, to: { x: TX, alpha: 1 }, duration: 1.2, ease: 'power2.out' }] }));

    // ── Seal (落款), stamped on the downbeat of bar 5 ────────────────────────
    const SEAL_AT = 4 * BAR, SEAL_X = 896, SEAL_Y = 1186, SEAL = 92;
    const seal = [
      { type: 'shape', shape: 'rect', name: 'seal', width: SEAL, height: SEAL, cornerRadius: 7, at: SEAL_AT - 0.15, duration: DURATION - SEAL_AT + 0.15,
        initial: { x: SEAL_X, y: SEAL_Y, fillColor: SHU, alpha: 0, scale: 1.3, rotation: -2 },
        keyframes: [{ at: 0, to: { alpha: 0.94, scale: 1 }, duration: 0.15, ease: 'power2.in' }] },
      { type: 'shape', shape: 'rect', name: 'sealRule', width: SEAL - 14, height: SEAL - 14, cornerRadius: 4, at: SEAL_AT - 0.15, duration: DURATION - SEAL_AT + 0.15,
        initial: { x: SEAL_X, y: SEAL_Y, fillAlpha: 0, strokeColor: PAPER_A, strokeWidth: 2, alpha: 0, scale: 1.3, rotation: -2 },
        keyframes: [{ at: 0, to: { alpha: 0.85, scale: 1 }, duration: 0.15, ease: 'power2.in' }] },
      { type: 'text', name: 'sealChar', text: '寿', at: SEAL_AT - 0.15, duration: DURATION - SEAL_AT + 0.15,
        style: { fontFamily: MINCHO, fontSize: 56, fill: PAPER_A, fontWeight: '600' },
        initial: { x: SEAL_X, y: SEAL_Y, anchorX: 0.5, anchorY: 0.5, alpha: 0, scale: 1.3, rotation: -2 },
        keyframes: [{ at: 0, to: { alpha: 1, scale: 1 }, duration: 0.15, ease: 'power2.in' }] },
    ];

    // ── Sound: a koto-like pluck in the yo scale over a soft pad ────────────
    const music = {
      type: 'audio', name: 'music', at: 0, volume: 1.4,
      music: {
        bpm: 100, reverb: 0.42, seed: 7,
        tracks: [
          { inst: 'pluck', vol: 0.85, tone: 0.55, reverb: 0.55, pan: -0.1,
            notes: 'd4:0.5 a4:0.5 d5:1 e5:0.5 d5:0.5 b4:1 | a4:1.5 g4:0.5 a4:2 | d5:0.5 e5:0.5 g5:1 e5:0.5 d5:0.5 b4:1 | a4:1 b4:0.5 a4:0.5 g4:0.5 e4:0.5 d4:1 | [d4 a4 d5]:4' },
          { inst: 'pad', vol: 0.32, attack: 1.4, release: 2.2, tone: 0.4,
            notes: '[d3 a3 e4]:8 [e3 b3 d4]:4 [g3 d4 a4]:4 [d3 a3 e4]:4' },
          { inst: 'bass', vol: 0.4, tone: 0.3, notes: 'd2:8 e2:4 g2:4 d2:4' },
          { inst: 'bell', vol: 0.5, ring: 2.2, reverb: 0.7, pan: 0.2, notes: '_:12 b5:0.5 a5:0.5 e6:1 _:2 d6:4' },
        ],
      },
    };
    const sealSound = { type: 'audio', name: 'sealHit', at: SEAL_AT, sfx: { preset: 'hit', pitch: -7, brightness: -0.7 }, volume: 0.6 };

    // everything on the card breathes in by 2.5 % over the whole piece (the paper stays)
    const card = { type: 'composition', name: 'card', width: W, height: H,
      initial: { x: W / 2, y: H / 2, pivotX: W / 2, pivotY: H / 2, scale: 1 },
      keyframes: [{ at: 0, to: { scale: 1.025 }, duration: DURATION, ease: 'sine.inOut' }],
      sequences: [...flakes(), ...sun, ...mizuhiki, ...title, ...greeting, ...seal] };
    const sequences = [paper, card, music, sealSound];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11,
        background: PAPER_A,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
