<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>line-again — 線の詩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@0.35.0/dist/loader.css" />
  <style>
    body { background: #111; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .stage { position: relative; width: min(960px, 100%); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script type="application/json" id="piece-meta">{"title": "A Line, Again", "subtitle": "a five-line bilingual poem, each line set by the move it describes", "tags": ["kinetic type", "japanese", "poem"], "width": 1280, "height": 720, "duration": 13.5, "model": "opus"}</script>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">{ "imports": {
    "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps", "mediabunny": "https://esm.sh/mediabunny@1.61.3",
    "pixi-effects": "../../dist/index.js", "pixi-effects/controller": "../../dist/Controller.js" } }</script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, BAR = 2.5, DURATION = 13.5;
    const PAPER = '#efe9dd', INK = '#17140f', VERM = '#e2412a', AMBER = '#f2b04a', MUTED = '#8a8276';
    const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif';
    const GOTHIC = '"Hiragino Sans", "Yu Gothic", "YuGothic", sans-serif';
    const SERIF = 'Georgia, "Times New Roman", serif';
    const HEAVY = '"Arial Black", Impact, sans-serif';

    // ---- tiny math kit (every draw needs these) ----
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const seg = (t, a, b) => clamp01((t - a) / (b - a));
    const out3 = (x) => 1 - Math.pow(1 - x, 3);
    const in2 = (x) => x * x;
    const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const outBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    const offscreen = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

    // x of each glyph of a line, measured with kerning (prefix widths)
    const glyphXs = (ctx, s) => [...s].map((_, i, a) => ctx.measureText(a.slice(0, i).join('')).width);

    // ================= 1. a line: stroke-by-stroke outlines =================
    const EN1 = ['A letter', 'begins as', 'a line.'];
    const JA1 = '文字は、一本の線からはじまる。';
    function drawLine(ctx, t) {
      // the rule: the first line of the piece
      const lp = out3(seg(t, 0, 0.55));
      ctx.strokeStyle = VERM; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(690, 478); ctx.lineTo(690 + 500 * lp, 478); ctx.stroke();

      // 線: outline grows along every contour, then ink wipes down
      ctx.font = `540px ${MINCHO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      const d = 2400 * inOut(seg(t, 0.05, 1.5));
      ctx.setLineDash([d, 9000]); ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
      ctx.strokeText('線', 340, 372);
      ctx.setLineDash([]);
      const f = inOut(seg(t, 1.35, 2.1));
      if (f > 0) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 80, 680, 590 * f); ctx.clip();
        ctx.fillStyle = INK; ctx.fillText('線', 340, 372); ctx.restore();
      }

      // English: glyph after glyph, outline first, then filled
      ctx.font = `italic 80px ${SERIF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 1.4;
      let n = 0;
      EN1.forEach((line, li) => {
        const xs = glyphXs(ctx, line);
        [...line].forEach((ch, i) => {
          const s = 0.4 + n++ * 0.04;
          const p = seg(t, s, s + 0.5);
          if (p <= 0 || ch === ' ') return;
          const x = 700 + xs[i], y = 258 + li * 96;
          ctx.setLineDash([260 * p, 9000]); ctx.strokeStyle = INK; ctx.strokeText(ch, x, y);
          const fp = seg(t, s + 0.45, s + 0.8);
          if (fp > 0) { ctx.setLineDash([]); ctx.globalAlpha = fp; ctx.fillStyle = INK; ctx.fillText(ch, x, y); ctx.globalAlpha = 1; }
        });
      });
      ctx.setLineDash([]);

      // Japanese, set character by character under the rule
      ctx.font = `30px ${MINCHO}`; ctx.fillStyle = INK;
      const jx = glyphXs(ctx, JA1);
      [...JA1].forEach((ch, i) => {
        const a = seg(t, 1.25 + i * 0.045, 1.45 + i * 0.045);
        if (a <= 0) return;
        ctx.globalAlpha = a; ctx.fillText(ch, 700 + jx[i], 536 + 8 * (1 - a));
      });
      ctx.globalAlpha = 1;
    }

    // ================= 2. it bends: a logarithmic spiral =================
    const SPIRAL = [
      { s: 'it bends the way the wind bends — ', font: `italic 100px ${SERIF}`, color: PAPER },
      { s: '風がまがるほうへ、まがる。　', font: `100px ${MINCHO}`, color: VERM },
    ];
    const K = 0.1, C = 0.34, RMAX = 980, CX = 640, CY = 372;
    function setupSpiral() {
      const m = offscreen(8, 8).getContext('2d');
      const glyphs = [];
      for (const part of SPIRAL) {
        m.font = part.font;
        for (const ch of part.s) glyphs.push({ ch, font: part.font, color: part.color, adv: m.measureText(ch).width / 100 });
      }
      const period = glyphs.reduce((a, g) => a + g.adv * C / Math.sqrt(1 + K * K), 0);
      return { glyphs, period };
    }
    function drawSpiral(ctx, t, info) {
      const { glyphs, period } = info.state;
      const flow = (0.55 * t + 0.6 * in2(seg(t, 0, 2.5))) % period;      // drifts inward, a little faster at the end
      let phi = -period + flow - Math.PI / 2;                              // reading parameter; r shrinks as phi grows
      const r0 = (p) => RMAX * Math.exp(-K * (p + Math.PI / 2));
      for (let j = 0; ; j++) {
        const g = glyphs[j % glyphs.length];
        const dphi = g.adv * C / Math.sqrt(1 + K * K);
        const mid = phi + dphi / 2;
        const r = r0(phi);
        if (r < 3) break;
        if (r0(mid) < RMAX * 0.92 && g.ch.trim()) {
          const x = CX + r * Math.cos(phi), y = CY + r * Math.sin(phi);
          const a = Math.atan2(-K * Math.sin(mid) + Math.cos(mid), -K * Math.cos(mid) - Math.sin(mid));
          const sc = (C * r) / 100;
          ctx.setTransform(Math.cos(a) * sc, Math.sin(a) * sc, -Math.sin(a) * sc, Math.cos(a) * sc, x, y);
          ctx.font = g.font; ctx.fillStyle = g.color;
          ctx.globalAlpha = clamp01((r - 4) / 30);
          ctx.fillText(g.ch, 0, 0);
        }
        phi += dphi;
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    }

    // ================= 3. it melts: drips by column =================
    const MELT = 'とける', MELT_TOP = 70, MELT_BOTTOM = 350, COL = 1;
    const EN3 = 'in the heat of being read, it melts.';
    const JA3 = '読まれる熱で、とける。';
    function setupMelt(info) {
      const src = offscreen(W, H), c = src.getContext('2d');
      c.font = `800 270px ${GOTHIC}`; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillStyle = INK;
      c.fillText(MELT, W / 2, MELT_TOP);
      const bumps = Array.from({ length: 30 }, () => { const r = info.random(); return { x: 260 + info.random() * 760, w: 7 + info.random() * 12, h: 0.3 + 0.7 * r * r }; });
      const prof = [];
      for (let x = 0; x < W; x += COL) {                // the tallest drip wins: separate drops, not one even stretch
        let v = 0;
        for (const b of bumps) v = Math.max(v, b.h * Math.exp(-((x - b.x) ** 2) / (2 * b.w * b.w)));
        prof.push(0.28 + 0.72 * v);                     // everything sags a little, the drops a lot
      }
      return { src, prof };
    }
    function drawMelt(ctx, t, info) {
      const { src, prof } = info.state;
      const m = in2(seg(t, 0.3, 2.45));
      ctx.drawImage(src, 0, 0, W, MELT_TOP, 0, 0, W, MELT_TOP);
      const N = 7, span = MELT_BOTTOM - MELT_TOP;
      prof.forEach((p, i) => {                          // each column: top held, the lower part pulled down more and more
        const x = i * COL, d = 215 * m * p;
        for (let k = 0; k < N; k++) {
          const s0 = MELT_TOP + span * k / N, s1 = MELT_TOP + span * (k + 1) / N;
          const d0 = s0 + d * Math.pow(k / N, 3), d1 = s1 + d * Math.pow((k + 1) / N, 3);
          ctx.drawImage(src, x, s0, COL, s1 - s0, x, d0, COL, d1 - d0 + 0.5);
        }
      });
      // the Japanese line, quiet
      ctx.font = `26px ${MINCHO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = MUTED;
      ctx.fillText(JA3, W / 2, 588);
      // the English line ripples glyph by glyph, softening as the heat rises
      ctx.font = `italic 46px ${SERIF}`; ctx.textAlign = 'left'; ctx.fillStyle = INK;
      const xs = glyphXs(ctx, EN3), total = ctx.measureText(EN3).width, x0 = (W - total) / 2;
      const amp = 3 + 9 * m;
      [...EN3].forEach((ch, i) => {
        const ph = i * 0.55 - t * 6.5;
        const sy = 1 + 0.32 * m * (0.5 + 0.5 * Math.sin(ph + 1.2));
        const sk = 0.18 * m * Math.cos(ph);
        ctx.setTransform(1, 0, -sk, sy, x0 + xs[i], 650 + amp * Math.sin(ph));
        ctx.fillText(ch, 0, 0);
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ================= 4. it holds the light: type as a window =================
    function setupLight() {
      const mask = offscreen(W, H), c = mask.getContext('2d');
      c.fillStyle = '#fff';
      c.font = `500px ${MINCHO}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('光', 330, 372);
      c.font = `150px ${HEAVY}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      c.fillText('LIGHT', 610, 400);
      return { mask };
    }
        function drawLight(ctx, t, info) {
      const rv = out3(seg(t, 0.05, 1.1));
      // the letters first (the window), then the moving light painted only where they are
      ctx.globalAlpha = rv;
      ctx.drawImage(info.state.mask, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = '#4a170c'; ctx.fillRect(0, 0, W, H);
      for (let k = 0; k < 96; k++) {
        const y0 = k * 8 - 40;
        ctx.beginPath();
        for (let x = -10; x <= W + 10; x += 14) {
          const y = y0 + 22 * Math.sin(x * 0.005 + t * 1.3 + k * 0.31) + 10 * Math.sin(x * 0.016 - t * 2.2 + k * 0.83);
          x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        const glow = 0.5 + 0.5 * Math.sin(k * 0.42 - t * 3.1);
        ctx.strokeStyle = glow > 0.62 ? AMBER : VERM;
        ctx.globalAlpha = 0.5 + 0.5 * glow; ctx.lineWidth = 1.5 + 3.2 * glow;
        ctx.stroke();
      }
      // a band of light passing once
      const bx = -500 + 2300 * inOut(seg(t, 0.4, 2.3));
      const g = ctx.createLinearGradient(bx - 260, 0, bx + 260, 0);
      g.addColorStop(0, 'rgba(242,176,74,0)'); g.addColorStop(0.5, 'rgba(255,226,170,0.85)'); g.addColorStop(1, 'rgba(242,176,74,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
      // thin outlines so the shapes read before the light is in
      ctx.strokeStyle = 'rgba(239,233,221,0.28)'; ctx.lineWidth = 1.2;
      ctx.font = `150px ${HEAVY}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.strokeText('LIGHT', 610, 400);
      ctx.font = `500px ${MINCHO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText('光', 330, 372);
      // the two lines, plain
      const a = seg(t, 0.9, 1.5);
      ctx.globalAlpha = a; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = `32px ${MINCHO}`; ctx.fillStyle = PAPER; ctx.fillText('光を、なかに抱く。', 616, 478);
      ctx.font = `italic 32px ${SERIF}`; ctx.fillStyle = MUTED; ctx.fillText('it holds the light.', 616, 526);
      ctx.globalAlpha = 1;
    }

    // ================= 5. it stands again: weight by layering =================
    const STAND = '立つ', EN5 = 'and it stands again.', JA5 = 'そして、もう一度、立つ。';
    function weighted(ctx, ch, x, y, w, maxW, layers, settle) {
      // contour strokes, widest first, alternating ink / paper: weight made of layers
      for (let l = layers; l >= 1; l--) {
        const lw = maxW * w * l / layers;
        if (lw < 0.4) continue;
        ctx.lineWidth = l === layers ? lw + 0.2 * maxW * w : lw;     // the outermost layer: a vermilion edge
        ctx.strokeStyle = l === layers ? VERM : (l % 2 && settle < 1 ? PAPER : INK);
        if (l !== layers && l % 2) ctx.globalAlpha = 1 - settle;
        ctx.strokeText(ch, x, y);
        ctx.globalAlpha = 1;
        if (l !== layers && l % 2 && settle > 0) { ctx.globalAlpha = settle; ctx.strokeStyle = INK; ctx.strokeText(ch, x, y); ctx.globalAlpha = 1; }
      }
      ctx.fillStyle = INK; ctx.fillText(ch, x, y);
    }
    function drawStand(ctx, t) {
      ctx.lineJoin = 'round'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      const settle = inOut(seg(t, 1.9, 2.4));
      ctx.font = `300px ${MINCHO}`;
      const xs = glyphXs(ctx, STAND), x0 = (W - ctx.measureText(STAND).width) / 2;
      [...STAND].forEach((ch, i) => {
        const rise = outBack(seg(t, 0.05 + i * 0.14, 0.7 + i * 0.14));
        const w = inOut(seg(t, 0.55 + i * 0.18, 1.85 + i * 0.1));
        ctx.setTransform(1, 0, 0, Math.max(0.001, rise), x0 + xs[i], 400);
        weighted(ctx, ch, 0, 0, w, 30, 9, settle);
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.font = `italic 64px ${SERIF}`;
      const ex = glyphXs(ctx, EN5), e0 = (W - ctx.measureText(EN5).width) / 2;
      [...EN5].forEach((ch, i) => {
        const a = seg(t, 0.7 + i * 0.03, 0.95 + i * 0.03);
        if (a <= 0 || ch === ' ') return;
        const w = inOut(seg(t, 1.0 + i * 0.04, 1.7 + i * 0.04));
        ctx.globalAlpha = a;
        weighted(ctx, ch, e0 + ex[i], 528, w, 7, 4, settle);
      });
      ctx.globalAlpha = seg(t, 1.5, 2.0);
      ctx.font = `26px ${MINCHO}`; ctx.fillStyle = MUTED; ctx.textAlign = 'center';
      ctx.fillText(JA5, W / 2, 600);
      ctx.globalAlpha = 1;
    }

    // ================= the movie =================
    const beat = (i) => i * BAR;
    const bg = (i, color, dur = BAR) => ({ type: 'shape', shape: 'rect', name: `bg${i + 1}`, at: beat(i), duration: dur, width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: color } });
    const canvasBeat = (i, name, draw, extra = {}) => ({ type: 'canvas', name, at: beat(i), duration: extra.duration || BAR, width: W, height: H, resolution: 1, draw, ...extra });
    const label = (i, txt, color, dur = BAR) => ({ type: 'text', name: `label${i + 1}`, text: txt, at: beat(i), duration: dur,
      style: { fontSize: 14, fill: color, fontFamily: 'ui-monospace, Menlo, Consolas, monospace', letterSpacing: 3 },
      initial: { x: 64, y: 48 } });
    const LAST = DURATION - beat(4);

    const sequences = [
      bg(0, PAPER), bg(1, INK), bg(2, PAPER), bg(3, INK), bg(4, PAPER, LAST),
      canvasBeat(0, 'line', (ctx, t) => drawLine(ctx, t)),
      canvasBeat(1, 'spiral', drawSpiral, { setup: setupSpiral }),
      canvasBeat(2, 'melt', drawMelt, { setup: setupMelt, seed: 7 }),
      canvasBeat(3, 'light', drawLight, { setup: setupLight }),
      canvasBeat(4, 'stand', (ctx, t) => drawStand(ctx, t), { duration: LAST }),
      label(0, '01 / 05   線   LINE', MUTED), label(1, '02 / 05   渦   SPIRAL', MUTED), label(2, '03 / 05   溶   MELT', MUTED),
      label(3, '04 / 05   光   LIGHT', MUTED), label(4, '05 / 05   立   STAND', MUTED, LAST),
      { type: 'text', name: 'colophon', text: '線の詩 — A LINE, AGAIN', at: beat(4) + 2.1, duration: LAST - 2.1,
        style: { fontSize: 14, fill: VERM, fontFamily: 'ui-monospace, Menlo, Consolas, monospace', letterSpacing: 3 },
        initial: { x: W - 64, y: 48, anchorX: 1, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5, ease: 'power2.out' }] },
      { type: 'audio', name: 'music', at: 0, volume: 1.3, music: {
        bpm: 96, reverb: 0.35,
        tracks: [
          { inst: 'pad', vol: 0.55, attack: 0.5, release: 1.2, notes: 'Dmaj9:4 Bm9:4 Gmaj7:4 Em9:4 Dmaj9:6' },
          { inst: 'bell', vol: 0.45, ring: 2.2, reverb: 0.7, notes: 'a5:4 f#5:4 d6:4 b5:4 a5:6' },
          { inst: 'bass', vol: 0.5, tone: 0.3, notes: 'd2:4 b1:4 g1:4 e2:4 d2:6' },
        ] } },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 8.75,
        background: PAPER,
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
