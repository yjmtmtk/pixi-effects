<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>orbit-rig — pixi-effects gallery</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    body { background: #0d1220; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .pe-stage { position: relative; width: min(960px, 100%); border-radius: 8px; --pe-loader-bg: #0d1220; background: #0d1220; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
  <script type="application/json" id="piece-meta">{
    "title": "Orrery",
    "subtitle": "A museum plate of the solar system in ivory and brass: orbit rings draw on one by one, planets ride nested rotating layers (a moon on the Earth's), a legend and a serif title arrive in quiet waves, the whole plate breathes by hand",
    "tags": ["orbit", "null-parent", "wiggle", "stagger", "typography", "diagram", "sfx"],
    "width": 1280, "height": 720, "duration": 12, "model": "sonnet"
  }</script>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":                    "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin":         "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js"
    }
  }
  </script>

  <script type="module">
    import { Movie, wiggle, stagger, animateText, rand } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 12;
    // ivory and brass on a blue-black plate, three muted planet colours: nothing else
    const INK = '#0b0f1c', PLATE = '#10162a', IVORY = '#efe6d2', BRASS = '#c9a45c', DIM = '#8a8fa6';
    const SERIF = "'Didot', 'Bodoni 72', 'Playfair Display', Georgia, 'Times New Roman', serif";
    const SANS = "'Helvetica Neue', Arial, system-ui, sans-serif";
    const CX = 850, CY = 362;                                           // the sun; everything in the diagram is measured from here

    // the plate: a faint panel and a hairline frame
    const plate = [
      { type: 'shape', shape: 'rect', name: 'ground', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2' }, fillGradient: { type: 'radial', radius: 0.8, center: [0.66, 0.5], stops: [[0, '#182040'], [1, INK]] } },
      { type: 'shape', shape: 'rect', name: 'frame', width: W - 56, height: H - 56, initial: { x: W / 2, y: H / 2, fillAlpha: 0, strokeColor: BRASS, strokeWidth: 1, strokeAlpha: 0.35 } },
    ];

    // ONE null layer carries the whole diagram: it breathes (a tiny seeded hand-held drift) and pushes in very slowly
    const rig = { type: 'null', name: 'rig', initial: { x: CX, y: CY },
      keyframes: [
        ...wiggle({ duration: DURATION, freq: 1.2, seed: 5, props: { x: { around: CX, amp: 2.5 }, y: { around: CY, amp: 2 }, rotation: { around: 0, amp: 0.12 } } }),
        { at: 0, to: { scale: 1.05 }, duration: DURATION, ease: 'sine.inOut' },
      ] };
    const inRig = spec => ({ parent: 'rig', ...spec });

    // a faint field of stars, each its own seed
    const stars = Array.from({ length: 64 }, (_, i) => inRig({
      type: 'shape', shape: 'circle', name: 'star-' + i, radius: 0.5 + rand(i * 3 + 2) * 0.9, duration: DURATION,
      initial: { x: (rand(i * 3) - 0.5) * 1200, y: (rand(i * 3 + 1) - 0.5) * 640, fillColor: IVORY },
      keyframes: wiggle({ duration: DURATION, freq: 0.4 + rand(i + 400) * 0.6, seed: i, props: { alpha: { around: 0.35, amp: 0.25 } } }),
    }));

    // the sun, then five orbits; each ring draws on, and its planet rides a rotating layer of its own
    const R = [68, 112, 162, 218, 284];
    const SIZE = [4.5, 7.5, 8.5, 6, 15];
    const COLOR = ['#b8ab95', '#d9b27c', '#8fb7c9', '#c8785a', BRASS];
    const NAMES = ['MERCURY', 'VENUS', 'EARTH', 'MARS', 'JUPITER'];
    const TURNS = [3.2, 2.1, 1.5, 1.0, 0.45];                          // turns over the whole movie
    const T0 = 0.9;
    const timing = stagger(5, { each: 0.42 }).map(d => T0 + d);        // when each orbit starts
    const sun = [
      inRig({ type: 'shape', shape: 'circle', name: 'sun-halo', radius: 70, blendMode: 'add', at: 0.3, duration: DURATION - 0.3,
        fillGradient: { type: 'radial', radius: 0.5, stops: [[0, 'rgba(201,164,92,0.45)'], [1, 'rgba(201,164,92,0)']] }, initial: { x: 0, y: 0, scale: 0 },
        keyframes: [{ at: 0, to: { scale: 1 }, duration: 1.4, ease: 'power3.out' }, ...wiggle({ at: 1.4, duration: DURATION - 1.7, freq: 0.5, seed: 8, props: { alpha: { around: 0.85, amp: 0.15 } } })] }),
      inRig({ type: 'shape', shape: 'circle', name: 'sun', radius: 15, at: 0.3, duration: DURATION - 0.3, initial: { x: 0, y: 0, fillColor: '#f1d9a0', scale: 0 },
        keyframes: [{ at: 0, to: { scale: 1 }, duration: 1.0, ease: 'back.out(1.6)' }] }),
    ];
    const orbits = R.flatMap((r, i) => {
      const at = timing[i], life = DURATION - at, a0 = rand(i + 60) * 360;
      return [
        inRig({ type: 'shape', shape: 'circle', name: 'ring-' + i, radius: r, at, duration: life, trimEnd: 0,
          initial: { x: 0, y: 0, fillAlpha: 0, strokeColor: IVORY, strokeWidth: 1.2, strokeAlpha: 0.3, rotation: -90 },
          keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 1.5, ease: 'power2.inOut' }] }),
        inRig({ type: 'null', name: 'orbit-' + i, at, duration: life, initial: { rotation: a0 },
          keyframes: [{ at: 0, to: { rotation: a0 + 360 * TURNS[i] }, duration: life, ease: 'none' }] }),
        { type: 'shape', shape: 'circle', name: 'planet-' + i, parent: 'orbit-' + i, radius: SIZE[i], at, duration: life, initial: { x: r, y: 0, fillColor: COLOR[i], alpha: 0 },
          keyframes: [{ at: 0.9, to: { alpha: 1 }, duration: 0.6 }] },
      ];
    });
    // the Earth carries a moon: a null on its null, turning fast
    const moon = [
      { type: 'null', name: 'moon-orbit', parent: 'orbit-2', at: timing[2], duration: DURATION - timing[2], initial: { x: R[2] },
        keyframes: [{ at: 0, to: { rotation: 360 * 9 }, duration: DURATION - timing[2], ease: 'none' }] },
      { type: 'shape', shape: 'circle', name: 'moon', parent: 'moon-orbit', radius: 2.4, at: timing[2], duration: DURATION - timing[2], initial: { x: 19, y: 0, fillColor: IVORY, alpha: 0 },
        keyframes: [{ at: 1.2, to: { alpha: 0.9 }, duration: 0.6 }] },
    ];

    // typography: a small brass kicker, a large serif title, a rule, a legend that arrives in a wave, a footnote
    const kicker = { type: 'text', name: 'kicker', text: 'PLATE  III', at: 0.8, duration: DURATION - 0.8, style: { fontFamily: SANS, fontSize: 13, fill: BRASS, letterSpacing: 7 },
      initial: { x: 96, y: 104, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.9 }] };
    const title = animateText('Orrery', { fontFamily: SERIF, fontSize: 128, fill: IVORY }, {
      x: 96, y: 150, align: 'left', name: 'title', at: 1.1, duration: DURATION - 1.1, in: { from: { y: 36, alpha: 0 }, duration: 1.1, ease: 'power3.out' }, stagger: { each: 0.09 },
    });
    const sub = { type: 'text', name: 'subtitle', text: 'A MODEL OF THE SOLAR SYSTEM', at: 2.6, duration: DURATION - 2.6, style: { fontFamily: SANS, fontSize: 13, fill: IVORY, letterSpacing: 6 },
      initial: { x: 100, y: 322, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 0.85 }, duration: 0.9 }, { at: 0, from: { x: 86 }, to: { x: 100 }, duration: 0.9, ease: 'power3.out' }] };
    const rule = { type: 'shape', shape: 'rect', name: 'rule', width: 64, height: 1.5, anchorX: 0, at: 3.0, duration: DURATION - 3.0, initial: { x: 100, y: 350, fillColor: BRASS, scaleX: 0 },
      keyframes: [{ at: 0, to: { scaleX: 1 }, duration: 0.8, ease: 'power3.inOut' }] };
    const legend = stagger(NAMES.map((name, i) => ({
      type: 'null', name: 'legend-' + i, at: 3.4, duration: DURATION - 3.4, initial: { x: 100, y: 410 + i * 38 }, _i: i,
    })), { each: 0.2 }).flatMap(({ _i: i, ...row }) => [
      row,
      { type: 'shape', shape: 'circle', name: 'swatch-' + i, parent: 'legend-' + i, radius: Math.max(3, SIZE[i] * 0.55), at: row.at, duration: row.duration, initial: { x: 4, y: 0, fillColor: COLOR[i], alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.7 }] },
      { type: 'text', name: 'legend-name-' + i, parent: 'legend-' + i, text: ['I', 'II', 'III', 'IV', 'V'][i] + '     ' + NAMES[i], at: row.at, duration: row.duration, style: { fontFamily: SANS, fontSize: 14, fill: IVORY, letterSpacing: 5 },
        initial: { x: 26, y: 0, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 0.8 }, duration: 0.7 }, { at: 0, from: { x: 14 }, to: { x: 26 }, duration: 0.7, ease: 'power3.out' }] },
    ]);
    const note = { type: 'text', name: 'note', text: 'NOT TO SCALE', at: 5.6, duration: DURATION - 5.6, style: { fontFamily: SANS, fontSize: 11, fill: DIM, letterSpacing: 6 },
      initial: { x: 100, y: 652, anchorX: 0, anchorY: 0.5, alpha: 0 }, keyframes: [{ at: 0, to: { alpha: 1 }, duration: 1 }] };

    const sounds = [
      ...stagger(5, { each: 0.42 }).map(d => ({ type: 'audio', sfx: { preset: 'click', pitch: d * 6 }, at: T0 + d, volume: 0.2 })),
      { type: 'audio', sfx: { preset: 'chime', pitch: -5 }, at: 1.3, volume: 0.28 },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 8,
        background: INK,
        composition: { sequences: [...plate, rig, ...stars, ...sun, ...orbits, ...moon, kicker, ...title, sub, rule, ...legend, note, ...sounds] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
