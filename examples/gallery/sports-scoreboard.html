<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matchday Graphics</title>
  <link rel="stylesheet" href="../../dist/loader.css" />
  <style>
    html, body { background: #0b0c10; margin: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .pe-stage { position: relative; width: min(960px, 100%); height: auto; border-radius: 6px; --pe-loader-bg: #0b0c10; background: #0b0c10; }
    .pe-stage canvas { display: block; width: 100%; height: auto; border-radius: inherit; }
  </style>
</head>
<body>
  <div class="pe-stage"><canvas id="stage" width="1280" height="720"></canvas><div class="pe-loader" data-label="LOADING"></div></div>

  <script type="application/json" id="piece-meta">{ "title": "Matchday Graphics", "subtitle": "Broadcast football package: crests, count-up score, stat bars, momentum graph and a GOAL stinger", "tags": ["sports", "broadcast", "data", "stinger", "diagonal"], "width": 1280, "height": 720, "duration": 12, "model": "opus" }</script>

  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "../../dist/index.js",
      "pixi-effects/controller": "../../dist/Controller.js",
      "pixi-effects/three":      "../../dist/three.js",
      "three":                   "https://esm.sh/three@0.178.0"
    }
  }
  </script>

  <script type="module">
    import { Movie } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1280, H = 720, FPS = 30, DURATION = 12, POSTER_FRAME = 285;

    // ── Palette & type ──────────────────────────────────────────────────────────
    const C = {
      night: '#0a0d16', night2: '#121828', ink: '#0b0f1a',
      home: '#e5232f', homeDeep: '#7a0b14', homeDark: '#4a050b',
      away: '#1f6fe0', awayDeep: '#0d2f72', awayDark: '#061840',
      gold: '#ffd21f', white: '#ffffff', mute: '#9aa3b8', track: '#232b3d',
    };
    const COND = "Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif";
    const SANS = "system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif";
    const HOME = { city: 'PORT ARDEN', name: 'KESTRELS', code: 'KES', color: C.home, deep: C.homeDeep, dark: C.homeDark };
    const AWAY = { city: 'VALE CITY', name: 'ROVERS', code: 'VAL', color: C.away, deep: C.awayDeep, dark: C.awayDark };
    const SNAP = t => Math.round(t * FPS) / FPS;

    // ── Timeline (seconds, composition time) ───────────────────────────────────
    const T_A_END = 4.0;          // matchup → stats cut (under the first sweep)
    const T_GOAL = 8.1;           // stinger starts
    const T_D = 10.0;             // final scoreboard (revealed by the stinger exit)

    // ── Small spec helpers ─────────────────────────────────────────────────────
    const rect = (name, x, y, w, h, fill, extra = {}) => ({
      type: 'shape', shape: 'rect', name, width: w, height: h, ...extra,
      initial: { x, y, fillColor: fill, ...(extra.initial || {}) },
    });
    // parallelogram centred on its own origin; slant = horizontal shift of the top edge vs the bottom edge
    const slantPts = (w, h, slant) => [[-w / 2 + slant / 2, -h / 2], [w / 2 + slant / 2, -h / 2], [w / 2 - slant / 2, h / 2], [-w / 2 - slant / 2, h / 2]];
    const slab = (name, x, y, w, h, slant, fill, extra = {}) => ({
      type: 'shape', shape: 'polygon', name, points: slantPts(w, h, slant), ...extra,
      initial: { x, y, ...(fill ? { fillColor: fill } : {}), ...(extra.initial || {}) },
    });
    const text = (name, str, size, x, y, o = {}) => ({
      type: 'text', name, text: str, at: o.at, duration: o.duration, format: o.format,
      style: { fontSize: size, fontFamily: o.font || COND, fontWeight: o.weight || 'normal', fill: o.fill || C.white,
               letterSpacing: o.ls || 0, padding: o.padding || 8, ...(o.style || {}) },
      initial: { x, y, anchorX: o.ax ?? 0.5, anchorY: o.ay ?? 0.5, ...(o.initial || {}) },
      keyframes: o.keyframes || [],
    });
    const sfx = (name, at, volume) => ({ type: 'audio', name: 'sfx-' + name + '-' + at, sfx: name, at, volume });

    // ── Crest: a shield drawn from shapes (composition, 240×280, pivot at its centre) ──
    const SHIELD = 'M 20 14 L 220 14 L 220 140 C 220 212 168 246 120 268 C 72 246 20 212 20 140 Z';
    const SHIELD_IN = 'M 36 30 L 204 30 L 204 138 C 204 200 160 228 120 248 C 80 228 36 200 36 138 Z';
    function crest(team, kind, o) {
      const motif = kind === 'wing'
        ? [ // a kestrel wing: chevron + three feathers
            { type: 'shape', shape: 'polygon', name: 'chevron', points: [[56, 96], [120, 150], [184, 96], [184, 132], [120, 192], [56, 132]], initial: { fillColor: C.white } },
            ...[0, 1, 2].map(i => ({ type: 'shape', shape: 'polygon', name: 'feather' + i,
              points: [[84 + i * 28, 64], [104 + i * 28, 64], [96 + i * 28, 102], [76 + i * 28, 102]], initial: { fillColor: C.gold } })),
          ]
        : [ // rovers: a gold sash + a star
            { type: 'shape', shape: 'polygon', name: 'sash', points: [[36, 150], [36, 112], [204, 52], [204, 90]], initial: { fillColor: C.gold } },
            { type: 'shape', shape: 'polygon', name: 'star', points: starPts(120, 186, 30, 12), initial: { fillColor: C.white } },
          ];
      return {
        type: 'composition', name: 'crest-' + team.code, width: 240, height: 280, at: o.at, duration: o.duration,
        initial: { x: o.x, y: o.y, pivotX: 120, pivotY: 141, scale: o.scale ?? 1, ...(o.initial || {}) },
        keyframes: o.keyframes || [],
        sequences: [
          { type: 'shape', shape: 'path', name: 'shield', d: SHIELD, initial: { fillColor: C.white } },
          { type: 'shape', shape: 'path', name: 'shield-in', d: SHIELD_IN, fillGradient: { stops: [[0, team.color], [1, team.deep]] } },
          ...motif,
          { type: 'shape', shape: 'rect', name: 'band', width: 168, height: 10, anchorX: 0, initial: { x: 36, y: 44, fillColor: C.white, fillAlpha: 0.35 } },
        ],
      };
    }
    function starPts(cx, cy, R, r) {
      return Array.from({ length: 10 }, (_, i) => {
        const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
        return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad];
      });
    }

    // faint diagonal stripes that drift (broadcast texture)
    function stripes(name, n, alpha, drift, dur, color = C.white) {
      return Array.from({ length: n }, (_, i) => {
        const x = -200 + i * (1680 / n);
        return slab(name + i, x, 360, 22, 800, 260, color, {
          initial: { fillAlpha: alpha },
          keyframes: [{ at: 0, to: { x: x + drift }, duration: dur, ease: 'none' }],
        });
      });
    }

    // ── SCENE A / D : the head-to-head matchup ─────────────────────────────────
    // intro: true = everything animates in and the scores count up; false = settled frame, home scores 2 → 3
    function matchup({ name, at, duration, intro }) {
      const E = 'expo.out';
      const ins = (delay, from, dur = 0.7, ease = E) => intro ? [{ at: delay, from, duration: dur, ease }] : [];
      const LX = 285, RX = 995;          // team column centres
      const seq = [
        rect('bg', 640, 360, W, H, C.night),
        // the two team panels meet on a diagonal seam through (640, 360): each one's inner edge sits exactly on it (the dark gap covers the joint)
        slab('panel-home', 220, 360, 840, 760, 160, null, { fillGradient: { angle: 0, stops: [[0, C.homeDark], [0.7, C.homeDeep], [1, C.home]] },
          keyframes: ins(0, { x: -560 }, 0.75) }),
        slab('panel-away', 1060, 360, 840, 760, 160, null, { fillGradient: { angle: 0, stops: [[0, C.away], [0.3, C.awayDeep], [1, C.awayDark]] },
          keyframes: ins(0.08, { x: 1840 }, 0.75) }),
        ...stripes(name + '-tex', 14, 0.035, 120, duration),
        // seam: dark gap + gold blade
        slab('seam-dark', 640, 360, 36, 780, 160, C.ink, { keyframes: ins(0.35, { scaleY: 0 }, 0.5) }),
        slab('seam-gold', 640, 360, 10, 780, 160, C.gold, { keyframes: ins(0.45, { scaleY: 0 }, 0.5) }),
        // vignette
        { type: 'shape', shape: 'rect', name: 'vignette', width: W, height: H, initial: { x: 640, y: 360 },
          fillGradient: { type: 'radial', radius: 0.8, stops: [[0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.55)']] } },

        // crests pop
        crest(HOME, 'wing', { x: LX, y: 268, keyframes: ins(0.55, { scale: 0, rotation: -14 }, 0.6, 'back.out(1.8)') }),
        crest(AWAY, 'star', { x: RX, y: 268, keyframes: ins(0.7, { scale: 0, rotation: 14 }, 0.6, 'back.out(1.8)') }),

        // names
        text('home-city', HOME.city, 24, LX, 438, { font: SANS, weight: '700', ls: 7, fill: C.gold,
          keyframes: ins(0.95, { x: LX - 60, alpha: 0 }) }),
        text('home-name', HOME.name, 84, LX, 506, { ls: 2, keyframes: ins(1.0, { x: LX - 120, alpha: 0 }) }),
        text('away-city', AWAY.city, 24, RX, 438, { font: SANS, weight: '700', ls: 7, fill: C.gold,
          keyframes: ins(1.05, { x: RX + 60, alpha: 0 }) }),
        text('away-name', AWAY.name, 84, RX, 506, { ls: 2, keyframes: ins(1.1, { x: RX + 120, alpha: 0 }) }),

        // top league chip
        slab('league-chip', 640, 72, 580, 46, 24, C.white, { keyframes: ins(0.3, { scaleX: 0 }, 0.5) }),
        text('league', 'CONTINENTAL LEAGUE  ·  MATCHDAY 24', 20, 640, 72, { font: SANS, weight: '800', ls: 3, fill: C.ink,
          keyframes: ins(0.5, { alpha: 0 }, 0.3, 'none') }),
      ];

      // scores (counters) either side of the seam
      const scoreStyle = { dropShadow: { color: '#000000', alpha: 0.45, blur: 12, distance: 6, angle: 1.2 }, padding: 32 };
      seq.push(text('score-home', '{value}', 230, 560, 300, { ax: 1, style: scoreStyle,
        initial: { value: intro ? 0 : 2 },
        keyframes: intro
          ? [{ at: 1.3, from: { alpha: 0, y: 340 }, to: { alpha: 1, y: 300 }, duration: 0.4, ease: 'power3.out' },
             { at: 1.5, to: { value: 2 }, duration: 1.1, ease: 'power2.out' }]
          : [{ at: 0.45, set: { value: 3 } },
             { at: 0.45, from: { scale: 1.45 }, to: { scale: 1 }, duration: 0.5, ease: 'back.out(2.2)' }] }));
      seq.push(text('score-away', '{value}', 230, 720, 300, { ax: 0, style: scoreStyle,
        initial: { value: intro ? 0 : 2 },
        keyframes: intro
          ? [{ at: 1.4, from: { alpha: 0, y: 340 }, to: { alpha: 1, y: 300 }, duration: 0.4, ease: 'power3.out' },
             { at: 1.6, to: { value: 2 }, duration: 1.1, ease: 'power2.out' }]
          : [] }));

      // clock chip on the seam, bottom
      seq.push(slab('clock-chip', 640, 600, 220, 50, 24, C.ink, { keyframes: ins(1.6, { scaleX: 0 }, 0.45) }));
      seq.push({ type: 'shape', shape: 'circle', name: 'live-dot', radius: 7, initial: { x: 562, y: 600, fillColor: C.home },
        keyframes: [...ins(1.8, { alpha: 0 }, 0.2, 'none'), { at: intro ? 2.0 : 0, to: { alpha: 0.25 }, duration: 0.5, ease: 'sine.inOut', repeat: 3, yoyo: true }] });
      seq.push(text('clock', intro ? 'LIVE   87:42' : 'LIVE   88:16', 26, 650, 600, { ls: 2,
        keyframes: ins(1.8, { alpha: 0 }, 0.3, 'none') }));

      if (!intro) {   // goal flare behind the new score + scorer tag
        seq.splice(seq.findIndex(s => s.name === 'score-home'), 0,
          { type: 'shape', shape: 'circle', name: 'score-flare', radius: 40, initial: { x: 495, y: 300, fillAlpha: 0, strokeColor: C.gold, strokeWidth: 8, alpha: 0 },
            keyframes: [{ at: 0.45, set: { alpha: 1, radius: 60, strokeWidth: 16 } },
                        { at: 0.46, to: { alpha: 0, radius: 260, strokeWidth: 2 }, duration: 0.7, ease: 'power2.out' }] });
        seq.push(slab('scorer-chip', 380, 600, 250, 50, 24, C.gold, {
          keyframes: [{ at: 0.6, from: { scaleX: 0 }, duration: 0.45, ease: E }] }));
        seq.push(text('scorer', "⚽  OKAFOR 88'", 24, 380, 600, { font: SANS, weight: '800', ls: 2, fill: C.ink,
          keyframes: [{ at: 0.75, from: { alpha: 0, x: 360 }, duration: 0.4, ease: E }] }));
      }
      return { type: 'composition', name, at, duration, width: W, height: H, sequences: seq };
    }

    // ── SCENE B : match stats + momentum ───────────────────────────────────────
    const STATS = [
      ['POSSESSION', 58, 42, '%'],
      ['SHOTS', 14, 9, ''],
      ['ON TARGET', 6, 4, ''],
      ['CORNERS', 7, 3, ''],
    ];
    // momentum: 45 two-minute buckets, + = Kestrels pressure, − = Rovers; seeded so every run is identical
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const N = 45;
    const MOM = Array.from({ length: N }, (_, i) => {
      let v = 0.55 * Math.sin(i * 0.31 + 0.6) + 0.3 * Math.sin(i * 0.93 + 2.0) + (rnd() - 0.5) * 0.5;
      if (i >= 39) v = 0.35 + (i - 39) * 0.13;                 // late Kestrels siege
      return Math.max(-1, Math.min(1, v));
    });
    MOM[N - 2] = 1;                                              // 88' — the goal

    function stats({ at, duration }) {
      const seq = [
        { type: 'shape', shape: 'rect', name: 'bg', width: W, height: H, initial: { x: 640, y: 360 },
          fillGradient: { stops: [[0, C.night2], [1, C.night]] } },
        ...stripes('stats-tex', 12, 0.025, -90, duration),
      ];

      // ── score bug (top) ──
      const BUG_Y = 92, bugIn = (d) => [{ at: d, from: { y: BUG_Y - 120 }, duration: 0.6, ease: 'expo.out' }];
      seq.push(slab('bug-home', 478, BUG_Y, 190, 58, 22, C.home, { keyframes: bugIn(0.15) }));
      seq.push(slab('bug-score', 640, BUG_Y, 150, 58, 22, C.white, { keyframes: bugIn(0.2) }));
      seq.push(slab('bug-away', 802, BUG_Y, 190, 58, 22, C.away, { keyframes: bugIn(0.25) }));
      seq.push(text('bug-home-code', HOME.code, 40, 490, BUG_Y, { ls: 3, keyframes: bugIn(0.15) }));
      seq.push(text('bug-score-txt', '2 – 2', 40, 640, BUG_Y, { fill: C.ink, keyframes: bugIn(0.2) }));
      seq.push(text('bug-away-code', AWAY.code, 40, 790, BUG_Y, { ls: 3, keyframes: bugIn(0.25) }));
      seq.push(crest(HOME, 'wing', { x: 340, y: BUG_Y, scale: 0.3, keyframes: bugIn(0.1) }));
      seq.push(crest(AWAY, 'star', { x: 940, y: BUG_Y, scale: 0.3, keyframes: bugIn(0.3) }));
      seq.push(slab('bug-clock', 640, BUG_Y + 46, 100, 30, 14, C.ink, { keyframes: [{ at: 0.6, from: { scaleY: 0 }, duration: 0.35, ease: 'expo.out' }] }));
      seq.push(text('bug-clock-txt', '87:58', 22, 640, BUG_Y + 46, { fill: C.gold, ls: 2, keyframes: [{ at: 0.75, from: { alpha: 0 }, duration: 0.2 }] }));

      // ── section headers ──
      const header = (name, label, x, d) => [
        rect(name + '-bar', x, 196, 6, 30, C.gold, { anchorX: 0, keyframes: [{ at: d, from: { scaleY: 0 }, duration: 0.4, ease: 'expo.out' }] }),
        text(name, label, 34, x + 20, 196, { ax: 0, ls: 3, keyframes: [{ at: d + 0.05, from: { alpha: 0, x: x - 10 }, duration: 0.5, ease: 'expo.out' }] }),
      ];
      seq.push(...header('hdr-stats', 'MATCH STATS', 80, 0.45));
      seq.push(...header('hdr-mom', 'MOMENTUM', 690, 0.55));

      // ── stat bars: each side grows out of the centre line, values count up in lock-step ──
      const SX = 340, HALF = 232, ROW0 = 262, ROW = 90, BAR_DUR = 0.9, BAR_EASE = 'power3.out';
      STATS.forEach(([label, a, b, unit], i) => {
        const y = ROW0 + i * ROW, d = SNAP(0.7 + i * 0.14), max = Math.max(a, b);
        const fadeIn = [{ at: d, from: { alpha: 0 }, duration: 0.3, ease: 'none' }];
        seq.push(text('lbl-' + i, label, 19, SX, y, { font: SANS, weight: '700', ls: 4, fill: C.mute, keyframes: fadeIn }));
        seq.push(rect('track-' + i, SX, y + 32, HALF * 2, 10, C.track, { keyframes: [{ at: d, from: { scaleX: 0 }, duration: 0.5, ease: 'expo.out' }] }));
        seq.push(rect('bar-h-' + i, SX - 2, y + 32, 0, 10, C.home, { anchorX: 1,
          keyframes: [{ at: d + 0.15, to: { width: HALF * a / max - 2 }, duration: BAR_DUR, ease: BAR_EASE }] }));
        seq.push(rect('bar-a-' + i, SX + 2, y + 32, 0, 10, C.away, { anchorX: 0,
          keyframes: [{ at: d + 0.15, to: { width: HALF * b / max - 2 }, duration: BAR_DUR, ease: BAR_EASE }] }));
        seq.push(text('val-h-' + i, '{value}' + unit, 44, SX - HALF, y - 6, { ax: 0, initial: { value: 0 },
          keyframes: [...fadeIn, { at: d + 0.15, to: { value: a }, duration: BAR_DUR, ease: BAR_EASE }] }));
        seq.push(text('val-a-' + i, '{value}' + unit, 44, SX + HALF, y - 6, { ax: 1, initial: { value: 0 },
          keyframes: [...fadeIn, { at: d + 0.15, to: { value: b }, duration: BAR_DUR, ease: BAR_EASE }] }));
      });

      // ── momentum graph ──
      const GX0 = 690, GX1 = 1200, BASE = 420, AMP = 140, STEP = (GX1 - GX0) / (N - 1);
      const DRAW_AT = 1.3, DRAW = 2.0;
      const px = i => GX0 + i * STEP, py = i => BASE - MOM[i] * AMP;
      const tAt = i => SNAP(DRAW_AT + DRAW * i / (N - 1));
      seq.push(rect('mom-panel', (GX0 + GX1) / 2, BASE, GX1 - GX0 + 40, AMP * 2 + 60, '#0e1424', {
        initial: { strokeColor: '#222b40', strokeWidth: 1 }, keyframes: [{ at: 0.55, from: { alpha: 0 }, duration: 0.4 }] }));
      seq.push({ type: 'shape', shape: 'line', name: 'mom-axis', from: [GX0 - 10, BASE], to: [GX1 + 10, BASE],
        initial: { strokeColor: '#3a4560', strokeWidth: 2 }, keyframes: [{ at: 0.7, from: { alpha: 0 }, duration: 0.4 }] });
      seq.push({ type: 'shape', shape: 'line', name: 'mom-half', from: [px(22), BASE - AMP - 16], to: [px(22), BASE + AMP + 16],
        initial: { strokeColor: '#2c3650', strokeWidth: 2 }, keyframes: [{ at: 0.8, from: { alpha: 0 }, duration: 0.4 }] });
      seq.push(text('mom-team-h', HOME.code, 22, GX0 + 4, BASE - AMP - 2, { ax: 0, fill: C.home, ls: 2, keyframes: [{ at: 0.9, from: { alpha: 0 }, duration: 0.3 }] }));
      seq.push(text('mom-team-a', AWAY.code, 22, GX0 + 4, BASE + AMP + 2, { ax: 0, fill: '#4f8ff0', ls: 2, keyframes: [{ at: 0.95, from: { alpha: 0 }, duration: 0.3 }] }));
      [["0'", 0], ["HT", 22], ["90'", N - 1]].forEach(([l, i], k) =>
        seq.push(text('mom-tick-' + k, l, 20, px(i), BASE + AMP + 44, { font: SANS, weight: '700', fill: C.mute, keyframes: [{ at: 1.0, from: { alpha: 0 }, duration: 0.3 }] })));
      // bars pop up as the line passes over them
      MOM.forEach((v, i) => {
        const hgt = Math.abs(v) * AMP, up = v >= 0;
        seq.push(rect('mom-bar-' + i, px(i), BASE, 7, 0, up ? C.home : C.away, { anchorY: up ? 1 : 0,
          initial: { fillAlpha: 0.85 },
          keyframes: [{ at: tAt(i), to: { height: hgt }, duration: 0.35, ease: 'back.out(2)' }] }));
      });
      // the line draws itself: a static open polygon revealed by a mask that grows from the left edge, in lock-step with a lead dot
      seq.push({ type: 'shape', shape: 'polygon', name: 'mom-line', open: true, points: MOM.map((_, i) => [px(i), py(i)]),
        initial: { strokeColor: C.white, strokeWidth: 3 },
        mask: rect('mom-mask', GX0 - 6, BASE, 0, AMP * 2 + 40, C.white, { anchorX: 0,
          keyframes: [{ at: DRAW_AT, to: { width: GX1 - GX0 + 12 }, duration: DRAW, ease: 'none' }] }) });
      seq.push({ type: 'shape', shape: 'circle', name: 'mom-dot', radius: 7, at: DRAW_AT, duration: duration - DRAW_AT,
        initial: { x: px(0), y: py(0), fillColor: C.gold, strokeColor: C.ink, strokeWidth: 3 },
        keyframes: MOM.slice(1).map((_, k) => ({ at: tAt(k) - DRAW_AT, to: { x: px(k + 1), y: py(k + 1) }, duration: SNAP(DRAW / (N - 1)), ease: 'none' })) });
      // 88' goal marker
      const GI = N - 2, MARK = DRAW_AT + DRAW + 0.15;
      seq.push({ type: 'shape', shape: 'circle', name: 'goal-ring', radius: 10, at: MARK, duration: duration - MARK,
        initial: { x: px(GI), y: py(GI), fillAlpha: 0, strokeColor: C.gold, strokeWidth: 3 },
        keyframes: [{ at: 0, from: { radius: 10, alpha: 1 }, to: { radius: 34, alpha: 0 }, duration: 0.6, ease: 'power2.out', repeat: 2 }] });
      seq.push(slab('goal-tag', px(GI) - 78, py(GI) - 14, 112, 34, 14, C.gold, { at: MARK, duration: duration - MARK,
        keyframes: [{ at: 0, from: { scaleX: 0 }, duration: 0.35, ease: 'expo.out' }] }));
      seq.push(text('goal-tag-txt', "88'  GOAL", 18, px(GI) - 78, py(GI) - 14, { font: SANS, weight: '800', fill: C.ink,
        at: MARK, duration: duration - MARK, keyframes: [{ at: 0.1, from: { alpha: 0 }, duration: 0.2 }] }));

      return { type: 'composition', name: 'stats', at, duration, width: W, height: H, sequences: seq };
    }

    // ── SCENE C : GOAL stinger ─────────────────────────────────────────────────
    // A full-frame composition revealed by a moving diagonal mask; coloured blades ride both edges of the mask.
    const SW = 1640, SS = 220;                        // sweep slab width / slant
    const OFF_L = -SW / 2 - SS / 2 - 40, OFF_R = W + SW / 2 + SS / 2 + 40;
    function sweepKeys(inAt, inDur, outAt, outDur, dx = 0) {
      return [
        { at: 0, set: { x: OFF_L + dx } },
        { at: inAt, to: { x: 640 + dx }, duration: inDur, ease: 'power3.out' },
        { at: outAt, to: { x: OFF_R + dx }, duration: outDur, ease: 'power3.in' },
      ];
    }
    function blades(prefix, at, dur, inAt, inDur, outAt, outDur, colors) {
      // colors: [[dx, color], ...] — positive dx leads on the way in, negative trails on the way out
      return colors.map(([dx, col], k) => slab(prefix + k, OFF_L + dx, 360, SW, 780, SS, col, {
        at, duration: dur, keyframes: sweepKeys(inAt, inDur, outAt, outDur, dx) }));
    }

    function goalStinger({ at, duration }) {
      const IN = 0.32, OUT_AT = duration - 0.4, OUT = 0.4;
      const seq = [
        { type: 'shape', shape: 'rect', name: 'goal-bg', width: W, height: H, initial: { x: 640, y: 360 },
          fillGradient: { angle: 20, stops: [[0, C.homeDark], [0.55, C.homeDeep], [1, C.home]] } },
      ];
      // outlined "GOAL" rows drifting in opposite directions
      for (let r = 0; r < 5; r++) {
        const y = 40 + r * 160, dir = r % 2 ? 1 : -1, x0 = dir > 0 ? -900 : -200;
        seq.push(text('goal-row-' + r, 'GOAL GOAL GOAL GOAL GOAL GOAL', 150, x0, y, { ax: 0, ls: 6,
          style: { fill: 'rgba(0,0,0,0)', stroke: { color: '#ffffff', width: 2 } },
          initial: { alpha: 0.13 },
          keyframes: [{ at: 0, to: { x: x0 + dir * 260 }, duration, ease: 'none' }] }));
      }
      // speed streaks
      let s2 = 5; const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
      for (let k = 0; k < 16; k++) {
        const y = 60 + r2() * 600, len = 140 + r2() * 260, d = 0.15 + r2() * 1.1;
        seq.push(slab('streak-' + k, -300, y, len, 4 + r2() * 5, 0, C.white, { initial: { fillAlpha: 0.25 + r2() * 0.4 },
          keyframes: [{ at: SNAP(d), to: { x: W + 300 }, duration: 0.45 + r2() * 0.3, ease: 'power1.in' }] }));
      }
      // GOAL slam: gold echo behind, white word on top, a short shake on impact
      const GOAL_STYLE = { dropShadow: { color: '#000000', alpha: 0.4, blur: 16, distance: 10, angle: 1.2 }, padding: 40 };
      seq.push(text('goal-echo', 'GOAL!', 300, 652, 300, { fill: C.gold, style: { padding: 40 },
        initial: { skewX: -12 },
        keyframes: [{ at: 0.28, from: { scale: 2.6, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.24, ease: 'expo.out' },
                    { at: 0.6, to: { scale: 1.08 }, duration: OUT_AT - 0.6, ease: 'sine.out' }] }));
      const shake = [[10, -6], [-8, 5], [6, -3], [-3, 2], [0, 0]].map(([dx, dy], k) =>
        ({ at: SNAP(0.46 + k * 0.034), to: { x: 640 + dx, y: 290 + dy }, duration: 0.034, ease: 'none' }));
      seq.push(text('goal-word', 'GOAL!', 300, 640, 290, { style: GOAL_STYLE, initial: { skewX: -12 },
        keyframes: [{ at: 0.22, from: { scale: 2.8, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.24, ease: 'expo.out' }, ...shake,
                    { at: 0.6, to: { scale: 1.05 }, duration: OUT_AT - 0.6, ease: 'sine.out' }] }));
      // impact ring
      seq.push({ type: 'shape', shape: 'circle', name: 'goal-ring', radius: 60, initial: { x: 640, y: 300, fillAlpha: 0, strokeColor: C.white, strokeWidth: 10, alpha: 0 },
        keyframes: [{ at: 0.46, set: { radius: 80, alpha: 0.8, strokeWidth: 14 } },     // `from` would show the ring before 0.46
                    { at: 0.47, to: { radius: 620, alpha: 0, strokeWidth: 2 }, duration: 0.7, ease: 'power2.out' }] });
      // scorer strap
      const SY = 540;
      seq.push(slab('strap', 640, SY, 720, 96, 40, C.ink, { keyframes: [{ at: 0.6, from: { scaleX: 0 }, duration: 0.5, ease: 'expo.out' }] }));
      seq.push(slab('strap-gold', 640, SY + 56, 660, 14, 10, C.gold, { keyframes: [{ at: 0.7, from: { scaleX: 0 }, duration: 0.5, ease: 'expo.out' }] }));
      seq.push(crest(HOME, 'wing', { x: 340, y: SY, scale: 0.42, keyframes: [{ at: 0.75, from: { scale: 0, rotation: -20 }, duration: 0.5, ease: 'back.out(1.8)' }] }));
      seq.push(text('strap-name', 'RAFE OKAFOR', 56, 400, SY - 10, { ax: 0, ls: 2,
        keyframes: [{ at: 0.8, from: { alpha: 0, x: 370 }, duration: 0.5, ease: 'expo.out' }] }));
      seq.push(text('strap-sub', "88'   ·   KESTRELS 3 – 2 ROVERS", 20, 402, SY + 30, { ax: 0, font: SANS, weight: '700', ls: 3, fill: C.gold,
        keyframes: [{ at: 0.9, from: { alpha: 0, x: 380 }, duration: 0.5, ease: 'expo.out' }] }));
      seq.push(text('strap-num', '9', 84, 930, SY - 2, { fill: C.home, initial: { skewX: -10 },
        keyframes: [{ at: 0.85, from: { alpha: 0, scale: 1.6 }, duration: 0.35, ease: 'expo.out' }] }));

      return {
        type: 'composition', name: 'goal', at, duration, width: W, height: H, sequences: seq,
        // a mask's keyframes count from the MASK's own `at` (default 0 = the parent's start), not from the masked layer's start
        mask: slab('goal-mask', OFF_L, 360, SW, 780, SS, C.white, { at, duration, keyframes: sweepKeys(0, IN, OUT_AT, OUT) }),
      };
    }

    // ── Assemble ───────────────────────────────────────────────────────────────
    const GOAL_DUR = 2.3;
    const sequences = [
      { type: 'shape', shape: 'rect', name: 'base', width: W, height: H, initial: { x: 640, y: 360, fillColor: C.night } },
      matchup({ name: 'matchup', at: 0, duration: T_A_END, intro: true }),
      stats({ at: T_A_END, duration: T_GOAL + 0.4 - T_A_END }),
      matchup({ name: 'final', at: T_D, duration: DURATION - T_D, intro: false }),

      // matchup → stats: a full-screen gold slab with team blades on both edges; the cut happens while it covers
      ...blades('sweep1-', 3.68, 0.75, 0, 0.3, 0.3, 0.4, [[150, C.home], [-150, C.home], [75, C.away], [-75, C.away], [0, C.gold]]),
      // goal stinger: blades under the masked composition, then the stinger
      ...blades('sweep2-', T_GOAL, GOAL_DUR, 0, 0.32, GOAL_DUR - 0.4, 0.4, [[150, C.gold], [-150, C.gold], [80, C.white], [-80, C.white]]),
      goalStinger({ at: T_GOAL, duration: GOAL_DUR }),
      // white flash on the goal
      rect('goal-flash', 640, 360, W, H, C.white, { at: T_GOAL + 0.22, duration: 0.4,
        initial: { alpha: 0.85 }, keyframes: [{ at: 0, to: { alpha: 0 }, duration: 0.38, ease: 'power2.out' }] }),

      // sound
      { type: 'audio', name: 'bgm', asset: 'bgm', loop: true, volume: 0, duration: DURATION,
        keyframes: [{ at: 0, to: { volume: 0.3 }, duration: 0.8 }, { at: -1.5, to: { volume: 0 }, duration: 1.5 }] },
      sfx('swoosh', 0.0, 0.51), sfx('pop', 0.6, 0.54), sfx('pop', 0.75, 0.54),
      sfx('swoosh', 3.6, 0.51), sfx('click', 4.9, 0.13), sfx('click', 5.05, 0.13),
      sfx('swoosh', T_GOAL, 0.68), sfx('chime', T_GOAL + 0.25, 0.21),
      sfx('swoosh', T_GOAL + GOAL_DUR - 0.4, 0.51), sfx('pop', T_D + 0.45, 0.72),
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS, poster: POSTER_FRAME / FPS,
        background: C.night,
        assets: [{ name: 'bgm', src: '../_assets/bgm.mp3' }],
        composition: { sequences },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
