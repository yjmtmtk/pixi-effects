<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>check · movie.onionSkin()</title>
</head>
<body>
  <!--
    Acceptance check (not an example): a black 1280x720 picture and a white 80 px square that moves right at a constant speed,
    from x = 160 (t = 0) to x = 1120 (t = 2). tests/tools/onion.test.ts overlays frames and reads the pixels back.
  -->
  <canvas id="stage" width="1280" height="720"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap":            "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":      "https://esm.sh/mediabunny@1.61.3"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';

    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: 1280, height: 720, duration: 2, frameRate: 30,
        composition: { sequences: [
          { type: 'shape', shape: 'rect', name: 'background', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#000000' } },
          { type: 'shape', shape: 'rect', name: 'square', width: 80, height: 80, initial: { x: 160, y: 360, fillColor: '#ffffff' },
            keyframes: [{ at: 0, to: { x: 1120 }, duration: 2, ease: 'none' }] },
        ] },
      });
      window.__ready = true;
    } catch (e) { window.__logs.push('init: ' + e.message); }
  </script>
</body>
</html>
