<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>check · a 3D card whose child is animated is right after a jump seek</title>
</head>
<body>
  <!--
    Acceptance check (not an example): a threeD composition (a "card") holds a white line that draws on (trimEnd 0 → 1 over 2 s) and a box that grows.
    After ANY seek (jump forward, jump back, the same frame twice) the card must show the state of THAT frame: count the white pixels of a snapshot.
  -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
  </script>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":      "https://esm.sh/mediabunny@1.61.3"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({
        canvas: document.getElementById('stage'), width: 640, height: 360, duration: 2, frameRate: 30, background: '#000000',
        composition: { sequences: [
          { type: 'composition', name: 'card', threeD: true, width: 600, height: 200, initial: { x: 320, y: 180, pivotX: 300, pivotY: 100 }, sequences: [
            { type: 'shape', shape: 'line', name: 'draw', from: [20, 100], to: [580, 100],
              initial: { strokeColor: '#ffffff', strokeWidth: 12, trimEnd: 0 }, keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 2, ease: 'none' }] },
            { type: 'shape', shape: 'rect', name: 'grow', width: 100, height: 10, initial: { x: 300, y: 170, fillColor: '#ffffff', scaleX: 0 }, keyframes: [{ at: 0, to: { scaleX: 5 }, duration: 2, ease: 'none' }] },
          ] },
        ] },
      });
      window.__ready = true;
    } catch (e) { window.__logs.push('init failed: ' + (e && e.message || e)); }
  </script>
</body>
</html>
