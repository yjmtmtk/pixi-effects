<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>check · depth of field</title></head>
<body>
  <!--
    Acceptance check (not an example): tests/tools/depthOfField.test.ts. Three white bars on black sit at three depths (near z = 60,
    front z = 0, back z = -100; the test builds them); the vertical edges of a bar show how blurred it is. Helpers: mk(opts) rebuilds
    the movie under test and returns the render backend; snap(f) is a frame as a data URL; diff(a, b) is the largest
    pixel difference of two data URLs; edge(url, y, x0, x1) counts the pixels of row y, between x0 and x1, that are between 10 % and
    90 % of white (0..3 for a sharp edge, about the blur width for a blurred one); orders(frames) snapshots a list in three seek
    orders and returns the largest differences; demo(aperture) draws a text-and-shapes picture to LOOK at.
  -->
  <canvas id="stage" width="320" height="180"></canvas>
  <script>
    // ?backend=webgl hides WebGPU from the page, so the movie falls back to WebGL (and warns about it once)
    if (new URLSearchParams(location.search).get('backend') === 'webgl') Object.defineProperty(navigator, 'gpu', { value: undefined });
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">
  { "imports": {
      "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "gsap": "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    const FPS = 30;
    window.mk = async (opts) => {
      if (window.movie) { await window.movie.destroy(); window.movie = null; }
      window.__logs.length = 0;
      const movie = new Movie(); window.movie = movie;
      await movie.init({ canvas: document.getElementById('stage'), width: 320, height: 180, duration: opts.duration ?? 2, frameRate: FPS, background: '#000000', ...opts });
      window.backend = movie.app.renderer.name || String(movie.app.renderer.type);
      return window.backend;
    };
    const toImg = (url) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = url; });
    const pixels = async (url) => { const i = await toImg(url); const c = document.createElement('canvas'); c.width = i.width; c.height = i.height; const g = c.getContext('2d'); g.drawImage(i, 0, 0); return g.getImageData(0, 0, i.width, i.height).data; };
    window.snap = (f) => window.movie.snapshot(f, { as: 'dataURL' });
    window.diff = async (a, b) => { if (a === b) return 0; const A = await pixels(a), B = await pixels(b); let m = 0; for (let i = 0; i < A.length; i++) m = Math.max(m, Math.abs(A[i] - B[i])); return m; };
    window.edge = async (url, y, x0, x1) => { const P = await pixels(url); let n = 0; for (let x = x0; x < x1; x++) { const v = P[(y * 320 + x) * 4] / 255; if (v > 0.1 && v < 0.9) n++; } return n; };
    window.shuffle = (arr, seed = 1) => { const a = arr.slice(); let s = seed; const r = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    window.orders = async (frames) => {
      const take = async (order) => { const m = {}; for (const f of order) m[f] = await window.snap(f); return m; };
      const fwd = await take(frames), bwd = await take(frames.slice().reverse()), jmp = await take(window.shuffle(frames, 7));
      const out = { bwdMax: 0, jmpMax: 0 };
      for (const f of frames) { out.bwdMax = Math.max(out.bwdMax, await window.diff(fwd[f], bwd[f])); out.jmpMax = Math.max(out.jmpMax, await window.diff(fwd[f], jmp[f])); }
      return out;
    };
    // a picture to look at: a title in focus, a dot field behind it, a badge in front (1280 x 720, the focus on the title)
    window.demo = async (aperture) => {
      const dots = Array.from({ length: 14 }, (_, i) => ({ type: 'shape', shape: 'circle', radius: 30 + (i % 4) * 14, threeD: true,
        initial: { x: 100 + ((i * 197) % 1100), y: 90 + ((i * 131) % 540), z: -500 - (i % 3) * 200, fillColor: ['#ffb347', '#6ec6ff', '#ff6f91', '#c4f1be'][i % 4] } }));
      const comp = { sequences: [
        { type: 'shape', shape: 'rect', width: 1280, height: 720, anchorX: 0, anchorY: 0, initial: { fillColor: '#101626' } },
        { type: 'camera', name: 'cam', initial: { focus: 'title', aperture } },
        ...dots,
        { type: 'text', name: 'title', text: 'Rack focus', threeD: true, style: { fontSize: 120, fill: '#ffffff', fontFamily: 'sans-serif', fontWeight: '700' }, initial: { x: 640, y: 360, z: 0, anchorX: 0.5, anchorY: 0.5 } },
        { type: 'shape', shape: 'circle', radius: 90, threeD: true, initial: { x: 190, y: 560, z: 350, fillColor: '#ef476f' } },
      ] };
      const canvas = document.createElement('canvas'); canvas.width = 1280; canvas.height = 720;      // (destroying a movie removes its canvas from the page)
      if (window.movie) { await window.movie.destroy(); window.movie = null; }
      const movie = new Movie(); window.movie = movie;
      await movie.init({ canvas, width: 1280, height: 720, duration: 1, frameRate: FPS, background: '#000000', composition: comp });
      return window.snap(0);
    };
    window.__ready = true;
  </script>
</body></html>
