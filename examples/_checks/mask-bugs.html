<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>check · masks: a text mask is the letters, an inverted mask stays inside an outer mask</title>
</head>
<body>
  <!--
    Acceptance check (not an example). ?case=textPlain | text | inverted | moving selects the scene; ?gl forces the WebGL backend (the
    default tries WebGPU first). tests/tools/maskBugs.test.ts reads pixels back.
      textPlain: the letters "II" drawn normally on a dark background.
      text:      a white full-canvas rectangle whose mask is the same text: it must look the same as textPlain.
      inverted:  a layer with an inverted mask (a hole) inside a composition that has an outer mask (a disc): outside the disc
                 there must be nothing of it.
  -->
  <canvas id="stage" width="640" height="360"></canvas>
  <script>
    window.__logs = [];
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); orig(...a); };
    }
    if (new URLSearchParams(location.search).has('gl')) Object.defineProperty(navigator, 'gpu', { value: undefined });   // no WebGPU: the library falls back to WebGL
  </script>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny":      "https://esm.sh/mediabunny@1.61.3"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';

    const CASE = new URLSearchParams(location.search).get('case') ?? 'textPlain';
    const bg = { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#101020' } };
    const textStyle = { fontFamily: 'Arial, sans-serif', fontSize: 220, fontWeight: '900', fill: '#ffffff' };
    const textInit = { x: 320, y: 180, anchorX: 0.5, anchorY: 0.5 };
    const circle = (r, x, y) => ({ type: 'shape', shape: 'circle', radius: r, initial: { x, y, fillColor: '#ffffff' } });
    const scenes = {
      textPlain: [bg, { type: 'text', text: 'II', style: textStyle, initial: textInit }],
      text: [bg, { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#ffffff' },
        mask: { type: 'text', text: 'II', style: textStyle, initial: textInit } }],
      // an alpha mask that moves: the hole slides right; seeking back must give the same picture as playing forward
      moving: [bg, { type: 'text', text: 'II', style: textStyle, initial: textInit, maskInverted: true,
        mask: { type: 'shape', shape: 'circle', radius: 60, initial: { x: 200, y: 180, fillColor: '#ffffff' }, keyframes: [{ at: 0, to: { x: 440 }, duration: 1, ease: 'none' }] } }],
      inverted: [bg, { type: 'composition', name: 'group', mask: circle(120, 320, 180), sequences: [
        { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fillColor: '#ff0000' }, maskInverted: true, mask: circle(50, 320, 180) },
      ] }],
    };
    const movie = new Movie();
    window.movie = movie;
    try {
      await movie.init({ canvas: document.getElementById('stage'), width: 640, height: 360, duration: 1, frameRate: 30, composition: { sequences: scenes[CASE] } });
      window.__ready = true;
    } catch (e) { window.__logs.push('init: ' + e.message); }
  </script>
</body>
</html>
