<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>check · variables and rebuild</title></head>
<body>
  <!--
    Acceptance check (not an example): tests/tools/variables.test.ts. mk(opts) builds the movie under test (160 x 90, 1 s, 30 fps unless opts says otherwise) and
    returns { backend }; snap(f) is a frame as a data URL; px(url, x, y) is one pixel [r, g, b, a] of it (any size); events is the list of 'rebuilt' reports.
    ?backend=webgl hides WebGPU so the movie falls back to WebGL.
  -->
  <script>
    if (new URLSearchParams(location.search).get('backend') === 'webgl') Object.defineProperty(navigator, 'gpu', { value: undefined });
    window.__logs = [];
    for (const k of ['warn', 'error']) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ': ' + a.map(x => (x && x.message) || String(x)).join(' ')); o(...a); }; }
  </script>
  <script type="importmap">
  { "imports": {
      "pixi.js": "https://esm.sh/pixi.js@8.22.0?bundle-deps",
      "mediabunny": "https://esm.sh/mediabunny@1.61.3" } }
  </script>
  <script type="module">
    import { Movie } from '../../dist/index.js';
    window.events = []; window.errors = []; window.played = [];
    window.mk = async (opts) => {
      if (window.movie) { await window.movie.destroy(); window.movie = null; }
      window.__logs.length = 0; window.events.length = 0; window.errors.length = 0; window.played.length = 0;
      const movie = new Movie(); window.movie = movie;
      const canvas = document.createElement('canvas'); document.body.appendChild(canvas);
      await movie.init({ canvas, width: 160, height: 90, duration: 1, frameRate: 30, background: '#000000', loader: false, ...opts });
      movie.on('rebuilt', e => window.events.push(e));
      movie.on('error', e => window.errors.push({ where: e.where, message: e.message }));
      movie.on('play', () => window.played.push('play')); movie.on('pause', () => window.played.push('pause'));
      return { backend: movie.app.renderer.name || String(movie.app.renderer.type) };
    };
    const toImg = (url) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = url; });
    window.snap = (f) => window.movie.snapshot(f, { as: 'dataURL' });
    window.px = async (url, x, y) => {
      const i = await toImg(url); const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(i, 0, 0);
      const d = g.getImageData(x, y, 1, 1).data; return [d[0], d[1], d[2], d[3]];
    };
    window.size = () => ({ w: window.movie.width, h: window.movie.height, cw: window.movie.app.canvas.width, ch: window.movie.app.canvas.height });
    window.__ready = true;
  </script>
</body></html>
