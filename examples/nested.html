<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>pixi-effects — nested + audio</title>
<style>body { background: #181818; margin: 16px; color: #ccc; font-family: sans-serif; }
canvas { width: min(960px, 100%); }</style></head>
<body>
  <h1>pixi-effects nested + audio</h1>
  <p>Provide an audio clip at <code>examples/_assets/bgm.mp3</code>.</p>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="ctrl"></div>
  <script type="importmap">
  { "imports": {
    "pixi.js":   "https://esm.sh/pixi.js@8.10.0?bundle-deps",
    "gsap":      "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
    "mediabunny":"https://esm.sh/mediabunny",
    "expr-eval": "https://esm.sh/expr-eval@2.0.2"
  } }
  </script>
  <script type="module">
    import { Movie } from '../dist/index.js';
    import { Controller } from '../dist/Controller.js';
    const movie = new Movie();
    new Controller(movie, { container: document.getElementById('ctrl') });
    await movie.init({
      canvas: document.getElementById('stage'),
      width: 1280, height: 720, duration: 6, frameRate: 30,
      assets: [{ name: 'bgm', src: '/examples/_assets/bgm.mp3' }],
      composition: {
        sequences: [
          {
            type: 'composition', width: 800, height: 450,
            initial: { x: 'GW/2 - 400', y: 'GH/2 - 225' },
            keyframes: [
              { at: 0, to: { alpha: 1 }, duration: 0.5 },
              { at: 1, to: { rotation: 0.2 }, duration: 2, ease: 'sine.inOut' },
              { at: 3, to: { rotation: -0.2 }, duration: 2, ease: 'sine.inOut' },
            ],
            sequences: [
              {
                type: 'text', text: 'inner composition',
                initial: { x: 400, y: 225 },
                style: { fontSize: 64, fill: '#88ddff' },
              },
            ],
          },
          {
            type: 'audio', asset: 'bgm', volume: 0,
            keyframes: [
              { at: 0,  to: { volume: 0.6 }, duration: 1 },
              { at: -1, to: { volume: 0 },  duration: 1 },
            ],
          },
        ],
      },
    });
  </script>
</body>
</html>
