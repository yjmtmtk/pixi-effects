<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pixi-effects — Ken Burns preset</title>
  <style>
    body { background: #0a0a0f; margin: 0; font-family: sans-serif; color: #ccc; padding: 16px; }
    h1 { font-weight: 500; margin: 0 0 4px 0; }
    p { font-size: 13px; color: #888; margin: 0 0 16px 0; max-width: 960px; }
    p code { background: #1a1a22; padding: 1px 6px; border-radius: 3px; color: #b5d3ff; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Ken Burns preset</h1>
  <p>Four images, one per <code>motion</code> mode (<code>scale</code>, <code>rotation</code>, <code>position</code>, <code>still</code>), stitched together with crossfades. Synthesised as inline data URLs so the example is self-contained.</p>
  <canvas id="stage" width="1280" height="720"></canvas>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.10.0?bundle-deps",
      "gsap":            "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":      "https://esm.sh/mediabunny"
    }
  }
  </script>
  <script type="module">
    import { Movie, kenBurns } from '../dist/index.js';
    import { Controller } from '../dist/Controller.js';

    function gradientPhoto(c1, c2, c3, label) {
      const c = document.createElement('canvas');
      c.width = 1920; c.height = 1080;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 1920, 1080);
      g.addColorStop(0, c1);
      g.addColorStop(0.5, c2);
      g.addColorStop(1, c3);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      for (let x = 0; x <= 1920; x += 120) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
      for (let y = 0; y <= 1080; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = 'bold 140px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 960, 540);
      return c.toDataURL();
    }

    const movie = new Movie();
    window.__movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    await movie.init({
      canvas: document.getElementById('stage'),
      width: 1280, height: 720, duration: 28, frameRate: 30,
      background: '#0a0a0f',
      assets: [
        { name: 'p1', src: gradientPhoto('#ff7755', '#cc4422', '#883311', '1 scale ↘') },
        { name: 'p2', src: gradientPhoto('#3399aa', '#2266bb', '#114488', '2 rotation ↻') },
        { name: 'p3', src: gradientPhoto('#22aa66', '#117744', '#005522', '3 position ↗') },
        { name: 'p4', src: gradientPhoto('#cc66cc', '#883399', '#441166', '4 still ·') },
      ],
      composition: {
        sequences: [
          // 1 — slow zoom in around the top-left quarter
          kenBurns({ asset: 'p1', name: 'P1', at:  0, duration: 8, motion: 'scale',
                     origin: [0.25, 0.25], zoom: 1.2, direction: 'in' }),
          // 2 — symmetric rotation through 0
          kenBurns({ asset: 'p2', name: 'P2', at:  7, duration: 8, motion: 'rotation',
                     angle: 6, direction: 'through' }),
          // 3 — diagonal pan from top-left toward bottom-right
          kenBurns({ asset: 'p3', name: 'P3', at: 14, duration: 8, motion: 'position',
                     from: [0, 0], to: [1, 1], zoom: 1.15 }),
          // 4 — still
          kenBurns({ asset: 'p4', name: 'P4', at: 21, duration: 7, motion: 'still' }),
        ],
        transitions: [
          { kind: 'crossfade', from: 'P1', to: 'P2', at:  7, duration: 1, ease: 'sine.inOut' },
          { kind: 'crossfade', from: 'P2', to: 'P3', at: 14, duration: 1, ease: 'sine.inOut' },
          { kind: 'crossfade', from: 'P3', to: 'P4', at: 21, duration: 1, ease: 'sine.inOut' },
        ],
      },
    });
  </script>
</body>
</html>
