<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pixi-effects — mask</title>
  <style>
    body { background: #0a0a0f; margin: 0; font-family: sans-serif; color: #ccc; padding: 16px; }
    h1 { font-weight: 500; margin: 0 0 4px 0; }
    p { font-size: 13px; color: #888; margin: 0 0 16px 0; max-width: 960px; }
    p code { background: #1a1a22; padding: 1px 6px; border-radius: 3px; color: #b5d3ff; }
    canvas { width: min(960px, 100%); border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Mask</h1>
  <p>Inline <code>mask</code> on any sequence. The mask is itself a sequence — geometry, position, even keyframes — so reveal animations come for free. Three demos here: a circular avatar crop, a growing-circle reveal that wipes a photo in, and a rect mask sliding across to reveal text.</p>
  <canvas id="stage" width="1280" height="720"></canvas>
  <script type="importmap">
  {
    "imports": {
      "pixi.js":         "https://esm.sh/pixi.js@8.10.0?bundle-deps",
      "gsap":            "https://esm.sh/gsap@3.12.5",
      "gsap/PixiPlugin": "https://esm.sh/gsap@3.12.5/PixiPlugin",
      "mediabunny":      "https://esm.sh/mediabunny"
    }
  }
  </script>
  <script type="module">
    import { Movie } from '../dist/index.js';
    import { Controller } from '../dist/Controller.js';

    function gradientPhoto(c1, c2, c3, label) {
      const c = document.createElement('canvas');
      c.width = 1920; c.height = 1080;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 1920, 1080);
      g.addColorStop(0, c1);
      g.addColorStop(0.5, c2);
      g.addColorStop(1, c3);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = 'bold 160px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 960, 540);
      return c.toDataURL();
    }

    const movie = new Movie();
    window.__movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage') });

    await movie.init({
      canvas: document.getElementById('stage'),
      width: 1280, height: 720, duration: 8, frameRate: 30,
      background: '#0a0a0f',
      assets: [
        { name: 'photoA', src: gradientPhoto('#ff7755', '#cc4422', '#883311', 'A') },
        { name: 'photoB', src: gradientPhoto('#3399aa', '#2266bb', '#114488', 'B') },
      ],
      composition: {
        sequences: [

          // 1 — Circular avatar crop. Static circle mask, image stays put.
          {
            type: 'image', asset: 'photoA',
            initial: { x: 'W * 0.22', y: 'H * 0.5', anchorX: 0.5, anchorY: 0.5, scale: 0.4 },
            keyframes: [
              { at: 0,    from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.5 },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            mask: {
              type: 'shape', shape: 'circle', radius: 130,
              initial: { x: 'W * 0.22', y: 'H * 0.5', fillColor: '#ffffff' },
            },
          },

          // 2 — Growing-circle reveal. Mask animates radius via scale tween,
          //     so the image is "wiped in" as a circular iris.
          {
            type: 'image', asset: 'photoB',
            initial: { x: 'W * 0.5', y: 'H * 0.5', anchorX: 0.5, anchorY: 0.5, scale: 0.4 },
            keyframes: [
              { at: 0,    to: { alpha: 1 }, duration: 0 },
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            mask: {
              type: 'shape', shape: 'circle', radius: 200,
              initial: { x: 'W * 0.5', y: 'H * 0.5', fillColor: '#ffffff', scale: 0 },
              keyframes: [
                { at: 1.5, to: { scale: 1 }, duration: 1.0, ease: 'power2.out' },
              ],
            },
          },

          // 3 — Rect mask wiping L→R to reveal text underneath. Pivot is
          //     pinned to the rect's LEFT edge (overriding the auto-centre)
          //     so scaleX 0 → 1 grows the rect rightward instead of out
          //     from the centre — a true left-to-right wipe.
          {
            type: 'text', text: 'masked text',
            initial: { x: 'W * 0.78', y: 'H * 0.5', anchorX: 0.5, anchorY: 0.5 },
            style: { fontSize: 'GW * 0.04', fill: '#ffffff', fontWeight: 'bold' },
            keyframes: [
              { at: -0.5, to: { alpha: 0 }, duration: 0.5 },
            ],
            mask: {
              type: 'shape', shape: 'rect',
              width: 360, height: 100,
              initial: {
                x: 'W * 0.78 - 180', y: 'H * 0.5',
                pivotX: -180, // left-edge pivot → scaleX grows rightward
                fillColor: '#ffffff', scaleX: 0,
              },
              keyframes: [
                { at: 3.0, to: { scaleX: 1 }, duration: 1.2, ease: 'power3.out' },
              ],
            },
          },

        ],
      },
    });
  </script>
</body>
</html>
