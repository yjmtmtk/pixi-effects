<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixi-effects — playground</title>
<!--site:head-->
<link rel="stylesheet" href="../site/shared/tokens.css">
<link rel="stylesheet" href="../site/shared/site.css">
<script>try{var t=localStorage.getItem('pe-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="../site/shared/site.js" defer></script>
<!--/site:head-->
  <link rel="stylesheet" href="playground/playground.css">
</head>
<body class="app">
<!--site:header-->
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="../"><span class="dia" aria-hidden="true"></span>pixi-effects</a>
    <nav aria-label="Site">
      <a href="../guide/">Guide</a>
      <a href="../examples/gallery/">Gallery</a>
      <a href="../examples/">Examples</a>
      <a href="../examples/playground.html" aria-current="page">Playground</a>
      <a class="only-wide" href="https://github.com/yjmtmtk/pixi-effects">GitHub</a>
    </nav>
    <button class="theme" type="button" id="themeBtn" aria-label="Colour theme: auto. Click to change">auto</button>
  </div>
</header>
<!--/site:header-->
  <div id="toolbar" role="toolbar" aria-label="Playground">
    <select id="preset" aria-label="Preset"></select>
    <button id="run" type="button" class="primary">▶ Run</button>
    <span id="state" role="status" aria-live="polite">Loading the editor…</span>
    <span class="spacer"></span>
  </div>
  <main id="main">
    <section id="editor" aria-label="Code"></section>
    <section id="preview" aria-label="Preview">
      <div id="host"></div>
    </section>
  </main>
  <section id="problems" aria-label="Problems" data-state="idle"></section>

  <!-- One copy of @codemirror/state and view for every package (deps=): two copies make "Unrecognized extension value". -->
  <script type="importmap">
  {
    "imports": {
      "codemirror":                  "https://esm.sh/codemirror@6.0.2?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.14",
      "@codemirror/state":           "https://esm.sh/@codemirror/state@6.7.6",
      "@codemirror/view":            "https://esm.sh/@codemirror/view@6.43.14?deps=@codemirror/state@6.7.6",
      "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.5?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.14",
      "@codemirror/theme-one-dark":  "https://esm.sh/@codemirror/theme-one-dark@6.1.3?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.14"
    }
  }
  </script>
  <script type="module" src="playground/app.js"></script>
</body>
</html>
