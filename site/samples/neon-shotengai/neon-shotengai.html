<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>夜の商店街 — OPEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/loader.css" />
  <style>
    body { background: #05060d; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .stage { position: relative; width: min(420px, 100%); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    let group = '';
    const text = (a) => { if (typeof a[0] === 'string' && a[0].includes('%')) { let i = 1; a = [a[0].replace(/%([csdifoO])/g, (_, f) => f === 'c' ? (i++, '') : String(a[i++])), ...a.slice(i)]; } return a.map(x => (x && x.message) || String(x)).join(' '); };
    const gc = console.groupCollapsed.bind(console), ge = console.groupEnd.bind(console);
    console.groupCollapsed = (...a) => { group = text(a); gc(...a); };
    console.groupEnd = () => { group = ''; ge(); };
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + (group ? group + ' — ' : '') + text(a)); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js",
      "pixi-effects/controller": "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/controller.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js" />

  <script type="module">
    import { Movie, splitText, measureText, random } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1080, H = 1920, FPS = 30, DURATION = 15;
    const BPM = 96, BEAT = 60 / BPM;              // 0.625 s; a bar = 2.5 s, the movie = 6 bars = 24 beats
    const FONT = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif';

    // ── signs (data) ────────────────────────────────────────────────
    // order = the order they light up
    const SIGNS = [
      { name: 'arch',   text: '月見通り商店街', x: 540, y: 330, size: 96,  color: '#ffb547', horizontal: true },
      { name: 'ramen',  text: 'ラーメン',       x: 150, y: 860, size: 118, color: '#ff3d6e' },
      { name: 'kissa',  text: '喫茶',           x: 362, y: 800, size: 78,  color: '#6dff8a' },
      { name: 'izakaya',text: '居酒屋',         x: 930, y: 830, size: 118, color: '#3de6ff' },
      { name: 'kosho',  text: '古書',           x: 718, y: 790, size: 78,  color: '#c58bff' },
    ];
    const OPEN = { text: 'OPEN', x: 540, y: 1430, size: 270, color: '#ff3fb4', frame: '#ffd84a' };

    const hex = (c) => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
    const core = (c) => mix(c, '#ffffff', 0.62);   // the hot white-ish core of a lit tube
    const dim  = (c) => mix(c, '#0b0a14', 0.86);   // an unlit tube

    await document.fonts.load(`800 120px ${FONT}`, SIGNS.map(s => s.text).join('') + OPEN.text);

    // ── timing: every letter on an eighth note ─────────────────────
    const letters = [];            // { sign, piece, t }
    let beat = 3;                  // first letter at beat 3 (1.875 s)
    for (const s of SIGNS) {
      const style = { fontFamily: FONT, fontWeight: '800', fontSize: s.size };
      const pieces = s.horizontal
        ? splitText(s.text, style, { by: 'chars', x: s.x, y: s.y - s.size * 0.62, align: 'center' })
            .map(p => ({ ...p, cx: p.x + p.width / 2, cy: s.y, rotation: 0 }))
        : splitText(s.text, { ...style, lineHeight: s.size * 1.12 }, { by: 'chars', vertical: true, x: s.x + s.size / 2, y: s.y, align: 'center' });
      s.pieces = pieces;
      s.start = beat * BEAT;
      for (const p of pieces) { letters.push({ sign: s, piece: p, t: beat * BEAT, beat }); beat += 0.5; }
      beat += 0.5;                 // a breath between signs
    }
    const OPEN_BEATS = [16, 17, 18, 19];          // O P E N on the beats of bar 5
    const BLAZE = 20 * BEAT;                       // 12.5 s: bar 6, the whole sign blazes

    // a neon tube switching on: a fast stutter, then steady
    const flickerOn = (t, peak = 1) => [
      { at: t,        to: { alpha: peak },        duration: 0.03 },
      { at: t + 0.05, to: { alpha: peak * 0.15 }, duration: 0.03 },
      { at: t + 0.11, to: { alpha: peak },        duration: 0.02 },
      { at: t + 0.17, to: { alpha: peak * 0.35 }, duration: 0.03 },
      { at: t + 0.24, to: { alpha: peak },        duration: 0.06 },
    ];
    const glow = (name, color, dist, strength) => ({ type: 'glow', name, color, distance: dist, outerStrength: strength, innerStrength: 0.4, quality: 0.25 });
    const pad = (n) => ({ x: -n, y: -n, width: n * 2, height: n * 2 });

    // ── background: sky, buildings, street ─────────────────────────
    const R = random(7);
    const bg = [
      { type: 'shape', name: 'sky', shape: 'rect', width: W, height: H, initial: { x: W / 2, y: H / 2 },
        fillGradient: { stops: [[0, '#05040f'], [0.45, '#140c2c'], [0.78, '#1d1030'], [1, '#07060d']] } },
    ];
    // a few stars
    for (let i = 0; i < 40; i++) {
      bg.push({ type: 'shape', shape: 'circle', radius: 1 + R() * 1.6,
        initial: { x: R() * W, y: R() * 520, fill: '#c9c4ff', alpha: 0.25 + R() * 0.5 } });
    }
    // buildings left & right (receding)
    const buildings = [
      { x: 90,  w: 260, top: 470, c: '#0f0c1d' }, { x: 990, w: 260, top: 500, c: '#0f0c1d' },
      { x: 330, w: 190, top: 610, c: '#151129' }, { x: 750, w: 190, top: 600, c: '#151129' },
      { x: 450, w: 110, top: 760, c: '#1a1530' }, { x: 630, w: 110, top: 750, c: '#1a1530' },
    ];
    for (const b of buildings) {
      const h = 1700 - b.top;
      bg.push({ type: 'shape', shape: 'rect', width: b.w, height: h, initial: { x: b.x, y: b.top + h / 2, fill: b.c } });
      // windows: some warm, most dark
      const cols = Math.floor(b.w / 60), rows = Math.floor(h / 90);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (R() > 0.22) continue;
        bg.push({ type: 'shape', shape: 'rect', width: 22, height: 30,
          initial: { x: b.x - b.w / 2 + 30 + c * 60 + 10, y: b.top + 50 + r * 90, fill: R() > 0.5 ? '#ffcf7a' : '#7aa8ff', alpha: 0.18 + R() * 0.2 } });
      }
    }
    // the street, wet
    bg.push({ type: 'shape', name: 'street', shape: 'rect', width: W, height: 300, initial: { x: W / 2, y: 1770 },
      fillGradient: { stops: [[0, '#120c1e'], [1, '#040308']] } });
    bg.push({ type: 'shape', shape: 'line', from: [0, 1622], to: [W, 1622], initial: { stroke: '#2a2140', strokeWidth: 3 } });

    // ── signs ───────────────────────────────────────────────────────
    const signLayers = [];
    for (const s of SIGNS) {
      const n = s.pieces.length;
      const boxW = s.horizontal ? measureText(s.text, { fontFamily: FONT, fontWeight: '800', fontSize: s.size }).width + 90 : s.size * 1.55;
      const boxH = s.horizontal ? s.size * 1.7 : n * s.size * 1.12 + s.size * 0.7;
      // board (dark plate behind the tubes)
      signLayers.push({ type: 'shape', name: `${s.name}-board`, shape: 'rect', width: boxW, height: boxH, cornerRadius: 20,
        initial: { x: s.x, y: s.y, fill: '#0d0a16', stroke: dim(s.color), strokeWidth: 5 } });
      // frame tube, lights with the first letter
      signLayers.push({ type: 'shape', name: `${s.name}-frame`, shape: 'rect', width: boxW - 22, height: boxH - 22, cornerRadius: 14,
        initial: { x: s.x, y: s.y, fill: 'none', stroke: core(s.color), strokeWidth: 4, alpha: 0 },
        filters: [glow('g', s.color, 16, 2.6)],
        filterArea: { x: -boxW / 2 - 40, y: -boxH / 2 - 40, width: boxW + 80, height: boxH + 80 },
        keyframes: flickerOn(s.start - 0.02) });
    }
    for (const L of letters) {
      const s = L.sign, p = L.piece;
      const style = { fontFamily: FONT, fontWeight: '800', fontSize: s.size, padding: 12 };
      const base = { x: p.cx, y: p.cy, anchorX: 0.5, anchorY: 0.5, rotation: p.rotation || 0 };
      signLayers.push({ type: 'text', name: `${s.name}-off-${p.index}`, text: p.text,
        style: { ...style, fill: dim(s.color), stroke: { color: mix(s.color, '#0b0a14', 0.72), width: 3 } }, initial: base });
      signLayers.push({ type: 'text', name: `${s.name}-${p.index}`, text: p.text,
        style: { ...style, fill: core(s.color), stroke: { color: s.color, width: Math.round(s.size / 16) } },
        initial: { ...base, alpha: 0 },
        filters: [glow('g', s.color, 20, 2.3)], filterArea: pad(s.size * 1.3),
        keyframes: [
          ...flickerOn(L.t),
          // every sign breathes once when OPEN blazes
          { at: BLAZE, to: { 'filters.g.outerStrength': 5 }, duration: 0.08 },
          { at: BLAZE + 0.1, to: { 'filters.g.outerStrength': 3 }, duration: 1.2, ease: 'power2.out' },
        ] });
    }

    // ── OPEN ───────────────────────────────────────────────────────
    const oStyle = { fontFamily: FONT, fontWeight: '800', fontSize: OPEN.size, letterSpacing: 18 };
    const oPieces = splitText(OPEN.text, oStyle, { by: 'chars', x: OPEN.x, y: OPEN.y - OPEN.size * 0.62, align: 'center' });
    const oW = measureText(OPEN.text, oStyle).width + 120, oH = OPEN.size * 1.45;
    const openLayers = [];
    // the reflection on the wet street (drawn first, under everything of the sign)
    const reflY = 1622 * 2 - OPEN.y + 10;
    openLayers.push({ type: 'shape', name: 'open-board', shape: 'rect', width: oW, height: oH, cornerRadius: 34,
      initial: { x: OPEN.x, y: OPEN.y, fill: '#0c0814', stroke: dim(OPEN.frame), strokeWidth: 6 } });
    openLayers.push({ type: 'shape', name: 'open-frame', shape: 'rect', width: oW - 34, height: oH - 34, cornerRadius: 26,
      initial: { x: OPEN.x, y: OPEN.y, fill: 'none', stroke: core(OPEN.frame), strokeWidth: 7, alpha: 0 },
      filters: [glow('g', OPEN.frame, 26, 3)],
      filterArea: { x: -oW / 2 - 60, y: -oH / 2 - 60, width: oW + 120, height: oH + 120 },
      keyframes: [
        ...flickerOn(OPEN_BEATS[0] * BEAT - 0.3),
        { at: BLAZE, to: { 'filters.g.outerStrength': 7 }, duration: 0.06 },
        { at: BLAZE + 0.1, to: { 'filters.g.outerStrength': 3.5 }, duration: 1.4, ease: 'power2.out' },
      ] });
    oPieces.forEach((p, i) => {
      const t = OPEN_BEATS[i] * BEAT;
      const pos = { x: p.x + p.width / 2, y: OPEN.y };
      const blaze = [
        { at: BLAZE, to: { 'filters.g.outerStrength': 8, scale: 1.08 }, duration: 0.06 },
        { at: BLAZE + 0.1, to: { 'filters.g.outerStrength': 4, scale: 1 }, duration: 1.2, ease: 'power3.out' },
      ];
      // a little life after the blaze: the E stutters once
      const stutter = p.text === 'E' ? [
        { at: 14.0, to: { alpha: 0.2 }, duration: 0.03 }, { at: 14.06, to: { alpha: 1 }, duration: 0.03 },
        { at: 14.14, to: { alpha: 0.45 }, duration: 0.03 }, { at: 14.2, to: { alpha: 1 }, duration: 0.05 },
      ] : [];
      openLayers.push({ type: 'text', name: `open-off-${p.text}`, text: p.text,
        style: { ...oStyle, letterSpacing: 0, padding: 16, fill: 'rgba(0,0,0,0)', stroke: { color: mix(OPEN.color, '#0b0a14', 0.8), width: 14 } },
        initial: { ...pos, anchorX: 0.5, anchorY: 0.5 } });
      openLayers.push({ type: 'text', name: `open-${p.text}`, text: p.text,
        style: { ...oStyle, letterSpacing: 0, padding: 16, fill: 'rgba(0,0,0,0)', stroke: { color: core(OPEN.color), width: 14 } },
        initial: { ...pos, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
        filters: [glow('g', OPEN.color, 30, 3)], filterArea: pad(OPEN.size * 1.2),
        keyframes: [...flickerOn(t), ...blaze, ...stutter] });
      // reflection: upside down, blurred, faint, on the street
      openLayers.unshift({ type: 'text', name: `refl-${p.text}`, text: p.text,
        style: { ...oStyle, letterSpacing: 0, padding: 16, fill: 'rgba(0,0,0,0)', stroke: { color: OPEN.color, width: 18 } },
        initial: { x: pos.x, y: reflY, anchorX: 0.5, anchorY: 0.5, scaleY: -0.75, alpha: 0 },
        filters: [{ type: 'blur', strength: 10 }], filterArea: pad(OPEN.size * 1.2),
        keyframes: [...flickerOn(t, 0.32), { at: BLAZE, to: { alpha: 0.55 }, duration: 0.06 }, { at: BLAZE + 0.1, to: { alpha: 0.32 }, duration: 1.2 }] });
    });
    // the reflection board glow under OPEN
    openLayers.unshift({ type: 'shape', name: 'refl-pool', shape: 'ellipse', radiusX: 520, radiusY: 120,
      initial: { x: OPEN.x, y: 1760, alpha: 0 },
      fillGradient: { type: 'radial', stops: [[0, 'rgba(255,63,180,0.45)'], [1, 'rgba(255,63,180,0)']] },
      keyframes: [{ at: OPEN_BEATS[0] * BEAT, to: { alpha: 0.6 }, duration: 2 }, { at: BLAZE, to: { alpha: 1 }, duration: 0.1 }, { at: BLAZE + 0.1, to: { alpha: 0.75 }, duration: 1.5 }] });

    // a soft flash of the whole frame on the blaze
    const flash = { type: 'shape', name: 'flash', shape: 'rect', width: W, height: H, blendMode: 'add',
      initial: { x: W / 2, y: H / 2, fill: '#ff6fc8', alpha: 0 },
      keyframes: [{ at: BLAZE, to: { alpha: 0.22 }, duration: 0.05 }, { at: BLAZE + 0.06, to: { alpha: 0 }, duration: 0.9, ease: 'power2.out' }] };
    // vignette
    const vignette = { type: 'shape', name: 'vignette', shape: 'rect', width: W, height: H, initial: { x: W / 2, y: H / 2 },
      fillGradient: { type: 'radial', stops: [[0.55, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.65)']] } };

    // the whole street, with a slow push in
    const street = { type: 'composition', name: 'street', width: W, height: H,
      initial: { x: W / 2, y: H / 2, pivotX: W / 2, pivotY: H / 2, scale: 1.0, alpha: 0 },
      keyframes: [
        { at: 0, to: { alpha: 1 }, duration: 1.2, ease: 'power1.out' },
        { at: 0, to: { scale: 1.07 }, duration: DURATION, ease: 'sine.inOut' },
      ],
      layers: [...bg, ...signLayers, ...openLayers] };

    // ── sound ──────────────────────────────────────────────────────
    // each letter: a neon tick (click + a low electric buzz)
    const sounds = [];
    const buzz = (at, vol = 0.5, pitch = 0) => [
      { type: 'audio', at, sfx: { preset: 'click', pitch: pitch - 4, brightness: -0.2 }, volume: vol },
      { type: 'audio', at, duration: 0.22, volume: vol * 0.55, sfx: { voices: [{ wave: 'square', freq: 120, filter: { type: 'lowpass', freq: [1400, 300] }, envelope: 'fall', pan: [0, 0] }] } },
    ];
    letters.forEach(L => sounds.push(...buzz(L.t, 0.45)));
    OPEN_BEATS.forEach(b => sounds.push(...buzz(b * BEAT, 0.8, -3)));
    sounds.push({ type: 'audio', at: BLAZE - 1.25, duration: 1.25, sfx: { preset: 'riser', brightness: 0.2 }, volume: 0.55 });
    sounds.push({ type: 'audio', at: BLAZE, sfx: { preset: 'chime', pitch: 0 }, volume: 0.9 });
    sounds.push({ type: 'audio', at: BLAZE, sfx: { preset: 'hit', brightness: -0.4 }, volume: 0.5 });

    // the music: a pluck note per letter (A minor pentatonic, climbing per sign), then the jingle
    const SCALE = ['a4', 'c5', 'd5', 'e5', 'g5', 'a5', 'c6'];
    let pl = '_:3', last = 3;
    SIGNS.forEach((s, si) => {
      letters.filter(L => L.sign === s).forEach((L, k) => {
        if (L.beat > last) pl += ` _:${L.beat - last}`;
        pl += ` ${SCALE[Math.min(SCALE.length - 1, (k + si) % SCALE.length)]}:0.5`;
        last = L.beat + 0.5;
      });
    });
    pl += ` _:${24 - last}`;
    const music = {
      bpm: BPM, reverb: 0.32, swing: 0,
      tracks: [
        { inst: 'pad',   vol: [[0, 0], [4, 0.45], [16, 0.5], [20, 0.75]], attack: 0.8, release: 1.5,
          notes: 'Am7:4 Fmaj7:4 Am7:4 Fmaj7:4 | Dm7:2 G7sus4:2 | Cmaj9:4' },
        { inst: 'pluck', vol: 0.55, pan: 0.15, reverb: 0.5, notes: pl },
        { inst: 'bass',  vol: 0.85, notes: '_:8 a1:2 _:2 f1:2 _:2 | d2:1 d2:1 g1:1 g1:1 | c2:4' },
        // the jingle: one note per OPEN letter, then the sign blazes on C
        { inst: 'bell',  vol: 0.95, reverb: 0.6, ring: 2,
          notes: '_:16 g4:1 c5:1 e5:1 g5:1 | c6:0.5 g5:0.25 c6:0.25 e6:3' },
        { inst: 'musicbox', vol: 0.5, pan: -0.2, notes: '_:20 [c5 e5 g5]:0.5 _:0.5 [e5 g5 c6]:0.5 _:0.5 [g5 c6 e6]:2' },
      ],
      drums: [{ from: 16, kick: 'x...x...x...x...x...............', hat: '..x...x...x...x.................', snare: '................x...............' }],
    };
    sounds.push({ type: 'audio', name: 'music', at: 0, music, volume: 1 });

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage'), theme: { accent: '#ff3fb4' } });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 13.5,
        background: '#05040f',
        loudness: -16,
        composition: { layers: [street, vignette, flash, ...sounds] },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
