<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lluvia anual en cinco ciudades</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/loader.css" />   <!-- the loader: HTML + CSS only, so it is on screen at once and keeps moving while the page builds the video -->
  <style>
    body { background: #0d1220; margin: 0; padding: 16px; }
    .stage { position: relative; width: min(960px, 100%); }                 /* the player and the loader both sit inside this box */
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
    /* the loader (pixi-effects/loader.css, linked above): movie.init() fades it out when the movie is ready */
    /* Screenshots: the player bar overlays the bottom ~60px of the canvas (it is NOT part of the exported video).
       Uncomment to hide it while you check the layout:  .movie-controller { display: none !important; } */
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>   <!-- shared loader: .pe-loader--pulse / --bar for other looks, --custom for your own -->
  </div>

  <script>
    // Harness: every console warning/error is collected. pixi-effects warnings are INSTRUCTIONS — read them.
    //   agent-browser eval "JSON.stringify({ ready: window.__ready, logs: window.__logs })"
    window.__logs = [];
    // A console group's title leads the warnings inside it (PixiJS prints a deprecation as a group titled with its message, the stack inside).
    let group = '';
    const text = (a) => { if (typeof a[0] === 'string' && a[0].includes('%')) { let i = 1; a = [a[0].replace(/%([csdifoO])/g, (_, f) => f === 'c' ? (i++, '') : String(a[i++])), ...a.slice(i)]; } return a.map(x => (x && x.message) || String(x)).join(' '); };
    const gc = console.groupCollapsed.bind(console), ge = console.groupEnd.bind(console);
    console.groupCollapsed = (...a) => { group = text(a); gc(...a); };
    console.groupEnd = () => { group = ''; ge(); };
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + (group ? group + ' — ' : '') + text(a)); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js",
      "pixi-effects/controller": "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/controller.js",
      "pixi-effects/present":  "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/present.js",
      "pixi-effects/3d":         "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/3d.js",
      "@pixi/3d":                "https://cdn.jsdelivr.net/npm/@pixi/3d@0.1.0/dist/pixijs-3d.min.mjs",
      "@pixi/3d/extras":         "https://cdn.jsdelivr.net/npm/@pixi/3d@0.1.0/dist/pixijs-3d-extras.min.mjs",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js" />   <!-- after the import map: the library downloads while the page is parsed -->

  <script type="module">
    import { Movie, particles } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';
    // PixiJS 2D objects built by code (Graphics, Sprites, a thousand pieces): { type: 'scene2d', setup({ root }) { root.addChild(…); return { objects } }, update(t, { objects }) { … } } — no import; recipe scene2d-basics
    // import { register3D } from 'pixi-effects/3d';   // a 3D scene (PixiJS 3D: meshes, glTF models, lights) as a layer: call register3D() before init; recipe scene3d-basics
    // import { Mesh3D, Model3D, CubeGeometry, Material3D, DirectionalLight } from '@pixi/3d';
    // A talk instead of a video: import { deck, Presenter } from 'pixi-effects/present';  (the import map above has "pixi-effects/present")
    //   const d = deck({ transition: { kind: 'slide', duration: 0.6 }, pages: [{ name, duration, stops: [at, ...], notes, layers }] });
    //   composition: d.composition, duration: d.duration; then new Presenter(movie, { canvas }) instead of the Controller. Docs: reference/cheatsheet.md → Presets (the deck lines).

    const W = 1280, H = 720, FPS = 30, DURATION = 20;

    // ── Datos: lluvia anual (mm) en el orden en que se presentan ─────────────
    const DATA = [['Tokio', 1530], ['Londres', 690], ['Bombay', 2200], ['Seattle', 960], ['El Cairo', 25]];
    const SORTED = [...DATA].sort((a, b) => b[1] - a[1]);
    const MAX = SORTED[0], MIN = SORTED[SORTED.length - 1];
    const RATIO = Math.round(MAX[1] / MIN[1]);                       // 2200 / 25 = 88

    // ── Tiempo: 72 bpm → un compás = 3,33 s; 6 compases = 20 s; todo cae en el pulso ──
    const BPM = 72, BEAT = 60 / BPM, BAR = 4 * BEAT;
    const T_TITLE = 0.3, T_GRID = BEAT;
    const T_GROW = 2 * BEAT, EACH = BEAT, GROW = 1.3;               // una barra por pulso
    const T_SORT = 9 * BEAT, SORT = 1.9;                             // se ordenan en el compás 3
    const T_HL = 3 * BAR;                                            // resaltar máximo y mínimo (compás 4)
    const T_END = 4 * BAR;                                           // la frase final (compás 5)

    // ── Estilo ───────────────────────────────────────────────────────────────
    const BG = '#0e1626', GRID = '#24324d', AXIS = '#7d8bab', INK = '#eef3fb', SOFT = '#9fb0cc';
    const BAR_C = '#3f86c9', WET = '#5cc8ff', DRY = '#e4b26a';
    const FONT = 'Inter, "Helvetica Neue", Arial, sans-serif';

    // ── Geometría del gráfico ────────────────────────────────────────────────
    const step = 500, NICE = Math.ceil(MAX[1] / step) * step;        // eje 0–2500
    const BASE = 600, CHART_H = 370, BAR_W = 118, GAP = 74;
    const X0 = (W - (DATA.length * BAR_W + (DATA.length - 1) * GAP)) / 2;
    const X1 = W - X0;
    const slotX = i => X0 + i * (BAR_W + GAP) + BAR_W / 2;
    const hOf = v => CHART_H * v / NICE;

    const layers = [
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', initial: { x: 'GW/2', y: 'GH/2', fill: BG } },
      { type: 'shape', shape: 'rect', width: 'GW', height: 'GH', name: 'vignette',
        initial: { x: 'GW/2', y: 'GH/2', fill: '#000000', alpha: 0.55,
          fillGradient: { type: 'radial', stops: [[0, '#000000', 0], [0.7, '#000000', 0.15], [1, '#000000', 0.7]] } } },
    ];

    // Título (se va antes de la frase final)
    const fadeUp = (dur = 0.8) => [{ at: 0, from: { alpha: 0, y: '+18' }, to: { alpha: 1 }, duration: dur, ease: 'power2.out' }];
    layers.push({ type: 'text', name: 'title', text: 'Lluvia anual en cinco ciudades', at: T_TITLE, duration: T_END - T_TITLE,
      style: { fontFamily: FONT, fontSize: 46, fontWeight: '800', fill: INK },
      initial: { x: W / 2, y: 74, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, from: { y: 92 }, to: { y: 74, alpha: 1 }, duration: 0.9, ease: 'power2.out' },
                  { at: -0.6, to: { alpha: 0 }, duration: 0.6, ease: 'power1.in' }] });
    layers.push({ type: 'text', name: 'subtitle', text: 'milímetros de lluvia al año', at: T_TITLE + 0.4, duration: T_END - T_TITLE - 0.4,
      style: { fontFamily: FONT, fontSize: 24, fill: SOFT },
      initial: { x: W / 2, y: 128, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.9 },
                  { at: -0.6, to: { alpha: 0 }, duration: 0.6, ease: 'power1.in' }] });

    // Rejilla y valores del eje
    for (let v = 0; v <= NICE; v += step) {
      const y = BASE - hOf(v), a = T_GRID + (v / step) * 0.08;
      layers.push({ type: 'shape', shape: 'line', at: a, from: [X0 - 30, y], to: [X1 + 30, y],
        initial: { stroke: v === 0 ? AXIS : GRID, strokeWidth: v === 0 ? 2 : 1, trimEnd: 0 },
        keyframes: [{ at: 0, to: { trimEnd: 1 }, duration: 0.9, ease: 'power2.inOut' }] });
      layers.push({ type: 'text', text: String(v), at: a,
        style: { fontFamily: FONT, fontSize: 18, fill: AXIS },
        initial: { x: X0 - 42, y, anchorX: 1, anchorY: 0.5, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.6 }] });
    }

    // Lluvia que cae solo sobre la columna de Bombay cuando se resalta (detrás de las barras)
    const wetTop = BASE - hOf(MAX[1]);
    // gotas como trazos cortos que nacen sobre la barra y "aterrizan" detrás de ella
    layers.push(...particles({ count: 170, at: T_HL + 0.3, emit: DURATION - T_HL - 0.6, life: 0.36,
      area: { x: slotX(0), y: wetTop - 75, width: BAR_W - 24, height: 50 }, angle: 90, speed: [300, 340],
      template: { type: 'shape', shape: 'rect', width: 2.5, height: 16, cornerRadius: 1, initial: { fill: WET } },
      fade: { in: 0.08, out: 0.05 }, name: 'rain', seed: 11 }));

    // Barras: crecen en el orden dado, luego viajan a su puesto ordenado, luego se resaltan
    DATA.forEach(([city, value], i) => {
      const at = T_GROW + i * EACH;
      const x0 = slotX(i), x1 = slotX(SORTED.findIndex(d => d[0] === city));
      const h = hOf(value);
      const isMax = city === MAX[0], isMin = city === MIN[0];
      const move = { at: T_SORT - at, to: { x: x1 }, duration: SORT, ease: 'power3.inOut' };
      // los rótulos de las barras que se mueven se apagan mientras se cruzan
      const hush = x0 === x1 ? [] : [{ at: T_SORT - at, to: { alpha: 0 }, duration: 0.3 },
                                     { at: T_SORT - at + SORT - 0.45, to: { alpha: 1 }, duration: 0.45 }];
      const hl = isMax ? { fill: WET } : isMin ? { fill: DRY } : { alpha: 0.42 };
      const hlText = isMax || isMin ? { fill: isMax ? WET : DRY } : { alpha: 0.45 };
      layers.push({ type: 'shape', shape: 'rect', name: 'bar-' + city, width: BAR_W, height: 0, cornerRadius: Math.min(8, h / 2),
        anchorY: 1, at, colorSpace: 'oklab',
        initial: { x: x0, y: BASE, fill: BAR_C },
        keyframes: [{ at: 0, to: { height: h }, duration: GROW, ease: 'power3.out' }, move,
                    { at: T_HL - at, to: hl, duration: 0.8, ease: 'power2.inOut' }] });
      layers.push({ type: 'text', name: 'value-' + city, text: '{value}', at,
        style: { fontFamily: FONT, fontSize: 28, fontWeight: '700', fill: INK },
        initial: { x: x0, y: BASE - 12, anchorX: 0.5, anchorY: 1, value: 0 },
        keyframes: [{ at: 0, to: { value, y: BASE - h - 12 }, duration: GROW, ease: 'power3.out' }, move, ...hush,
                    { at: T_HL - at, to: hlText, duration: 0.8, ease: 'power2.inOut' }] });
      layers.push({ type: 'text', name: 'city-' + city, text: city, at,
        style: { fontFamily: FONT, fontSize: 25, fontWeight: '600', fill: SOFT },
        initial: { x: x0, y: BASE + 16, anchorX: 0.5, anchorY: 0, alpha: 0 },
        keyframes: [{ at: 0, to: { alpha: 1 }, duration: 0.5 }, move, ...hush,
                    { at: T_HL - at, to: isMax || isMin ? { fill: INK } : { alpha: 0.5 }, duration: 0.8 }] });
    });

    // La frase final: explica el resultado
    layers.push({ type: 'text', name: 'phrase', at: T_END, duration: DURATION - T_END,
      spans: [{ text: MAX[0], fill: WET }, ` recibe ${RATIO} veces más lluvia que `, { text: MIN[0], fill: DRY }],
      style: { fontFamily: FONT, fontSize: 42, fontWeight: '800', fill: INK },
      initial: { x: W / 2, y: 72, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, from: { y: 92 }, to: { y: 72, alpha: 1 }, duration: 1.0, ease: 'power2.out' }] });
    layers.push({ type: 'text', name: 'phrase-why', at: T_END + 2 * BEAT, duration: DURATION - T_END - 2 * BEAT,
      text: 'El monzón empapa Bombay cada verano; El Cairo está en pleno desierto.',
      style: { fontFamily: FONT, fontSize: 25, fill: SOFT },
      initial: { x: W / 2, y: 130, anchorX: 0.5, anchorY: 0.5, alpha: 0 },
      keyframes: [{ at: 0, to: { alpha: 1 }, duration: 1.0, ease: 'power1.out' }] });

    // Música tranquila (72 bpm, 6 compases = 20 s): piano eléctrico, pad, bajo y una caja de música
    layers.push({ type: 'audio', name: 'music', at: 0, volume: 0.9, music: {
      bpm: BPM, reverb: 0.34, seed: 3, humanize: 0.01,
      tracks: [
        { inst: 'pad',  vol: [[0, 0], [4, 0.5], [20, 0.5], [24, 0.2]], attack: 1.2, release: 2,
          notes: '[f2 c3 a3]:4 | [a2 e3 c4]:4 | [d3 a3 f4]:4 | [bb2 f3 d4]:4 | [g2 d3 bb3]:4 | [f2 c3 a3]:4' },
        { inst: 'keys', vol: [[0, 0.55], [20, 0.55], [24, 0.3]], pan: -0.15, strum: 0.02, tone: 0.45,
          notes: 'Fmaj7:4 | Am7:4 | Dm7:4 | Bbmaj7:4 | Gm7:2 C7sus4:2 | Fmaj7:4' },
        { inst: 'bass', vol: 0.6, tone: 0.35,
          notes: 'f1:3 c2:1 | a1:3 e2:1 | d2:3 a1:1 | bb1:3 f1:1 | g1:2 c2:2 | f1:4' },
        { inst: 'musicbox', vol: [[0, 0], [7, 0], [8, 0.38]], pan: 0.25, ring: 1.6,
          notes: '_:8 | f5:1 a5:1 c6:2 | bb5:1 a5:1 f5:2 | g5:1 a5:1 bb5:1 c6:0.5 g5:0.5 | a5:4' },
      ],
    } });
    // Un toque suave cuando aparece la frase
    layers.push({ type: 'audio', at: T_END, sfx: { preset: 'chime', pitch: -5, brightness: -0.4 }, volume: 1.4 });

    const movie = new Movie();
    window.movie = movie;                         // so a script can seek / screenshot / render
    new Controller(movie, { canvas: document.getElementById('stage') });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 18,        // the moment that stands for the video before it plays (pick your most striking one)
        background: BG,
        loudness: -16,
        // assets: [{ name: 'photo', src: './photo.jpg' }, { name: 'bgm', src: './bgm.mp3' }],
        composition: { layers },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));   // keep this try/catch: it makes failures visible
    }
  </script>
</body>
</html>
