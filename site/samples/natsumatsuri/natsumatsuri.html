<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>夏祭り 8.15</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=block" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/loader.css" />
  <style>
    body { background: #05060f; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .stage { position: relative; width: min(420px, 100%); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    let group = '';
    const text = (a) => { if (typeof a[0] === 'string' && a[0].includes('%')) { let i = 1; a = [a[0].replace(/%([csdifoO])/g, (_, f) => f === 'c' ? (i++, '') : String(a[i++])), ...a.slice(i)]; } return a.map(x => (x && x.message) || String(x)).join(' '); };
    const gc = console.groupCollapsed.bind(console), ge = console.groupEnd.bind(console);
    console.groupCollapsed = (...a) => { group = text(a); gc(...a); };
    console.groupEnd = () => { group = ''; ge(); };
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + (group ? group + ' — ' : '') + text(a)); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js",
      "pixi-effects/controller": "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/controller.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js" />

  <script type="module">
    import { Movie, random } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    // ───────── constants ─────────
    const W = 1080, H = 1920, FPS = 30, DURATION = 15;
    const BEAT = 0.5;                 // 120 bpm: a beat is 0.5 s, a bar 2 s
    const TITLE_AT = 11.0;            // beat 22: the big reveal
    const BRUSH = '"Yuji Syuku", "Hiragino Mincho ProN", serif';
    const RISE = 1.0;                 // seconds a shell climbs before it bursts

    await document.fonts.load(`290px "Yuji Syuku"`, '夏祭り8.15');

    // ───────── fireworks (data) ─────────
    const COLORS = {
      red:    ['#ff4a3d', '#ffd0b0'],
      gold:   ['#ffc44d', '#fff1c4'],
      cyan:   ['#4fe3ff', '#e6fbff'],
      green:  ['#6dff8a', '#eaffe9'],
      pink:   ['#ff6fb5', '#ffffff'],
      blue:   ['#5b7bff', '#dfe6ff'],
      purple: ['#b77bff', '#f3e6ff'],
    };
    // burst time (on the beat), position, kind, colour, size
    const SHOWS = [
      [1.5,  320, 1020, 'peony',   'red',    1.0],
      [2.5,  770, 860, 'chrys',   'gold',   1.05],
      [3.5,  540, 1100, 'ring',    'cyan',   0.9],
      [4.0,  240, 820, 'peony',   'green',  0.85],
      [5.0,  800, 1070, 'twotone', 'pink',   1.0],
      [6.0,  430, 880, 'willow',  'gold',   1.1],
      [6.5,  730, 1180, 'peony',   'blue',   0.8],
      [7.5,  290, 1090, 'chrys',   'purple', 0.95],
      [8.0,  790, 820, 'peony',   'red',    0.9],
      [8.5,  540, 990, 'ring',    'gold',   0.9],
      [9.0,  220, 900, 'peony',   'cyan',   0.85],
      [9.5,  860, 950, 'twotone', 'pink',   0.85],
      [10.0, 420, 770, 'chrys',   'green',  0.9],
      [10.5, 660, 890, 'peony',   'purple', 0.9],
      [TITLE_AT, 540, 660, 'willow', 'gold', 1.2],     // the big one behind the title
      [TITLE_AT, 190, 640, 'peony',  'red',  0.85],
      [TITLE_AT, 890, 640, 'peony',  'red',  0.85],
      [12.5, 250, 680, 'chrys',   'cyan',   0.8],
      [13.5, 830, 660, 'twotone', 'pink',   0.85],
      [14.0, 540, 620, 'peony',   'gold',   0.8],
    ];
    const KIND = {
      peony:   { n: 80,  v: 822, k: 2.0, g: 70,  life: 1.9, trail: 0.10, crackle: false },
      chrys:   { n: 95,  v: 875, k: 2.1, g: 80,  life: 2.2, trail: 0.30, crackle: true  },
      ring:    { n: 64,  v: 752, k: 2.0, g: 50,  life: 1.7, trail: 0.12, crackle: false },
      twotone: { n: 90,  v: 822, k: 2.0, g: 70,  life: 2.0, trail: 0.14, crackle: false },
      willow:  { n: 120, v: 752, k: 1.7, g: 150, life: 3.4, trail: 0.55, crackle: true  },
    };
    const rng = random(815);
    const FIREWORKS = SHOWS.map(([t, x, y, kind, col, size]) => {
      const K = KIND[kind];
      const n = Math.round(K.n * 1.4 * Math.min(size, 1.3));
      const parts = Array.from({ length: n }, (_, i) => {
        let a = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.12, sp;
        if (kind === 'ring') {           // a flat ring, tilted
          sp = 1; const tilt = 0.45;
          return { dx: Math.cos(a), dy: Math.sin(a) * tilt, sp: 0.95 + rng() * 0.1, inner: false, seed: rng() };
        }
        sp = 0.55 + Math.sqrt(rng()) * 0.5;   // a filled sphere seen flat
        return { dx: Math.cos(a), dy: Math.sin(a), sp, inner: kind === 'twotone' && i % 2 === 0, seed: rng() };
      });
      const x0 = x + (rng() - 0.5) * 120;
      return { t, x, y, x0, kind, K, size, col: COLORS[col], parts, wob: rng() * 10 };
    });
    const posAt = (f, p, dt) => {
      const { v, k, g } = f.K, s = v * f.size * p.sp;
      const r = s * (1 - Math.exp(-k * dt)) / k;
      return [f.x + p.dx * r, f.y + p.dy * r + 0.5 * g * dt * dt];
    };

    function drawFireworks(ctx, t) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (const f of FIREWORKS) {
        const launch = f.t - RISE;
        // the climbing shell
        if (t >= launch && t < f.t) {
          const u = (t - launch) / RISE, e = 1 - (1 - u) * (1 - u);
          for (let j = 0; j < 10; j++) {
            const uu = Math.max(0, u - j * 0.018), ee = 1 - (1 - uu) * (1 - uu);
            const px = f.x0 + (f.x - f.x0) * ee + Math.sin((uu * 18) + f.wob) * 4;
            const py = H + 40 + (f.y - H - 40) * ee;
            ctx.globalAlpha = (1 - j / 10) * 0.9;
            ctx.fillStyle = j === 0 ? '#fff6dc' : '#ffb35a';
            ctx.beginPath(); ctx.arc(px, py, j === 0 ? 5 : 3.2 - j * 0.2, 0, Math.PI * 2); ctx.fill();
          }
        }
        const dt = t - f.t;
        if (dt < 0 || dt > f.K.life + 0.3) continue;
        // sky glow + flash
        const glow = Math.exp(-dt * 2.6) * 0.32 * f.size;
        if (glow > 0.01) {
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 760 * f.size);
          g.addColorStop(0, f.col[0]); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = glow; ctx.fillStyle = g;
          ctx.fillRect(f.x - 800 * f.size, f.y - 800 * f.size, 1600 * f.size, 1600 * f.size);
        }
        if (dt < 0.16) {
          const r = 40 + dt * 900;
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
          g.addColorStop(0, '#ffffff'); g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalAlpha = 1 - dt / 0.16; ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
        }
        // the stars
        const life = f.K.life;
        for (const p of f.parts) {
          const myLife = life * (0.8 + p.seed * 0.3);
          if (dt > myLife) continue;
          const fade = Math.pow(1 - dt / myLife, 1.4);
          let a = fade;
          if (f.K.crackle && dt > myLife * 0.55) a *= (Math.sin(t * 60 + p.seed * 50) > 0 ? 1 : 0.25);
          const isWillow = f.kind === 'willow';
          const color = p.inner ? f.col[1] : (isWillow && dt > 1.2 ? '#ff9a3c' : f.col[0]);
          const steps = 6, tr = Math.min(f.K.trail, dt);
          ctx.strokeStyle = color; ctx.lineWidth = (isWillow ? 4.5 : 5.5) * f.size;
          ctx.globalAlpha = Math.min(1, a * 1.0);
          ctx.beginPath();
          for (let s = 0; s <= steps; s++) {
            const [px, py] = posAt(f, p, Math.max(0, dt - tr * s / steps));
            s ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.stroke();
          const [hx, hy] = posAt(f, p, dt);
          ctx.globalAlpha = a; ctx.fillStyle = dt < 0.5 ? '#ffffff' : f.col[1];
          ctx.beginPath(); ctx.arc(hx, hy, 5 * f.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }

    // ───────── stars ─────────
    const srng = random(7);
    const STARS = Array.from({ length: 140 }, () => ({ x: srng() * W, y: srng() * 1300, r: 0.8 + srng() * 2, ph: srng() * 6.28, sp: 1 + srng() * 2 }));
    function drawStars(ctx, t) {
      ctx.fillStyle = '#ffffff';
      for (const s of STARS) {
        ctx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ───────── town silhouette with a yagura ─────────
    function townPath() {
      const y0 = 1760; let d = `M 0 ${H} L 0 ${y0}`;
      const roofs = [[0, 1760, 150], [150, 1790, 130], [280, 1740, 170], [690, 1750, 160], [850, 1785, 120], [970, 1755, 110]];
      for (const [x, y, w] of roofs) d += ` L ${x} ${y + 20} L ${x + w * 0.5} ${y - 30} L ${x + w} ${y + 20}`;
      d += ` L ${W} ${H} Z`;
      // the yagura (festival tower) in the middle
      d += ` M 450 ${H} L 470 1650 L 610 1650 L 630 ${H} Z M 430 1655 L 540 1590 L 650 1655 Z`;
      return d;
    }

    // ───────── lanterns ─────────
    const rope = (x0, y0, x1, y1, sag) => (u) => [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u + sag * 4 * u * (1 - u)];
    const TOP = rope(-40, 150, W + 40, 170, 140);
    const LOW = rope(-40, 1520, W + 40, 1500, 110);
    const ROPES = [
      { fn: TOP, d: 'M -40 150 Q 540 440 1120 170', count: 6, scale: 1.0 },
      { fn: LOW, d: 'M -40 1520 Q 540 1740 1120 1500', count: 7, scale: 0.8 },
    ];

    function lantern(name, x, y, s, i) {
      const LW = 180, LH = 330, cx = LW / 2, by = 150;
      const ribs = [-66, -44, -22, 0, 22, 44, 66].map(dy => ({
        type: 'shape', shape: 'ellipse', radiusX: 64 * Math.sqrt(1 - (dy / 92) ** 2), radiusY: 5,
        initial: { x: cx, y: by + dy, fillAlpha: 0, stroke: '#5a0a0a', strokeWidth: 2, strokeAlpha: 0.35 },
      }));
      const amp = 4 + (i % 3) * 1.5, period = 1.6 + (i % 4) * 0.25;
      return {
        type: 'composition', name, width: LW, height: LH,
        initial: { x, y, pivotX: cx, pivotY: 0, scale: s },
        keyframes: [
          { at: 0, from: { rotation: -amp }, to: { rotation: amp }, duration: period, ease: 'sine.inOut',
            repeat: Math.ceil(DURATION / period) + 1, yoyo: true },
        ],
        layers: [
          { type: 'shape', shape: 'line', from: [cx, 0], to: [cx, 50], initial: { stroke: '#1b1210', strokeWidth: 3 } },
          { type: 'shape', shape: 'ellipse', radiusX: 70, radiusY: 94,
            fillGradient: { type: 'radial', center: [0.45, 0.42], radius: 0.6, stops: [[0, '#fff0b8'], [0.35, '#ff8a3a'], [0.8, '#d62a1e'], [1, '#7a0d12']] },
            initial: { x: cx, y: by } },
          ...ribs,
          { type: 'shape', shape: 'rect', width: 86, height: 18, cornerRadius: 4, initial: { x: cx, y: 58, fill: '#1c1412' } },
          { type: 'shape', shape: 'rect', width: 86, height: 18, cornerRadius: 4, initial: { x: cx, y: by + 92, fill: '#1c1412' } },
          { type: 'text', text: '祭', style: { fontFamily: BRUSH, fontSize: 78, fill: '#2a0505' },
            initial: { x: cx, y: by + 4, anchorX: 0.5, anchorY: 0.5, alpha: 0.85 } },
          { type: 'shape', shape: 'line', from: [cx, by + 101], to: [cx, by + 150], initial: { stroke: '#d62a1e', strokeWidth: 6 } },
          { type: 'shape', shape: 'rect', width: 16, height: 40, cornerRadius: 3, initial: { x: cx, y: by + 168, fill: '#d62a1e' } },
        ],
      };
    }
    const lanternLayers = [], glowLayers = [];
    ROPES.forEach((r, ri) => {
      for (let i = 0; i < r.count; i++) {
        const u = (i + 0.5) / r.count;
        const [x, y] = r.fn(u);
        const idx = ri * 10 + i;
        glowLayers.push({
          type: 'shape', shape: 'circle', name: `glow${idx}`, radius: 190 * r.scale, blendMode: 'add',
          fillGradient: { type: 'radial', stops: [[0, 'rgba(255,150,70,0.55)'], [0.45, 'rgba(255,110,50,0.18)'], [1, 'rgba(255,90,40,0)']] },
          initial: { x, y: y + 150 * r.scale, alpha: 0.9 },
          keyframes: [{ at: 0, from: { alpha: 0.75 }, to: { alpha: 1 }, duration: 0.7 + (i % 3) * 0.2, ease: 'sine.inOut', repeat: 24, yoyo: true }],
        });
        lanternLayers.push(lantern(`lantern${idx}`, x, y, r.scale, idx));
      }
    });

    // ───────── title ─────────
    const TITLE_Y = 1010, DATE_Y = 1300;
    const titleStyle = {
      fontFamily: BRUSH, fontSize: 300, fill: '#fff6e2',
      stroke: { color: '#b3121b', width: 14, join: 'round' },
      dropShadow: { color: '#ff5a1f', blur: 34, distance: 0, alpha: 0.95 }, padding: 90,
    };
    const titleChars = [...'夏祭り'].map((ch, i) => ({
      type: 'text', name: `title${i}`, text: ch, at: TITLE_AT + i * 0.25, style: titleStyle,
      initial: { x: 540 + (i - 1) * 310, y: TITLE_Y, anchorX: 0.5, anchorY: 0.5 },
      keyframes: [
        { at: 0, from: { scale: 2.6, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.32, ease: 'expo.out' },
        { at: 0.32, to: { scale: 1.06 }, duration: 0.12, ease: 'power2.out', yoyo: true, repeat: 1 },
      ],
    }));
    const dateLayer = {
      type: 'text', name: 'date', text: '8.15', at: TITLE_AT + 1.0,
      style: { fontFamily: BRUSH, fontSize: 280, fill: '#ffd25e', letterSpacing: 6,
        stroke: { color: '#7a1a00', width: 12, join: 'round' },
        dropShadow: { color: '#ffb02e', blur: 30, distance: 0, alpha: 0.9 }, padding: 90 },
      initial: { x: 540, y: DATE_Y, anchorX: 0.5, anchorY: 0.5 },
      keyframes: [
        { at: 0, from: { scale: 0.4, alpha: 0, y: DATE_Y + 80 }, to: { scale: 1, alpha: 1, y: DATE_Y }, duration: 0.6, ease: 'back.out(2.2)' },
      ],
    };
    // a soft dark band so the title reads over the bursts
    const titleBacking = {
      type: 'shape', shape: 'rect', name: 'backing', width: W, height: 760, at: TITLE_AT - 0.2,
      fillGradient: { angle: 180, stops: [[0, 'rgba(5,6,20,0)'], [0.3, 'rgba(5,6,20,0.55)'], [0.7, 'rgba(5,6,20,0.55)'], [1, 'rgba(5,6,20,0)']] },
      initial: { x: 540, y: 1150 },
      keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 0.6 }],
    };

    // ───────── sound ─────────
    // taiko groove (tom = "don", rim = "ka"), a fue line in the yo scale, a soft pad
    const music = {
      bpm: 120, reverb: 0.3, drumVol: 1.0, seed: 3,
      tracks: [
        { inst: 'lead', vol: 0.5, reverb: 0.5, tone: 0.55, legato: 0.95,
          notes: '_:4 | a4:1 b4:1 d5:2 | e5:1 d5:0.5 b4:0.5 a4:2 | d5:1 e5:1 g5:1 e5:1 | d5:3 b4:1 | _:2 a5:2 | g5:1 e5:1 d5:2 | d5:2' },
        { inst: 'pad', vol: [[0, 0.25], [20, 0.4], [22, 0.6]], attack: 0.6, release: 1.2,
          notes: 'Dsus2:4 Dsus2:4 G@3:4 Dsus2:4 Em7:4 A7sus4:2 _:2 Dsus2:6 Dsus2:2' },
        { inst: 'sub', vol: 0.55, notes: 'd2:4 d2:4 g1:4 d2:4 e2:4 a1:2 _:2 d2:8' },
      ],
      drums: [
        { from: 0, to: 20, tom: 'x...x.......x.x.', kick: 'x...x.......x...', rim: '........x.x.x...', shaker: '..x...x...x...x.' },
        { from: 20, to: 22, tom: 'xoxoxoxoxxxxxxxx', kick: 'x.......x...x.x.' },          // the roll into the title
        { from: 22, to: 23, crash: 'x', kick: 'x', tom: 'x' },
        { from: 24, to: 30, tom: 'x.......x...x...', kick: 'x.......x.......', rim: '....x.......x.x.' },
      ],
    };
    const don = (at, vol = 1, big = false) => ({
      type: 'audio', name: `don${at}`, at, volume: vol, duration: big ? 2.0 : 0.9,
      sfx: { voices: [
        { wave: 'sine', freq: big ? [95, 38] : [120, 52], envelope: 'fall' },
        { wave: 'triangle', freq: big ? [190, 70] : [230, 90], envelope: 'fall' },
        { wave: 'noise', filter: { type: 'lowpass', freq: [900, 120] }, envelope: 'fall' },
      ] },
    });
    // a crackle for the bursts (a firework pop, quieter than the drum)
    const crackle = (at, vol) => ({ type: 'audio', name: `pop${at}`, at, volume: vol, sfx: { preset: 'pop', pitch: -10, brightness: -0.3, seed: Math.round(at * 10) } });
    const burstTimes = [...new Set(SHOWS.map(s => s[0]))];
    const sound = [
      { type: 'audio', name: 'bgm', at: 0, volume: 0.9, music },
      ...burstTimes.map(t => don(t, t === TITLE_AT ? 1.6 : 0.8, t === TITLE_AT)),
      ...burstTimes.map(t => crackle(t + 0.04, 0.5)),
      { type: 'audio', name: 'riser', at: TITLE_AT - 1.0, duration: 1.0, volume: 0.45, sfx: { preset: 'riser', brightness: -0.2 } },
      don(TITLE_AT + 1.0, 1.2, true),                         // DON as 8.15 lands
    ];

    // ───────── composition ─────────
    const layers = [
      { type: 'shape', shape: 'rect', name: 'sky', width: W, height: H,
        fillGradient: { angle: 180, stops: [[0, '#03040d'], [0.45, '#0b0d2a'], [0.8, '#26164a'], [1, '#4a1d3e']] },
        initial: { x: W / 2, y: H / 2 } },
      { type: 'canvas', name: 'stars', width: W, height: H, initial: { x: 0, y: 0 }, draw: (ctx, t) => drawStars(ctx, t) },
      { type: 'canvas', name: 'fireworks', width: W, height: H, initial: { x: 0, y: 0 }, draw: (ctx, t) => drawFireworks(ctx, t) },
      { type: 'shape', shape: 'path', name: 'town', d: townPath(), initial: { fill: '#07060c' } },
      { type: 'shape', shape: 'rect', name: 'haze', width: W, height: 420,
        fillGradient: { angle: 180, stops: [[0, 'rgba(255,120,60,0)'], [1, 'rgba(255,120,60,0.22)']] },
        initial: { x: W / 2, y: H - 210 }, blendMode: 'add' },
      titleBacking,
      ...glowLayers,
      ...ROPES.map((r, i) => ({ type: 'shape', shape: 'path', name: `rope${i}`, d: r.d, initial: { fillAlpha: 0, stroke: '#140c0a', strokeWidth: 4 } })),
      ...lanternLayers,
      ...titleChars,
      dateLayer,
      ...sound,
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage'), theme: { accent: '#ff5a1f' } });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 13.6,
        background: '#03040d',
        loudness: -16,
        composition: { layers },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
