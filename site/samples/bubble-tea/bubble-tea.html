<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云朵茶屋 · 今日开业</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@700&display=block" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/loader.css" />
  <style>
    body { background: #2a1d17; margin: 0; padding: 16px; }
    .stage { position: relative; width: min(420px, 100%); margin: 0 auto; }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div class="pe-loader" data-label="LOADING"></div>
  </div>

  <script>
    window.__logs = [];
    let group = '';
    const text = (a) => { if (typeof a[0] === 'string' && a[0].includes('%')) { let i = 1; a = [a[0].replace(/%([csdifoO])/g, (_, f) => f === 'c' ? (i++, '') : String(a[i++])), ...a.slice(i)]; } return a.map(x => (x && x.message) || String(x)).join(' '); };
    const gc = console.groupCollapsed.bind(console), ge = console.groupEnd.bind(console);
    console.groupCollapsed = (...a) => { group = text(a); gc(...a); };
    console.groupEnd = () => { group = ''; ge(); };
    for (const k of ['warn', 'error']) {
      const orig = console[k].bind(console);
      console[k] = (...a) => { window.__logs.push(k + ': ' + (group ? group + ' — ' : '') + text(a)); orig(...a); };
    }
    window.addEventListener('error', e => window.__logs.push('uncaught: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.__logs.push('unhandled: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script type="importmap">
  {
    "imports": {
      "pixi.js":                 "https://esm.sh/pixi.js@8.23.0?bundle-deps",
      "mediabunny":              "https://esm.sh/mediabunny",
      "pixi-effects":            "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js",
      "pixi-effects/controller": "https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/controller.js",
      "pixi-filters":            "https://esm.sh/pixi-filters@6.1.5?external=pixi.js"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pixi-effects@1.0.0/dist/index.js" />

  <script type="module">
    import { Movie, animateText, ease, random } from 'pixi-effects';
    import { Controller } from 'pixi-effects/controller';

    const W = 1080, H = 1920, FPS = 30, DURATION = 12;
    const BPM = 120;                       // one bar = 2 s: every cue sits on a bar or a beat
    const T_PEARLS = 3.0;                  // pearls start to float (bar 2.5)
    const T_LIFT = 7.9;                    // cup rises to make room for the title
    const T_TITLE = 8.5;                   // 云朵茶屋
    const T_BADGE = 10.0;                  // 今日开业 (bar 6)

    const TITLE_FONT = '"ZCOOL KuaiLe", "Noto Sans SC", sans-serif';
    const BADGE_FONT = '"Noto Sans SC", sans-serif';
    await Promise.all([
      document.fonts.load('180px "ZCOOL KuaiLe"', '云朵茶屋'),
      document.fonts.load('700 64px "Noto Sans SC"', '今日开业'),
    ]);

    const clamp01 = (x) => Math.max(0, Math.min(1, x));
    const inOut = ease('power2.inOut'), outBack = ease('back.out'), out3 = ease('power3.out');

    // Where the cup is at movie time T (shared by every canvas layer, so the shadow, glow and cup agree).
    function cupPose(T) {
      const intro = out3(clamp01(T / 1.6));
      const lift = inOut(clamp01((T - T_LIFT) / 1.3));
      return {
        x: W / 2,
        y: 980 - 30 * (1 - intro) - 190 * lift,
        s: (0.9 + 0.1 * intro) * (1 - 0.2 * lift),
        rot: 0.35 + 0.52 * T + 0.08 * Math.sin(T * 0.7),   // slow turn, a little more than one revolution
      };
    }

    // ── the cup, in its own design coordinates (760 × 1240, centre 380, 620) ──
    const CX = 380, RIM = 380, BOT = 1120, TOP_R = 236, BOT_R = 178, TEA_TOP = 452;
    const R = (y) => TOP_R + (BOT_R - TOP_R) * (y - RIM) / (BOT - RIM);

    const rnd = random(7);
    const PEARLS = Array.from({ length: 46 }, (_, i) => {
      const stays = i % 4 === 3;                                    // a quarter stays on the bottom
      return {
        th: rnd() * Math.PI * 2,
        rho: Math.sqrt(rnd()) * 0.86,
        y0: BOT - 26 - rnd() * 70,
        y1: stays ? BOT - 26 - rnd() * 70 : TEA_TOP + 90 + rnd() * (BOT - TEA_TOP - 260),
        start: T_PEARLS + rnd() * 3.2,
        rise: 1.8 + rnd() * 0.9,
        phase: rnd() * Math.PI * 2,
        r: 19 + rnd() * 5,
        stays,
      };
    });
    const BUBBLES = Array.from({ length: 26 }, () => ({ th: rnd() * Math.PI * 2, rho: rnd() * 0.9, off: rnd(), speed: 0.08 + rnd() * 0.08, r: 2 + rnd() * 4 }));
    const STREAKS = Array.from({ length: 9 }, (_, k) => ({ th: k * Math.PI * 2 / 9 + rnd() * 0.3, wob: rnd() * 6, len: 0.45 + rnd() * 0.4 }));

    function cupPath(ctx, top, inset = 0) {
      const rt = R(top) - inset, rb = BOT_R - inset;
      ctx.beginPath();
      ctx.moveTo(CX - rt, top);
      ctx.lineTo(CX + rt, top);
      ctx.lineTo(CX + rb, BOT - 30);
      ctx.quadraticCurveTo(CX + rb, BOT - inset, CX + rb - 40, BOT - inset);
      ctx.lineTo(CX - rb + 40, BOT - inset);
      ctx.quadraticCurveTo(CX - rb, BOT - inset, CX - rb, BOT - 30);
      ctx.closePath();
    }

    function cloudShape(ctx, x, y, s) {
      ctx.beginPath();
      ctx.arc(x - 52 * s, y + 6 * s, 34 * s, 0, Math.PI * 2);
      ctx.arc(x - 12 * s, y - 22 * s, 46 * s, 0, Math.PI * 2);
      ctx.arc(x + 38 * s, y - 8 * s, 38 * s, 0, Math.PI * 2);
      ctx.arc(x + 70 * s, y + 14 * s, 26 * s, 0, Math.PI * 2);
      ctx.rect(x - 52 * s, y + 4 * s, 122 * s, 36 * s);
      ctx.fill();
    }

    function drawPearl(ctx, x, y, r, depth) {
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
      g.addColorStop(0, '#6b4130'); g.addColorStop(0.55, '#3a2117'); g.addColorStop(1, '#1d0f0a');
      ctx.globalAlpha = 0.72 + 0.28 * depth;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,225,0.75)';
      ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.28, r * 0.17, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawCup(ctx, T) {
      const p = cupPose(T);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.scale(p.s, p.s); ctx.translate(-CX, -620);
      const rot = p.rot;

      // contact shadow on the table
      const sh = ctx.createRadialGradient(CX, BOT + 18, 10, CX, BOT + 18, 280);
      sh.addColorStop(0, 'rgba(120,70,40,0.38)'); sh.addColorStop(1, 'rgba(120,70,40,0)');
      ctx.fillStyle = sh;
      ctx.save(); ctx.translate(CX, BOT + 18); ctx.scale(1, 0.16); ctx.translate(-CX, -(BOT + 18));
      ctx.beginPath(); ctx.arc(CX, BOT + 18, 280, 0, Math.PI * 2); ctx.fill(); ctx.restore();

      // straw (drawn first: the tea and the lid cover its lower part)
      const sAng = 0.9 + rot;
      const sx = CX + 0.32 * TOP_R * Math.sin(sAng), sTop = 40, sBot = 760;
      ctx.save();
      ctx.translate(sx, sBot); ctx.rotate(0.12);
      const sg = ctx.createLinearGradient(-24, 0, 24, 0);
      sg.addColorStop(0, '#d9798f'); sg.addColorStop(0.3, '#f7b3c2'); sg.addColorStop(0.55, '#ffd9e1'); sg.addColorStop(1, '#c9677e');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.lineTo(24, -(sBot - sTop) + 14); ctx.lineTo(-24, -(sBot - sTop) - 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b75c72';
      ctx.beginPath(); ctx.ellipse(0, -(sBot - sTop), 24, 15, -0.53, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // the tea, clipped to the inside of the cup
      ctx.save();
      cupPath(ctx, TEA_TOP, 10); ctx.clip();
      const tg = ctx.createLinearGradient(0, TEA_TOP, 0, BOT);
      tg.addColorStop(0, '#efd3b0'); tg.addColorStop(0.55, '#d9a77a'); tg.addColorStop(1, '#b97a4e');
      ctx.globalAlpha = 0.95; ctx.fillStyle = tg; ctx.fillRect(0, TEA_TOP, 760, BOT - TEA_TOP); ctx.globalAlpha = 1;

      // brown-sugar streaks on the inner wall: they turn with the cup and show the rotation
      for (const s of STREAKS) {
        const yEnd = TEA_TOP + (BOT - TEA_TOP) * s.len;
        for (let y = TEA_TOP + 4; y < yEnd; y += 6) {
          const a = s.th + rot + 0.22 * Math.sin(y * 0.011 + s.wob);
          const c = Math.cos(a);
          if (c <= 0.02) continue;
          const fade = 1 - (y - TEA_TOP) / (yEnd - TEA_TOP);
          ctx.fillStyle = `rgba(122,62,28,${(0.42 * c * (0.35 + 0.65 * fade)).toFixed(3)})`;
          const x = CX + (R(y) - 12) * Math.sin(a);
          const wdt = (8 + 14 * fade) * c;
          ctx.fillRect(x - wdt / 2, y, wdt, 7);
        }
      }

      // pearls: rest on the bottom, then float up with a little overshoot and keep bobbing
      const pts = PEARLS.map((q) => {
        const u = clamp01((T - q.start) / q.rise);
        const k = q.stays ? 0 : outBack(u);
        const bob = q.stays ? 0 : u * (9 * Math.sin(T * 1.4 + q.phase));
        const y = q.y0 + (q.y1 - q.y0) * k + bob;
        const a = q.th + rot + (q.stays ? 0 : 0.35 * u * Math.sin(T * 0.5 + q.phase));
        const rr = Math.max(0, (R(y) - 12 - q.r) * q.rho);
        return { x: CX + rr * Math.sin(a), y, z: q.rho * Math.cos(a), r: q.r };
      }).sort((a, b) => a.z - b.z);
      for (const q of pts) drawPearl(ctx, q.x, q.y, q.r * (1 + 0.1 * q.z), clamp01((q.z + 1) / 2));

      // tiny air bubbles
      for (const b of BUBBLES) {
        const prog = (b.off + T * b.speed) % 1;
        const y = BOT - 30 - prog * (BOT - TEA_TOP - 50);
        const a = b.th + rot;
        ctx.fillStyle = `rgba(255,248,238,${(0.35 * Math.sin(prog * Math.PI)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(CX + (R(y) - 20) * b.rho * Math.sin(a), y, b.r, 0, Math.PI * 2); ctx.fill();
      }

      // cylinder shading: darker edges, the soft key light from the upper left
      const rr = R(TEA_TOP);
      const cyl = ctx.createLinearGradient(CX - rr, 0, CX + rr, 0);
      cyl.addColorStop(0, 'rgba(90,45,20,0.45)'); cyl.addColorStop(0.18, 'rgba(255,245,230,0.10)');
      cyl.addColorStop(0.3, 'rgba(255,250,240,0.22)'); cyl.addColorStop(0.62, 'rgba(0,0,0,0)');
      cyl.addColorStop(1, 'rgba(90,45,20,0.5)');
      ctx.fillStyle = cyl; ctx.fillRect(0, TEA_TOP - 40, 760, BOT);
      ctx.restore();

      // the tea's surface, with milk foam
      const fg = ctx.createLinearGradient(CX - rr, 0, CX + rr, 0);
      fg.addColorStop(0, '#e2bf98'); fg.addColorStop(0.35, '#fbebd6'); fg.addColorStop(1, '#d9b18a');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.ellipse(CX, TEA_TOP, rr - 10, 26, 0, 0, Math.PI * 2); ctx.fill();

      // printed label on the cup: a cloud with 云朵, wrapping round the cylinder
      for (const off of [0, Math.PI]) {
        const a = off + rot, c = Math.cos(a);
        if (c < 0.06) continue;
        const ly = 800, lx = CX + (R(ly) + 2) * Math.sin(a);
        ctx.save();
        ctx.translate(lx, ly); ctx.scale(c, 1);
        ctx.globalAlpha = 0.25 + 0.75 * c;
        ctx.fillStyle = '#fffaf3';
        cloudShape(ctx, 0, 0, 1.25);
        ctx.fillStyle = '#8a5638';
        ctx.font = `64px ${TITLE_FONT}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('云朵', 6, 14);
        ctx.restore();
      }

      // clear plastic wall: faint body above the tea, rim, highlights fixed to the light
      ctx.save();
      cupPath(ctx, RIM); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, RIM, 760, TEA_TOP - RIM + 10);
      const hl = (x0, wd, al) => {
        const g = ctx.createLinearGradient(0, RIM, 0, BOT);
        g.addColorStop(0, `rgba(255,255,255,${al})`); g.addColorStop(0.7, `rgba(255,255,255,${al * 0.5})`); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(CX + x0 * TOP_R, RIM); ctx.lineTo(CX + x0 * TOP_R + wd, RIM);
        ctx.lineTo(CX + x0 * BOT_R + wd * 0.8, BOT); ctx.lineTo(CX + x0 * BOT_R, BOT); ctx.closePath(); ctx.fill();
      };
      hl(-0.72, 26, 0.55); hl(-0.58, 8, 0.4); hl(0.74, 12, 0.28);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
      cupPath(ctx, RIM); ctx.stroke();

      // the dome lid
      ctx.save();
      ctx.beginPath(); ctx.ellipse(CX, RIM, TOP_R - 6, 120, 0, Math.PI, 0); ctx.closePath();
      const lg = ctx.createLinearGradient(CX - TOP_R, 0, CX + TOP_R, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0.20)'); lg.addColorStop(0.3, 'rgba(255,255,255,0.45)'); lg.addColorStop(1, 'rgba(255,255,255,0.12)');
      ctx.fillStyle = lg; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(CX, RIM, TOP_R + 10, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(214,170,140,0.6)'; ctx.lineWidth = 2; ctx.stroke();

      // the straw above the lid (drawn again so it sits in front of the dome)
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, 760, RIM - 60 - 40 * Math.abs(Math.sin(sAng))); ctx.clip();
      ctx.translate(sx, sBot); ctx.rotate(0.12);
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.lineTo(24, -(sBot - sTop) + 14); ctx.lineTo(-24, -(sBot - sTop) - 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b75c72';
      ctx.beginPath(); ctx.ellipse(0, -(sBot - sTop), 24, 15, -0.53, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // ── soft-lit backdrop: warm cream, a slow key light, drifting bokeh ──
    const BOKEH = Array.from({ length: 16 }, () => ({ x: rnd() * W, y: rnd() * H * 0.8, r: 40 + rnd() * 90, sp: 6 + rnd() * 14, ph: rnd() * 6, hue: rnd() }));
    function drawBackdrop(ctx, T) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#fdf1e2'); bg.addColorStop(0.6, '#f8e2cd'); bg.addColorStop(1, '#efcdb2');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      const lx = 330 + 60 * Math.sin(T * 0.35), ly = 640 + 40 * Math.cos(T * 0.3);
      const key = ctx.createRadialGradient(lx, ly, 0, lx, ly, 900);
      key.addColorStop(0, 'rgba(255,253,245,0.95)'); key.addColorStop(0.45, 'rgba(255,246,230,0.45)'); key.addColorStop(1, 'rgba(255,240,220,0)');
      ctx.fillStyle = key; ctx.fillRect(0, 0, W, H);
      for (const b of BOKEH) {
        const x = (b.x + T * b.sp) % (W + 200) - 100, y = b.y - T * b.sp * 0.6;
        const a = 0.10 + 0.08 * Math.sin(T * 0.8 + b.ph);
        const col = b.hue < 0.5 ? '255,214,190' : '255,236,200';
        const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
        g.addColorStop(0, `rgba(${col},${a.toFixed(3)})`); g.addColorStop(0.7, `rgba(${col},${(a * 0.7).toFixed(3)})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
      }
      // a halo behind the cup
      const p = cupPose(T);
      const halo = ctx.createRadialGradient(p.x, p.y - 80 * p.s, 0, p.x, p.y - 80 * p.s, 560 * p.s);
      halo.addColorStop(0, 'rgba(255,255,250,0.85)'); halo.addColorStop(1, 'rgba(255,255,250,0)');
      ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    }

    // ── clouds that drift in for the name, and twinkles ──
    const CLOUDS = [
      { x: 95, y: 1215, s: 1.1, from: -360, d: 0.0 },
      { x: 965, y: 1180, s: 1.0, from: 380, d: 0.15 },
      { x: 110, y: 1740, s: 1.1, from: -320, d: 0.3 },
      { x: 960, y: 1770, s: 1.6, from: 420, d: 0.1 },
      { x: 860, y: 420, s: 0.9, from: 300, d: 0.25 },
      { x: 190, y: 330, s: 0.8, from: -260, d: 0.35 },
    ];
    const STARS = Array.from({ length: 14 }, () => ({ x: 120 + rnd() * 840, y: 1220 + rnd() * 560, ph: rnd() * 6, s: 10 + rnd() * 14, at: T_TITLE + 0.3 + rnd() * 2.6 }));
    function drawClouds(ctx, T) {
      for (const c of CLOUDS) {
        const u = out3(clamp01((T - T_LIFT - c.d) / 1.6));
        if (u <= 0) continue;
        const x = c.x + c.from * (1 - u) + 10 * Math.sin(T * 0.6 + c.s), y = c.y + 6 * Math.sin(T * 0.8 + c.x);
        ctx.globalAlpha = u * 0.95;
        ctx.fillStyle = 'rgba(214,170,140,0.25)'; cloudShape(ctx, x + 6, y + 10, c.s);
        ctx.fillStyle = '#ffffff'; cloudShape(ctx, x, y, c.s);
      }
      ctx.globalAlpha = 1;
      for (const s of STARS) {
        const k = clamp01((T - s.at) / 0.4);
        if (k <= 0) continue;
        const tw = k * (0.55 + 0.45 * Math.sin(T * 5 + s.ph));
        const r = s.s * tw;
        ctx.fillStyle = `rgba(255,214,150,${(0.9 * tw).toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - r); ctx.quadraticCurveTo(s.x, s.y, s.x + r, s.y); ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + r);
        ctx.quadraticCurveTo(s.x, s.y, s.x - r, s.y); ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - r); ctx.fill();
      }
    }

    // ── a soft light sweep (screen blend): once over the cup at the start, once over the name ──
    function drawSweep(ctx, T) {
      const sweep = (t0, dur, yc) => {
        const u = (T - t0) / dur;
        if (u < 0 || u > 1) return;
        const x = -400 + u * (W + 800);
        ctx.save();
        ctx.translate(x, yc); ctx.rotate(-0.35);
        const g = ctx.createLinearGradient(-200, 0, 200, 0);
        const a = Math.sin(u * Math.PI) * 0.55;
        g.addColorStop(0, 'rgba(255,240,215,0)'); g.addColorStop(0.5, `rgba(255,240,215,${a.toFixed(3)})`); g.addColorStop(1, 'rgba(255,240,215,0)');
        ctx.fillStyle = g; ctx.fillRect(-200, -900, 400, 1800);
        ctx.restore();
      };
      sweep(0.6, 2.4, 900);
      sweep(T_BADGE + 0.3, 1.4, 1450);
    }

    // ── music: F major, 120 bpm, 6 bars = 12 s ──
    const CHORDS = [['Fmaj7', 'f4 a4 c5 e5'], ['Am7', 'e4 a4 c5 g5'], ['Bbmaj7', 'f4 bb4 d5 a5'], ['C7', 'e4 g4 bb4 c5'], ['Fmaj7', 'f4 a4 c5 e5'], ['Bb', 'f4 bb4 d5 f5']];
    const arp = CHORDS.map(([, n]) => { const p = n.split(' '); return [p[0], p[1], p[2], p[3], p[2], p[1], p[2], p[3]].map(x => x + ':0.5').join(' '); }).join(' | ');
    const music = {
      bpm: BPM, swing: 0.08, reverb: 0.28,
      tracks: [
        { inst: 'keys', vol: 0.55, pan: -0.1, strum: 0.012, notes: 'Fmaj7:4 Am7:4 Bbmaj7:4 C7sus4:2 C7:2 Fmaj7:4 Bbmaj7:2 Fmaj7@4:2' },
        { inst: 'bass', vol: 0.8, notes: 'f2:1.5 f2:0.5 c3:1 f2:1 | a1:1.5 a1:0.5 e2:1 a1:1 | bb1:1.5 bb1:0.5 f2:1 bb1:1 | c2:1.5 c2:0.5 g2:1 c2:1 | f2:1.5 f2:0.5 c3:1 f2:1 | bb1:2 f2:2' },
        { inst: 'pluck', vol: [[0, 0.15], [4, 0.45]], pan: 0.25, notes: arp },
        { inst: 'musicbox', vol: 0.75, pan: 0.05, notes: 'c5:1 f5:0.5 a5:0.5 g5:1 f5:1 | e5:1 g5:0.5 a5:0.5 c6:1 a5:1 | d5:1 f5:0.5 a5:0.5 g5:1 f5:1 | e5:1 g5:1 bb5:1 g5:1 | a5:1.5 g5:0.5 f5:1 c6:1 | d6:1 c6:1 a5:2' },
      ],
      drums: [{ from: 4, kick: 'x.......x.x.....', snare: '....x.......x...', hat: '..x...x...x...x.' }],
    };

    const layers = [
      { type: 'canvas', name: 'backdrop', draw: (ctx, t, info) => drawBackdrop(ctx, info.time) },
      { type: 'canvas', name: 'cup', draw: (ctx, t, info) => drawCup(ctx, info.time),
        keyframes: [{ at: 0, from: { alpha: 0 }, to: { alpha: 1 }, duration: 1.0, ease: 'power2.out' }] },
      { type: 'canvas', name: 'clouds', at: T_LIFT, draw: (ctx, t, info) => drawClouds(ctx, info.time) },

      ...animateText('云朵茶屋', { fontFamily: TITLE_FONT, fontSize: 190, fill: '#7a4a31', padding: 20 }, {
        name: 'title', x: W / 2, y: 1270, align: 'center', at: T_TITLE, duration: DURATION - T_TITLE,
        in: { from: { y: 70, alpha: 0, scale: 0.7 }, to: { alpha: 1, scale: 1 }, duration: 0.7, ease: 'back.out' },
        stagger: { each: 0.13 }, idle: { y: 4 },
      }),
      { type: 'text', name: 'subtitle', text: 'CLOUD  TEA  HOUSE', at: T_TITLE + 0.8, duration: DURATION - T_TITLE - 0.8,
        style: { fontFamily: 'Avenir Next, Helvetica Neue, Arial, sans-serif', fontSize: 34, fontWeight: '600', fill: '#b98a6c', letterSpacing: 10 },
        initial: { x: W / 2, y: 1532, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { alpha: 0, y: 1552 }, to: { alpha: 1, y: 1532 }, duration: 0.8, ease: 'power2.out' }] },
      { type: 'shape', name: 'badge', shape: 'rect', width: 440, height: 120, cornerRadius: 60, at: T_BADGE, duration: DURATION - T_BADGE,
        initial: { x: W / 2, y: 1665, fill: '#ef8a7a' },
        keyframes: [{ at: 0, from: { scale: 0, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.55, ease: 'back.out(2)' }] },
      { type: 'text', name: 'open', text: '今日开业', at: T_BADGE + 0.12, duration: DURATION - T_BADGE - 0.12,
        style: { fontFamily: BADGE_FONT, fontWeight: '700', fontSize: 64, fill: '#ffffff', letterSpacing: 14, padding: 10 },
        initial: { x: W / 2 + 7, y: 1665, anchorX: 0.5, anchorY: 0.5 },
        keyframes: [{ at: 0, from: { scale: 0.6, alpha: 0 }, to: { scale: 1, alpha: 1 }, duration: 0.45, ease: 'back.out(2)' }] },

      { type: 'canvas', name: 'sweep', blendMode: 'screen', draw: (ctx, t, info) => drawSweep(ctx, info.time) },

      { type: 'audio', name: 'music', at: 0, volume: 1.15, music },
      ...[0, 1, 2, 3, 4, 5].map(i => ({ type: 'audio', name: `pop${i}`, at: T_PEARLS + i * 0.5, volume: 1.4, sfx: { preset: 'pop', pitch: i * 2, seed: i } })),
      { type: 'audio', name: 'whoosh', at: T_LIFT - 0.16, volume: 0.35, sfx: 'swoosh' },
      { type: 'audio', name: 'chime', at: T_TITLE, volume: 1.6, sfx: { preset: 'chime', pitch: 5 } },
      { type: 'audio', name: 'ding', at: T_BADGE, volume: 2.2, sfx: { preset: 'coin', pitch: 0 } },
    ];

    const movie = new Movie();
    window.movie = movie;
    new Controller(movie, { canvas: document.getElementById('stage'), theme: { accent: '#ef8a7a' } });

    try {
      await movie.init({
        canvas: document.getElementById('stage'),
        width: W, height: H, duration: DURATION, frameRate: FPS,
        poster: 11.2,
        background: '#fdf1e2',
        composition: { layers },
      });
      window.__ready = true;
    } catch (e) {
      window.__logs.push('init failed: ' + (e && e.message || e));
    }
  </script>
</body>
</html>
